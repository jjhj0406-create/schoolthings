    .coll__pendhead .coll__label { margin: 0; }
    .coll__plist, .coll__list { list-style: none; display: grid; gap: 5px; margin-top: 8px; max-height: 380px; overflow: auto; }
    .prow, .crow { display: flex; align-items: center; gap: 8px; padding: 11px 13px; border-radius: 12px; background: var(--field); }
    .prow__main, .crow__main { flex: 1; min-width: 0; }
    .prow__name, .crow__title { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .prow__name .num { color: var(--ink-2); }
    .prow__sub, .crow__sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
    .crow__acts { display: flex; align-items: center; gap: 5px; flex: none; }
    .crow { align-items: flex-start; }
    .rboard { margin-top: 8px; }
    .rboard summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); list-style: none; }
    .rboard summary::-webkit-details-marker { display: none; }
    .rboard summary::before { content: '▸ '; color: var(--ink-3); }
    .rboard[open] summary::before { content: '▾ '; }
    .rboard summary .is-warn { color: var(--late); }
    .rboard__grp { margin-top: 10px; }
    .rboard__label { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 5px; }
    .rboard__rooms { display: flex; flex-wrap: wrap; gap: 5px; }
    .rchip { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border-radius: 8px; font-size: 13px; font-weight: 700; background: #fff; }
    .rchip small { font-size: 11px; font-weight: 700; opacity: .8; }
    .rchip.is-in { background: #e8f2ed; color: var(--board); }
    .rchip.is-none { background: #eef0f6; color: var(--ink-2); }
    .rchip.is-wait { background: #fdf0f0; color: var(--late); }
    .rboard__out { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
    .give__other, .give__manual button { margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
    .give__manual { font-size: 14px; color: var(--ink-2); line-height: 1.5; padding: 12px 14px; border-radius: 12px; background: var(--field); }
    .give__manual button { display: block; }
    .crow.is-shut .crow__main { opacity: .65; }
    .crow__tag { display: inline-flex; height: 20px; padding: 0 7px; margin-left: 6px; border-radius: 5px; background: #e7eaf2; color: var(--ink-2); font-size: 11px; font-weight: 800; align-items: center; }

    @media (max-width: 760px) {
      .give { padding: 16px 0 32px; }
      .give__card { padding: 22px 18px; border-radius: 18px; }
      .grow__place { grid-template-columns: 1fr 1fr; }
      .grow__place .input:last-child { grid-column: 1 / -1; }
      .coll__place { grid-template-columns: 1fr 1fr; }
      .coll__place .input:nth-child(3) { grid-column: 1 / -1; }
      .coll__mode { grid-template-columns: 1fr; }
      .coll__new .row { grid-template-columns: 1fr; }
      .coll__new input[type="date"] { width: 100%; min-width: 0; }
      .crow { flex-wrap: wrap; }
      .crow__acts { width: 100%; justify-content: flex-end; }
      .prow { flex-wrap: wrap; }
      .prow__main { flex: 1 0 100%; }
    }
    /* ───────── 메뉴 아이콘이 잠깐 살아 움직이기 ─────────
       마우스를 올리면 메뉴마다 다른 몸짓을 해요. 손이 닿는 곳에만 씁니다. */
    .rail__item .icon, .tabbar__item .icon {
      transform-origin: 50% 60%;
      transition: transform 180ms cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }

    /* 홈: 지붕이 눌렸다 올라와요 */
    @keyframes ic-home { 0% { transform: none; } 30% { transform: translateY(3px) scaleY(.78); } 60% { transform: translateY(-5px) scaleY(1.12); } 100% { transform: none; } }
    /* 찾기: 돋보기가 두리번거려요 */
    @keyframes ic-find { 0% { transform: none; } 20% { transform: rotate(-24deg) translateX(-2px); } 45% { transform: rotate(20deg) translateX(2px); } 70% { transform: rotate(-10deg); } 100% { transform: none; } }
    /* 장소별 보기: 핀이 통 떨어져 꽂혀요 */
    @keyframes ic-place { 0% { transform: none; } 30% { transform: translateY(-8px) scale(1.08); } 62% { transform: translateY(3px) scaleY(.82); } 100% { transform: none; } }
    /* 등록: 더하기가 돌아요 */
    @keyframes ic-add { 0% { transform: none; } 100% { transform: rotate(135deg) scale(1.15); } }
    /* 대여·인수인계: 화살표가 오갔다 와요 */
    @keyframes ic-swap { 0% { transform: none; } 28% { transform: translateX(5px); } 60% { transform: translateX(-5px); } 100% { transform: none; } }
    /* 비품 대장: 종이가 넘어가요 */
    @keyframes ic-paper { 0% { transform: none; } 35% { transform: rotate(-12deg) translateY(-3px); } 70% { transform: rotate(7deg); } 100% { transform: none; } }
    /* 관리 담당: 고개를 끄덕여요 */
    @keyframes ic-nod { 0% { transform: none; } 28% { transform: translateY(3px) rotate(-11deg); } 62% { transform: translateY(-2px) rotate(9deg); } 100% { transform: none; } }
    /* 학교 공간 설정: 건물이 한 번 올라섰다 내려와요 */
    @keyframes ic-build { 0% { transform: none; } 32% { transform: translateY(-7px) scale(1.1); } 66% { transform: translateY(2px) scale(.94); } 100% { transform: none; } }

    /* 마우스를 올렸을 때와, 손가락으로 눌렀을 때(is-wiggle) 모두 움직여요 */
    .rail__item[data-key="home"]:hover .icon,
    .rail__item[data-key="home"].is-wiggle .icon { animation: ic-home 460ms ease-out; }
    .rail__item[data-key="find"]:hover .icon    { animation: ic-find 520ms ease-out; }
    .rail__item[data-key="place"]:hover .icon,
    .rail__item[data-key="place"].is-wiggle .icon { animation: ic-place 480ms ease-out; }
    .rail__item[data-key="add"]:hover .icon,
    .rail__item[data-key="add"].is-wiggle .icon { animation: ic-add 260ms cubic-bezier(.2, .8, .2, 1) forwards; }
    .rail__item[data-key="rent"]:hover .icon,
    .rail__item[data-key="handover"]:hover .icon,
    .rail__item[data-key="rent"].is-wiggle .icon,
    .rail__item[data-key="handover"].is-wiggle .icon { animation: ic-swap 500ms ease-out; }
    .rail__item[data-key="ledger"]:hover .icon,
    .rail__item[data-key="ledger"].is-wiggle .icon { animation: ic-paper 520ms ease-out; }
    .rail__item[data-key="manager"]:hover .icon { animation: ic-nod 500ms ease-out; }
    .rail__item[data-key="spaces"]:hover .icon,
    .rail__item[data-key="spaces"].is-wiggle .icon { animation: ic-build 500ms ease-out; }

    /* 글자도 아주 살짝 따라 움직여요 */
    .rail__label { transition: transform 200ms cubic-bezier(.2, .8, .2, 1); }
    .rail__item:hover .rail__label { transform: translateX(2px); }

    /* 폰에서는 누를 때 톡 눌리는 느낌만 */
    .tabbar__item:active .icon { transform: scale(.86); }
    .tabbar__item[aria-current="page"] .icon { animation: ic-place 420ms ease-out; }
    .tabbar__item.is-wiggle .icon { animation: ic-place 420ms ease-out; }

    /* 자주 누르는 단추도 살짝 */
    .btn .icon, .bigbtn .icon { transition: transform 200ms cubic-bezier(.2, .8, .2, 1); }
    .btn:hover .icon { transform: translateY(-1px) scale(1.06); }

    /* 동작을 줄이도록 설정한 기기에서는 모두 멈춰요
       (윈도우 설정 → 접근성 → 시각 효과 → 애니메이션 효과 를 켜면 다시 움직여요) */
    @media (prefers-reduced-motion: reduce) {
      .rail__item .icon, .tabbar__item .icon, .rail__label, .btn .icon, .bigbtn .icon { transition: none; }
      .rail__item:hover .icon, .tabbar__item[aria-current="page"] .icon { animation: none; }
    }

    .placebar { display: none; }
    .tabbar { display: none; }

    /* ───────── 반응형 ───────── */

      .places { grid-column: span 5; }

      .preview { grid-column: 1 / -1; }

    @media (max-width: 760px) {

        overflow: visible;
      }

      .avatar { width: 40px; height: 40px; }

      .find { min-height: 0; padding: 22px 18px 16px; border-radius: 20px; }

      .find__foot::-webkit-scrollbar { display: none; }
      .chip { flex: none; }

      .card { padding: 16px 18px; border-radius: 20px; }
      .card__head { margin-bottom: 10px; }

      .stock .card__head { margin: 0; }

      .stock__total { font-size: 30px; }

      .stock__bar { grid-column: 1 / -1; height: 10px; margin: 12px 0 10px; }
      .legend { grid-column: 1 / -1; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 8px; }
      .legend__row { gap: 6px; font-size: 13px; }
      .legend__row b { margin-left: 2px; font-size: 14px; }
      .legend__dot { width: 8px; height: 8px; border-radius: 2px; }
      .stock__cta { grid-column: 1 / -1; }
      .loan { padding: 10px 12px; }
      .pill { height: 26px; padding: 0 10px; }
      .loans .loan:nth-child(n+4) { display: none; }
      .week, .places { display: none; }
      .rank, .board { display: block; }

      .bld__tabs { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px 14px; padding: 0 18px; scrollbar-width: none; }
      .bld__tabs::-webkit-scrollbar { display: none; }
      .floor { grid-template-columns: 46px 1fr; gap: 10px; }
      .floor__no { font-size: 13px; }
      .room { height: 44px; }
      body.is-room .tabbar { display: none; }
      body.is-room .main { padding-bottom: calc(env(safe-area-inset-bottom) + 88px); }
      .placebar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--line);
      }
      .placebar__info { flex: 1; min-width: 0; }
      .placebar__name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .placebar__sum { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
      .placebar .btn { height: 48px; flex: none; }
      .lsum { padding: 14px 16px; gap: 10px 20px; }
      .lsum__value { font-size: 20px; }
      .lsum .btn { width: 100%; }
      .lsum__spacer { display: none; }
      .ledger__tools { margin-bottom: 12px; }
      .dept { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px; padding: 0 18px; scrollbar-width: none; }
      .dept::-webkit-scrollbar { display: none; }
      .lwrap { display: none; }
      .lcards { display: grid; gap: 8px; }
      .lcard { padding: 14px; border-radius: 14px; background: #f6f7fb; }

      .lcard__v { font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }
      .lcard__note { grid-column: 1 / -1; font-weight: 500; color: var(--ink-2); line-height: 1.45; }

      .rsum { padding: 14px 16px; gap: 10px 20px; }
      .rsum__value { font-size: 20px; }
      .rsum__spacer { display: none; }
      .rsum .btn { width: 100%; }
      .tabs { overflow-x: auto; margin: 0 -18px 12px; padding: 0 18px; scrollbar-width: none; }

      .todo, .side, .spot, .setupcard, .mgrgrid, .mgrsum { grid-column: 1 / -1; }

      .spotpick__row { grid-template-columns: 1fr; }

      .todo__body { overflow: visible; }
      .todorow { grid-template-columns: minmax(0, 1fr); }
      .todorow__act { grid-column: 1; grid-row: auto; justify-content: flex-end; margin-top: 6px; }
      .cats { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px 10px; padding: 0 18px; scrollbar-width: none; }

    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

<body>
  <div class="gate" id="gate" hidden></div>

  <div class="app" id="app">

    // 저장소: localStorage를 쓰고, 막혀 있으면(미리보기 환경 등) 메모리에만 둔다.
    const STORE_KEY = 'school-items:v1';
    const blank = () => ({ items: [], loans: [], recent: [], handovers: [], posts: [], comments: [], collects: [], submissions: [] });
    let memoryStore = blank();
    let cacheOff = false;   // 기기 사본을 접었는지
    const store = {
      load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          return { ...blank(), ...(raw ? JSON.parse(raw) : {}) };
        } catch { return structuredClone(memoryStore); }
      },
      save(next) {
        // 기기 사본은 '있으면 좋은 것'이다. 실패해도 서버 저장은 막지 않는다.
        try {
          const text = JSON.stringify(next);
          if (text.length > 3_000_000) {
            // 자료가 아주 많으면 사본을 접는다
            try { localStorage.removeItem(STORE_KEY); } catch {}
            cacheOff = true;
            if (!online()) memoryStore = structuredClone(next);
            return;
          }
          localStorage.setItem(STORE_KEY, text);
          cacheOff = false;
        } catch (e) {
          try { localStorage.removeItem(STORE_KEY); } catch {}
          cacheOff = true;
          memoryStore = structuredClone(next);
        }
      },
    };
    let state = store.load();
    const commit = (next) => {
      const prev = state;
      store.save(next);   // 기기에도 남겨 두면 인터넷이 끊겨도 바로 보인다
      state = next;
      pushDiff(prev, next);
    };

    const newId = () => 'itm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const addRecent = (q) => {
      q = q.trim();
      if (!q) return;
      commit({ ...state, recent: [q, ...state.recent.filter((r) => r !== q)].slice(0, 6) });
    };

    /* ════════ 로그인과 학교 (→ src/lib/auth.js) ════════ */
    // 아래 두 줄을 채우면 여러 선생님이 같은 학교 자료를 함께 봐요.
    // 비워 두면 이 기기에만 저장되는 '혼자 쓰기' 모드로 돌아갑니다.
    const SUPABASE = {
      url: 'https://zhytrtgnedatjwflfgkj.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeXRydGduZWRhdGp3ZmxmZ2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDAwMTksImV4cCI6MjEwNDg3NjAxOX0.q4A5M70jFDDrmY-Mtdx0QXRNsQzkDASoZgBGX7TA0QE',
    };

    // 학교 이름으로 주소를 찾아 주는 나이스 교육정보 개방 포털 인증키.
    // open.neis.go.kr 에서 무료로 바로 받을 수 있어요. 비워 두면 주소를 직접 적으면 돼요.
    const NEIS_KEY = '619ceb6595654ae1ab781003ee16fcb3';

    // 배치도를 읽는 Supabase Edge Function의 주소 이름(slug).
    // 대시보드에서 함수 주소 끝부분을 보고 적어 주세요. 예: .../functions/v1/smooth-task → 'smooth-task'
    const AI_FUNCTION = 'smooth-task';

    let sb = null;        // Supabase 연결. 설정이 없으면 null
    let session = null;   // 로그인한 사람
    let me = null;        // { schoolId, role, status, school }

    const online = () => Boolean(sb);

    let bootError = '';

    async function initSupabase() {
      if (!SUPABASE.url || !SUPABASE.anonKey) return;
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      sb = createClient(SUPABASE.url, SUPABASE.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
      const { data } = await sb.auth.getSession();
      session = data.session;
      sb.auth.onAuthStateChange(async (_event, next) => {
        const changed = next?.user?.id !== session?.user?.id;
        session = next;
        if (changed) { await loadMe(); await loadData(); render(); }
      });
    }

    async function loadMe() {
      me = null; members = [];
      if (!sb || !session) return;
      const { data, error } = await sb.rpc('my_membership');
      if (error) { console.error(error); return; }
      if (!data) return;
      me = { schoolId: data.school_id, role: data.role, status: data.status,
             canImport: Boolean(data.can_import), school: data.school };
      if (me.role === 'admin' && me.status === 'active') await loadMembers();
    }

    async function loadMembers() {
      const { data, error } = await sb.from('members')
        .select('id,user_id,email,name,position,role,status,can_import,created_at')
        .order('created_at', { ascending: true });
      if (!error) members = data || [];
    }

    // 서버에 있는 우리 학교 자료를 통째로 읽어 와서 화면 상태로 만든다
    // PostgREST는 한 번에 1000줄까지만 준다. 끝까지 나눠서 읽는다.
    async function fetchAll(table) {
      const size = 1000;
      const out = [];
      for (let from = 0; ; from += size) {
        const { data, error } = await sb.from(table).select('*').range(from, from + size - 1);
        if (error) throw error;
        out.push(...data);
        if (data.length < size) break;
      }
      return out;
    }

    // 아직 만들지 않은 표가 있어도 앱 전체가 멈추지 않게 한다
    async function fetchMaybe(table) {
      try {
        return await fetchAll(table);
      } catch (e) {
        console.warn(table, e);
        missingTables.add(table);
        return [];
      }
    }

    async function loadData() {
      if (!sb || me?.status !== 'active') return;
      missingTables.clear();
      const [items, loans, hos, pss, cms, cols, subs] = await Promise.all([
        fetchAll('items'), fetchAll('loans'), fetchMaybe('handovers'),
        fetchMaybe('posts'), fetchMaybe('comments'),
        fetchMaybe('collects'), fetchMaybe('submissions'),
      ]);
      state = {
        ...state,
        items: items.map(fromRowItem),
        loans: loans.map(fromRowLoan),
        collects: cols.map((r) => ({
          id: r.id, code: r.code, title: r.title, dueDate: r.due_date, autoApprove: !!r.auto_approve,
          building: r.building, floor: r.floor, room: r.room, closed: !!r.closed, createdAt: r.created_at,
        })),
        submissions: subs.map((r) => ({
          id: r.id, collectId: r.collect_id, who: r.who, name: r.name, qty: r.qty, category: r.category,
          building: r.building, floor: r.floor, room: r.room, storage: r.storage, memo: r.memo,
          status: r.status, createdAt: r.created_at,
        })),
        posts: pss.map((r) => ({ id: r.id, title: r.title, body: r.body || '', who: r.who, solved: !!r.solved, createdAt: r.created_at })),
        comments: cms.map((r) => ({ id: r.id, postId: r.post_id, who: r.who, body: r.body, createdAt: r.created_at })),
        handovers: hos.map((r) => ({
          id: r.id, startedAt: r.started_at, doneAt: r.done_at,
          fromName: r.from_name, fromPosition: r.from_position,
          toName: r.to_name, toPosition: r.to_position,
          checks: r.checks || {}, snapshot: r.snapshot || [],
          signFrom: r.sign_from || '', signTo: r.sign_to || '',
        })),
        school: me.school
          ? { name: me.school.name, address: me.school.address || '', teacher: me.school.teacher,
              position: me.school.position || '교사', place: me.school.place, tel: me.school.tel }
          : state.school,
      };
    }

    /* 표의 칸 이름과 앱의 이름을 서로 옮겨 준다 */
    const fromRowItem = (r) => ({
      id: r.id, name: r.name, category: r.category, qty: r.qty, loanable: r.loanable,
      building: r.building, floor: r.floor, room: r.room, storage: r.storage, shelf: r.shelf,
      memo: r.memo, ...(r.photo ? { photo: r.photo } : {}),
      asset: r.asset, ...(r.asset_info ? { assetInfo: r.asset_info } : {}),
      ...(r.disused ? { disused: true } : {}),
      ...(r.repair ? { repair: true } : {}),
      ...(r.lost ? { lost: true } : {}),
      createdAt: r.created_at, ...(r.updated_at ? { updatedAt: r.updated_at } : {}),
    });
    const toRowItem = (i) => ({
      id: i.id, school_id: me.schoolId, name: i.name, category: i.category || '', qty: i.qty,
      loanable: !!i.loanable, building: i.building || '', floor: i.floor || '', room: i.room || '',
      storage: i.storage || '', shelf: i.shelf || '', memo: i.memo || '', photo: i.photo || null,
      asset: !!i.asset, asset_info: i.assetInfo || null, disused: !!i.disused, repair: !!i.repair, lost: !!i.lost,
      created_at: i.createdAt, updated_at: i.updatedAt || null,
    });
    const fromRowLoan = (r) => ({
      id: r.id, itemId: r.item_id, itemName: r.item_name, path: r.path, qty: r.qty, who: r.who,
      dueAt: r.due_at, period: r.period, periodNote: r.period_note, memo: r.memo,
      ...(r.who_type ? { whoType: r.who_type } : {}),
      ...(r.by_user ? { by: r.by_user } : {}),
      ...(r.sign ? { sign: r.sign } : {}),
      outAt: r.out_at, returnedAt: r.returned_at,
    });
    const toRowLoan = (l) => ({
      id: l.id, school_id: me.schoolId, item_id: l.itemId, item_name: l.itemName, path: l.path || '',
      qty: l.qty, who: l.who, who_type: l.whoType || 'staff', by_user: l.by || '', due_at: l.dueAt || null, period: l.period || '',
      period_note: l.periodNote || '', memo: l.memo || '', sign: l.sign || null,
      out_at: l.outAt, returned_at: l.returnedAt,
    });

    // 한 번에 다 보내면 요청이 너무 커진다. 400줄씩 끊어 보낸다.
    const chunk = (arr, size = 400) => {
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    };

    // 바뀐 줄만 골라 서버에 보낸다. 화면은 먼저 바뀌고 저장은 뒤따라간다.
    async function pushDiff(prev, next) {
      if (!sb || me?.status !== 'active') return;
      const jobs = [];
      const diff = (a, b, table, toRow) => {
        const before = new Map(a.map((x) => [x.id, x]));
        const after = new Map(b.map((x) => [x.id, x]));
        const changed = [...after.values()].filter((x) => JSON.stringify(before.get(x.id)) !== JSON.stringify(x));
        const gone = [...before.keys()].filter((id) => !after.has(id));
        for (const part of chunk(changed)) jobs.push(sb.from(table).upsert(part.map(toRow)));
        for (const part of chunk(gone)) jobs.push(sb.from(table).delete().in('id', part));
      };
      diff(prev.items || [], next.items || [], 'items', toRowItem);
      diff(prev.loans || [], next.loans || [], 'loans', toRowLoan);
      diff(prev.collects || [], next.collects || [], 'collects', (x) => ({
        id: x.id, school_id: me.schoolId, code: x.code, title: x.title, due_date: x.dueDate || null,
        auto_approve: !!x.autoApprove, building: x.building || '', floor: x.floor || '', room: x.room || '',
        closed: !!x.closed, created_at: x.createdAt,
      }));
      diff(prev.submissions || [], next.submissions || [], 'submissions', (x) => ({
        id: x.id, school_id: me.schoolId, collect_id: x.collectId, who: x.who || '', name: x.name, qty: x.qty,
        category: x.category || '', building: x.building || '', floor: x.floor || '', room: x.room || '',
        storage: x.storage || '', memo: x.memo || '', status: x.status, created_at: x.createdAt,
      }));
      diff(prev.posts || [], next.posts || [], 'posts', (x) => ({
        id: x.id, school_id: me.schoolId, title: x.title, body: x.body || '',
        who: x.who, solved: !!x.solved, created_at: x.createdAt,
      }));
      diff(prev.comments || [], next.comments || [], 'comments', (x) => ({
        id: x.id, school_id: me.schoolId, post_id: x.postId,
        who: x.who, body: x.body, created_at: x.createdAt,
      }));
      diff(prev.handovers || [], next.handovers || [], 'handovers', (x) => ({
        id: x.id, school_id: me.schoolId,
        started_at: x.startedAt, done_at: x.doneAt,
        from_name: x.fromName, from_position: x.fromPosition,
        to_name: x.toName, to_position: x.toPosition,
        checks: x.checks || {}, snapshot: x.snapshot || [],
        sign_from: x.signFrom || null, sign_to: x.signTo || null,
      }));

      if (JSON.stringify(prev.school) !== JSON.stringify(next.school) && next.school && isAdmin()) {
        jobs.push(sb.from('schools').update({
          name: next.school.name, address: next.school.address || '',
          teacher: next.school.teacher, position: next.school.position || '',
          place: next.school.place, tel: next.school.tel,
        }).eq('id', me.schoolId));
      }

      const results = await Promise.all(jobs);
      const bad = results.find((r) => r && r.error);
      if (bad) {
        console.error(bad.error);
        const msg = String(bad.error.message || '');
        flash(msg.includes('schema cache')
          ? '데이터베이스 준비가 덜 됐어요. supabase-update.sql을 실행해 주세요.'
          : '저장하지 못했어요. 인터넷을 확인해 주세요.', 'warn');
      }
    }

    // 나이스에서 학교를 찾아 이름과 주소를 가져온다
    async function findSchools(name) {
      if (!NEIS_KEY) throw new Error('NO_KEY');
      const url = 'https://open.neis.go.kr/hub/schoolInfo'
        + `?KEY=${encodeURIComponent(NEIS_KEY)}&Type=json&pIndex=1&pSize=20`
        + `&SCHUL_NM=${encodeURIComponent(name)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.RESULT) throw new Error(data.RESULT.CODE === 'INFO-200' ? 'NONE' : data.RESULT.CODE);
      const rows = data.schoolInfo?.[1]?.row || [];
      return rows.map((r) => ({
        name: r.SCHUL_NM,
        address: [r.ORG_RDNMA, r.ORG_RDNDA].filter(Boolean).map((v) => v.trim()).join(' '),
        area: r.ATPT_OFCDC_SC_NM || '',
        kind: r.SCHUL_KND_SC_NM || '',
      }));
    }

    /* ── 로그인 화면들 ── */
    const GOOGLE_MARK = `<svg class="gicon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M23 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.17a5.28 5.28 0 01-2.29 3.46v2.88h3.7C21.74 18.8 23 15.8 23 12.27z"/>
      <path fill="#34A853" d="M12 23.5c3.1 0 5.7-1.03 7.6-2.8l-3.7-2.88c-1.03.69-2.34 1.1-3.9 1.1-3 0-5.54-2.02-6.45-4.74H1.7v2.97A11.5 11.5 0 0012 23.5z"/>
      <path fill="#FBBC05" d="M5.55 14.18a6.9 6.9 0 010-4.36V6.85H1.7a11.5 11.5 0 000 10.3l3.85-2.97z"/>
      <path fill="#EA4335" d="M12 5.02c1.69 0 3.2.58 4.4 1.72l3.28-3.28C17.7 1.58 15.1.5 12 .5A11.5 11.5 0 001.7 6.85l3.85 2.97C6.46 7.1 9 5.02 12 5.02z"/>
    </svg>`;

    const gateShell = (inner) => `
      <div class="gate__box">
        <div class="gate__brand">
          <span class="gate__mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
          </span>
          <span class="gate__name">학교 물품 어디 있지?</span>

    const whoStrip = () => `
      <div class="gate__who">
        ${icon(ICONS.manager)}
        <span class="gate__who-mail">${esc(myEmail())}</span>
        <button type="button" id="g-out">다른 계정</button>

    function gateView(kind) {

    let gateMode = 'start';   // start | create

    function mountGate(root, kind) {
      const err = root.querySelector('#g-err');
      const say = (m) => { err.textContent = m; };
      const busy = (btn, on) => { btn.disabled = on; };

      root.querySelector('#g-retry')?.addEventListener('click', () => location.reload());

      root.querySelector('#g-google')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        busy(btn, true);
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: location.origin + location.pathname },
        });
        if (error) { busy(btn, false); say('로그인 창을 열지 못했어요. 잠시 뒤 다시 해 주세요.'); }
      });

      root.querySelector('#g-out')?.addEventListener('click', async () => {
        await sb.auth.signOut();
        me = null; session = null; render();
      });

      root.querySelector('#g-new')?.addEventListener('click', () => { gateMode = 'create'; found = null; render(); });
      root.querySelector('#g-back')?.addEventListener('click', () => { gateMode = 'start'; render(); });

      const code = root.querySelector('#g-code');
      if (code) {
        code.addEventListener('input', () => {
          code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
          codeTyped = code.value;
        });
        code.addEventListener('keydown', (e) => { if (e.key === 'Enter') root.querySelector('#g-check').click(); });
        code.focus();
      }

      // 1단계: 코드로 어느 학교인지 확인
      root.querySelector('#g-check')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const v = code.value.trim();
        if (v.length < 6) { say('코드 6자리를 모두 넣어 주세요.'); code.focus(); return; }
        busy(btn, true); say('');
        const { data, error } = await sb.rpc('find_school', { code: v });
        busy(btn, false);
        if (error || !data) {
          say('그런 코드를 가진 학교가 없어요. 코드를 다시 확인해 주세요.');
          code.select();
          return;
        }
        found = { name: data.name, address: data.address, code: v };
        render();
      });

      root.querySelector('#g-again')?.addEventListener('click', () => { found = null; render(); });

      // 2단계: 이름과 직위를 적고 신청
      root.querySelector('#g-join')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const nameBox = root.querySelector('#g-me');
        const who = nameBox.value.trim();
        const pos = root.querySelector('#g-mypos').value;
        if (!who) { say('내 이름을 적어 주세요.'); nameBox.focus(); return; }
        busy(btn, true); say('');
        const { error } = await sb.rpc('join_school', { code: found.code, member_name: who, position_name: pos });
        busy(btn, false);
        if (error) {
          say(String(error.message).includes('NO_SCHOOL')
            ? '학교를 찾지 못했어요. 코드를 다시 확인해 주세요.'
            : '신청하지 못했어요. 잠시 뒤 다시 해 주세요.');
          return;
        }
        found = null; codeTyped = ''; justApplied = true;
        await loadMe();
        render();
        flash('신청을 보냈어요');
      });

      const hits = root.querySelector('#g-hits');
      root.querySelector('#g-name')?.addEventListener('input', () => { if (hits) hits.innerHTML = ''; });
      root.querySelector('#g-find')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const q = root.querySelector('#g-name').value.trim();
        if (q.length < 2) { say('학교 이름을 두 글자 이상 적어 주세요.'); return; }
        busy(btn, true); say('');
        hits.innerHTML = '<p class="hits__wait">찾는 중이에요…</p>';
        try {
          const list = await findSchools(q);
          hits.innerHTML = list.length
            ? `<ul class="hits2">${list.map((h, i2) => `
                <li><button class="hit2" type="button" data-hit="${i2}">
                  <span class="hit2__name">${esc(h.name)}</span>
                  <span class="hit2__addr">${esc(h.address || '주소 없음')}</span>
                </button></li>`).join('')}</ul>`
            : '<p class="hits__wait">그런 이름의 학교를 찾지 못했어요. 직접 적어 주세요.</p>';
          hits.querySelectorAll('[data-hit]').forEach((btn) => btn.addEventListener('click', () => {
            const h = list[Number(btn.dataset.hit)];
            root.querySelector('#g-name').value = h.name;
            root.querySelector('#g-addr').value = h.address;

        } catch (err) {
          const code = String(err.message);
          hits.innerHTML = `<p class="hits__wait">${
            code === 'NONE' ? '그런 이름의 학교를 찾지 못했어요. 직접 적어 주세요.'
            : code === 'NO_KEY' ? '학교 찾기를 쓰려면 나이스 인증키가 필요해요. 주소를 직접 적어 주세요.'
            : '지금은 학교 찾기가 되지 않아요. 주소를 직접 적어 주세요.'}</p>`;
        }
        busy(btn, false);
      });

      root.querySelector('#g-make')?.addEventListener('click', async (e) => {
        const name = root.querySelector('#g-name').value.trim();
        const who = root.querySelector('#g-teacher').value.trim();
        const pos = root.querySelector('#g-pos').value;
        if (!name) { say('학교 이름을 적어 주세요.'); root.querySelector('#g-name').focus(); return; }
        if (!who) { say('관리자 이름을 적어 주세요.'); root.querySelector('#g-teacher').focus(); return; }
        const btn = e.currentTarget;
        busy(btn, true); say('');
        const addr = root.querySelector('#g-addr').value.trim();
        const { error } = await sb.rpc('create_school', { school_name: name, school_address: addr, teacher_name: who, position_name: pos });
        busy(btn, false);
        if (error) {
          say(String(error.message).includes('ALREADY_JOINED')
            ? '이미 다른 학교에 속해 있어요.'
            : '학교를 만들지 못했어요. 잠시 뒤 다시 해 주세요.');
          return;
        }
        await loadMe(); await loadData(); render();
        setTimeout(openSpaces, 400);   // 학교를 만들자마자 공간 설정을 이어서
      });

      root.querySelector('#g-recheck')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        busy(btn, true); say('');
        await loadMe();
        busy(btn, false);
        if (me?.status === 'active') { justApplied = false; await loadData(); render(); flash('승인됐어요. 이제 함께 쓸 수 있어요'); }
        else say('아직 승인 전이에요. 조금 뒤에 다시 눌러 주세요.');
      });
    }

    /* ════════ 표시 형식 (→ src/lib/format.js) ════════ */
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n = (v) => Number(v).toLocaleString('ko-KR');

    const todayLabel = () => { const d = new Date(); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`; };
    const pathOf = (item) => PATH_KINDS.map((k) => item[k.key]).filter(Boolean);

    // 받침에 맞는 조사: josa('삼각대', '은/는') → '삼각대는'
    function josa(word, pair) {
      const [withJong, withoutJong] = pair.split('/');
      const last = String(word).trim().slice(-1);
      const code = last.charCodeAt(0) - 0xac00;
      if (code < 0 || code > 11171) {
        // 영문·숫자로 끝나면 읽는 소리를 알 수 없으니 둘 다 적는다
        return `${word}${withJong}(${withoutJong})`;
      }
      const jong = code % 28;
      if (pair === '으로/로' && jong === 8) return word + '로'; // ㄹ 받침
      return word + (jong ? withJong : withoutJong);
    }

    /* ════════ 한글 검색 (→ src/lib/search.js) ════════ */
    const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    // 겹자모는 풀고, 헷갈리기 쉬운 모음(애/에/얘/예, 왜/외)은 같은 것으로 본다.
    const LOOSE = {
      'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ',
      'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅔ','ㅚ':'ㅗㅔ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ','ㅐ':'ㅔ','ㅒ':'ㅔ','ㅖ':'ㅔ',
    };
    const SKIP = /[\s·\-_.,()/[\]]/;
    const isSyllable = (c) => c >= 0xac00 && c <= 0xd7a3;
    const isConsonant = (ch) => /^[ㄱ-ㅎ]$/.test(ch);

    // 글자마다 원래 위치를 기억해 둬서, 어디서 맞았는지 형광펜을 칠할 수 있게 한다.
    function indexText(text) {
      const chars = [...String(text ?? '')];
      const t = { chars, syl: '', sylMap: [], jamo: '', jamoMap: [], cho: '', choMap: [] };
      chars.forEach((raw, i) => {
        const ch = raw.toLowerCase();
        if (SKIP.test(ch)) return;
        t.syl += ch; t.sylMap.push(i);
        const code = ch.charCodeAt(0);
        let jamo, cho;
        if (isSyllable(code)) {
          const k = code - 0xac00;
          const parts = [CHO[Math.floor(k / 588)], JUNG[Math.floor((k % 588) / 28)], JONG[k % 28]];
          jamo = parts.map((p) => LOOSE[p] ?? p).join('');
          cho = parts[0];
        } else {
          jamo = LOOSE[ch] ?? ch;
          cho = ch;
        }
        for (const j of jamo) { t.jamo += j; t.jamoMap.push(i); }
        t.cho += cho; t.choMap.push(i);
      });
      return t;
    }

    const span = (map, start, len) => [[map[start], map[start + len - 1] + 1]];

    // 한 칸(필드) 안에서 가장 잘 맞는 방식을 고른다.
    function matchField(t, q) {
      if (!q.syl || !t.syl) return null;
      if (t.syl === q.syl) return { tier: 100, ranges: span(t.sylMap, 0, q.syl.length) };
      let p = t.syl.indexOf(q.syl);
      if (p === 0) return { tier: 90, ranges: span(t.sylMap, 0, q.syl.length) };
      if (p > 0) return { tier: 80, ranges: span(t.sylMap, p, q.syl.length) };
      if (q.jamo.length >= 2) {
        p = t.jamo.indexOf(q.jamo);
        if (p >= 0) return { tier: 70, ranges: span(t.jamoMap, p, q.jamo.length) };
      }
      if (q.isCho) {
        p = t.cho.indexOf(q.syl);
        if (p >= 0) return { tier: 65, ranges: span(t.choMap, p, q.syl.length), why: '초성으로 찾았어요' };
      }
      // 글자가 순서대로 들어 있으면(과학실 → 과학 준비실) 약하게 맞은 것으로 본다.
      if (q.syl.length >= 2) {
        const hit = []; let from = 0;
        for (const ch of q.syl) {
          const at = t.syl.indexOf(ch, from);
          if (at < 0) return null;
          hit.push(at); from = at + 1;
        }
        if (hit[hit.length - 1] - hit[0] < q.syl.length * 3) {
          // 처음과 끝이 맞으면(과학실 ↔ 과학 준비실) 조금 더 믿는다
          const ends = hit[0] === 0 && hit[hit.length - 1] === t.syl.length - 1;
          return { tier: ends ? 58 : 30, ranges: hit.map((h) => [t.sylMap[h], t.sylMap[h] + 1]), loose: true };
        }
      }
      return null;
    }

    const WEIGHTS = {
      name: 1, room: .72, storage: .62, building: .55, category: .45, shelf: .45, floor: .45, memo: .36,
      'assetInfo.no': .9, 'assetInfo.name': .8, 'assetInfo.code': .6, 'assetInfo.dept': .5, 'assetInfo.spec': .4,
    };
    const FIELD_WHY = {
      memo: '메모에서 찾았어요',
      'assetInfo.no': '비품 고유번호로 찾았어요',
      'assetInfo.name': '비품 대장 이름으로 찾았어요',
      'assetInfo.code': '비품 분류번호로 찾았어요',
      'assetInfo.dept': '운용부서로 찾았어요',
      'assetInfo.spec': '규격에서 찾았어요',
    };
    // 'assetInfo.no'처럼 점이 들어간 이름도 읽는다
    const pick = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);

    function makeQuery(text) {
      const q = indexText(text);
      q.isCho = q.syl.length >= 2 && [...q.syl].every(isConsonant);
      return q;
    }

    function synonymHits(nameIdx, q) {
      if (q.syl.length < 1) return null;
      for (const group of SYNONYMS) {
        const said = group.find((w) => w === q.syl || (q.syl.length >= 2 && w.startsWith(q.syl)));
        if (!said) continue;
        for (const other of group) {
          if (other === said || other.length < 2 && other !== '빔') continue;
          const p = nameIdx.syl.indexOf(other);
          if (p >= 0) return { tier: 60, ranges: span(nameIdx.sylMap, p, other.length), why: `비슷한 말 ‘${said}’` };
        }
      }
      return null;
    }

    // 가장 잘 맞은 칸이 점수를 정하고, 함께 맞은 칸은 조금 보태고 형광펜도 같이 칠한다.
    function scoreOne(entry, q) {
      let best = null;
      const found = [];
      for (const [field, w] of Object.entries(WEIGHTS)) {
        const m = matchField(entry.idx[field], q);
        if (!m) continue;
        const score = m.tier * w;
        const why = m.why || FIELD_WHY[field] || (m.loose && field === 'name' ? '비슷한 이름' : undefined);
        const hit = { score, field, ranges: m.ranges, why };
        found.push(hit);
        if (!best || score > best.score) best = hit;
      }
      if (best && found.length > 1) {
        const extra = found.filter((f) => f !== best);
        best = {
          ...best,
          score: best.score + extra.reduce((a, f) => a + f.score, 0) * .15,
          also: Object.fromEntries(extra.filter((f) => f.score >= 20).map((f) => [f.field, f.ranges])),
        };
      }
      // 강당 ↔ 다목적실처럼 학교에서 다르게 부르는 이름
      if ((!best || best.score < 60) && entry.item?.room) {
        const alias = ROOM_ALIAS.get(q.syl);
        if (alias && alias === entry.item.room) {
          best = { score: 78, field: 'room', ranges: [], why: '다르게 부르는 이름' };
        }
      }
      if (!best || best.field !== 'name' || best.score < 60) {
        for (const field of ['name', 'memo']) {
          const s = synonymHits(entry.idx[field], q);
          if (!s) continue;
          const score = s.tier * WEIGHTS[field];
          if (!best || score > best.score) best = { score, field, ranges: s.ranges, why: s.why };
          break;
        }
      }
      return best;
    }

    let ROOM_ALIAS = new Map();

    function searchItems(items, text) {
      ROOM_ALIAS = roomAliasMap();
      const whole = makeQuery(text);
      const tokens = String(text).trim().split(/\s+/).filter(Boolean);
      const parts = tokens.length > 1 ? tokens.map(makeQuery) : [];
      const out = [];

      for (const item of items) {
        const entry = { item, idx: Object.fromEntries(Object.keys(WEIGHTS).map((f) => [f, indexText(pick(item, f))])) };
        const candidates = [];

        const a = scoreOne(entry, whole);
        if (a) candidates.push({ score: a.score, marks: { ...(a.also || {}), [a.field]: a.ranges }, why: a.why });

        if (parts.length) {
          const got = parts.map((p) => scoreOne(entry, p));
          if (got.every(Boolean)) {
            const marks = {};
            for (const g of got) {
              for (const [f, r] of Object.entries(g.also || {})) (marks[f] ||= []).push(...r);
              (marks[g.field] ||= []).push(...g.ranges);
            }
            candidates.push({
              score: got.reduce((s, g) => s + g.score, 0) / got.length * 1.02,
              marks, why: got.map((g) => g.why).find(Boolean),
            });
          }
        }
        if (!candidates.length) continue;
        const best = candidates.sort((x, y) => y.score - x.score)[0];
        out.push({ item, ...best });
      }
      return out.sort((x, y) =>
        y.score - x.score ||
        x.item.name.length - y.item.name.length ||
        y.item.createdAt.localeCompare(x.item.createdAt));
    }

    // 결과가 없을 때 "혹시 이걸 찾으세요?"
    function levenshtein(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        let prev = row[0]; row[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const tmp = row[j];
          row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
          prev = tmp;
        }
      }
      return row[b.length];
    }
    function guesses(items, text) {
      const q = makeQuery(text).jamo;
      if (q.length < 2) return [];
      const names = [...new Set([...items.map((i) => i.name), ...items.map((i) => i.room)])];
      return names
        .map((name) => {
          const t = indexText(name).jamo;
          // 이름 안의 비슷한 길이 조각과 비교해서, 긴 이름이 불리하지 않게 한다
          let d = levenshtein(q, t);
          for (let i = 0; i + q.length - 1 <= t.length; i++) {
            d = Math.min(d, levenshtein(q, t.slice(i, i + q.length)), levenshtein(q, t.slice(i, i + q.length + 1)));
          }
          return { name, d };
        })
        .filter((g) => g.d <= Math.max(2, Math.floor(q.length * .4)))
        .sort((a, b) => a.d - b.d)
        .slice(0, 3)
        .map((g) => g.name);
    }

    function highlight(text, ranges = []) {
      const chars = [...String(text ?? '')];
      const on = new Array(chars.length).fill(false);
      for (const [s, e] of ranges) for (let i = s; i < e; i++) on[i] = true;
      let html = '', open = false;
      chars.forEach((ch, i) => {
        if (on[i] && !open) { html += '<mark>'; open = true; }
        if (!on[i] && open) { html += '</mark>'; open = false; }
        html += esc(ch);
      });
      return html + (open ? '</mark>' : '');
    }

    /* ════════ 공통 조각 (→ src/components) ════════ */
    function renderNav(active) {
      const item = (m, baseCls, withLabelSpan) => {
        let cls = baseCls;
        const current = m.key === active ? 'aria-current="page"' : '';
        if (m.admin) cls += ' rail__item--admin';
        const label = withLabelSpan ? `<span class="rail__label">${esc(m.label)}</span>` : esc(m.label);
        if (m.action) return `<button class="${cls}" type="button" data-key="${m.key}" data-action="${m.action}">${icon(ICONS[m.key])}${label}</button>`;
        return m.href
          ? `<a class="${cls}" href="${m.href}" data-key="${m.key}" ${current}>${icon(ICONS[m.key])}${label}</a>`
          : `<button class="${cls}" type="button" data-key="${m.key}" data-soon>${icon(ICONS[m.key])}${label}</button>`;
      };
      const menu = MENU.filter((m) => (!m.admin || isAdmin()) && (!m.manage || canImport())
        && !(m.key === 'handover' && missingTables.has('handovers')));
      document.getElementById('rail-nav').innerHTML = menu.map((m) => item(m, 'rail__item', true)).join('');
      document.getElementById('tabbar').innerHTML = menu.filter((m) => m.tab !== false).map((m) => item(m, 'tabbar__item', false)).join('');
      const s = school();
      const who = s.teacher ? `${s.teacher} ${s.position || '선생님'}` : '물품 담당';
      const line = [s.place, who].filter(Boolean).join(' · ');
      const whoCard = isAdmin()
        ? `<a class="rail__who" href="#/manager"><strong>${esc(s.name)}${online() && me?.role === 'admin' ? '<span class="rolechip">관리자</span>' : ''}</strong>${esc(line)}${s.tel ? `<br>${esc(s.tel)}` : ''}</a>`
        : `<div class="rail__who"><strong>${esc(s.name)}</strong>${esc(line)}${s.tel ? `<br>${esc(s.tel)}` : ''}</div>`;
      const meCard = online() && session
        ? `<div class="rail__me"><span class="rail__mail">${esc(myEmail())}</span><button class="rail__out" type="button" id="rail-out">로그아웃</button></div>`
        : '';
      document.getElementById('rail-foot').innerHTML = whoCard + meCard;
      document.getElementById('rail-out')?.addEventListener('click', async () => {
        await sb.auth.signOut();
        me = null; session = null; state = blank(); render();
      });
    }

    const PLAN_SVG = `
      <svg class="plan" viewBox="0 0 330 230" aria-hidden="true">
        <path class="wall" d="M20 40h290v150H20z M20 100h290 M20 130h290 M90 40v60 M160 40v60 M230 40v60 M120 130v60 M200 130v60"/>
        <path class="route" d="M40 185 V115 H265 V78"/>
        <circle class="pin-ring" cx="265" cy="70" r="14"/><circle class="pin" cx="265" cy="70" r="6"/>
      </svg>`;

    // 목록마다 붙는 수정·삭제 단추. 지우기는 한 번 더 물어본다.
    let pendingDelete = null;

    function rowActions(id) {
      if (pendingDelete === id) {
        return `<span class="confirm">지울까요?
          <button class="confirm__yes" type="button" data-del-yes="${id}">지우기</button>
          <button class="confirm__no" type="button" data-del-cancel>그만두기</button>
        </span>`;
      }
      return `<span class="acts">
        <button class="act" type="button" data-edit="${id}" aria-label="수정">${icon(ICONS.edit)}<span class="act__label">수정</span></button>
        <button class="act act--del" type="button" data-del="${id}" aria-label="삭제">${icon(ICONS.trash)}<span class="act__label">삭제</span></button>
      </span>`;
    }

    let flashTimer;
    function flash(msg, kind = 'ok') {
      const el = document.getElementById('flash');
      clearTimeout(flashTimer);
      el.className = 'flash flash--' + kind;
      el.innerHTML = `${icon(kind === 'ok' ? ICONS.check : ICONS.bell, 'icon flash__mark')}<span>${esc(msg)}</span>`;
      el.hidden = false;
      // 다시 띄울 때도 움직임이 보이게 애니메이션을 처음부터 준다
      el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
      flashTimer = setTimeout(() => { el.hidden = true; }, 3200);
    }

    const refreshView = () => {
      const v = document.getElementById('view');
      if (v.refresh) v.refresh(); else render();
    };

    const goSearch = (q = '') => { if (q) addRecent(q); location.hash = '#/search' + (q ? '?q=' + encodeURIComponent(q) : ''); };

    /* ════════ 홈 (→ src/pages/home.js) ════════ */
    function homeView() {
      const items = state.items;
      const loans = state.loans || [];
      const out = loans.filter((l) => !l.returnedAt);
      const total = items.reduce((a, i) => a + i.qty, 0);
      const onLoan = out.reduce((a, l) => a + (l.qty || 1), 0);
      const repair = items.filter((i) => i.repair).reduce((a, i) => a + i.qty, 0);
      const stock = [
        { label: '사용 가능', count: total - onLoan - repair, color: 'var(--board)' },
        { label: '대여 중',   count: onLoan, color: 'var(--marker)' },
        { label: '수리 필요', count: repair, color: 'var(--late)' },
      ];

      const byRoom = new Map();
      for (const i of items) {
        const p = placeOf(i);
        // 자리 없는 것은 한 줄로 모은다
        const unset = p.building === UNSET_B;
        const key = unset ? UNSET_B : roomKey(i);
        const prev = byRoom.get(key) || { name: unset ? '장소 미지정' : p.room, key, count: 0, unset };
        prev.count += i.qty; byRoom.set(key, prev);
      }
      const places = [...byRoom.values()].sort((a, b) => b.count - a.count).slice(0, 5);
      const ranks = rentRank();
      const recentPosts = posts().slice().sort((a, b) => {
        if (a.solved !== b.solved) return a.solved ? 1 : -1;   // 해결 안 된 것부터
        return b.createdAt.localeCompare(a.createdAt);
      }).slice(0, 5);
      const recent = [...new Set(items.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map((i) => i.name))].slice(0, 5);

      const todayIdx = new Date().getDay() - 1;
      // 이번 주 월요일부터 요일별 대여 건수
      const monday = new Date();
      monday.setHours(0, 0, 0, 0);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      const week = ['월', '화', '수', '목', '금'].map((day, i) => {
        const key = ymd(new Date(monday.getTime() + i * DAY));
        return { day, count: loans.filter((l) => l.outAt.slice(0, 10) === key).length };
      });
      const weekMax = Math.max(1, ...week.map((w) => w.count));
      const weekSum = week.reduce((a, w) => a + w.count, 0);

      const stockBody = total === 0
        ? `<div class="stock__bar" aria-hidden="true"></div>
           <div class="stock__cta">
             <a class="btn btn--solid" href="#/add">첫 물품 등록</a>
           </div>`
        : `<div class="stock__bar" aria-hidden="true">${stock.filter((s) => s.count > 0).map((s) => `<span style="flex:${s.count} 0 0;background:${s.color}"></span>`).join('')}</div>
           <div class="legend">${stock.map((s) => `
             <div class="legend__row"><span class="legend__dot" style="background:${s.color}"></span><span>${esc(s.label)}</span><b class="num">${n(s.count)}</b></div>`).join('')}
           </div>`;

      return `
        <header class="top">
          <div>
            <p class="top__date">${todayLabel()}</p>
            <h1 class="top__title" tabindex="-1">${esc(school().name)}</h1>
          </div>
          <div class="top__actions">
            <a class="btn btn--ghost" href="#/add">${icon(ICONS.add)}물품 등록</a>
            <a class="btn btn--solid" href="#/lend">${icon(ICONS.rent)}빌리기</a>
            ${isAdmin() ? `<div class="alert">
              <button class="avatar" type="button" id="alert-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="alert-panel"
                      aria-label="알림${notifications().length ? ` ${notifications().length}건` : ''}">
                ${icon(ICONS.bell)}
                ${urgentCount() ? `<span class="alert__badge num">${urgentCount()}</span>` : ''}
              </button>
              <div class="alert__panel" id="alert-panel" role="dialog" aria-label="알림" hidden></div>
            </div>` : ''}
          </div>
        </header>

        <section class="find" aria-labelledby="find-title">
          ${PLAN_SVG}
          <h2 class="find__title" id="find-title">학교 물품 어디 있지?</h2>
          <form class="search" role="search" id="search">
            ${icon(ICONS.find)}
            <input id="q" type="search" placeholder="물품 이름이나 장소" autocomplete="off" enterkeyhint="search" aria-label="물품 찾기">
            <button class="search__go" type="submit">찾기</button>
          </form>
          <div class="find__foot" id="find-foot" aria-live="polite" data-recent='${esc(JSON.stringify(recent))}'></div>
        </section>

        <section class="card stock" aria-labelledby="stock-title">
          <div class="card__head"><h2 class="card__title" id="stock-title">전체 물품</h2><span class="card__meta">오늘 기준</span></div>
          <p class="stock__figure"><span class="stock__total num">${n(total)}</span><span class="stock__unit">개</span></p>
          ${stockBody}
        </section>

        <section class="card rank" aria-labelledby="rank-title">
          <div class="card__head">
            <h2 class="card__title" id="rank-title">자주 대여하는 물품</h2>
            <span class="card__meta">${ranks.length ? '눌러서 대여 현황 보기' : ''}</span>
          </div>
          ${ranks.length ? `<ol class="rank__list">${ranks.map((r, i) => `
            <li>
              <button class="rankitem ${i < 3 ? 'is-top' : ''}" type="button" data-rank="${esc(r.name)}">
                <span class="rankitem__no num">${i + 1}</span>
                <span class="rankitem__main">
                  <span class="rankitem__name">${esc(r.name)}</span>
                  <span class="rankitem__bar"><span style="width:${(r.times / ranks[0].times) * 100}%;animation-delay:${i * 60}ms"></span></span>

          : `<div class="empty"><strong>물어볼 게 있으신가요?</strong><span>“이동식 마이크는 어디 있을까요?”처럼<br>적어 두면 아는 분이 알려 줘요</span></div>`}

    function mountHome(view) {
      view.addEventListener('click', (e) => {
        const r = e.target.closest('[data-rank]');
        if (r) { openRankDetail(r.dataset.rank); return; }
        const pRow = e.target.closest('[data-post]');
        if (pRow) { openPost(pRow.dataset.post, () => render()); return; }
        if (e.target.closest('#board-write')) openWrite(() => { render(); flash('문의 글을 올렸어요'); });
      });

      const foot = view.querySelector('#find-foot');
      const q = view.querySelector('#q');
      const recent = JSON.parse(foot.dataset.recent);
      const renderChips = () => {
        foot.innerHTML = recent.length
          ? `<span class="find__foot-label">최근 등록</span>` + recent.map((r) => `<button class="chip" type="button">${esc(r)}</button>`).join('')
          : `<span class="find__foot-label">등록한 물품이 여기에 보여요</span>`;
      };
      renderChips();

      let timer;
      view.notify = (msg) => {
        clearTimeout(timer);
        foot.innerHTML = `<span class="find__notice">${esc(msg)}</span>`;
        timer = setTimeout(renderChips, 1800);
      };

      foot.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (chip) goSearch(chip.textContent);
      });
      view.querySelector('#search').addEventListener('submit', (e) => {
        e.preventDefault();
        goSearch(q.value.trim());
      });

      // ── 알림 ──
      const bell = view.querySelector('#alert-btn');
      const panel = view.querySelector('#alert-panel');
      if (!bell) return;

      function drawAlerts() {
        const list = notifications();
        const shown = list.slice(0, 6);
        panel.innerHTML = `
          <div class="alert__head">
            <p class="alert__title">알림</p>
            <span class="alert__count">${list.length ? `${n(list.length)}가지` : ''}</span>
          </div>
          ${shown.length ? `
            <ul class="alert__list">
              ${shown.map((a2) => `
                <li>
                  <a class="alert__row" href="${a2.href}">
                    <span class="alert__dot" style="background:${a2.color}"></span>
                    <span>
                      <span class="alert__name">${esc(a2.name)}</span>
                      <span class="alert__sub">${esc(a2.sub)}</span>
                    </span>
                  </a>
                </li>`).join('')}
            </ul>`
          : `<div class="alert__none">
               <strong>새 알림이 없어요</strong>
               <span>반납이 늦거나 대장에 빈 칸이 생기면<br>여기로 알려 드려요.</span>
             </div>`}
          <div class="alert__foot">
            <a class="alert__all" href="#/manager">${list.length > shown.length ? `나머지 ${list.length - shown.length}가지까지 모두 보기` : '관리 담당 선생님 화면 열기'}</a>
          </div>`;
      }

      const closeAlerts = () => {
        panel.hidden = true;
        bell.setAttribute('aria-expanded', 'false');
      };

      bell.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = panel.hidden;
        if (open) drawAlerts();
        panel.hidden = !open;
        bell.setAttribute('aria-expanded', String(open));
      });

      // 바깥을 누르거나 Esc를 누르면 닫는다
      document.addEventListener('click', (e) => {
        if (!panel.hidden && !e.target.closest('.alert')) closeAlerts();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !panel.hidden) { closeAlerts(); bell.focus(); }
      });

      view.refresh = () => render();
    }

    /* ════════ 찾기 (→ src/pages/search.js) ════════ */
    const TIPS = [
      { q: '빔 프로젝터', text: '띄어쓰기는 몰라도 돼요' },
      { q: 'ㅂㅍㄹㅈㅌ',  text: '초성만 넣어도 돼요' },
      { q: '과학실',      text: '장소 이름으로 모아 봐요' },
      { q: '영사기',      text: '다르게 불러도 찾아요' },
      { q: '삼각데',      text: '애/에가 헷갈려도 돼요' },

    function searchView(params) {
      const q = params.get('q') || '';
      return `
