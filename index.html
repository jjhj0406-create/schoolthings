<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17204a">
  <title>학교 물품 어디 있지?</title>
  <style>
    :root {
      --navy: #17204a;
      --navy-2: #232d5e;
      --board: #1f5a45;
      --board-2: #2b7659;
      --marker: #ffc93c;
      --late: #e5484d;
      --bg: #eef1f6;
      --card: #ffffff;
      --field: #f3f5f9;
      --ink: #121831;
      --ink-2: #5d6480;
      --ink-3: #9aa0b8;
      --line: #e4e7f0;

      --r-lg: 22px;
      --r-md: 16px;
      --shadow: 0 1px 2px rgba(23, 32, 74, .06), 0 8px 24px -12px rgba(23, 32, 74, .18);

      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
                   "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; touch-action: manipulation; }
    svg { display: block; }
    .num { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; border-radius: 8px; }
    [tabindex="-1"]:focus { outline: none; }

    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* ───────── 틀 ───────── */
    .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; height: 100dvh; }

    .rail { background: var(--navy); color: #fff; display: flex; flex-direction: column; padding: 28px 16px 20px; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 32px; }
    .brand__mark { width: 40px; height: 40px; border-radius: 12px; background: var(--marker); color: var(--navy); display: grid; place-items: center; flex: none; }
    .brand__mark .icon { stroke-width: 2.2; }
    .brand__name { font-size: 16px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
    .rail__nav { display: flex; flex-direction: column; gap: 4px; }
    .rail__item {
      display: flex; align-items: center; gap: 12px;
      height: 46px; padding: 0 12px; border-radius: 12px;
      color: rgba(255, 255, 255, .66); font-size: 15px; font-weight: 600; text-align: left;
      transition: background-color 120ms, color 120ms;
    }
    .rail__item:hover { color: #fff; background: rgba(255, 255, 255, .06); }
    .rail__item[aria-current="page"] { color: #fff; background: rgba(255, 255, 255, .12); }
    .rail__item[aria-current="page"] .icon { color: var(--marker); }
    .rail__foot { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid rgba(255, 255, 255, .1); font-size: 13px; color: rgba(255, 255, 255, .5); line-height: 1.5; }
    .rail__foot strong { display: block; color: #fff; font-size: 14px; font-weight: 700; }
    .rail__who { display: block; padding: 8px; margin: -8px; border-radius: 10px; transition: background-color 120ms, color 120ms; }
    .rail__who:hover { background: rgba(255, 255, 255, .07); color: rgba(255, 255, 255, .75); }

    .main {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px 18px;
      padding: 24px 32px;
      min-height: 0;
      overflow: auto;
    }
    .main.is-add { grid-template-rows: auto minmax(0, 1fr); }

    .top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
    .top__date { font-size: 14px; color: var(--ink-2); font-weight: 500; }
    .top__title { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; margin-top: 2px; }
    .top__actions { display: flex; align-items: center; gap: 8px; }
    .back {
      display: inline-flex; align-items: center; gap: 2px; margin-left: -6px;
      height: 28px; padding: 0 6px; border-radius: 8px;
      font-size: 14px; font-weight: 600; color: var(--ink-2);
    }
    .back:hover { color: var(--ink); }
    .back .icon { width: 18px; height: 18px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 18px; border-radius: 12px;
      font-size: 15px; font-weight: 700; white-space: nowrap; flex: none;
      transition: transform 120ms, background-color 120ms;
    }
    .btn:active { transform: scale(.97); }
    .btn .icon { width: 19px; height: 19px; }
    .btn--ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .btn--ghost:hover { background: #f7f8fb; }
    .btn--solid { background: var(--navy); color: #fff; }
    .btn--solid:hover { background: var(--navy-2); }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }

    .card {
      background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow);
      padding: 20px 22px; min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
    }
    .card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .card__title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .card__meta { font-size: 13px; color: var(--ink-3); font-weight: 500; }
    .empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 4px; padding: 12px 0; }
    .empty strong { font-size: 15px; font-weight: 700; }
    .empty span { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    /* ───────── 홈: 찾기 ───────── */
    .find {
      grid-column: span 8; position: relative; overflow: hidden;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, var(--board) 0%, var(--board-2) 100%);
      color: #fff; padding: 28px 36px 26px;
      box-shadow: 0 18px 40px -22px rgba(31, 90, 69, .8);
      display: flex; flex-direction: column; justify-content: flex-end;
      min-height: 264px;
    }
    .plan { position: absolute; right: -10px; top: -14px; width: clamp(240px, 26vw, 330px); height: auto; opacity: .45; pointer-events: none; }
    .plan .wall { stroke: rgba(255, 255, 255, .14); stroke-width: 1.5; fill: none; }
    .plan .route { stroke: var(--marker); stroke-width: 2.2; fill: none; stroke-dasharray: 5 7; stroke-linecap: round; }
    .plan .pin { fill: var(--marker); }
    .plan .pin-ring { fill: none; stroke: var(--marker); stroke-width: 2; opacity: .5; }
    .find__title { position: relative; font-size: clamp(30px, 3.5vw, 46px); font-weight: 800; line-height: 1.15; letter-spacing: -0.05em; margin-bottom: 22px; white-space: nowrap; }
    .search {
      position: relative; display: flex; align-items: center; gap: 12px;
      height: 58px; padding: 0 8px 0 18px; max-width: 560px;
      background: #fff; color: var(--ink); border-radius: var(--r-md);
      box-shadow: 0 10px 30px -14px rgba(0, 0, 0, .45);
    }
    .search > .icon { color: var(--ink-2); }
    .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 17px; font-weight: 500; }
    .search input::placeholder { color: var(--ink-3); }
    .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    .search:focus-within { box-shadow: 0 0 0 3px var(--marker), 0 10px 30px -14px rgba(0, 0, 0, .45); }
    .search__go { height: 42px; padding: 0 16px; border-radius: 11px; background: var(--navy); color: #fff; font-size: 15px; font-weight: 700; }
    .find__foot { position: relative; display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; min-height: 34px; }
    .find__foot-label { font-size: 13px; color: rgba(255, 255, 255, .7); margin-right: 2px; }
    .chip { height: 34px; padding: 0 13px; border-radius: 999px; background: rgba(255, 255, 255, .13); color: #fff; font-size: 14px; font-weight: 600; transition: background-color 120ms; }
    .chip:hover { background: rgba(255, 255, 255, .22); }
    .find__notice { font-size: 14px; font-weight: 600; color: var(--marker); }

    /* ───────── 홈: 카드들 ───────── */
    .stock { grid-column: span 4; justify-content: space-between; }
    .stock__total { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .stock__unit { font-size: 20px; font-weight: 700; margin-left: 4px; color: var(--ink-2); }
    .stock__bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px; margin: 22px 0 16px; background: #eceef5; }
    .stock__bar span { display: block; height: 100%; border-radius: 3px; min-width: 6px; }
    .legend { display: grid; gap: 10px; }
    .legend__row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
    .legend__dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .legend__row b { margin-left: auto; color: var(--ink); font-weight: 700; }
    .stock__cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stock__cta p { font-size: 14px; color: var(--ink-2); line-height: 1.45; }

    .week { grid-column: span 4; }
    .week__chart { flex: 1; min-height: 150px; display: flex; align-items: flex-end; gap: 14px; padding-top: 22px; position: relative; }
    .week__col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; }
    .week__val { font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .week__bar { width: 100%; max-width: 44px; min-height: 4px; border-radius: 10px 10px 4px 4px; background: #dfe3f0; transform-origin: bottom; animation: grow 520ms cubic-bezier(.2, .8, .2, 1) both; }
    .week__col.is-today .week__bar { background: var(--navy); }
    .week__day { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .week__col.is-today .week__day { color: var(--ink); }
    .week__day em { font-style: normal; font-size: 11px; font-weight: 700; background: var(--marker); color: var(--navy); padding: 1px 5px; border-radius: 5px; margin-left: 3px; }
    .week__empty { position: absolute; inset: 0 0 40px; display: grid; place-content: center; text-align: center; gap: 4px; }
    .week__empty strong { font-size: 15px; }
    .week__empty span { font-size: 13px; color: var(--ink-2); }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    .loans { grid-column: span 5; }
    .loans__list { list-style: none; display: grid; gap: 6px; overflow: auto; }
    .loan { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: #f6f7fb; }
    .loan.is-late { background: #fdf0f0; }
    .loan__main { min-width: 0; flex: 1; }
    .loan__item { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .loan__who { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
    .pill { flex: none; height: 28px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; background: #e8ebf3; color: var(--ink-2); }
    .pill--today { background: var(--marker); color: var(--navy); }
    .pill--late { background: var(--late); color: #fff; }

    .places { grid-column: span 3; }
    .places__list { list-style: none; display: grid; gap: 6px; margin: 0 -8px; }
    .place { display: block; padding: 6px 8px 8px; border-radius: 10px; transition: background-color 120ms; }
    .place:hover { background: var(--field); }
    .place__row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; gap: 8px; }
    .place__name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .place__count { font-size: 15px; color: var(--ink-2); font-weight: 700; flex: none; }
    .place__track { display: block; height: 8px; border-radius: 4px; background: #eceef5; overflow: hidden; }
    .place__fill { display: block; height: 100%; border-radius: 4px; background: var(--board); transform-origin: left; animation: grow-x 520ms cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* ───────── 등록 ───────── */
    .sheet { grid-column: span 4; overflow: auto; }
    .sheet__title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .sheet__desc { font-size: 13px; color: var(--ink-2); margin: 3px 0 18px; line-height: 1.45; }

    .field { display: grid; gap: 7px; border: 0; min-width: 0; }
    .field + .field { margin-top: 16px; }
    .field__label { display: flex; align-items: baseline; justify-content: space-between; font-size: 14px; font-weight: 700; }
    .field__label small { font-size: 12px; font-weight: 500; color: var(--ink-3); }
    legend.field__label { padding: 0; margin-bottom: 7px; width: 100%; }
    .field__error { font-size: 13px; font-weight: 600; color: var(--late); }
    .field__error:empty { display: none; }

    .input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 0; border-radius: 12px; background: var(--field);
      font-size: 16px; font-weight: 500;
      box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow 120ms, background-color 120ms;
    }
    .input::placeholder { color: var(--ink-3); font-weight: 400; }
    .input:focus { outline: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
    .input[aria-invalid="true"] { background: #fdf0f0; box-shadow: inset 0 0 0 2px var(--late); }
    textarea.input { height: 76px; padding: 12px 14px; resize: none; line-height: 1.45; }

    .choices { display: flex; flex-wrap: wrap; gap: 6px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: inline-flex; align-items: center; justify-content: center;
      height: 38px; padding: 0 13px; border-radius: 10px;
      background: var(--field); font-size: 14px; font-weight: 600; color: var(--ink-2);
      cursor: pointer; user-select: none; transition: background-color 120ms, color 120ms;
    }
    .choice span:hover { color: var(--ink); }
    .choice input:checked + span { background: var(--navy); color: #fff; }
    .choice input:focus-visible + span { outline: 3px solid var(--marker); outline-offset: 2px; }
    .floors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .floors .choice span { width: 100%; height: 44px; padding: 0; }
    .floors.is-invalid .choice span { box-shadow: inset 0 0 0 2px var(--late); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row .field + .field { margin-top: 0; }
    .row + .field { margin-top: 16px; }
    .row--qty { grid-template-columns: 1fr; }
    .row--qty .stepper { max-width: 180px; }

    .stepper { display: flex; align-items: center; height: 48px; border-radius: 12px; background: var(--field); overflow: hidden; }
    .stepper button { width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink-2); }
    .stepper button:hover { color: var(--ink); background: #e9ecf3; }
    .stepper button:disabled { color: var(--ink-3); opacity: .5; cursor: default; background: none; }
    .stepper input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; text-align: center; font-size: 17px; font-weight: 700; outline: 0; -moz-appearance: textfield; }
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .stepper:focus-within { box-shadow: inset 0 0 0 2px var(--navy); background: #fff; }

    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--field); cursor: pointer; font-size: 15px; font-weight: 600; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch__track { width: 46px; height: 28px; border-radius: 14px; background: #cfd4e2; position: relative; transition: background-color 150ms; flex: none; margin-right: 4px; }
    .switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform 150ms; }
    .switch input:checked + .switch__track { background: var(--board); }
    .switch input:checked + .switch__track::after { transform: translateX(18px); }
    .switch input:focus-visible + .switch__track { outline: 3px solid var(--marker); outline-offset: 2px; }

    .photo { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 1.5px dashed #c9cfdd; cursor: pointer; transition: border-color 120ms, background-color 120ms; }
    .photo:hover { border-color: var(--ink-3); background: #fafbfd; }
    .photo:focus-within { border-color: var(--navy); }
    .photo input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .photo__icon { width: 44px; height: 44px; border-radius: 10px; background: var(--field); display: grid; place-items: center; color: var(--ink-2); flex: none; overflow: hidden; }
    .photo__icon img { width: 100%; height: 100%; object-fit: cover; }
    .photo__text { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .photo__text small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .photo__busy { display: none; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .photo.is-busy .photo__text { display: none; }
    .photo.is-busy .photo__busy { display: block; }
    .photo__remove { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; }
    .photo__remove:hover { color: var(--late); }
    .photo.is-busy { border-style: solid; border-color: var(--line); background: #fafbfd; }
    .photo.is-busy .photo__text { color: var(--ink-2); }
    .photo.is-busy .photo__icon { color: var(--ink-3); }

    /* 미리보기: 이렇게 안내돼요 */
    .preview {
      grid-column: span 4; border-radius: var(--r-lg); color: #fff;
      background: linear-gradient(160deg, var(--board) 0%, var(--board-2) 100%);
      box-shadow: 0 18px 40px -22px rgba(31, 90, 69, .8);
      padding: 22px 24px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .preview__label { font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .7); }
    .preview__name { font-size: 26px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.2; margin-top: 6px; overflow-wrap: anywhere; }
    .preview__name.is-empty { color: rgba(255, 255, 255, .35); }
    .preview__qty { font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, .75); margin-top: 4px; }

    .path { list-style: none; margin-top: 20px; display: grid; }
    .path__step { position: relative; display: grid; grid-template-columns: 22px 1fr; align-items: start; gap: 10px; padding-bottom: 14px; }
    .path__step:last-child { padding-bottom: 0; }
    .path__step::before { content: ""; position: absolute; left: 10px; top: 16px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .16); }
    .path__step:last-child::before { display: none; }
    .path__dot { width: 12px; height: 12px; margin: 4px 0 0 5px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); transition: background-color 150ms, box-shadow 150ms; }
    .path__step.is-set .path__dot { background: #fff; box-shadow: none; }
    .path__step.is-last.is-set .path__dot { background: var(--marker); box-shadow: 0 0 0 4px rgba(255, 201, 60, .25); }
    .path__kind { font-size: 12px; color: rgba(255, 255, 255, .55); font-weight: 500; }
    .path__value { font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .path__step:not(.is-set) .path__value { color: rgba(255, 255, 255, .35); font-weight: 500; }

    .preview__memo { margin-top: 14px; font-size: 14px; line-height: 1.45; color: rgba(255, 255, 255, .85); background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }
    .preview__photo { margin-top: 14px; width: 100%; height: 110px; object-fit: cover; border-radius: 12px; }
    .preview > #preview { min-height: 0; overflow: auto; }
    .preview__foot { margin-top: auto; padding-top: 18px; display: grid; gap: 10px; }
    .preview__done { font-size: 14px; font-weight: 600; color: var(--marker); line-height: 1.45; }
    .preview__done:empty { display: none; }
    .save { height: 54px; border-radius: 14px; background: #fff; color: var(--navy); font-size: 17px; font-weight: 800; transition: transform 120ms, background-color 120ms; }
    .save:hover { background: #f1f3f8; }
    .save:active { transform: scale(.98); }

    /* ───────── 찾기 ───────── */
    .seek {
      grid-column: 1 / -1; border-radius: var(--r-lg); color: #fff;
      background: linear-gradient(135deg, var(--board) 0%, var(--board-2) 100%);
      box-shadow: 0 18px 40px -24px rgba(31, 90, 69, .8);
      padding: 16px; display: grid; gap: 12px;
    }
    .search--wide { max-width: none; height: 60px; padding-right: 10px; }
    .search--wide input { font-size: 18px; }
    .search__clear { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); flex: none; }
    .search__clear:hover { background: var(--field); color: var(--ink); }
    .search__clear .icon { width: 18px; height: 18px; }
    .kbd { flex: none; font-size: 12px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
    @media (pointer: coarse), (max-width: 760px) { .kbd { display: none; } }

    .filters { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 34px; }
    .fchip {
      height: 34px; padding: 0 12px; border-radius: 999px; flex: none;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255, 255, 255, .13); color: #fff; font-size: 14px; font-weight: 600;
      transition: background-color 120ms, color 120ms;
    }
    .fchip:hover { background: rgba(255, 255, 255, .22); }
    .fchip b { font-size: 13px; font-weight: 700; opacity: .65; }
    .fchip[aria-pressed="true"] { background: #fff; color: var(--navy); }
    .fchip[aria-pressed="true"] b { opacity: .8; }
    .fchip--toggle { margin-left: auto; }
    .fchip--toggle .icon { width: 16px; height: 16px; stroke-width: 2.4; }

    .results { grid-column: span 8; }
    .results__body { flex: 1; min-height: 0; overflow: auto; margin: 0 -6px; padding: 0 6px 4px; }
    .results__recent { display: none; }
    .hits { list-style: none; display: grid; gap: 8px; }
    .hit { display: grid; grid-template-columns: 1fr auto; align-items: start; gap: 14px; padding: 14px 16px; border-radius: 16px; background: #f6f7fb; }
    .hit.has-photo { grid-template-columns: 1fr 88px auto; gap: 12px; }
    .hit__main { min-width: 0; display: grid; gap: 4px; }
    .hit__name { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; overflow-wrap: anywhere; }
    .hit__qty { font-size: 16px; font-weight: 800; color: var(--ink-2); letter-spacing: -0.01em; padding-top: 1px; white-space: nowrap; }
    .hit__path { display: flex; flex-wrap: wrap; align-items: center; row-gap: 2px; font-size: 15px; font-weight: 500; color: var(--ink-2); }
    .hit__path > span { white-space: nowrap; }
    .hit__path > span + span::before { content: "›"; margin: 0 7px; color: var(--ink-3); font-weight: 400; }
    .hit__end { color: var(--board); font-weight: 700; }
    .hit__end .icon { display: inline-block; vertical-align: -3px; width: 16px; height: 16px; margin-right: 2px; stroke-width: 2.2; }
    .hit__memo { font-size: 14px; color: var(--ink-2); line-height: 1.45; }
    .hit__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 2px; }
    /* 보관 위치 사진은 대개 가로로 찍혀서, 정사각형보다 4:3이 덜 잘린다 */
    .hit__photo {
      align-self: center;
      width: 88px; height: 66px; border-radius: 10px;
      object-fit: cover; background: #e4e7f0;
      box-shadow: 0 1px 3px rgba(23, 32, 74, .14);
    }
    .tag { height: 24px; padding: 0 9px; border-radius: 7px; background: #e8ebf3; font-size: 12px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; }
    .tag--no { background: #fdf0f0; color: var(--late); }
    /* 비품 대장 칸 */
    .assetbox {
      margin-top: 12px; padding: 16px; border-radius: 14px;
      background: #fff; box-shadow: inset 0 0 0 1.5px var(--line);
    }
    .assetbox[hidden] { display: none; }
    .assetbox__lead { font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-bottom: 14px; }
    .assetbox .field + .field { margin-top: 14px; }
    .assetbox .row .field + .field { margin-top: 0; }
    .assetbox .row + .field, .assetbox .field + .row { margin-top: 14px; }
    .assetbox .input { height: 44px; font-size: 15px; }
    .assetbox textarea.input { height: 66px; }
    .suffix { position: relative; display: block; }
    .suffix .input { padding-right: 40px; }
    .suffix__unit {
      position: absolute; right: 14px; top: 0; height: 44px;
      display: flex; align-items: center;
      font-size: 14px; font-weight: 600; color: var(--ink-3); pointer-events: none;
    }
    .tag--asset { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px rgba(23, 32, 74, .25); }
    .hit__why { font-size: 12px; font-weight: 600; color: var(--ink-3); }
    mark { background: linear-gradient(transparent 52%, rgba(255, 201, 60, .75) 52%); color: inherit; padding: 0 1px; }

    .nohit { padding: 28px 8px; display: grid; justify-items: center; text-align: center; gap: 6px; }
    .nohit strong { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
    .nohit > span { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
    .nohit__guess { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 10px 0 4px; }
    .nohit__guess-label { width: 100%; font-size: 13px; color: var(--ink-3); font-weight: 600; }
    .nohit__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
    .pchip { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--field); font-size: 14px; font-weight: 700; color: var(--ink); }
    .pchip:hover { background: #e7eaf2; }

    .side { grid-column: span 4; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: auto; }
    .side .card { flex: none; }
    .recent { list-style: none; display: grid; gap: 2px; margin: 0 -8px; }
    .recent li { display: flex; align-items: center; }
    .recent__go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-radius: 10px; font-size: 15px; font-weight: 600; text-align: left; }
    .recent__go span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent__go .icon { width: 17px; height: 17px; color: var(--ink-3); }
    .recent__go:hover { background: var(--field); }
    .recent__x { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
    .recent__x:hover { background: var(--field); color: var(--ink); }
    .recent__x .icon { width: 15px; height: 15px; }
    .linkish { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .linkish:hover { color: var(--ink); }
    .side-empty { font-size: 14px; color: var(--ink-3); }

    .tips { list-style: none; display: grid; gap: 4px; margin: 0 -8px; }
    .tip { width: 100%; display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; padding: 8px; border-radius: 10px; text-align: left; }
    .tip:hover { background: var(--field); }
    .tip code { font-family: inherit; font-size: 15px; font-weight: 800; color: var(--navy); }
    .tip span { font-size: 13px; color: var(--ink-2); line-height: 1.4; }

    .sample-note { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
    .stock__sample { display: block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
    .stock__sample:hover { color: var(--ink); }

    .savebar { display: none; }
    /* ───────── 장소별 보기 ───────── */
    .bld { grid-column: span 5; min-height: 0; }
    .bld__tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .bld__tab {
      height: 38px; padding: 0 16px; border-radius: 10px; flex: none;
      display: inline-flex; align-items: center;
      background: var(--field); font-size: 15px; font-weight: 700; color: var(--ink-2);
      letter-spacing: -0.02em;
      transition: background-color 120ms, color 120ms;
    }
    .bld__tab:hover { color: var(--ink); }
    .bld__tab[aria-pressed="true"] { background: var(--navy); color: #fff; }

    /* 건물 단면: 위층이 위로 쌓인다 */
    .stack { display: grid; gap: 3px; overflow: auto; margin: 0 -4px; padding: 0 4px 2px; }
    .floor { display: grid; grid-template-columns: 50px 1fr; align-items: stretch; gap: 12px; }
    .floor__no {
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px; background: var(--field);
      font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.03em;
    }
    .floor__rooms { display: flex; flex-wrap: wrap; align-content: center; gap: 6px; padding: 10px 0; min-height: 60px; border-bottom: 1.5px solid var(--line); }
    .floor:last-child .floor__rooms { border-bottom: 0; }
    .floor--void .floor__no { background: transparent; color: var(--ink-3); }
    .floor__none { font-size: 13px; color: var(--ink-3); align-self: center; }

    .room {
      display: inline-flex; align-items: center;
      height: 40px; padding: 0 15px; border-radius: 11px;
      background: #eef1f6; font-size: 15px; font-weight: 700; letter-spacing: -0.02em;
      transition: background-color 120ms, color 120ms, transform 120ms;
    }
    .room:hover { background: #e2e7f0; }
    .room:active { transform: scale(.97); }
    .room[aria-current="true"] { background: var(--board); color: #fff; }

    .roomview { grid-column: span 7; overflow: auto; }
    .roomview__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .roomview__crumb { font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .roomview__crumb span + span::before { content: "›"; margin: 0 6px; color: var(--ink-3); font-weight: 400; }
    .roomview__name { font-size: 26px; font-weight: 800; letter-spacing: -0.035em; margin-top: 3px; }
    .roomview__sum { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-top: 4px; }

    .units { display: grid; gap: 16px; }
    .unit__name { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .unit__name .icon { width: 17px; height: 17px; color: var(--board); stroke-width: 2.2; align-self: center; }
    .unit__name small { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .shelf { display: grid; gap: 4px; }
    .shelf + .shelf { margin-top: 10px; }
    .shelf__label { font-size: 13px; font-weight: 700; color: var(--ink-2); padding-left: 2px; }
    .thing { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 14px; border-radius: 13px; background: #f6f7fb; }
    .thing__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .thing__qty { font-size: 16px; font-weight: 800; color: var(--ink-2); letter-spacing: -0.01em; }
    .thing__meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; }
    .thing__memo { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }

    /* ───────── 비품 대장 ───────── */
    .lsum { grid-column: 1 / -1; display: flex; flex-flow: row wrap; align-items: center; gap: 12px 28px; padding: 16px 22px; }
    .lsum__fig { display: grid; gap: 2px; }
    .lsum__label { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .lsum__value { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
    .lsum__value small { font-size: 14px; font-weight: 700; color: var(--ink-2); margin-left: 2px; }
    .lsum__spacer { flex: 1; }

    .ledger { grid-column: 1 / -1; min-height: 0; padding-bottom: 14px; }
    .ledger__tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
    .lfind {
      display: flex; align-items: center; gap: 10px; flex: 1; min-width: 220px;
      height: 44px; padding: 0 8px 0 14px; border-radius: 12px; background: var(--field);
    }
    .lfind .icon { width: 19px; height: 19px; color: var(--ink-2); }
    .lfind input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 15px; font-weight: 500; }
    .lfind input::placeholder { color: var(--ink-3); font-weight: 400; }
    .lfind input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .lfind:focus-within { background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
    .lfind__clear { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); flex: none; }
    .lfind__clear .icon { width: 16px; height: 16px; }
    .lfind__clear:hover { color: var(--ink); }

    .dept { display: flex; gap: 6px; flex-wrap: wrap; }
    .dept__chip { height: 34px; padding: 0 12px; border-radius: 999px; background: var(--field); font-size: 14px; font-weight: 600; color: var(--ink-2); flex: none; }
    .dept__chip:hover { color: var(--ink); }
    .dept__chip[aria-pressed="true"] { background: var(--navy); color: #fff; }
    .dept__chip b { font-size: 13px; opacity: .6; margin-left: 5px; }

    .lwrap { flex: 1; min-height: 0; overflow: auto; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); }
    .ltable { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 14px; }
    .ltable th, .ltable td { padding: 10px 14px; text-align: left; vertical-align: top; white-space: nowrap; border-bottom: 1px solid var(--line); }
    .ltable thead th { position: sticky; top: 0; z-index: 2; background: #f3f5f9; font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 0; }
    .ltable tbody tr:last-child td { border-bottom: 0; }
    .ltable tbody tr:hover td { background: #f8f9fc; }
    .ltable tbody tr:hover th { background: #f8f9fc; }

    .lsort { display: flex; align-items: center; gap: 5px; width: 100%; height: 40px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .lsort:hover { color: var(--ink); }
    .lsort .icon { width: 13px; height: 13px; stroke-width: 3; opacity: 0; }
    .ltable th[aria-sort] .lsort { color: var(--ink); }
    .ltable th[aria-sort] .lsort .icon { opacity: 1; }
    .ltable th[aria-sort="descending"] .lsort .icon { transform: rotate(180deg); }
    .lhead-plain { padding: 0 14px; height: 40px; display: flex; align-items: center; }
    .ltable .lnum { text-align: right; font-variant-numeric: tabular-nums; }
    .ltable th.lnum .lsort { justify-content: flex-end; }

    /* 첫 칸은 가로로 밀어도 붙어 있게 */
    .ltable th.lname, .ltable td.lname {
      position: sticky; left: 0; z-index: 1; background: #fff;
      white-space: normal; min-width: 200px; max-width: 260px;
      box-shadow: 1px 0 0 var(--line);
    }
    .ltable thead th.lname { z-index: 3; background: #f3f5f9; }
    .lname__title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
    .lname__where { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
    .lname__tags { display: inline-flex; gap: 4px; margin-top: 5px; }
    .ldim { color: var(--ink-3); }
    .lnote { white-space: normal; min-width: 160px; max-width: 260px; line-height: 1.4; color: var(--ink-2); }

    .lcards { display: none; }
    /* 수정·삭제 단추 */
    .acts { display: inline-flex; align-items: center; gap: 2px; }
    .act {
      display: inline-flex; align-items: center; gap: 4px;
      height: 30px; padding: 0 9px; border-radius: 8px;
      font-size: 13px; font-weight: 600; color: var(--ink-2);
      transition: background-color 120ms, color 120ms;
    }
    .act .icon { width: 15px; height: 15px; }
    .act:hover { background: #e8ebf3; color: var(--ink); }
    .act--del:hover { background: #fdeaea; color: var(--late); }

    .confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
    .confirm__yes, .confirm__no { height: 30px; padding: 0 11px; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .confirm__yes { background: var(--late); color: #fff; }
    .confirm__yes:hover { background: #d13c41; }
    .confirm__no { color: var(--ink-2); }
    .confirm__no:hover { background: #e8ebf3; color: var(--ink); }

    .thing__meta .acts, .thing__meta .confirm { margin-left: auto; }

    /* 찾기 결과에서는 물품 이름 오른쪽에 붙는다 */
    .hit__head { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 14px; }
    .hit__head .hit__name { flex: 0 1 auto; min-width: 0; }
    .hit__head .acts, .hit__head .confirm { flex: none; }

    .lname__acts { display: block; margin-top: 7px; margin-left: -9px; }

    /* 지웠어요 같은 짧은 알림 */
    .flash {
      position: fixed; left: 50%; bottom: 24px; z-index: 40;
      transform: translateX(-50%);
      max-width: calc(100vw - 32px);
      padding: 11px 18px; border-radius: 999px;
      background: var(--navy); color: #fff;
      font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
      box-shadow: 0 8px 24px -8px rgba(23, 32, 74, .5);
      animation: flash-in 180ms ease-out both;
    }
    .flash[hidden] { display: none; }
    @keyframes flash-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* 지우기: 저장 단추와 같은 크기 */
    .danger {
      width: 100%; height: 54px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 17px; font-weight: 800;
      transition: background-color 120ms, transform 120ms;
    }
    .danger:active { transform: scale(.98); }
    .danger .icon { width: 19px; height: 19px; }

    .dconfirm { display: grid; gap: 8px; }
    .dconfirm__q { text-align: center; font-size: 14px; font-weight: 700; }
    .dconfirm__row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dconfirm__yes, .dconfirm__no {
      height: 54px; border-radius: 14px; font-size: 17px; font-weight: 800;
      transition: background-color 120ms, transform 120ms;
    }
    .dconfirm__yes:active, .dconfirm__no:active { transform: scale(.98); }
    .dconfirm__yes { background: var(--late); color: #fff; }
    .dconfirm__yes:hover { background: #d13c41; }

    /* 초록 미리보기 카드 위에 놓일 때 */
    .preview__danger { margin-top: 10px; }
    .preview__danger .danger { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .35); }
    .preview__danger .danger:hover { background: rgba(255, 255, 255, .14); }
    .preview__danger .dconfirm__q { color: rgba(255, 255, 255, .85); }
    .preview__danger .dconfirm__no { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .35); }
    .preview__danger .dconfirm__no:hover { background: rgba(255, 255, 255, .14); }

    /* 폰에서는 본문 아래에 따로 놓인다 */
    .dangerbar { display: none; }
    .dangerbar .danger { background: #fff; color: var(--late); box-shadow: inset 0 0 0 1.5px rgba(229, 72, 77, .4); }
    .dangerbar .danger:hover { background: #fdeaea; }
    .dangerbar .dconfirm__q { color: var(--ink-2); }
    .dangerbar .dconfirm__no { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
    .dangerbar .dconfirm__no:hover { background: #f1f3f8; }
    /* ───────── 대여 ───────── */
    .rsum { grid-column: 1 / -1; display: flex; flex-flow: row wrap; align-items: center; gap: 12px 28px; padding: 16px 22px; }
    .rsum__fig { display: grid; gap: 2px; }
    .rsum__label { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .rsum__value { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
    .rsum__value small { font-size: 14px; font-weight: 700; color: var(--ink-2); margin-left: 2px; }
    .rsum__fig.is-late .rsum__value { color: var(--late); }
    .rsum__fig.is-today .rsum__value { color: #b8860b; }
    .rsum__spacer { flex: 1; }

    .rlist { grid-column: 1 / -1; min-height: 0; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tab {
      height: 38px; padding: 0 14px; border-radius: 10px; flex: none;
      background: var(--field); font-size: 15px; font-weight: 700; color: var(--ink-2);
      transition: background-color 120ms, color 120ms;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { background: var(--navy); color: #fff; }
    .tab b { font-size: 13px; opacity: .6; margin-left: 6px; }

    .rrows { list-style: none; display: grid; gap: 8px; overflow: auto; min-height: 0; }
    .rrow { display: grid; gap: 3px; padding: 14px 16px; border-radius: 16px; background: #f6f7fb; }
    .rrow.is-late { background: #fdf0f0; }
    .rrow.is-back { background: #f3f6f4; }
    .rrow__head { display: flex; align-items: flex-start; gap: 12px; }
    .rrow__name { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; overflow-wrap: anywhere; }
    .rrow__name .num { font-size: 15px; color: var(--ink-2); }
    .rrow__name s { color: var(--ink-3); text-decoration-thickness: 1px; }
    .rrow__head .pill { flex: none; margin-top: 1px; }
    .rrow__who { font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .rrow__where { font-size: 13px; color: var(--ink-3); }
    .rrow__memo { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }
    .rrow__acts { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; margin: 8px -9px -2px 0; }

    /* 넓은 화면에서는 단추를 오른쪽에 세운다 */
    @media (min-width: 761px) {
      .rrow { grid-template-columns: minmax(0, 1fr) auto; column-gap: 20px; align-items: center; }
      .rrow__head, .rrow__who, .rrow__where, .rrow__memo, .rrow__sign { grid-column: 1; }
      .rrow__acts { grid-column: 2; grid-row: 1 / -1; margin: 0 -9px 0 0; flex-wrap: nowrap; }
    }
    .back-btn { height: 36px; padding: 0 14px; border-radius: 10px; background: var(--board); color: #fff; font-size: 14px; font-weight: 700; }
    .back-btn:hover { background: var(--board-2); }
    .back-btn:active { transform: scale(.97); }

    /* 빌리기 */
    .pick { position: relative; }
    .pick__results { list-style: none; display: grid; gap: 4px; margin-top: 8px; max-height: 236px; overflow: auto; }
    .pickrow {
      width: 100%; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
      padding: 10px 12px; border-radius: 12px; text-align: left;
      transition: background-color 120ms;
    }
    .pickrow:hover { background: var(--field); }
    .pickrow__name { font-size: 15px; font-weight: 700; }
    .pickrow__where { grid-column: 1; font-size: 13px; color: var(--ink-2); }
    .pickrow__left { font-size: 14px; font-weight: 700; color: var(--board); white-space: nowrap; }
    .pickrow__left.is-none { color: var(--ink-3); }
    .pick__none { padding: 14px 2px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }

    .chosen { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-radius: 14px; background: var(--field); }
    .chosen__name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .chosen__where { grid-column: 1; font-size: 13px; color: var(--ink-2); }
    .chosen__left { grid-column: 1; font-size: 13px; font-weight: 700; color: var(--board); margin-top: 2px; }
    .chosen__change { align-self: start; font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px 10px; border-radius: 8px; }
    .chosen__change:hover { background: #e4e8f0; color: var(--ink); }

    .whens { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .when { height: 36px; padding: 0 12px; border-radius: 10px; background: var(--field); font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .when:hover { color: var(--ink); }
    .when[aria-pressed="true"] { background: var(--navy); color: #fff; }

    .preview__line { display: grid; grid-template-columns: 62px 1fr; gap: 4px 10px; margin-top: 18px; font-size: 15px; }
    .preview__k { font-size: 13px; color: rgba(255, 255, 255, .6); font-weight: 500; padding-top: 2px; }
    .preview__v { font-weight: 700; overflow-wrap: anywhere; }
    .preview__v.is-empty { color: rgba(255, 255, 255, .35); font-weight: 500; }
    /* ───────── 관리 담당 ───────── */
    .todo { grid-column: span 8; min-height: 0; }
    .todo__body { flex: 1; min-height: 0; overflow: auto; display: grid; gap: 20px; align-content: start; margin: 0 -4px; padding: 0 4px; }
    .group__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .group__dot { width: 9px; height: 9px; border-radius: 3px; flex: none; align-self: center; }
    .group__name { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .group__count { font-size: 13px; font-weight: 700; color: var(--ink-3); }
    .group__why { font-size: 13px; color: var(--ink-2); margin: -4px 0 8px 17px; line-height: 1.45; }
    .group__list { list-style: none; display: grid; gap: 6px; }

    .todorow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 11px 14px; border-radius: 13px; background: #f6f7fb; }
    .todorow.is-late { background: #fdf0f0; }
    .todorow__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .todorow__sub { grid-column: 1; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
    .todorow__act { grid-column: 2; grid-row: 1 / -1; display: flex; align-items: center; gap: 6px; }
    .mini { height: 34px; padding: 0 13px; border-radius: 9px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .mini--go { background: var(--navy); color: #fff; }
    .mini--go:hover { background: var(--navy-2); }
    .mini--back { background: var(--board); color: #fff; }
    .mini--back:hover { background: var(--board-2); }
    .mini--quiet { background: #e8ebf3; color: var(--ink-2); }
    .mini--quiet:hover { color: var(--ink); }
    .mini:active { transform: scale(.97); }

    .allclear { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 8px; padding: 30px 8px; }
    .allclear__mark { width: 52px; height: 52px; border-radius: 50%; background: #e8f2ed; color: var(--board); display: grid; place-items: center; }
    .allclear__mark .icon { width: 26px; height: 26px; stroke-width: 2.4; }
    .allclear strong { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
    .allclear span { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

    .signlist { list-style: none; display: grid; gap: 6px; max-height: 320px; overflow: auto; margin: 0 -8px; }
    .signrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; }
    .signrow:hover { background: var(--field); }
    .signrow__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .signrow__sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
    .signrow__img { height: 38px; width: auto; max-width: 120px; object-fit: contain; object-position: right; opacity: .9; }
    .who__save { width: 100%; height: 48px; border-radius: 12px; background: var(--navy); color: #fff; font-size: 16px; font-weight: 800; margin-top: 18px; }
    .who__save:hover { background: var(--navy-2); }
    .who__save:active { transform: scale(.98); }
    .who__done { font-size: 14px; font-weight: 600; color: var(--board); text-align: center; margin-top: 10px; min-height: 20px; }
    /* 알림 */
    .alert { position: relative; }
    .alert__badge {
      position: absolute; top: -2px; right: -2px; min-width: 19px; height: 19px;
      padding: 0 5px; border-radius: 999px;
      background: var(--late); color: #fff;
      font-size: 11px; font-weight: 800; line-height: 19px; text-align: center;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 0 0 2px var(--bg);
    }
    .avatar[aria-expanded="true"] { background: var(--navy); color: #fff; box-shadow: none; }

    .alert__panel {
      position: absolute; top: calc(100% + 10px); right: 0; z-index: 30;
      width: 340px; max-width: calc(100vw - 32px);
      background: var(--card); border-radius: 18px;
      box-shadow: 0 2px 6px rgba(23, 32, 74, .08), 0 20px 44px -16px rgba(23, 32, 74, .34);
      overflow: hidden;
      animation: pop 140ms ease-out both;
    }
    .alert__panel[hidden] { display: none; }
    @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    .alert__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 16px 18px 10px; }
    .alert__title { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .alert__count { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .alert__list { list-style: none; max-height: 340px; overflow: auto; padding: 0 8px 8px; }
    .alert__row { display: grid; grid-template-columns: 9px 1fr; gap: 10px; align-items: start; padding: 10px; border-radius: 12px; }
    .alert__row:hover { background: var(--field); }
    .alert__dot { width: 9px; height: 9px; border-radius: 3px; margin-top: 5px; }
    .alert__name { display: block; font-size: 15px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .alert__sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; overflow-wrap: anywhere; }
    .alert__none { padding: 26px 18px 30px; text-align: center; }
    .alert__none strong { display: block; font-size: 15px; font-weight: 700; }
    .alert__none span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; }
    .alert__foot { border-top: 1px solid var(--line); }
    .alert__all { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 48px; font-size: 14px; font-weight: 700; color: var(--ink-2); }
    .alert__all:hover { background: var(--field); color: var(--ink); }
    /* 분류로 고르기 */
    .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .cat {
      height: 34px; padding: 0 12px; border-radius: 999px; flex: none;
      background: var(--field); font-size: 14px; font-weight: 600; color: var(--ink-2);
      transition: background-color 120ms, color 120ms;
    }
    .cat:hover { color: var(--ink); }
    .cat[aria-pressed="true"] { background: var(--navy); color: #fff; }
    .cat b { font-size: 13px; font-weight: 700; opacity: .55; margin-left: 5px; }

    /* 고르는 칸 */
    .selectbox { position: relative; }
    .selectbox select {
      width: 100%; appearance: none; -webkit-appearance: none;
      padding-right: 42px; cursor: pointer;
    }
    .selectbox select:focus { outline: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
    .selectbox__caret {
      position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: var(--ink-2); pointer-events: none; stroke-width: 2.4;
    }
    .periodnote { margin-top: 8px; }
    .periodnote[hidden] { display: none; }

    /* 서명 */
    .rrow__sign { display: block; height: 34px; width: auto; max-width: 180px; object-fit: contain; object-position: left; margin-top: 7px; opacity: .9; }
    .preview__sign { font-size: 13px; color: rgba(255, 255, 255, .7); margin-top: 10px; }

    .signback {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center; padding: 16px;
      background: rgba(18, 24, 49, .5);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      animation: fade 140ms ease-out both;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .signbox {
      width: min(520px, 100%); background: var(--card); color: var(--ink);
      border-radius: 22px; padding: 22px;
      box-shadow: 0 24px 60px -20px rgba(23, 32, 74, .55);
      animation: pop 160ms ease-out both;
    }
    .signbox__title { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
    .signbox__desc { font-size: 14px; color: var(--ink-2); margin-top: 4px; line-height: 1.45; }
    .signpad {
      position: relative; margin-top: 16px; border-radius: 14px;
      background: var(--field); box-shadow: inset 0 0 0 1.5px var(--line);
      overflow: hidden; touch-action: none;
    }
    .signpad canvas { display: block; width: 100%; height: 190px; touch-action: none; cursor: crosshair; }
    .signpad__line { position: absolute; left: 22px; right: 22px; bottom: 44px; height: 1.5px; background: #d6dbe6; pointer-events: none; }
    .signpad__hint {
      position: absolute; left: 0; right: 0; bottom: 18px; text-align: center;
      font-size: 14px; color: var(--ink-3); pointer-events: none;
    }
    .signpad.is-drawn .signpad__hint, .signpad.is-drawn .signpad__line { opacity: 0; }
    .signbox__err { font-size: 13px; font-weight: 600; color: var(--late); min-height: 18px; margin-top: 8px; }
    .signbox__acts { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .signbox__spacer { flex: 1; }
    .signbox__go { height: 48px; padding: 0 20px; border-radius: 12px; background: var(--navy); color: #fff; font-size: 16px; font-weight: 800; }
    .signbox__go:hover { background: var(--navy-2); }
    .signbox__go:active { transform: scale(.98); }
    /* ───────── 로그인·학교 ───────── */
    .gate {
      min-height: 100vh; min-height: 100dvh;
      display: grid; place-items: center;
      padding: calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
      background: var(--bg);
    }
    .gate[hidden], .app[hidden] { display: none; }
    .gate__box { width: min(420px, 100%); }
    .gate__brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .gate__mark { width: 44px; height: 44px; border-radius: 13px; background: var(--marker); color: var(--navy); display: grid; place-items: center; flex: none; }
    .gate__name { font-size: 19px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
    .gate__card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); padding: 26px 24px; }
    .gate__title { font-size: 24px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.25; }
    .gate__desc { font-size: 15px; color: var(--ink-2); line-height: 1.55; margin-top: 8px; }
    .gate__acts { display: grid; gap: 8px; margin-top: 22px; }
    .gate__err { font-size: 14px; font-weight: 600; color: var(--late); margin-top: 12px; min-height: 20px; line-height: 1.45; }
    .gate__foot { font-size: 13px; color: var(--ink-3); line-height: 1.6; margin-top: 18px; text-align: center; }
    .gate__foot button { font-size: 13px; font-weight: 700; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
    .gate__foot button:hover { color: var(--ink); }

    .bigbtn {
      width: 100%; height: 54px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
      transition: background-color 120ms, transform 120ms;
    }
    .bigbtn:active { transform: scale(.98); }
    .bigbtn--google { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
    .bigbtn--google:hover { background: #f7f8fb; }
    .bigbtn--navy { background: var(--navy); color: #fff; }
    .bigbtn--navy:hover { background: var(--navy-2); }
    .bigbtn--ghost { background: var(--field); color: var(--ink); }
    .bigbtn--ghost:hover { background: #e7eaf2; }
    .bigbtn[disabled] { opacity: .55; cursor: default; }
    .gicon { width: 20px; height: 20px; flex: none; }

    .gate__who { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 13px; background: var(--field); margin-bottom: 18px; }
    .gate__who-mail { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gate__who button { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; flex: none; }
    .gate__who button:hover { background: #e4e8f0; color: var(--ink); }

    .codebox { display: grid; gap: 8px; margin-top: 18px; }
    .codebox input {
      width: 100%; height: 58px; border: 0; border-radius: 14px; background: var(--field);
      text-align: center; font-size: 26px; font-weight: 800; letter-spacing: .22em; text-indent: .22em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px transparent;
    }
    .codebox input:focus { outline: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
    .codebox input::placeholder { color: var(--ink-3); font-weight: 600; letter-spacing: .18em; }

    .waitmark { width: 54px; height: 54px; border-radius: 50%; background: #fff7e0; color: #b8860b; display: grid; place-items: center; margin-bottom: 16px; }
    .waitmark .icon { width: 26px; height: 26px; stroke-width: 2.2; }

    /* 왼쪽 아래 로그인한 사람 */
    .rail__me { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, .1); }
    .rail__mail { flex: 1; min-width: 0; font-size: 12px; color: rgba(255, 255, 255, .5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail__out { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .6); padding: 6px 8px; border-radius: 8px; flex: none; }
    .rail__out:hover { background: rgba(255, 255, 255, .1); color: #fff; }
    .rolechip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--marker); color: var(--navy); font-size: 11px; font-weight: 800; margin-left: 6px; }

    /* 구성원 관리 */
    .code { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: var(--field); }
    .code__val { flex: 1; font-size: 24px; font-weight: 800; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
    .mlist { list-style: none; display: grid; gap: 4px; margin: 12px -8px 0; }
    .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 12px; padding: 9px 8px; border-radius: 11px; }
    .mrow:hover { background: var(--field); }
    .mrow.is-pending { background: #fffaf0; }
    .mrow__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .mrow__mail { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
    .mrow__acts { display: flex; align-items: center; gap: 4px; flex: none; }
    .mrow__tag { font-size: 12px; font-weight: 700; color: var(--ink-3); }
    .placebar { display: none; }
    .tabbar { display: none; }

    /* ───────── 반응형 ───────── */
    @media (max-width: 1180px) {
      .app { grid-template-columns: 84px 1fr; }
      .rail { padding: 24px 12px; align-items: center; }
      .brand { padding: 0 0 28px; }
      .brand__name, .rail__label, .rail__foot { display: none; }
      .rail__item { width: 52px; justify-content: center; padding: 0; }
      .main, .main.is-add { grid-template-rows: none; align-content: start; }
      .main > * { min-height: auto; }
      .plan { right: -50px; }
      .find { grid-column: 1 / -1; }
      .stock { grid-column: span 5; }
      .week { grid-column: span 7; }
      .loans { grid-column: span 7; }
      .places { grid-column: span 5; }
      .bld { grid-column: 1 / -1; }
      .roomview { grid-column: 1 / -1; overflow: visible; }
      .stack { overflow: visible; }
      .sheet { grid-column: span 6; overflow: visible; }
      .preview { grid-column: 1 / -1; }
      .results { grid-column: 1 / -1; min-height: 360px; }
      .side { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; overflow: visible; }
    }

    @media (max-width: 760px) {
      .app { display: block; height: auto; min-height: 100dvh; }
      .rail { display: none; }
      .main, .main.is-add {
        display: flex; flex-direction: column; gap: 10px;
        padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 80px);
        overflow: visible;
      }
      .main.is-add { padding-bottom: calc(env(safe-area-inset-bottom) + 96px); }
      .top { min-height: 0; }
      .top__date { font-size: 13px; }
      .top__title { font-size: 22px; }
      .top__actions .btn { display: none; }
      .is-rent .top__actions .btn { display: inline-flex; }
      .avatar { width: 40px; height: 40px; }

      .find { min-height: 0; padding: 22px 18px 16px; border-radius: 20px; }
      .plan { width: 190px; right: -26px; top: -18px; opacity: .4; }
      .find__title { font-size: min(8.2vw, 34px); margin-bottom: 16px; }
      .search { height: 54px; padding-left: 14px; }
      .search input { font-size: 16px; }
      .find__foot-label { display: none; }
      .find__foot { flex-wrap: nowrap; overflow-x: auto; margin: 10px -18px 0; padding: 0 18px; scrollbar-width: none; }
      .find__foot::-webkit-scrollbar { display: none; }
      .chip { flex: none; }

      .card { padding: 16px 18px; border-radius: 20px; }
      .card__head { margin-bottom: 10px; }
      .stock { display: grid; grid-template-columns: 1fr auto; align-items: center; }
      .stock .card__head { margin: 0; }
      .stock .card__meta { display: none; }
      .stock__figure { grid-column: 2; grid-row: 1; }
      .stock__total { font-size: 30px; }
      .stock__unit { font-size: 15px; margin-left: 2px; }
      .stock__bar { grid-column: 1 / -1; height: 10px; margin: 12px 0 10px; }
      .legend { grid-column: 1 / -1; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 8px; }
      .legend__row { gap: 6px; font-size: 13px; }
      .legend__row b { margin-left: 2px; font-size: 14px; }
      .legend__dot { width: 8px; height: 8px; border-radius: 2px; }
      .stock__cta { grid-column: 1 / -1; }
      .loan { padding: 10px 12px; }
      .pill { height: 26px; padding: 0 10px; }
      .loans .loan:nth-child(n+4) { display: none; }
      .week, .places { display: none; }

      .bld__tabs { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px 14px; padding: 0 18px; scrollbar-width: none; }
      .bld__tabs::-webkit-scrollbar { display: none; }
      .floor { grid-template-columns: 46px 1fr; gap: 10px; }
      .floor__no { font-size: 13px; }
      .room { height: 44px; }
      body.is-room .tabbar { display: none; }
      body.is-room .main { padding-bottom: calc(env(safe-area-inset-bottom) + 88px); }
      .placebar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px);
        background: rgba(255, 255, 255, .94);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--line);
      }
      .placebar__info { flex: 1; min-width: 0; }
      .placebar__name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  <script type="module">
    /* ════════ 데이터 (→ src/data) ════════ */
    const DEFAULT_SCHOOL = { name: '우리 학교', teacher: '', place: '행정실', tel: '' };
    const school = () => ({ ...DEFAULT_SCHOOL, ...(state.school || {}) });
    const CATEGORIES = ['수업 기기', '체육', '과학 실험', '방송·행사', '사무·행정', '기타'];
    const FLOORS = [
      { value: '지하 1층', short: '지하' }, { value: '1층', short: '1' }, { value: '2층', short: '2' },
      { value: '3층', short: '3' }, { value: '4층', short: '4' }, { value: '5층', short: '5' },
    ];
    const BUILDING_HINTS = ['본관', '별관', '체육관'];

    // 비품 대장에 적는 칸. wide=true면 한 줄을 다 쓴다.
    const ASSET_FIELDS = [
      { key: 'name',  label: '비품명',   placeholder: '대장에 적힌 이름', wide: true },

      { key: 'dept',  label: '운용부서', placeholder: '예: 과학과' },
      { key: 'place', label: '위치장소', placeholder: '대장에 적힌 장소' },

      { key: 'no',    label: '고유번호', placeholder: '예: 2024-0135' },

      { key: 'life',  label: '내용연수', unit: '년', inputmode: 'numeric', placeholder: '0' },

    ];
    const emptyAsset = () => Object.fromEntries(ASSET_FIELDS.map((f) => [f.key, '']));
    const PATH_KINDS = [
      { key: 'building', label: '건물' },
      { key: 'floor',    label: '층' },
      { key: 'room',     label: '실' },
      { key: 'storage',  label: '보관함' },
      { key: 'shelf',    label: '칸' },
    ];

    // 같은 물건을 다르게 부르는 말 (→ src/data/synonyms.js)
    const SYNONYMS = [
      ['빔프로젝터', '프로젝터', '빔', '영사기'],
      ['멀티탭', '멀티콘센트', '연장선', '콘센트'],
      ['노트북', '랩탑', 'laptop'],
      ['태블릿', '아이패드', '패드', '갤럭시탭'],
      ['마이크', '무선마이크', '핀마이크'],
      ['스피커', '앰프', '엠프'],
      ['삼각대', '트라이포드', 'tripod'],
      ['카메라', '캠코더', '디카'],
      ['포인터', '레이저포인터', '프레젠터', '프리젠터'],
      ['리모컨', '리모콘'],
      ['케이블', 'hdmi', '젠더'],
      ['보안경', '고글'],
      ['확성기', '메가폰', '메가폰스피커'],
    ];

    // 원할 때만 넣는 예시 물품. sample 표시가 있어서 한 번에 지울 수 있다.
    const SAMPLE_ITEMS = [
      ['휴대용 빔프로젝터', '수업 기기', 2, true, '본관', '3층', '과학 준비실', '2번 캐비닛', '위에서 2칸', '파란 상자 안에 있어요. 리모컨도 같이 들어 있어요.'],
      ['HDMI 케이블 10m', '수업 기기', 3, true, '본관', '3층', '과학 준비실', '2번 캐비닛', '맨 아래 칸', ''],
      ['디지털 현미경', '과학 실험', 6, true, '본관', '3층', '과학 준비실', '1번 캐비닛', '맨 위 칸', ''],
      ['보안경', '과학 실험', 30, false, '본관', '3층', '과학 준비실', '실험 도구함', '둘째 칸', ''],
      ['무선 마이크', '방송·행사', 4, true, '본관', '2층', '방송실', '장비 선반', '가운데 칸', '충전기는 책상 서랍 첫째 칸에 있어요.'],
      ['카메라 삼각대', '방송·행사', 3, true, '본관', '2층', '방송실', '장비 선반', '맨 아래 칸', ''],
      ['블루투스 스피커', '방송·행사', 2, true, '본관', '2층', '방송실', '장비 선반', '가운데 칸', ''],
      ['수업용 노트북', '수업 기기', 15, true, '본관', '2층', '교무실', '충전 보관함', '', '빌리기 전에 교무부에 말씀해 주세요.'],
      ['레이저 포인터', '수업 기기', 5, true, '본관', '2층', '교무실', '공용 서랍', '첫째 칸', ''],
      ['멀티탭 5구', '사무·행정', 8, true, '본관', '1층', '행정실', '비품 캐비닛', '3칸', ''],
      ['태블릿 (아이패드)', '수업 기기', 20, true, '별관', '2층', '컴퓨터실', '충전 카트', '', '카트 열쇠는 정보 선생님께 있어요.'],
      ['줄넘기', '체육', 40, true, '체육관', '1층', '체육 창고', '왼쪽 바구니', '', ''],
      ['배구공', '체육', 12, true, '체육관', '1층', '체육 창고', '공 수레', '', '바람이 빠진 공은 수레 옆 상자에 모아 주세요.'],
      ['확성기', '방송·행사', 2, true, '체육관', '1층', '체육 창고', '문 옆 선반', '', '건전지를 확인하고 가져가세요.'],
      ['뜀틀', '체육', 2, false, '체육관', '1층', '무대 옆 창고', '', '', ''],
    ].map(([name, category, qty, loanable, building, floor, room, storage, shelf, memo], i) => ({
      id: 'smp_' + i, sample: true, name, category, qty, loanable, building, floor, room, storage, shelf, memo,
      createdAt: new Date(Date.now() - (15 - i) * 3600e3).toISOString(),
    }));

    // 저장소: localStorage를 쓰고, 막혀 있으면(미리보기 환경 등) 메모리에만 둔다.
    const STORE_KEY = 'school-items:v1';
    const blank = () => ({ items: [], loans: [], recent: [] });
    let memoryStore = blank();
    const store = {
      load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          return { ...blank(), ...(raw ? JSON.parse(raw) : {}) };
        } catch { return structuredClone(memoryStore); }
      },
      save(next) {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(next)); }
        catch (e) {
          if (e && e.name === 'QuotaExceededError') throw e;
          memoryStore = structuredClone(next);
        }
      },
    };
    let state = store.load();
    const commit = (next) => {
      const prev = state;
      store.save(next);   // 기기에도 남겨 두면 인터넷이 끊겨도 바로 보인다
      state = next;
      pushDiff(prev, next);
    };

    const newId = () => 'itm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const hasSamples = () => state.items.some((i) => i.sample);
    const addSamples = () => commit({ ...state, items: [...state.items.filter((i) => !i.sample), ...SAMPLE_ITEMS] });
    const removeSamples = () => commit({ ...state, items: state.items.filter((i) => !i.sample) });
    const addRecent = (q) => {
      q = q.trim();
      if (!q) return;
      commit({ ...state, recent: [q, ...state.recent.filter((r) => r !== q)].slice(0, 6) });
    };

    /* ════════ 로그인과 학교 (→ src/lib/auth.js) ════════ */
    // 아래 두 줄을 채우면 여러 선생님이 같은 학교 자료를 함께 봐요.
    // 비워 두면 이 기기에만 저장되는 '혼자 쓰기' 모드로 돌아갑니다.
    const SUPABASE = {
      url: 'https://zhytrtgnedatjwflfgkj.supabase.co',
      anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeXRydGduZWRhdGp3ZmxmZ2tqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMDAwMTksImV4cCI6MjEwNDg3NjAxOX0.q4A5M70jFDDrmY-Mtdx0QXRNsQzkDASoZgBGX7TA0QE',
    };

    let sb = null;        // Supabase 연결. 설정이 없으면 null
    let session = null;   // 로그인한 사람
    let me = null;        // { schoolId, role, status, school }
    let members = [];     // 우리 학교 구성원 (관리자만 읽어 옴)

    const online = () => Boolean(sb);
    const isAdmin = () => !online() || me?.role === 'admin';
    const myEmail = () => session?.user?.email || '';
    const myName = () => session?.user?.user_metadata?.full_name || '';

    let bootError = '';

    async function initSupabase() {
      if (!SUPABASE.url || !SUPABASE.anonKey) return;
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      sb = createClient(SUPABASE.url, SUPABASE.anonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
      const { data } = await sb.auth.getSession();
      session = data.session;
      sb.auth.onAuthStateChange(async (_event, next) => {
        const changed = next?.user?.id !== session?.user?.id;
        session = next;
        if (changed) { await loadMe(); await loadData(); render(); }
      });
    }

    async function loadMe() {
      me = null; members = [];
      if (!sb || !session) return;
      const { data, error } = await sb.rpc('my_membership');
      if (error) { console.error(error); return; }
      if (!data) return;
      me = { schoolId: data.school_id, role: data.role, status: data.status, school: data.school };
      if (me.role === 'admin' && me.status === 'active') await loadMembers();
    }

    async function loadMembers() {
      const { data, error } = await sb.from('members')
        .select('id,user_id,email,name,role,status,created_at')
        .order('created_at', { ascending: true });
      if (!error) members = data || [];
    }

    // 서버에 있는 우리 학교 자료를 통째로 읽어 와서 화면 상태로 만든다
    async function loadData() {
      if (!sb || me?.status !== 'active') return;
      const [items, loans] = await Promise.all([
        sb.from('items').select('*'),
        sb.from('loans').select('*'),
      ]);
      state = {
        ...state,
        items: (items.data || []).map(fromRowItem),
        loans: (loans.data || []).map(fromRowLoan),
        school: me.school
          ? { name: me.school.name, teacher: me.school.teacher, place: me.school.place, tel: me.school.tel }
          : state.school,
      };
    }

    /* 표의 칸 이름과 앱의 이름을 서로 옮겨 준다 */
    const fromRowItem = (r) => ({
      id: r.id, name: r.name, category: r.category, qty: r.qty, loanable: r.loanable,
      building: r.building, floor: r.floor, room: r.room, storage: r.storage, shelf: r.shelf,
      memo: r.memo, ...(r.photo ? { photo: r.photo } : {}),
      asset: r.asset, ...(r.asset_info ? { assetInfo: r.asset_info } : {}),
      ...(r.sample ? { sample: true } : {}),
      createdAt: r.created_at, ...(r.updated_at ? { updatedAt: r.updated_at } : {}),
    });
    const toRowItem = (i) => ({
      id: i.id, school_id: me.schoolId, name: i.name, category: i.category || '', qty: i.qty,
      loanable: !!i.loanable, building: i.building || '', floor: i.floor || '', room: i.room || '',
      storage: i.storage || '', shelf: i.shelf || '', memo: i.memo || '', photo: i.photo || null,
      asset: !!i.asset, asset_info: i.assetInfo || null, sample: !!i.sample,
      created_at: i.createdAt, updated_at: i.updatedAt || null,
    });
    const fromRowLoan = (r) => ({
      id: r.id, itemId: r.item_id, itemName: r.item_name, path: r.path, qty: r.qty, who: r.who,
      dueAt: r.due_at, period: r.period, periodNote: r.period_note, memo: r.memo,
      ...(r.sign ? { sign: r.sign } : {}),
      outAt: r.out_at, returnedAt: r.returned_at,
    });
    const toRowLoan = (l) => ({
      id: l.id, school_id: me.schoolId, item_id: l.itemId, item_name: l.itemName, path: l.path || '',
      qty: l.qty, who: l.who, due_at: l.dueAt || null, period: l.period || '',
      period_note: l.periodNote || '', memo: l.memo || '', sign: l.sign || null,
      out_at: l.outAt, returned_at: l.returnedAt,
    });

    // 바뀐 줄만 골라 서버에 보낸다. 화면은 먼저 바뀌고 저장은 뒤따라간다.
    async function pushDiff(prev, next) {
      if (!sb || me?.status !== 'active') return;
      const jobs = [];
      const diff = (a, b, table, toRow) => {
        const before = new Map(a.map((x) => [x.id, x]));
        const after = new Map(b.map((x) => [x.id, x]));
        const changed = [...after.values()].filter((x) => JSON.stringify(before.get(x.id)) !== JSON.stringify(x));
        const gone = [...before.keys()].filter((id) => !after.has(id));
        if (changed.length) jobs.push(sb.from(table).upsert(changed.map(toRow)));
        if (gone.length) jobs.push(sb.from(table).delete().in('id', gone));
      };
      diff(prev.items || [], next.items || [], 'items', toRowItem);
      diff(prev.loans || [], next.loans || [], 'loans', toRowLoan);

      if (JSON.stringify(prev.school) !== JSON.stringify(next.school) && next.school && isAdmin()) {

          name: next.school.name, teacher: next.school.teacher,
          place: next.school.place, tel: next.school.tel,
        }).eq('id', me.schoolId));
      }

      const results = await Promise.all(jobs);
      const bad = results.find((r) => r && r.error);

    // 받침에 맞는 조사: josa('삼각대', '은/는') → '삼각대는'
    function josa(word, pair) {
      const [withJong, withoutJong] = pair.split('/');
      const last = String(word).trim().slice(-1);
      const code = last.charCodeAt(0) - 0xac00;
      if (code < 0 || code > 11171) {
        // 영문·숫자로 끝나면 읽는 소리를 알 수 없으니 둘 다 적는다
        return `${word}${withJong}(${withoutJong})`;
      }
      const jong = code % 28;
      if (pair === '으로/로' && jong === 8) return word + '로'; // ㄹ 받침
      return word + (jong ? withJong : withoutJong);
    }
