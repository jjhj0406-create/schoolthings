        <ol class="path">
          ${steps.map((s, i) => `
            <li class="path__step ${s.value ? 'is-set' : ''} ${i === lastSet ? 'is-last' : ''}">
              <span class="path__dot" aria-hidden="true"></span>
              <span><span class="path__kind">${esc(s.label)}</span><br><span class="path__value">${esc(s.value || '아직 비어 있어요')}</span></span>
            </li>`).join('')}
        </ol>
        ${d.memo ? `<p class="preview__memo">${esc(d.memo)}</p>` : ''}
        ${d.photo ? `<img class="preview__photo" src="${esc(d.photo)}" alt="보관 위치 사진">` : ''}`;
      view.querySelector('#preview-done').textContent = lastSaved;

      const path = pathOf(d);
      view.querySelector('#sb-name').textContent = d.name || '물품 이름을 적어 주세요';
      const sbPath = view.querySelector('#sb-path');
      const done = Boolean(lastSaved && !d.name);
      sbPath.textContent = done ? lastSaved : (path.length ? path.join(' › ') : '위치를 적으면 여기에 경로가 보여요');
      sbPath.classList.toggle('is-done', done);

      const dangerHTML = pendingDelete === editing
        ? `<div class="dconfirm">
             <p class="dconfirm__q">정말 지울까요?</p>
             <div class="dconfirm__row">
               <button class="dconfirm__yes" type="button" data-del-yes="${editing}">지우기</button>
               <button class="dconfirm__no" type="button" data-del-cancel>그만두기</button>
             </div>
           </div>`
        : `<button class="danger" type="button" data-del="${editing}">${icon(ICONS.trash)}이 물품 지우기</button>`;
      for (const slot of view.querySelectorAll('[data-danger]')) slot.innerHTML = dangerHTML;
    }

    function readForm(form) {
      const fd = new FormData(form);
      return {
        ...draft,
        name: (fd.get('name') || '').trim(),
        category: fd.get('category') || '',
        qty: Math.min(9999, Math.max(1, parseInt(fd.get('qty'), 10) || 1)),
        loanable: fd.get('loanable') === 'on',
        asset: fd.get('asset') === 'on',
        assetInfo: Object.fromEntries(ASSET_FIELDS.map((f) => [f.key, (fd.get('a_' + f.key) || '').trim()])),
        building: (fd.get('building') || '').trim(),
        floor: fd.get('floor') || '',
        room: (fd.get('room') || '').trim(),
        storage: (fd.get('storage') || '').trim(),
        shelf: (fd.get('shelf') || '').trim(),
        memo: (fd.get('memo') || '').trim(),
      };
    }

    const RULES = [
      { key: 'name',     msg: '물품 이름을 적어 주세요', focus: '#f-name' },
      { key: 'building', msg: '건물을 적어 주세요',       focus: '#f-building' },
      { key: 'floor',    msg: '층을 골라 주세요',         focus: '#floors input' },
      { key: 'room',     msg: '실 이름을 적어 주세요',    focus: '#f-room' },
    ];

    function showErrors(view, errors) {
      for (const r of RULES) {
        const has = errors.includes(r.key);
        view.querySelector(`#e-${r.key}`).textContent = has ? r.msg : '';
        if (r.key === 'floor') view.querySelector('#floors').classList.toggle('is-invalid', has);
        else view.querySelector(r.focus).setAttribute('aria-invalid', has ? 'true' : 'false');
      }
    }

    // 사진은 긴 변 640px JPEG로 줄여서 저장 공간을 아낀다.
    function shrinkPhoto(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 640 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
        img.src = url;
      });
    }

    function mountAdd(view) {
      const form = view.querySelector('#add-form');
      let tried = false;

      const assetBox = view.querySelector('#asset-fields');
      const assetSwitch = view.querySelector('#f-asset');

      const sync = () => {
        draft = readForm(form);
        assetBox.hidden = !draft.asset;
        assetSwitch.setAttribute('aria-expanded', String(draft.asset));
        // 비품명을 비워 두면 물품 이름을 그대로 쓴다고 알려 준다
        const nm = draft.name;
      view.querySelector('#a-name').placeholder = nm
        ? `비우면 ‘${nm}’${josa(nm, '으로/로').slice(nm.length)} 적어요`
        : '대장에 적힌 이름';
        view.querySelector('[data-step="-1"]').disabled = draft.qty <= 1;
        if (tried) showErrors(view, RULES.filter((r) => !draft[r.key]).map((r) => r.key));
        if (draft.name) lastSaved = '';
        renderPreview(view);
      };

      // 단가는 치는 동안 세 자리마다 쉼표를 넣는다
      view.querySelector('#a-price').addEventListener('input', (e) => {
        const digits = e.target.value.replace(/[^\d]/g, '').slice(0, 12);
        e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      });

      view.addEventListener('input', sync);
      view.addEventListener('change', sync);

      view.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
        const input = view.querySelector('#f-qty');
        input.value = Math.min(9999, Math.max(1, (parseInt(input.value, 10) || 1) + Number(b.dataset.step)));
        sync();
      }));

      view.querySelector('#f-photo').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const box = view.querySelector('#photo-box');
        const err = view.querySelector('#e-photo');
        err.textContent = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          err.textContent = '사진 파일만 넣을 수 있어요.';
          return;
        }
        box.classList.add('is-busy');
        try {
          const photo = await shrinkPhoto(file);
          // await 뒤에는 draft가 다른 객체로 바뀌어 있을 수 있으니, 그때 다시 읽어서 넣는다
          draft = { ...draft, photo };
          render();
        } catch {
          box.classList.remove('is-busy');
          err.textContent = '이 사진은 열 수 없어요. 다른 사진을 골라 주세요.';
        }
      });
      const remove = view.querySelector('#photo-remove');
      if (remove) remove.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation(); // 라벨을 눌러 파일 창이 열리지 않게
        draft = { ...draft, photo: '' };
        render();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        tried = true;
        draft = readForm(form);
        const errors = RULES.filter((r) => !draft[r.key]).map((r) => r.key);
        showErrors(view, errors);
        if (errors.length) {
          view.querySelector(RULES.find((r) => r.key === errors[0]).focus).focus();
          return;
        }

        const old = editing ? state.items.find((i) => i.id === editing) : null;
        const item = {
          ...draft,
          id: old ? old.id : newId(),
          createdAt: old ? old.createdAt : new Date().toISOString(),
          ...(old ? { updatedAt: new Date().toISOString() } : {}),
        };
        if (!item.photo) delete item.photo;
        if (item.asset) {
          item.assetInfo = { ...item.assetInfo, name: item.assetInfo.name || item.name };
        } else {
          delete item.assetInfo;
        }

        try {
          commit({
            ...state,
            items: old ? state.items.map((i) => (i.id === old.id ? item : i)) : [...state.items, item],
          });
        } catch {
          view.querySelector('#e-photo').textContent = '저장 공간이 부족해요. 사진을 빼고 다시 저장해 주세요.';
          return;
        }

        if (old) {
          flash(`‘${item.name}’ 수정했어요`);
          draft = null; editing = null;
          location.hash = backTo;   // 왔던 화면으로 돌아간다
          return;
        }

        lastSaved = `‘${item.name}’ 등록했어요. 위치는 그대로 두었어요.`;
        draft = emptyDraft({ ...item, name: '' }); // 위치·분류·비품 여부는 남기고 나머지는 비운다
        render();
        document.getElementById('f-name').focus({ preventScroll: true });
      });

      renderPreview(view);
    }

    /* ════════ 화면 전환 ════════ */
    const ROUTES = {
      '#/':       { key: 'home', view: homeView,   mount: mountHome,   title: '학교 물품 어디 있지?' },
      '#/search': { key: 'find', view: searchView, mount: mountSearch, title: '찾기 · 학교 물품 어디 있지?' },
      '#/places': { key: 'place', view: placesView, mount: mountPlaces, title: '장소별 보기 · 학교 물품 어디 있지?' },
      '#/rent':   { key: 'rent', view: rentView,  mount: mountRent, title: '대여 · 학교 물품 어디 있지?' },
      '#/lend':   { key: 'rent', view: lendView,  mount: mountLend, title: '빌리기 · 학교 물품 어디 있지?' },
      '#/ledger': { key: 'ledger', view: ledgerView, mount: mountLedger, title: '비품 대장 · 학교 물품 어디 있지?' },
      '#/manager': { key: 'manager', view: managerView, mount: mountManager, title: '관리 담당 선생님 · 학교 물품 어디 있지?' },
      '#/add':    { key: 'add',  view: addView,    mount: mountAdd,    title: '물품 등록 · 학교 물품 어디 있지?' },
    };
    const parseHash = () => {
      const [path, qs = ''] = (location.hash || '#/').split('?');
      return { path, params: new URLSearchParams(qs) };
    };

    // 로그인·학교 상태에 따라 앱 대신 안내 화면을 보여 준다
    function gateKind() {
      if (bootError) return 'error';
      if (!online()) return null;              // 혼자 쓰기 모드
      if (!session) return 'login';
      if (!me) return gateMode === 'create' ? 'create' : 'start';
      if (me.status !== 'active') return 'pending';
      return null;
    }

    function render(focus = false) {
      const gate = gateKind();
      const app = document.getElementById('app');
      const gateRoot = document.getElementById('gate');
      app.hidden = Boolean(gate);
      gateRoot.hidden = !gate;
      if (gate) {
        gateRoot.className = 'gate';
        gateRoot.innerHTML = gateView(gate);
        mountGate(gateRoot, gate);
        document.title = '학교 물품 어디 있지?';
        return;
      }

      const { path, params } = parseHash();
      const route = ROUTES[path] || ROUTES['#/'];
      // 화면을 새 요소로 갈아 끼운다. 지난 화면에 걸어 둔 이벤트가 남지 않게.
      const old = document.getElementById('view');
      const view = old.cloneNode(false);
      old.replaceWith(view);
      if (route.key === 'manager' && !isAdmin()) { location.hash = '#/'; return; }
      view.className = 'main is-' + route.key + (path === '#/lend' ? ' is-add' : '');
      document.body.classList.toggle('is-add', route.key === 'add' || path === '#/lend');
      document.body.classList.toggle('is-room', route.key === 'place' && state.items.length > 0);
      view.innerHTML = route.view(params);
      route.mount(view, params);
      // 수정 중에는 왼쪽 메뉴의 '등록'을 켜 두지 않는다
      renderNav(route.key === 'add' && editing ? '' : route.key);
      document.title = route.title;
      if (focus) {
        view.scrollTop = 0; window.scrollTo(0, 0);
        const fine = matchMedia('(pointer: fine)').matches;
        let target = view.querySelector('.top__title');
        if (fine && route.key === 'add') target = view.querySelector('#f-name');
        // 검색어 없이 들어오면 바로 입력하게, 검색어를 들고 오면 결과를 먼저 보게
        if (route.key === 'find' && (fine || !params.get('q'))) target = view.querySelector('#s-q');
        target.focus({ preventScroll: true });
        if (target.id === 's-q') target.setSelectionRange(target.value.length, target.value.length);
      }
    }

    window.addEventListener('hashchange', () => {
      draft = null; lastSaved = ''; pendingDelete = null;
      if (!location.hash.startsWith('#/lend')) lend = null;
      render(true);
    });

    document.addEventListener('click', (e) => {
      // 수정하기
      const edit = e.target.closest('[data-edit]');
      if (edit) {
        pendingDelete = null;
        location.hash = `#/add?id=${encodeURIComponent(edit.dataset.edit)}&from=${encodeURIComponent(location.hash || '#/')}`;
        return;
      }
      // 지우기: 한 번 더 물어본다
      const del = e.target.closest('[data-del]');
      if (del) { pendingDelete = del.dataset.del; refreshView(); return; }
      if (e.target.closest('[data-del-cancel]')) { pendingDelete = null; refreshView(); return; }
      const yes = e.target.closest('[data-del-yes]');
      if (yes) {
        const id = yes.dataset.delYes;
        const gone = state.items.find((i) => i.id === id);
        commit({ ...state, items: state.items.filter((i) => i.id !== id) });
        pendingDelete = null;
        flash(gone ? `‘${gone.name}’ 지웠어요` : '지웠어요');
        if (editing === id) { draft = null; editing = null; location.hash = backTo; }
        else refreshView();
        return;
      }

      // 반납 처리
      const ret = e.target.closest('[data-return]');
      if (ret) {
        const id = ret.dataset.return;
        const loan = (state.loans || []).find((l) => l.id === id);
        commit({ ...state, loans: state.loans.map((l) => (l.id === id ? { ...l, returnedAt: new Date().toISOString() } : l)) });
        flash(loan ? `${loan.itemName} 반납 처리했어요` : '반납 처리했어요');
        refreshView();
        return;
      }
      const ldel = e.target.closest('[data-loan-del]');
      if (ldel) { pendingDelete = ldel.dataset.loanDel; refreshView(); return; }
      const lyes = e.target.closest('[data-loan-del-yes]');
      if (lyes) {
        commit({ ...state, loans: state.loans.filter((l) => l.id !== lyes.dataset.loanDelYes) });
        pendingDelete = null;
        flash('기록을 지웠어요');
        refreshView();
        return;
      }

      const samples = e.target.closest('[data-samples]');
      if (samples) {
        samples.dataset.samples === 'add' ? addSamples() : removeSamples();
        const view = document.getElementById('view');
        view.refresh ? view.refresh() : render();
        return;
      }
      if (e.target.closest('[data-soon]')) {
        const view = document.getElementById('view');
        if (view.notify) view.notify('이 기능은 다음 단계에서 연결돼요');
      }
    });

    // 어디서든 / 를 누르면 검색창으로
    document.addEventListener('keydown', (e) => {
      if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      const box = document.getElementById('s-q') || document.getElementById('q');
      if (box) box.focus(); else location.hash = '#/search';
    });

    async function boot() {
      try {
        await initSupabase();
        await loadMe();
        await loadData();
      } catch (e) {
        console.error(e);
        bootError = String(e?.message || e);
      }
      render();
    }
    boot();
  </script>
</body>
</html>
