<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17204a">
  <title>학교 물품 어디 있지?</title>
  <style>
    :root {
      --navy: #17204a;
      --navy-2: #232d5e;
      --board: #1f5a45;
      --board-2: #2b7659;
      --marker: #ffc93c;
      --late: #e5484d;
      --bg: #eef1f6;
      --card: #ffffff;
      --field: #f3f5f9;
      --ink: #121831;
      --ink-2: #5d6480;
      --ink-3: #9aa0b8;
      --line: #e4e7f0;

      --r-lg: 22px;
      --r-md: 16px;
      --shadow: 0 1px 2px rgba(23, 32, 74, .06), 0 8px 24px -12px rgba(23, 32, 74, .18);

      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
                   "Noto Sans CJK KR", "Malgun Gothic", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      word-break: keep-all;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; touch-action: manipulation; }
    svg { display: block; }
    .num { font-variant-numeric: tabular-nums; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; border-radius: 8px; }
    [tabindex="-1"]:focus { outline: none; }

    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor;
            stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    /* ───────── 틀 ───────── */
    .app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; height: 100dvh; }

    .rail { background: var(--navy); color: #fff; display: flex; flex-direction: column; padding: 28px 16px 20px; }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 32px; }
    .brand__mark { width: 40px; height: 40px; border-radius: 12px; background: var(--marker); color: var(--navy); display: grid; place-items: center; flex: none; }
    .brand__mark .icon { stroke-width: 2.2; }
    .brand__name { font-size: 16px; font-weight: 800; line-height: 1.25; letter-spacing: -0.03em; }
    .rail__nav { display: flex; flex-direction: column; gap: 4px; }
    .rail__item--admin {
      background: rgba(255, 201, 60, .10);
      color: #ffd97a; font-weight: 700;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255, 201, 60, .22);
    }
    .rail__item--admin + .rail__item:not(.rail__item--admin) { margin-top: 12px; }
    .rail__item--admin + .rail__item:not(.rail__item--admin)::before {
      content: ""; position: absolute; left: 12px; right: 12px; top: -7px;
      height: 1px; background: rgba(255, 255, 255, .12);
    }
    .rail__item { position: relative; }
    .rail__item--admin .icon { color: var(--marker); }
    .rail__item--admin:hover { background: rgba(255, 201, 60, .18); color: #fff; }
    .rail__item--admin[aria-current="page"] {
      background: var(--marker); color: var(--navy); box-shadow: none;
    }
    .rail__item--admin[aria-current="page"] .icon { color: var(--navy); }
    .rail__item {
      display: flex; align-items: center; gap: 12px;
      height: 46px; padding: 0 12px; border-radius: 12px;
      color: rgba(255, 255, 255, .66); font-size: 15px; font-weight: 600; text-align: left;
      transition: background-color 120ms, color 120ms;
    }
    .rail__item:hover { color: #fff; background: rgba(255, 255, 255, .06); }
    .rail__item[aria-current="page"] { color: #fff; background: rgba(255, 255, 255, .12); }
    .rail__item[aria-current="page"] .icon { color: var(--marker); }
    .rail__foot { margin-top: auto; padding: 16px 12px 0; border-top: 1px solid rgba(255, 255, 255, .1); font-size: 13px; color: rgba(255, 255, 255, .5); line-height: 1.5; }
    .rail__foot strong { display: block; color: #fff; font-size: 14px; font-weight: 700; }
    .rail__who { display: block; padding: 8px; margin: -8px; border-radius: 10px; transition: background-color 120ms, color 120ms; }
    .rail__who:hover { background: rgba(255, 255, 255, .07); color: rgba(255, 255, 255, .75); }

    .main {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px 18px;
      padding: 24px 32px;
      min-height: 0;
      overflow: auto;
    }
    .main.is-add { grid-template-rows: auto minmax(0, 1fr); }

    .top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
    .top__date { font-size: 14px; color: var(--ink-2); font-weight: 500; }
    .top__title { font-size: 28px; font-weight: 800; letter-spacing: -0.035em; margin-top: 2px; }
    .top__actions { display: flex; align-items: center; gap: 8px; }
    .back {
      display: inline-flex; align-items: center; gap: 2px; margin-left: -6px;
      height: 28px; padding: 0 6px; border-radius: 8px;
      font-size: 14px; font-weight: 600; color: var(--ink-2);
    }
    .back:hover { color: var(--ink); }
    .back .icon { width: 18px; height: 18px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; padding: 0 18px; border-radius: 12px;
      font-size: 15px; font-weight: 700; white-space: nowrap; flex: none;
      transition: transform 120ms, background-color 120ms;
    }
    .btn:active { transform: scale(.97); }
    .btn .icon { width: 19px; height: 19px; }
    .btn--ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
    .btn--ghost:hover { background: #f7f8fb; }
    .btn--solid { background: var(--navy); color: #fff; }
    .btn--solid:hover { background: var(--navy-2); }
    .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2); }

    .card {
      background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow);
      padding: 20px 22px; min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
    }
    .card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .card__title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .card__meta { font-size: 13px; color: var(--ink-3); font-weight: 500; }
    .empty { flex: 1; display: grid; place-content: center; text-align: center; gap: 4px; padding: 12px 0; }
    .empty strong { font-size: 15px; font-weight: 700; }
    .empty span { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

    /* ───────── 홈: 찾기 ───────── */
    .find {
      grid-column: span 8; position: relative; overflow: hidden;
      border-radius: var(--r-lg);
      background: linear-gradient(135deg, var(--board) 0%, var(--board-2) 100%);
      color: #fff; padding: 28px 36px 26px;
      box-shadow: 0 18px 40px -22px rgba(31, 90, 69, .8);
      display: flex; flex-direction: column; justify-content: flex-end;
      min-height: 264px;
    }
    .plan { position: absolute; right: -10px; top: -14px; width: clamp(240px, 26vw, 330px); height: auto; opacity: .45; pointer-events: none; }
    .plan .wall { stroke: rgba(255, 255, 255, .14); stroke-width: 1.5; fill: none; }
    .plan .route { stroke: var(--marker); stroke-width: 2.2; fill: none; stroke-dasharray: 5 7; stroke-linecap: round; }
    .plan .pin { fill: var(--marker); }
    .plan .pin-ring { fill: none; stroke: var(--marker); stroke-width: 2; opacity: .5; }
    .find__title { position: relative; font-size: clamp(30px, 3.5vw, 46px); font-weight: 800; line-height: 1.15; letter-spacing: -0.05em; margin-bottom: 22px; white-space: nowrap; }
    .search {
      position: relative; display: flex; align-items: center; gap: 12px;
      height: 58px; padding: 0 8px 0 18px; max-width: 560px;
      background: #fff; color: var(--ink); border-radius: var(--r-md);
      box-shadow: 0 10px 30px -14px rgba(0, 0, 0, .45);
    }
    .search > .icon { color: var(--ink-2); }
    .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 17px; font-weight: 500; }
    .search input::placeholder { color: var(--ink-3); }
    .search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    .search:focus-within { box-shadow: 0 0 0 3px var(--marker), 0 10px 30px -14px rgba(0, 0, 0, .45); }
    .search__go { height: 42px; padding: 0 16px; border-radius: 11px; background: var(--navy); color: #fff; font-size: 15px; font-weight: 700; }
    .find__foot { position: relative; display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; min-height: 34px; }
    .find__foot-label { font-size: 13px; color: rgba(255, 255, 255, .7); margin-right: 2px; }
    .chip { height: 34px; padding: 0 13px; border-radius: 999px; background: rgba(255, 255, 255, .13); color: #fff; font-size: 14px; font-weight: 600; transition: background-color 120ms; }
    .chip:hover { background: rgba(255, 255, 255, .22); }
    .find__notice { font-size: 14px; font-weight: 600; color: var(--marker); }

    /* ───────── 홈: 카드들 ───────── */
    .stock { grid-column: span 4; justify-content: space-between; }
    .stock__total { font-size: 52px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
    .stock__unit { font-size: 20px; font-weight: 700; margin-left: 4px; color: var(--ink-2); }
    .stock__bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 3px; margin: 22px 0 16px; background: #eceef5; }
    .stock__bar span { display: block; height: 100%; border-radius: 3px; min-width: 6px; }
    .legend { display: grid; gap: 10px; }
    .legend__row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
    .legend__dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .legend__row b { margin-left: auto; color: var(--ink); font-weight: 700; }
    .stock__cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .stock__cta p { font-size: 14px; color: var(--ink-2); line-height: 1.45; }

    .week { grid-column: span 4; }
    .week__chart { flex: 1; min-height: 150px; display: flex; align-items: flex-end; gap: 14px; padding-top: 22px; position: relative; }
    .week__col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; }
    .week__val { font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .week__bar { width: 100%; max-width: 44px; min-height: 4px; border-radius: 10px 10px 4px 4px; background: #dfe3f0; transform-origin: bottom; animation: grow 520ms cubic-bezier(.2, .8, .2, 1) both; }
    .week__col.is-today .week__bar { background: var(--navy); }
    .week__day { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .week__col.is-today .week__day { color: var(--ink); }
    .week__day em { font-style: normal; font-size: 11px; font-weight: 700; background: var(--marker); color: var(--navy); padding: 1px 5px; border-radius: 5px; margin-left: 3px; }
    .week__empty { position: absolute; inset: 0 0 40px; display: grid; place-content: center; text-align: center; gap: 4px; }
    .week__empty strong { font-size: 15px; }
    .week__empty span { font-size: 13px; color: var(--ink-2); }
    @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

    .loans { grid-column: span 5; }
    .loans__list { list-style: none; display: grid; gap: 6px; overflow: auto; }
    .loan { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 14px; background: #f6f7fb; }
    .loan.is-late { background: #fdf0f0; }
    .loan__main { min-width: 0; flex: 1; }
    .loan__item { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .loan__who { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
    .pill { flex: none; height: 28px; padding: 0 11px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; background: #e8ebf3; color: var(--ink-2); }
    .pill--today { background: var(--marker); color: var(--navy); }
    .pill--late { background: var(--late); color: #fff; }

    .places { grid-column: span 3; }
    .places__list { list-style: none; display: grid; gap: 6px; margin: 0 -8px; }
    .place { display: block; padding: 6px 8px 8px; border-radius: 10px; transition: background-color 120ms; }
    .place:hover { background: var(--field); }
    .place__row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; gap: 8px; }
    .place__name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .place__count { font-size: 15px; color: var(--ink-2); font-weight: 700; flex: none; }
    .place__track { display: block; height: 8px; border-radius: 4px; background: #eceef5; overflow: hidden; }
    .place__fill { display: block; height: 100%; border-radius: 4px; background: var(--board); transform-origin: left; animation: grow-x 520ms cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* ───────── 등록 ───────── */
    .sheet { grid-column: span 4; overflow: auto; }
    .sheet__title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .sheet__desc { font-size: 13px; color: var(--ink-2); margin: 3px 0 18px; line-height: 1.45; }

    .field { display: grid; gap: 7px; border: 0; min-width: 0; }
    .field + .field { margin-top: 16px; }
    .field__label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 700; }
    .field__label .req { margin-right: auto; }
    .field__label small { font-size: 12px; font-weight: 500; color: var(--ink-3); }
    .req { color: var(--late); font-weight: 800; margin-left: 3px; }
    legend.field__label { padding: 0; margin-bottom: 7px; width: 100%; }
    .field__error { font-size: 13px; font-weight: 600; color: var(--late); }
    .field__error:empty { display: none; }

    .input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 0; border-radius: 12px; background: var(--field);
      font-size: 16px; font-weight: 500;
      box-shadow: inset 0 0 0 1px transparent;
      transition: box-shadow 120ms, background-color 120ms;
    }
    .input::placeholder { color: var(--ink-3); font-weight: 400; }
    .input:focus { outline: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
    .input[aria-invalid="true"] { background: #fdf0f0; box-shadow: inset 0 0 0 2px var(--late); }
    textarea.input { height: 76px; padding: 12px 14px; resize: none; line-height: 1.45; }

    .choices { display: flex; flex-wrap: wrap; gap: 6px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      display: inline-flex; align-items: center; justify-content: center;
      height: 38px; padding: 0 13px; border-radius: 10px;
      background: var(--field); font-size: 14px; font-weight: 600; color: var(--ink-2);
      cursor: pointer; user-select: none; transition: background-color 120ms, color 120ms;
    }
    .choice span:hover { color: var(--ink); }
    .choice input:checked + span { background: var(--navy); color: #fff; }
    .choice input:focus-visible + span { outline: 3px solid var(--marker); outline-offset: 2px; }
    .floors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .floors .choice span { width: 100%; height: 44px; padding: 0; }
    .floors.is-invalid .choice span { box-shadow: inset 0 0 0 2px var(--late); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row .field + .field { margin-top: 0; }
    .row + .field { margin-top: 16px; }
    .row--qty { grid-template-columns: 1fr; }
    .row--qty .stepper { max-width: 180px; }

    .stepper { display: flex; align-items: center; height: 48px; border-radius: 12px; background: var(--field); overflow: hidden; }
    .stepper button { width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink-2); }
    .stepper button:hover { color: var(--ink); background: #e9ecf3; }
    .stepper button:disabled { color: var(--ink-3); opacity: .5; cursor: default; background: none; }
    .stepper input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; text-align: center; font-size: 17px; font-weight: 700; outline: 0; -moz-appearance: textfield; }
    .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .stepper:focus-within { box-shadow: inset 0 0 0 2px var(--navy); background: #fff; }

    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 48px; padding: 0 6px 0 14px; border-radius: 12px; background: var(--field); cursor: pointer; font-size: 15px; font-weight: 600; }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .switch__track { width: 46px; height: 28px; border-radius: 14px; background: #cfd4e2; position: relative; transition: background-color 150ms; flex: none; margin-right: 4px; }
    .switch__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: transform 150ms; }
    .switch input:checked + .switch__track { background: var(--board); }
    .switch input:checked + .switch__track::after { transform: translateX(18px); }
    .switch input:focus-visible + .switch__track { outline: 3px solid var(--marker); outline-offset: 2px; }

    .photo { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 12px; border-radius: 12px; border: 1.5px dashed #c9cfdd; cursor: pointer; transition: border-color 120ms, background-color 120ms; }
    .photo:hover { border-color: var(--ink-3); background: #fafbfd; }
    .photo:focus-within { border-color: var(--navy); }
    .photo input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .photo__icon { width: 44px; height: 44px; border-radius: 10px; background: var(--field); display: grid; place-items: center; color: var(--ink-2); flex: none; overflow: hidden; }
    .photo__icon img { width: 100%; height: 100%; object-fit: cover; }
    .photo__text { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .photo__text small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); }
    .photo__busy { display: none; font-size: 14px; font-weight: 600; color: var(--ink-2); }
    .photo.is-busy .photo__text { display: none; }
    .photo.is-busy .photo__busy { display: block; }
    .photo__remove { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; }
    .photo__remove:hover { color: var(--late); }
    .photo.is-busy { border-style: solid; border-color: var(--line); background: #fafbfd; }
    .photo.is-busy .photo__text { color: var(--ink-2); }
    .photo.is-busy .photo__icon { color: var(--ink-3); }

    /* 미리보기: 이렇게 안내돼요 */
    .preview {
      grid-column: span 4; border-radius: var(--r-lg); color: #fff;
      background: linear-gradient(160deg, var(--board) 0%, var(--board-2) 100%);
      box-shadow: 0 18px 40px -22px rgba(31, 90, 69, .8);
      padding: 22px 24px; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .preview__label { font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, .7); }
    .preview__name { font-size: 26px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.2; margin-top: 6px; overflow-wrap: anywhere; }
    .preview__name.is-empty { color: rgba(255, 255, 255, .35); }
    .preview__qty { font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, .75); margin-top: 4px; }

    .path { list-style: none; margin-top: 20px; display: grid; }
    .path__step { position: relative; display: grid; grid-template-columns: 22px 1fr; align-items: start; gap: 10px; padding-bottom: 14px; }
    .path__step:last-child { padding-bottom: 0; }
    .path__step::before { content: ""; position: absolute; left: 10px; top: 16px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .16); }
    .path__step:last-child::before { display: none; }
    .path__dot { width: 12px; height: 12px; margin: 4px 0 0 5px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); transition: background-color 150ms, box-shadow 150ms; }
    .path__step.is-set .path__dot { background: #fff; box-shadow: none; }
    .path__step.is-last.is-set .path__dot { background: var(--marker); box-shadow: 0 0 0 4px rgba(255, 201, 60, .25); }
    .path__kind { font-size: 12px; color: rgba(255, 255, 255, .55); font-weight: 500; }
    .path__value { font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
    .path__step:not(.is-set) .path__value { color: rgba(255, 255, 255, .35); font-weight: 500; }

    .preview__memo { margin-top: 14px; font-size: 14px; line-height: 1.45; color: rgba(255, 255, 255, .85); background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; }
    .preview__photo { margin-top: 14px; width: 100%; height: 110px; object-fit: cover; border-radius: 12px; }
    .preview > #preview { min-height: 0; overflow: auto; }
    .preview__foot { margin-top: auto; padding-top: 18px; display: grid; gap: 10px; }
    .preview__done {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-radius: 12px;
      background: rgba(255, 255, 255, .16);
      font-size: 15px; font-weight: 700; color: #fff; line-height: 1.4;
      animation: rise 200ms ease-out both;
    }

    .dconfirm { display: grid; gap: 8px; }

    /* ───────── 대여 ───────── */

    .rlist { grid-column: 1 / -1; min-height: 0; }

    .signlist { list-style: none; display: grid; gap: 6px; max-height: 320px; overflow: auto; margin: 0 -8px; }

    .signrow__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .signrow__sub { font-size: 13px; color: var(--ink-2); margin-top: 2px; line-height: 1.4; }
    .signrow__img { height: 38px; width: auto; max-width: 120px; object-fit: contain; object-position: right; opacity: .9; }

    /* 알림 */

    .alert__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 16px 18px 10px; }

    .bigbtn--google { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
    .bigbtn--google:hover { background: #f7f8fb; }
    .bigbtn--navy { background: var(--navy); color: #fff; }
    .bigbtn--navy:hover { background: var(--navy-2); }
    .bigbtn--ghost { background: var(--field); color: var(--ink); }
    .bigbtn--ghost:hover { background: #e7eaf2; }
    .bigbtn[disabled] { opacity: .55; cursor: default; }
    .gicon { width: 20px; height: 20px; flex: none; }

    .gate__who { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 13px; background: var(--field); margin-bottom: 18px; }
    .gate__who-mail { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gate__who button { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 6px 8px; border-radius: 8px; flex: none; }
    .gate__who button:hover { background: #e4e8f0; color: var(--ink); }

    .findrow { display: flex; gap: 8px; }
    .findrow .input { flex: 1; min-width: 0; }
    .findrow__go { flex: none; height: 50px; padding: 0 16px; border-radius: 12px; background: var(--navy); color: #fff; font-size: 15px; font-weight: 700; white-space: nowrap; }
    .findrow__go:hover { background: var(--navy-2); }
    .findrow__go[disabled] { opacity: .55; }
    .hits__wait { font-size: 14px; color: var(--ink-2); line-height: 1.5; padding: 2px; }
    .hits2 { list-style: none; display: grid; gap: 4px; max-height: 210px; overflow: auto; margin: 0 -8px; }
    .hit2 { width: 100%; display: grid; gap: 2px; text-align: left; padding: 10px 8px; border-radius: 11px; }
    .hit2:hover { background: var(--field); }
    .hit2__name { font-size: 15px; font-weight: 700; }
    .hit2__addr { font-size: 13px; color: var(--ink-2); line-height: 1.4; }

    .found { margin-top: 18px; padding: 18px; border-radius: 16px; background: var(--field); }
    .found__name { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; overflow-wrap: anywhere; }
    .found__addr { font-size: 14px; color: var(--ink-2); line-height: 1.5; margin-top: 6px; overflow-wrap: anywhere; }
    .found__again { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
    .found__again:hover { color: var(--ink); }
    .waitmark.is-done { background: #e8f2ed; color: var(--board); }

    .gform { display: grid; gap: 14px; margin-top: 20px; }
    .gform .field + .field, .gform .row + .field { margin-top: 0; }
    .gform .input { height: 50px; font-size: 16px; }
    .gform__hint { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .gform .bigbtn { margin-top: 4px; }
    .gform .bigbtn + .bigbtn { margin-top: -8px; }

    .codebox { display: grid; gap: 8px; margin-top: 18px; }
    .codebox input {
      width: 100%; height: 58px; border: 0; border-radius: 14px; background: var(--field);
      text-align: center; font-size: 26px; font-weight: 800; letter-spacing: .22em; text-indent: .22em;
      text-transform: uppercase;
      box-shadow: inset 0 0 0 1px transparent;
    }
    .codebox input:focus { outline: 0; background: #fff; box-shadow: inset 0 0 0 2px var(--navy); }
    .codebox input::placeholder { color: var(--ink-3); font-weight: 600; letter-spacing: .18em; }

    .waitmark { width: 54px; height: 54px; border-radius: 50%; background: #fff7e0; color: #b8860b; display: grid; place-items: center; margin-bottom: 16px; }
    .waitmark .icon { width: 26px; height: 26px; stroke-width: 2.2; }

    /* 왼쪽 아래 로그인한 사람 */
    .rail__me { display: flex; align-items: center; gap: 10px; padding: 10px 12px 0; margin-top: 10px; border-top: 1px solid rgba(255, 255, 255, .1); }
    .rail__mail { flex: 1; min-width: 0; font-size: 12px; color: rgba(255, 255, 255, .5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail__out { font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, .6); padding: 6px 8px; border-radius: 8px; flex: none; }
    .rail__out:hover { background: rgba(255, 255, 255, .1); color: #fff; }
    .rolechip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--marker); color: var(--navy); font-size: 11px; font-weight: 800; margin-left: 6px; }
    .rolechip--soft { background: #e3e8f5; color: var(--navy); }

    /* 구성원 관리 */
    .code { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: var(--field); }
    .code__val { flex: 1; font-size: 24px; font-weight: 800; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
    .mlist { list-style: none; display: grid; gap: 4px; margin: 12px -8px 0; }
    .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 12px; padding: 9px 8px; border-radius: 11px; }
    .mrow:hover { background: var(--field); }
    .mrow.is-pending { background: #fffaf0; }
    .mrow__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .mrow__mail { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
    .mrow__acts { display: flex; align-items: center; gap: 4px; flex: none; }
    .mrow__tag { font-size: 12px; font-weight: 700; color: var(--ink-3); }
    .mrow__pos { font-size: 13px; font-weight: 600; color: var(--ink-2); }
    /* 파일 가져오기 */
    .impbox { width: min(560px, 100%); }
    .bulkrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .bulkrow .btn { height: 46px; }
    .bulkrow .btn[disabled] { opacity: .5; cursor: default; }
    .drop {
      display: flex; align-items: center; gap: 14px;
      margin-top: 16px; padding: 18px; border-radius: 16px;
      border: 1.5px dashed #c9cfdd; cursor: pointer;
      transition: border-color 120ms, background-color 120ms;
    }
    .drop:hover { border-color: var(--navy); background: #fafbfd; }
    .drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .drop__icon { width: 26px; height: 26px; color: var(--navy); flex: none; stroke-width: 2; }
    .drop__text { font-size: 16px; font-weight: 700; line-height: 1.35; }
    .drop__text small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-top: 2px; }

    .imp__wait { padding: 18px 2px; font-size: 15px; color: var(--ink-2); }
    .imp__file { margin-top: 16px; font-size: 14px; font-weight: 700; color: var(--ink-2); overflow-wrap: anywhere; }
    .imp__sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .imp__fig { padding: 12px 14px; border-radius: 13px; background: var(--field); display: grid; gap: 3px; }
    .imp__k { font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .imp__v { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
    .imp__note { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; padding: 12px 14px; border-radius: 13px; background: #fff7e6; font-size: 14px; line-height: 1.5; color: var(--ink-2); }
    .imp__note .icon { width: 18px; height: 18px; flex: none; margin-top: 1px; color: #b8860b; }
    .imp__peek { list-style: none; display: grid; gap: 4px; margin-top: 12px; }
    .imp__peek li { padding: 9px 12px; border-radius: 11px; background: #f6f7fb; }
    .imp__name { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
    .imp__sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; overflow-wrap: anywhere; }
    .imp__more { font-size: 13px; color: var(--ink-3); background: none !important; padding-left: 2px !important; }

    /* 묶어서 보이는 찾기 결과 */
    .hit__count { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 7px; background: var(--navy); color: #fff; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .hit__each { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 5px 9px; border-radius: 8px; margin-left: -9px; }
    .hit__each:hover { background: #e8ebf3; color: var(--ink); }
    .hit__kids { list-style: none; display: grid; gap: 4px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); max-height: 260px; overflow: auto; }
    .kid { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; background: #fff; }
    .kid__no { font-size: 13px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .kid__sub { grid-column: 1; font-size: 12px; color: var(--ink-3); }

    /* 장소 미지정 */
    .fold { width: 100%; display: flex; align-items: center; gap: 8px; padding: 0; font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .fold__caret { width: 16px; height: 16px; color: var(--ink-2); stroke-width: 2.6; transition: transform 140ms; }
    .fold[aria-expanded="true"] .fold__caret { transform: rotate(180deg); }
    .fold__count { font-size: 13px; font-weight: 700; color: var(--ink-3); }
    .spotbox { margin-top: 14px; }
    .spotbox[hidden] { display: none; }
    .spotpick { display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--field); }
    .spotpick__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .spotpick .input { height: 44px; font-size: 15px; background: #fff; }
    .spotlist { list-style: none; display: grid; gap: 4px; margin-top: 12px; max-height: 430px; overflow: auto; }
    .spotrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 11px; }
    .spotrow:hover { background: var(--field); }
    .spotrow input { width: 18px; height: 18px; accent-color: var(--navy); }
    .spotrow__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
    .spotrow__sub { grid-column: 2; font-size: 13px; color: var(--ink-2); }
    .spotrow__qty { font-size: 14px; font-weight: 700; color: var(--ink-2); }
    .spotbar { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .spotbar__info { flex: 1; font-size: 14px; color: var(--ink-2); font-weight: 600; }
    /* ───────── 우리 학교 공간 설정하기 ───────── */
    .wizback {
      position: fixed; inset: 0; z-index: 70;
      display: grid; place-items: center; padding: 20px;
      background: rgba(18, 24, 49, .5);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      animation: fade 140ms ease-out both;
    }
    .wizbox {
      width: min(680px, 100%); max-height: min(840px, calc(100dvh - 48px));
      display: flex; flex-direction: column;
      background: var(--card); border-radius: 24px; overflow: hidden;
      box-shadow: 0 28px 70px -24px rgba(23, 32, 74, .6);
      animation: pop 180ms ease-out both;
    }
    .wizbar { display: flex; align-items: center; gap: 14px; padding: 20px 26px 14px; }
    .wizbar__step { font-size: 13px; font-weight: 800; color: var(--ink-3); flex: none; }
    .wizbar__track { flex: 1; height: 5px; border-radius: 3px; background: var(--field); overflow: hidden; }
    .wizbar__fill { display: block; height: 100%; border-radius: 3px; background: var(--navy); transition: width 260ms cubic-bezier(.2, .8, .2, 1); }
    .wizbar__x { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); flex: none; }
    .wizbar__x:hover { background: var(--field); color: var(--ink); }
    .wizbody { flex: 1; min-height: 0; overflow: auto; padding: 10px 32px 32px; }
    .wizstep { animation: wizin 240ms cubic-bezier(.2, .8, .2, 1) both; }
    .wiz__eyebrow { font-size: 13px; font-weight: 800; color: var(--board); letter-spacing: -0.01em; margin-bottom: 8px; }
    .wiz__skip { display: block; width: 100%; margin-top: 14px; padding: 8px; font-size: 14px; font-weight: 600; color: var(--ink-3); text-align: center; }
    .wiz__skip:hover { color: var(--ink); }

    .wizdrop {
      display: flex; align-items: center; gap: 16px;
      margin-top: 18px; padding: 22px; border-radius: 18px;
      border: 1.5px dashed #c9cfdd; cursor: pointer;
      transition: border-color 120ms, background-color 120ms;
    }
    .wizdrop:hover { border-color: var(--navy); background: #fafbfd; }
    .wizdrop.is-busy { border-style: solid; border-color: var(--line); background: var(--field); cursor: default; }
    .wizdrop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .wizdrop__icon { width: 28px; height: 28px; color: var(--navy); flex: none; stroke-width: 2; }
    .wizdrop__text { font-size: 17px; font-weight: 700; line-height: 1.35; }
    .wizdrop__text small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-top: 3px; }
    .wizdrop__msg {
      font-size: 14px; line-height: 1.55; margin-top: 12px;
      padding: 12px 14px; border-radius: 12px;
      background: var(--field); color: var(--ink-2);
    }
    .wizdrop__msg.is-bad { background: #fdf0f0; color: var(--late); font-weight: 600; }

    .wizcount { display: flex; align-items: center; gap: 8px; margin-top: 18px; padding: 13px 16px; border-radius: 13px; background: #e8f2ed; font-size: 15px; font-weight: 600; color: var(--board); }
    .wizcount .icon { width: 18px; height: 18px; flex: none; stroke-width: 2.6; }
    .wizchip--wait { box-shadow: inset 0 0 0 1.5px var(--line); background: #fff; }
    @keyframes wizin { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

    .wiz__title { font-size: 27px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.32; }
    .wiz__desc { font-size: 16px; color: var(--ink-2); line-height: 1.6; margin-top: 10px; word-break: keep-all; }
    .wiz__hint { font-size: 13px; color: var(--ink-3); line-height: 1.5; margin-top: 10px; }
    .wiz__label { font-size: 13px; font-weight: 700; color: var(--ink-3); margin: 18px 0 8px; }
    .wiz__acts { display: flex; gap: 10px; margin-top: 28px; }
    .wiz__acts .bigbtn { flex: 1; height: 56px; font-size: 17px; }

    .wizchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .wizchips--on { margin-top: 14px; }
    .wizchip {
      display: inline-flex; align-items: center; gap: 7px;
      height: 44px; padding: 0 16px; border-radius: 12px;
      background: var(--field); font-size: 15px; font-weight: 700; color: var(--ink-2);
      transition: background-color 120ms, color 120ms, transform 120ms;
    }
    .wizchip:hover { background: #e7eaf2; color: var(--ink); }
    .wizchip:active { transform: scale(.97); }
    .wizchip.is-on { background: var(--navy); color: #fff; }
    .wizchip.is-on:hover { background: var(--navy-2); }
    .wizchip__plus { font-size: 16px; font-weight: 700; color: var(--ink-3); }
    .wizchip:hover .wizchip__plus { color: var(--ink-2); }
    .wizchip__x { width: 14px; height: 14px; stroke-width: 2.6; opacity: .7; }
    .wizchip small { font-size: 12px; font-weight: 600; opacity: .65; margin-left: 2px; }
    .wizchip b { font-size: 12px; font-weight: 700; opacity: .55; }

    .wizadd { display: flex; gap: 8px; margin-top: 14px; }
    .wizadd .input { flex: 1; height: 50px; }
    .wizadd .btn { height: 50px; flex: none; }

    .wizask { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: #fff7e6; }
    .wizask__q { font-size: 15px; font-weight: 700; }
    .wizask .wizchips { margin-top: 10px; }
    .wizask .wizchip { background: #fff; }

    .wizfloors { list-style: none; display: grid; gap: 10px; margin-top: 18px; }
    .wizfloor { padding: 14px 16px; border-radius: 16px; background: var(--field); }
    .wizfloor__name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .wizfloor__rows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .wizfloor__row { display: flex; align-items: center; gap: 8px; }
    .wizfloor__k { font-size: 14px; font-weight: 700; color: var(--ink-2); flex: none; }
    .stepper--sm { flex: 1; height: 42px; background: #fff; }
    .stepper--sm button { width: 40px; height: 42px; }
    .stepper__val { flex: 1; text-align: center; font-size: 16px; font-weight: 800; }
    .wizfloor__sum { font-size: 13px; color: var(--ink-3); margin-top: 10px; line-height: 1.5; }

    .wizwhere { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .wizledger { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .wizledger__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .wizledger__head .wiz__label { margin: 0; }

    .wizpaste { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .wizpaste summary { font-size: 14px; font-weight: 700; color: var(--ink-2); cursor: pointer; list-style: none; }
    .wizpaste summary::-webkit-details-marker { display: none; }
    .wizpaste summary::before { content: "＋ "; color: var(--ink-3); }
    .wizpaste[open] summary::before { content: "− "; }
    .wizpaste summary:hover { color: var(--ink); }
    .wizpaste__box { width: 100%; height: 110px; margin-top: 10px; padding: 12px 14px; resize: none; line-height: 1.45; }
    .wizpaste__acts { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .wizpaste__msg { flex: 1; font-size: 13px; color: var(--ink-2); }

    .wizdone { width: 54px; height: 54px; border-radius: 50%; background: #e8f2ed; color: var(--board); display: grid; place-items: center; margin-bottom: 14px; }
    .wizdone .icon { width: 26px; height: 26px; stroke-width: 2.6; }
    .wizsum { list-style: none; display: grid; gap: 8px; margin-top: 18px; }
    .wizsum__row { padding: 14px 16px; border-radius: 14px; background: var(--field); }
    .wizsum__name { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .wizsum__sub { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.5; }

    @media (max-width: 760px) {
      .wizback { padding: 0; place-items: stretch; }
      .wizbox { width: 100%; max-height: none; border-radius: 0; min-height: 100dvh; }
      .wizbar { padding: calc(env(safe-area-inset-top) + 14px) 18px 12px; }
      .wizbody { padding: 8px 20px calc(env(safe-area-inset-bottom) + 24px); }
      .wiz__title { font-size: 23px; }
      .wizfloor__rows { grid-template-columns: 1fr; }
      .wizwhere { grid-template-columns: 1fr; }
      .wiz__acts { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--card) 28%); padding-top: 14px; }
    }
    /* ───────── 인수인계 ───────── */
    .hostart, .holist, .hobar, .horooms { grid-column: 1 / -1; }
    .hostart { max-width: 720px; }
    .horow { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; margin-top: 16px; }

    .hobar { display: grid; gap: 14px; }
    .hobar__names { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; overflow-wrap: anywhere; }
    .hobar__sub { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
    .hobar__figs { display: flex; flex-wrap: wrap; gap: 18px; }
    .hobar__fig { display: flex; align-items: baseline; gap: 5px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
    .hobar__fig b { font-size: 22px; font-weight: 800; color: var(--board); letter-spacing: -0.03em; }
    .hobar__fig.is-lost b { color: var(--late); }
    .hobar__fig.is-fix b { color: #b8860b; }
    .hobar__fig.is-left b { color: var(--ink-2); }
    .hobar__acts { display: flex; gap: 8px; }
    .hobar__acts .btn { flex: none; }
    .hobar__track { height: 6px; border-radius: 3px; background: var(--field); overflow: hidden; }
    .hobar__fill { display: block; height: 100%; border-radius: 3px; background: var(--board); transition: width 260ms cubic-bezier(.2, .8, .2, 1); }

    .horooms { display: grid; gap: 8px; }
    .horoom { border-radius: 16px; background: #f6f7fb; overflow: hidden; }
    .horoom.is-done { background: #f2f7f4; }
    .horoom__head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 15px 16px; text-align: left; }
    .horoom__head[aria-expanded="true"] .fold__caret { transform: rotate(180deg); }
    .horoom__name { flex: 1; min-width: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .horoom__count { font-size: 13px; font-weight: 700; color: var(--ink-2); flex: none; }
    .horoom.is-done .horoom__count { color: var(--board); }

    .hoitems { list-style: none; display: grid; gap: 4px; padding: 0 10px 4px; max-height: 460px; overflow: auto; }
    .hoitem { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 10px 12px; border-radius: 12px; background: #fff; }
    .hoitem.is-lost { background: #fdf0f0; }
    .hoitem.is-fix { background: #fff7e6; }
    .hoitem.is-ok { background: #f2f7f4; }
    .hoitem__main { flex: 1; min-width: 150px; }
    .hoitem__name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }

    let cacheOff = false;   // 기기 사본을 접었는지
    const store = {
      load() {
        try {
          const raw = localStorage.getItem(STORE_KEY);
          return { ...blank(), ...(raw ? JSON.parse(raw) : {}) };
        } catch { return structuredClone(memoryStore); }
      },
      save(next) {
        // 기기 사본은 '있으면 좋은 것'이다. 실패해도 서버 저장은 막지 않는다.
        try {
          const text = JSON.stringify(next);
          if (text.length > 3_000_000) {
            // 자료가 아주 많으면 사본을 접는다

        session = next;
        if (changed) { await loadMe(); await loadData(); render(); }
      });
    }

    async function loadMe() {
      me = null; members = [];
      if (!sb || !session) return;
      const { data, error } = await sb.rpc('my_membership');
      if (error) { console.error(error); return; }
      if (!data) return;
      me = { schoolId: data.school_id, role: data.role, status: data.status,
             canImport: Boolean(data.can_import), school: data.school };
      if (me.role === 'admin' && me.status === 'active') await loadMembers();
    }

    async function loadMembers() {
      const { data, error } = await sb.from('members')
        .select('id,user_id,email,name,position,role,status,can_import,created_at')
        .order('created_at', { ascending: true });
      if (!error) members = data || [];
    }

    // 서버에 있는 우리 학교 자료를 통째로 읽어 와서 화면 상태로 만든다
    // PostgREST는 한 번에 1000줄까지만 준다. 끝까지 나눠서 읽는다.
    async function fetchAll(table) {
      const size = 1000;
      const out = [];
      for (let from = 0; ; from += size) {
        const { data, error } = await sb.from(table).select('*').range(from, from + size - 1);
        if (error) throw error;
        out.push(...data);
        if (data.length < size) break;
      }
      return out;
    }

    async function loadData() {
      if (!sb || me?.status !== 'active') return;
      const [items, loans, hos] = await Promise.all([fetchAll('items'), fetchAll('loans'), fetchAll('handovers')]);
      state = {
        ...state,
        items: items.map(fromRowItem),
        loans: loans.map(fromRowLoan),
        handovers: hos.map((r) => ({
          id: r.id, startedAt: r.started_at, doneAt: r.done_at,
          fromName: r.from_name, fromPosition: r.from_position,
          toName: r.to_name, toPosition: r.to_position,
          checks: r.checks || {}, snapshot: r.snapshot || [],
          signFrom: r.sign_from || '', signTo: r.sign_to || '',
        })),
        school: me.school
          ? { name: me.school.name, address: me.school.address || '', teacher: me.school.teacher,
              position: me.school.position || '교사', place: me.school.place, tel: me.school.tel }
          : state.school,
      };
    }

    /* 표의 칸 이름과 앱의 이름을 서로 옮겨 준다 */
    const fromRowItem = (r) => ({
      id: r.id, name: r.name, category: r.category, qty: r.qty, loanable: r.loanable,
      building: r.building, floor: r.floor, room: r.room, storage: r.storage, shelf: r.shelf,
      memo: r.memo, ...(r.photo ? { photo: r.photo } : {}),
      asset: r.asset, ...(r.asset_info ? { assetInfo: r.asset_info } : {}),
      ...(r.disused ? { disused: true } : {}),
      ...(r.repair ? { repair: true } : {}),
      ...(r.lost ? { lost: true } : {}),
      createdAt: r.created_at, ...(r.updated_at ? { updatedAt: r.updated_at } : {}),
    });
    const toRowItem = (i) => ({
      id: i.id, school_id: me.schoolId, name: i.name, category: i.category || '', qty: i.qty,
      loanable: !!i.loanable, building: i.building || '', floor: i.floor || '', room: i.room || '',
      storage: i.storage || '', shelf: i.shelf || '', memo: i.memo || '', photo: i.photo || null,
      asset: !!i.asset, asset_info: i.assetInfo || null, disused: !!i.disused, repair: !!i.repair, lost: !!i.lost,
      created_at: i.createdAt, updated_at: i.updatedAt || null,
    });
    const fromRowLoan = (r) => ({
      id: r.id, itemId: r.item_id, itemName: r.item_name, path: r.path, qty: r.qty, who: r.who,
      dueAt: r.due_at, period: r.period, periodNote: r.period_note, memo: r.memo,
      ...(r.who_type ? { whoType: r.who_type } : {}),
      ...(r.sign ? { sign: r.sign } : {}),
      outAt: r.out_at, returnedAt: r.returned_at,
    });
    const toRowLoan = (l) => ({
      id: l.id, school_id: me.schoolId, item_id: l.itemId, item_name: l.itemName, path: l.path || '',
      qty: l.qty, who: l.who, who_type: l.whoType || 'staff', due_at: l.dueAt || null, period: l.period || '',
      period_note: l.periodNote || '', memo: l.memo || '', sign: l.sign || null,
      out_at: l.outAt, returned_at: l.returnedAt,
    });

    // 한 번에 다 보내면 요청이 너무 커진다. 400줄씩 끊어 보낸다.
    const chunk = (arr, size = 400) => {
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    };

    // 바뀐 줄만 골라 서버에 보낸다. 화면은 먼저 바뀌고 저장은 뒤따라간다.
    async function pushDiff(prev, next) {
      if (!sb || me?.status !== 'active') return;
      const jobs = [];
      const diff = (a, b, table, toRow) => {
        const before = new Map(a.map((x) => [x.id, x]));
        const after = new Map(b.map((x) => [x.id, x]));
        const changed = [...after.values()].filter((x) => JSON.stringify(before.get(x.id)) !== JSON.stringify(x));
        const gone = [...before.keys()].filter((id) => !after.has(id));
        for (const part of chunk(changed)) jobs.push(sb.from(table).upsert(part.map(toRow)));
        for (const part of chunk(gone)) jobs.push(sb.from(table).delete().in('id', part));
      };
      diff(prev.items || [], next.items || [], 'items', toRowItem);
      diff(prev.loans || [], next.loans || [], 'loans', toRowLoan);
      diff(prev.handovers || [], next.handovers || [], 'handovers', (x) => ({
        id: x.id, school_id: me.schoolId,
        started_at: x.startedAt, done_at: x.doneAt,
        from_name: x.fromName, from_position: x.fromPosition,
        to_name: x.toName, to_position: x.toPosition,
        checks: x.checks || {}, snapshot: x.snapshot || [],
        sign_from: x.signFrom || null, sign_to: x.signTo || null,
      }));

      if (JSON.stringify(prev.school) !== JSON.stringify(next.school) && next.school && isAdmin()) {
        jobs.push(sb.from('schools').update({
          name: next.school.name, address: next.school.address || '',
          teacher: next.school.teacher, position: next.school.position || '',
          place: next.school.place, tel: next.school.tel,
        }).eq('id', me.schoolId));
      }

      const results = await Promise.all(jobs);
      const bad = results.find((r) => r && r.error);
      if (bad) {
        console.error(bad.error);
        flash('저장하지 못했어요. 인터넷을 확인해 주세요.', 'warn');
      }
    }

    // 나이스에서 학교를 찾아 이름과 주소를 가져온다
    async function findSchools(name) {
      if (!NEIS_KEY) throw new Error('NO_KEY');
      const url = 'https://open.neis.go.kr/hub/schoolInfo'
        + `?KEY=${encodeURIComponent(NEIS_KEY)}&Type=json&pIndex=1&pSize=20`
        + `&SCHUL_NM=${encodeURIComponent(name)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.RESULT) throw new Error(data.RESULT.CODE === 'INFO-200' ? 'NONE' : data.RESULT.CODE);
      const rows = data.schoolInfo?.[1]?.row || [];
      return rows.map((r) => ({
        name: r.SCHUL_NM,
        address: [r.ORG_RDNMA, r.ORG_RDNDA].filter(Boolean).map((v) => v.trim()).join(' '),
        area: r.ATPT_OFCDC_SC_NM || '',
        kind: r.SCHUL_KND_SC_NM || '',
      }));
    }

    /* ── 로그인 화면들 ── */
    const GOOGLE_MARK = `<svg class="gicon" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M23 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.17a5.28 5.28 0 01-2.29 3.46v2.88h3.7C21.74 18.8 23 15.8 23 12.27z"/>
      <path fill="#34A853" d="M12 23.5c3.1 0 5.7-1.03 7.6-2.8l-3.7-2.88c-1.03.69-2.34 1.1-3.9 1.1-3 0-5.54-2.02-6.45-4.74H1.7v2.97A11.5 11.5 0 0012 23.5z"/>
      <path fill="#FBBC05" d="M5.55 14.18a6.9 6.9 0 010-4.36V6.85H1.7a11.5 11.5 0 000 10.3l3.85-2.97z"/>
      <path fill="#EA4335" d="M12 5.02c1.69 0 3.2.58 4.4 1.72l3.28-3.28C17.7 1.58 15.1.5 12 .5A11.5 11.5 0 001.7 6.85l3.85 2.97C6.46 7.1 9 5.02 12 5.02z"/>
    </svg>`;

    const gateShell = (inner) => `
      <div class="gate__box">
        <div class="gate__brand">
          <span class="gate__mark" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
          </span>
          <span class="gate__name">학교 물품 어디 있지?</span>
        </div>
        <div class="gate__card">${inner}</div>
      </div>`;

    const whoStrip = () => `
      <div class="gate__who">
        ${icon(ICONS.manager)}
        <span class="gate__who-mail">${esc(myEmail())}</span>
        <button type="button" id="g-out">다른 계정</button>
      </div>`;

    function gateView(kind) {
      if (kind === 'login') {
        return `
          <div class="gate__box">
            <div class="welcome">
              <div class="welcome__hero">
                ${PLAN_SVG}
                <p class="welcome__eyebrow">학교 물품 어디 있지?</p>
                <h1 class="welcome__title">선생님, 환영합니다!</h1>
              </div>
              <div class="welcome__body">
                <p class="welcome__desc">교내 비품 조회부터 대여까지 한 번에 해결하는 맞춤형 서비스입니다. 계정으로 로그인하여 우리 학교만의 프라이빗한 물품 현황을 바로 확인해 보세요.</p>
                <button class="bigbtn bigbtn--google" type="button" id="g-google">${GOOGLE_MARK}구글로 계속하기</button>
                <p class="gate__err" id="g-err"></p>
                <p class="welcome__note">${icon(ICONS.lock, 'icon welcome__lock')}<span>우리 학교 자료는 같은 학교 선생님에게만 보여요.</span></p>
              </div>
            </div>
          </div>`;
      }

      if (kind === 'start') {
        if (!found) {
          return gateShell(`
            ${whoStrip()}
            <h1 class="gate__title">어느 학교인가요</h1>
            <p class="gate__desc">담당 선생님께 받은 6자리 코드를 넣고 확인해 주세요.</p>
            <div class="codebox">
              <input id="g-code" type="text" inputmode="latin" maxlength="6" placeholder="A1B2C3" autocomplete="off" aria-label="학교 코드" value="${esc(codeTyped)}">
              <button class="bigbtn bigbtn--navy" type="button" id="g-check">확인하기</button>
            </div>
            <p class="gate__err" id="g-err"></p>
            <p class="gate__foot">소속된 그룹이 없다면, 관리자로 새 공간을 만들어 보세요.<br><button type="button" id="g-new">우리 학교를 새로 만들기</button></p>`);
        }
        return gateShell(`
          ${whoStrip()}
          <h1 class="gate__title">이 학교가 맞나요</h1>
          <div class="found">
            <p class="found__name">${esc(found.name)}</p>
            <p class="found__addr">${esc(found.address || '주소가 아직 적혀 있지 않아요')}</p>
            <button class="found__again" type="button" id="g-again">다른 코드 넣기</button>
          </div>
          <div class="gform">
            <div class="row">
              <div class="field">
                <label class="field__label" for="g-me">내 이름<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                <input class="input" id="g-me" type="text" placeholder="예: 김하늘" autocomplete="name" value="${esc(myName())}">
              </div>
              <div class="field">
                <label class="field__label" for="g-mypos">직위</label>
                <div class="selectbox">
                  <select class="input" id="g-mypos">
                    ${POSITIONS.map((v) => `<option value="${esc(v)}" ${v === '교사' ? 'selected' : ''}>${esc(v)}</option>`).join('')}
                  </select>
                  ${icon(ICONS.caret, 'icon selectbox__caret')}
                </div>
              </div>
            </div>
            <button class="bigbtn bigbtn--navy" type="button" id="g-join">신청하기</button>
          </div>
          <p class="gate__err" id="g-err"></p>
          <p class="gate__foot">신청하면 관리 담당 선생님이 확인하고 승인해요.</p>`);
      }

      if (kind === 'create') {
        return gateShell(`
          ${whoStrip()}
          <h1 class="gate__title">학교를 만들어요</h1>
          <p class="gate__desc">학교를 최초로 개설한 선생님이 관리자로 지정됩니다. 동료 선생님들은 초대 코드로 합류를 요청하고, 관리자의 승인 후 최종 가입됩니다.</p>
          <div class="gform">
            <div class="field">
              <label class="field__label" for="g-name">학교 이름<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
              <div class="findrow">
                <input class="input" id="g-name" type="text" placeholder="예: 전주화정초등학교" autocomplete="off" value="${esc(picked ? picked.name : '')}">
                ${NEIS_KEY ? '<button class="findrow__go" type="button" id="g-find">학교 찾기</button>' : ''}
              </div>
              <p class="gform__hint">줄여 쓰지 말고 정식 이름으로 적어 주세요. 전주화정초(X) · 전주화정초등학교(O)</p>
            </div>
            <div id="g-hits"></div>
            <div class="field">
              <label class="field__label" for="g-addr">학교 주소</label>
              <input class="input" id="g-addr" type="text" placeholder="예: 전북특별자치도 전주시 덕진구 화정1길 15" autocomplete="off" value="${esc(picked ? picked.address : '')}">
              <p class="gform__hint">${NEIS_KEY ? '학교 찾기를 쓰면 자동으로 채워져요.' : '다른 선생님이 학교가 맞는지 확인할 때 보여요.'}</p>
            </div>
            <div class="row">
              <div class="field">
                <label class="field__label" for="g-teacher">관리자 이름<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
                <input class="input" id="g-teacher" type="text" placeholder="예: 김하늘" autocomplete="off" value="${esc(myName())}">
              </div>
              <div class="field">
                <label class="field__label" for="g-pos">직위</label>
                <div class="selectbox">
                  <select class="input" id="g-pos">
                    ${POSITIONS.map((v) => `<option value="${esc(v)}" ${v === '교사' ? 'selected' : ''}>${esc(v)}</option>`).join('')}
                  </select>
                  ${icon(ICONS.caret, 'icon selectbox__caret')}
                </div>
              </div>
            </div>
            <button class="bigbtn bigbtn--navy" type="button" id="g-make">학교 만들기</button>
            <button class="bigbtn bigbtn--ghost" type="button" id="g-back">코드로 가입하기</button>
          </div>
          <p class="gate__err" id="g-err"></p>`);
      }

      if (kind === 'error') {
        return gateShell(`
          <h1 class="gate__title">서버에 연결하지 못했어요</h1>
          <p class="gate__desc">인터넷 연결을 확인하고 다시 시도해 주세요.<br>계속 이러면 아래 내용을 알려 주세요.</p>
          <div class="gate__acts">
            <button class="bigbtn bigbtn--navy" type="button" id="g-retry">다시 시도</button>
          </div>
          <p class="gate__err">${esc(bootError)}</p>`);
      }

      // 승인 대기
      if (justApplied) {
        return gateShell(`
          ${whoStrip()}
          <span class="waitmark is-done" aria-hidden="true">${icon(ICONS.check)}</span>
          <h1 class="gate__title">신청을 보냈어요</h1>
          <p class="gate__desc"><b>${esc(me?.school?.name || '')}</b>에 가입을 신청했어요.<br>관리 담당 선생님이 승인하면 바로 쓸 수 있어요.<br>승인되면 이 화면에서 다시 확인해 주세요.</p>
          <div class="gate__acts">
            <button class="bigbtn bigbtn--navy" type="button" id="g-recheck">승인됐는지 확인</button>
          </div>
          <p class="gate__err" id="g-err"></p>`);
      }
      return gateShell(`
        ${whoStrip()}
        <span class="waitmark" aria-hidden="true">${icon(ICONS.clock)}</span>
        <h1 class="gate__title">승인을 기다리고 있어요</h1>
        <p class="gate__desc"><b>${esc(me?.school?.name || '')}</b>에 가입을 신청했어요.<br>관리 담당 선생님이 승인하면 바로 쓸 수 있어요.</p>
        <div class="gate__acts">
          <button class="bigbtn bigbtn--navy" type="button" id="g-recheck">승인됐는지 확인</button>
        </div>
        <p class="gate__err" id="g-err"></p>`);
    }

    let gateMode = 'start';   // start | create
    let found = null;         // 코드로 확인한 학교 { name, address }
    let codeTyped = '';       // 다시 그릴 때 코드가 사라지지 않게
    let justApplied = false;  // 방금 신청을 보냈는지
    let picked = null;       // 나이스에서 고른 학교

    function mountGate(root, kind) {
      const err = root.querySelector('#g-err');
      const say = (m) => { err.textContent = m; };
      const busy = (btn, on) => { btn.disabled = on; };

      root.querySelector('#g-retry')?.addEventListener('click', () => location.reload());

      root.querySelector('#g-google')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        busy(btn, true);
        const { error } = await sb.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: location.origin + location.pathname },
        });
        if (error) { busy(btn, false); say('로그인 창을 열지 못했어요. 잠시 뒤 다시 해 주세요.'); }
      });

      root.querySelector('#g-out')?.addEventListener('click', async () => {
        await sb.auth.signOut();
        me = null; session = null; render();
      });

      root.querySelector('#g-new')?.addEventListener('click', () => { gateMode = 'create'; found = null; render(); });
      root.querySelector('#g-back')?.addEventListener('click', () => { gateMode = 'start'; render(); });

      const code = root.querySelector('#g-code');
      if (code) {
        code.addEventListener('input', () => {
          code.value = code.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
          codeTyped = code.value;
        });
        code.addEventListener('keydown', (e) => { if (e.key === 'Enter') root.querySelector('#g-check').click(); });
        code.focus();
      }

      // 1단계: 코드로 어느 학교인지 확인
      root.querySelector('#g-check')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const v = code.value.trim();
        if (v.length < 6) { say('코드 6자리를 모두 넣어 주세요.'); code.focus(); return; }
        busy(btn, true); say('');
        const { data, error } = await sb.rpc('find_school', { code: v });
        busy(btn, false);
        if (error || !data) {
          say('그런 코드를 가진 학교가 없어요. 코드를 다시 확인해 주세요.');
          code.select();
          return;
        }
        found = { name: data.name, address: data.address, code: v };
        render();
      });

      root.querySelector('#g-again')?.addEventListener('click', () => { found = null; render(); });

      // 2단계: 이름과 직위를 적고 신청
      root.querySelector('#g-join')?.addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        const nameBox = root.querySelector('#g-me');
        const who = nameBox.value.trim();
        const pos = root.querySelector('#g-mypos').value;
        if (!who) { say('내 이름을 적어 주세요.'); nameBox.focus(); return; }
        busy(btn, true); say('');
        const { error } = await sb.rpc('join_school', { code: found.code, member_name: who, position_name: pos });
        busy(btn, false);
        if (error) {
          say(String(error.message).includes('NO_SCHOOL')
            ? '학교를 찾지 못했어요. 코드를 다시 확인해 주세요.'
            : '신청하지 못했어요. 잠시 뒤 다시 해 주세요.');
          return;
        }
        found = null; codeTyped = ''; justApplied = true;
        await loadMe();
        render();
        flash('신청을 보냈어요');
      });

    /* ════════ 표시 형식 (→ src/lib/format.js) ════════ */
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const n = (v) => Number(v).toLocaleString('ko-KR');
    const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
    const todayLabel = () => { const d = new Date(); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`; };
    const pathOf = (item) => PATH_KINDS.map((k) => item[k.key]).filter(Boolean);

    // 받침에 맞는 조사: josa('삼각대', '은/는') → '삼각대는'
    function josa(word, pair) {
      const [withJong, withoutJong] = pair.split('/');
      const last = String(word).trim().slice(-1);
      const code = last.charCodeAt(0) - 0xac00;
      if (code < 0 || code > 11171) {
        // 영문·숫자로 끝나면 읽는 소리를 알 수 없으니 둘 다 적는다
        return `${word}${withJong}(${withoutJong})`;
      }
      const jong = code % 28;
      if (pair === '으로/로' && jong === 8) return word + '로'; // ㄹ 받침
      return word + (jong ? withJong : withoutJong);
    }

    const icon = (d, cls = 'icon') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;

    /* ════════ 한글 검색 (→ src/lib/search.js) ════════ */
    const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    // 겹자모는 풀고, 헷갈리기 쉬운 모음(애/에/얘/예, 왜/외)은 같은 것으로 본다.
    const LOOSE = {
      'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ',
      'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅔ','ㅚ':'ㅗㅔ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ','ㅐ':'ㅔ','ㅒ':'ㅔ','ㅖ':'ㅔ',
    };
    const SKIP = /[\s·\-_.,()/[\]]/;
    const isSyllable = (c) => c >= 0xac00 && c <= 0xd7a3;
    const isConsonant = (ch) => /^[ㄱ-ㅎ]$/.test(ch);

    // 글자마다 원래 위치를 기억해 둬서, 어디서 맞았는지 형광펜을 칠할 수 있게 한다.
    function indexText(text) {
      const chars = [...String(text ?? '')];
      const t = { chars, syl: '', sylMap: [], jamo: '', jamoMap: [], cho: '', choMap: [] };
      chars.forEach((raw, i) => {
        const ch = raw.toLowerCase();
        if (SKIP.test(ch)) return;
        t.syl += ch; t.sylMap.push(i);
        const code = ch.charCodeAt(0);
        let jamo, cho;
        if (isSyllable(code)) {
          const k = code - 0xac00;
          const parts = [CHO[Math.floor(k / 588)], JUNG[Math.floor((k % 588) / 28)], JONG[k % 28]];
          jamo = parts.map((p) => LOOSE[p] ?? p).join('');
          cho = parts[0];
        } else {
          jamo = LOOSE[ch] ?? ch;
          cho = ch;
        }
        for (const j of jamo) { t.jamo += j; t.jamoMap.push(i); }
        t.cho += cho; t.choMap.push(i);
      });
      return t;
    }

    const span = (map, start, len) => [[map[start], map[start + len - 1] + 1]];

    // 한 칸(필드) 안에서 가장 잘 맞는 방식을 고른다.
    function matchField(t, q) {
      if (!q.syl || !t.syl) return null;
      if (t.syl === q.syl) return { tier: 100, ranges: span(t.sylMap, 0, q.syl.length) };
      let p = t.syl.indexOf(q.syl);
      if (p === 0) return { tier: 90, ranges: span(t.sylMap, 0, q.syl.length) };
      if (p > 0) return { tier: 80, ranges: span(t.sylMap, p, q.syl.length) };
      if (q.jamo.length >= 2) {
        p = t.jamo.indexOf(q.jamo);
        if (p >= 0) return { tier: 70, ranges: span(t.jamoMap, p, q.jamo.length) };
      }
      if (q.isCho) {
        p = t.cho.indexOf(q.syl);
        if (p >= 0) return { tier: 65, ranges: span(t.choMap, p, q.syl.length), why: '초성으로 찾았어요' };
      }
      // 글자가 순서대로 들어 있으면(과학실 → 과학 준비실) 약하게 맞은 것으로 본다.
      if (q.syl.length >= 2) {
        const hit = []; let from = 0;
        for (const ch of q.syl) {
          const at = t.syl.indexOf(ch, from);
          if (at < 0) return null;
          hit.push(at); from = at + 1;
        }
        if (hit[hit.length - 1] - hit[0] < q.syl.length * 3) {
          // 처음과 끝이 맞으면(과학실 ↔ 과학 준비실) 조금 더 믿는다
          const ends = hit[0] === 0 && hit[hit.length - 1] === t.syl.length - 1;
          return { tier: ends ? 58 : 30, ranges: hit.map((h) => [t.sylMap[h], t.sylMap[h] + 1]), loose: true };
        }
      }
      return null;
    }

    const WEIGHTS = {
      name: 1, room: .72, storage: .62, building: .55, category: .45, shelf: .45, floor: .45, memo: .36,
      'assetInfo.no': .9, 'assetInfo.name': .8, 'assetInfo.code': .6, 'assetInfo.dept': .5, 'assetInfo.spec': .4,
    };
    const FIELD_WHY = {
      memo: '메모에서 찾았어요',
      'assetInfo.no': '비품 고유번호로 찾았어요',
      'assetInfo.name': '비품 대장 이름으로 찾았어요',
      'assetInfo.code': '비품 분류번호로 찾았어요',
      'assetInfo.dept': '운용부서로 찾았어요',
      'assetInfo.spec': '규격에서 찾았어요',
    };
    // 'assetInfo.no'처럼 점이 들어간 이름도 읽는다
    const pick = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);

    function makeQuery(text) {
      const q = indexText(text);
      q.isCho = q.syl.length >= 2 && [...q.syl].every(isConsonant);
      return q;
    }

    function synonymHits(nameIdx, q) {
      if (q.syl.length < 1) return null;
      for (const group of SYNONYMS) {
        const said = group.find((w) => w === q.syl || (q.syl.length >= 2 && w.startsWith(q.syl)));
        if (!said) continue;
        for (const other of group) {
          if (other === said || other.length < 2 && other !== '빔') continue;
          const p = nameIdx.syl.indexOf(other);
          if (p >= 0) return { tier: 60, ranges: span(nameIdx.sylMap, p, other.length), why: `비슷한 말 ‘${said}’` };
        }
      }
      return null;
    }

    // 가장 잘 맞은 칸이 점수를 정하고, 함께 맞은 칸은 조금 보태고 형광펜도 같이 칠한다.
    function scoreOne(entry, q) {
      let best = null;
      const found = [];
      for (const [field, w] of Object.entries(WEIGHTS)) {
        const m = matchField(entry.idx[field], q);
        if (!m) continue;
        const score = m.tier * w;
        const why = m.why || FIELD_WHY[field] || (m.loose && field === 'name' ? '비슷한 이름' : undefined);
        const hit = { score, field, ranges: m.ranges, why };
        found.push(hit);
        if (!best || score > best.score) best = hit;
      }
      if (best && found.length > 1) {
        const extra = found.filter((f) => f !== best);
        best = {
          ...best,
          score: best.score + extra.reduce((a, f) => a + f.score, 0) * .15,
          also: Object.fromEntries(extra.filter((f) => f.score >= 20).map((f) => [f.field, f.ranges])),
        };
      }
      // 강당 ↔ 다목적실처럼 학교에서 다르게 부르는 이름
      if ((!best || best.score < 60) && entry.item?.room) {
        const alias = ROOM_ALIAS.get(q.syl);
        if (alias && alias === entry.item.room) {
          best = { score: 78, field: 'room', ranges: [], why: '다르게 부르는 이름' };
        }
      }
      if (!best || best.field !== 'name' || best.score < 60) {
        for (const field of ['name', 'memo']) {
          const s = synonymHits(entry.idx[field], q);
          if (!s) continue;
          const score = s.tier * WEIGHTS[field];
          if (!best || score > best.score) best = { score, field, ranges: s.ranges, why: s.why };
          break;
        }
      }
      return best;
    }

    let ROOM_ALIAS = new Map();

    function searchItems(items, text) {
      ROOM_ALIAS = roomAliasMap();
      const whole = makeQuery(text);
      const tokens = String(text).trim().split(/\s+/).filter(Boolean);
      const parts = tokens.length > 1 ? tokens.map(makeQuery) : [];
      const out = [];

      for (const item of items) {
        const entry = { item, idx: Object.fromEntries(Object.keys(WEIGHTS).map((f) => [f, indexText(pick(item, f))])) };
        const candidates = [];

        const a = scoreOne(entry, whole);
        if (a) candidates.push({ score: a.score, marks: { ...(a.also || {}), [a.field]: a.ranges }, why: a.why });

        if (parts.length) {
          const got = parts.map((p) => scoreOne(entry, p));
          if (got.every(Boolean)) {
            const marks = {};
            for (const g of got) {
              for (const [f, r] of Object.entries(g.also || {})) (marks[f] ||= []).push(...r);
              (marks[g.field] ||= []).push(...g.ranges);
            }
            candidates.push({
              score: got.reduce((s, g) => s + g.score, 0) / got.length * 1.02,
              marks, why: got.map((g) => g.why).find(Boolean),
            });
          }
        }
        if (!candidates.length) continue;
        const best = candidates.sort((x, y) => y.score - x.score)[0];
        out.push({ item, ...best });
      }
      return out.sort((x, y) =>
        y.score - x.score ||
        x.item.name.length - y.item.name.length ||
        y.item.createdAt.localeCompare(x.item.createdAt));
    }

    // 결과가 없을 때 "혹시 이걸 찾으세요?"
    function levenshtein(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        let prev = row[0]; row[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const tmp = row[j];
          row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
          prev = tmp;
        }
      }
      return row[b.length];
    }
    function guesses(items, text) {
      const q = makeQuery(text).jamo;
      if (q.length < 2) return [];
      const names = [...new Set([...items.map((i) => i.name), ...items.map((i) => i.room)])];
      return names
        .map((name) => {
          const t = indexText(name).jamo;
          // 이름 안의 비슷한 길이 조각과 비교해서, 긴 이름이 불리하지 않게 한다
          let d = levenshtein(q, t);
          for (let i = 0; i + q.length - 1 <= t.length; i++) {
            d = Math.min(d, levenshtein(q, t.slice(i, i + q.length)), levenshtein(q, t.slice(i, i + q.length + 1)));
          }
          return { name, d };
        })
        .filter((g) => g.d <= Math.max(2, Math.floor(q.length * .4)))
        .sort((a, b) => a.d - b.d)
        .slice(0, 3)
        .map((g) => g.name);
    }

    function highlight(text, ranges = []) {
      const chars = [...String(text ?? '')];
      const on = new Array(chars.length).fill(false);
      for (const [s, e] of ranges) for (let i = s; i < e; i++) on[i] = true;
      let html = '', open = false;
      chars.forEach((ch, i) => {
        if (on[i] && !open) { html += '<mark>'; open = true; }
        if (!on[i] && open) { html += '</mark>'; open = false; }
        html += esc(ch);
      });
      return html + (open ? '</mark>' : '');
    }

    /* ════════ 공통 조각 (→ src/components) ════════ */
    function renderNav(active) {
      const item = (m, baseCls, withLabelSpan) => {

        if (m.action) return `<button class="${cls}" type="button" data-action="${m.action}">${icon(ICONS[m.key])}${label}</button>`;
        return m.href
          ? `<a class="${cls}" href="${m.href}" ${current}>${icon(ICONS[m.key])}${label}</a>`
          : `<button class="${cls}" type="button" data-soon>${icon(ICONS[m.key])}${label}</button>`;
      };
      const menu = MENU.filter((m) => (!m.admin || isAdmin()) && (!m.manage || canImport()));
      document.getElementById('rail-nav').innerHTML = menu.map((m) => item(m, 'rail__item', true)).join('');
      document.getElementById('tabbar').innerHTML = menu.filter((m) => m.tab !== false).map((m) => item(m, 'tabbar__item', false)).join('');
      const s = school();
      const who = s.teacher ? `${s.teacher} ${s.position || '선생님'}` : '물품 담당';

    /* ════════ 홈 (→ src/pages/home.js) ════════ */
    function homeView() {
      const items = state.items;

      const total = items.reduce((a, i) => a + i.qty, 0);

      const repair = items.filter((i) => i.repair).reduce((a, i) => a + i.qty, 0);
      const stock = [
        { label: '사용 가능', count: total - onLoan - repair, color: 'var(--board)' },
        { label: '대여 중',   count: onLoan, color: 'var(--marker)' },
        { label: '수리 필요', count: repair, color: 'var(--late)' },
      ];

      const byRoom = new Map();
      for (const i of items) {
        const key = `${i.building}|${i.room}`;
        const prev = byRoom.get(key) || { name: i.room, key: `${i.building}|${i.floor}|${i.room}`, count: 0 };
        prev.count += i.qty; byRoom.set(key, prev);
      }
      const places = [...byRoom.values()].sort((a, b) => b.count - a.count).slice(0, 5);
      const recent = [...new Set(items.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).map((i) => i.name))].slice(0, 5);

      const todayIdx = new Date().getDay() - 1;
      // 이번 주 월요일부터 요일별 대여 건수
      const monday = new Date();
      monday.setHours(0, 0, 0, 0);
      monday.setDate(monday.getDate() - ((monday.getDay() + 6) % 7));
      const week = ['월', '화', '수', '목', '금'].map((day, i) => {
        const key = ymd(new Date(monday.getTime() + i * DAY));
        return { day, count: loans.filter((l) => l.outAt.slice(0, 10) === key).length };
      });
      const weekMax = Math.max(1, ...week.map((w) => w.count));
      const weekSum = week.reduce((a, w) => a + w.count, 0);

      const stockBody = total === 0
        ? `<div class="stock__bar" aria-hidden="true"></div>

        : `<div class="stock__bar" aria-hidden="true">${stock.filter((s) => s.count > 0).map((s) => `<span style="flex:${s.count} 0 0;background:${s.color}"></span>`).join('')}</div>
           <div class="legend">${stock.map((s) => `
             <div class="legend__row"><span class="legend__dot" style="background:${s.color}"></span><span>${esc(s.label)}</span><b class="num">${n(s.count)}</b></div>`).join('')}
           </div>`;

      return `
        <header class="top">
          <div>
            <p class="top__date">${todayLabel()}</p>
            <h1 class="top__title" tabindex="-1">${esc(school().name)}</h1>
          </div>
          <div class="top__actions">
            <a class="btn btn--ghost" href="#/add">${icon(ICONS.add)}물품 등록</a>
            <a class="btn btn--solid" href="#/lend">${icon(ICONS.rent)}빌리기</a>
            ${isAdmin() ? `<div class="alert">
              <button class="avatar" type="button" id="alert-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="alert-panel"
                      aria-label="알림${notifications().length ? ` ${notifications().length}건` : ''}">
                ${icon(ICONS.bell)}
                ${urgentCount() ? `<span class="alert__badge num">${urgentCount()}</span>` : ''}
              </button>
              <div class="alert__panel" id="alert-panel" role="dialog" aria-label="알림" hidden></div>
            </div>` : ''}
          </div>
        </header>

        <section class="find" aria-labelledby="find-title">
          ${PLAN_SVG}
          <h2 class="find__title" id="find-title">학교 물품 어디 있지?</h2>
          <form class="search" role="search" id="search">
            ${icon(ICONS.find)}
            <input id="q" type="search" placeholder="물품 이름이나 장소" autocomplete="off" enterkeyhint="search" aria-label="물품 찾기">
            <button class="search__go" type="submit">찾기</button>
          </form>
          <div class="find__foot" id="find-foot" aria-live="polite" data-recent='${esc(JSON.stringify(recent))}'></div>
        </section>

        <section class="card stock" aria-labelledby="stock-title">
          <div class="card__head"><h2 class="card__title" id="stock-title">전체 물품</h2><span class="card__meta">오늘 기준</span></div>
          <p class="stock__figure"><span class="stock__total num">${n(total)}</span><span class="stock__unit">개</span></p>
          ${stockBody}
        </section>

        <section class="card week" aria-labelledby="week-title">
          <div class="card__head"><h2 class="card__title" id="week-title">이번 주 대여</h2><span class="card__meta num">총 ${weekSum}건</span></div>
          <div class="week__chart">
            ${week.map((w, i) => `
              <div class="week__col ${i === todayIdx ? 'is-today' : ''}">
                ${weekSum ? `<span class="week__val num">${w.count}</span>` : ''}
                <span class="week__bar" style="height:${weekSum ? (w.count / weekMax) * 100 : 0}%;animation-delay:${i * 60}ms"></span>
                <span class="week__day">${w.day}${i === todayIdx ? '<em>오늘</em>' : ''}</span>
              </div>`).join('')}
            ${weekSum ? '' : `<div class="week__empty"><strong>이번 주 대여 기록이 없어요</strong><span>물품을 빌리면 요일별로 쌓여요</span></div>`}
          </div>

        <section class="card loans" aria-labelledby="loans-title">
          <div class="card__head">
            <h2 class="card__title" id="loans-title">대여 현황</h2>
            ${out.length ? `<a class="linkish" href="#/rent">모두 보기</a>` : ''}
          </div>
          ${out.length ? `<ul class="loans__list">${sortLoans(out).slice(0, 4).map((l) => {
            const st = dueState(l);
            return `<li class="loan ${st.key === 'late' ? 'is-late' : ''}">
              <div class="loan__main">
                <p class="loan__item">${esc(l.itemName)}${l.qty > 1 ? ` ${n(l.qty)}개` : ''}</p>
                <p class="loan__who">${esc(l.who)}</p>

              <span class="pill ${PILL[st.key]}">${esc(st.label)}</span>
