            <span class="spotbar__info">${picked.length ? `${n(picked.length)}가지 · ${n(pickedQty)}개 고름` : '옮길 물품을 골라 주세요'}</span>
            <button class="mini mini--quiet" type="button" id="sp-all">${picked.length === groups.length ? '모두 풀기' : '모두 고르기'}</button>
            <button class="mini mini--go" type="button" id="sp-save" ${picked.length ? '' : 'disabled'}>여기로 옮기기</button>
          </div>
          <ul class="spotlist">
            ${groups.slice(0, 200).map((g) => `
              <li class="spotrow">
                <input type="checkbox" data-spot="${esc(g.key)}" ${chosen.has(g.key) ? 'checked' : ''} aria-label="${esc(g.name)}">
                <span class="spotrow__name">${esc(g.name)}</span>
                <span class="spotrow__qty num">${n(g.qty)}개</span>
                <span class="spotrow__sub">${esc(g.place || '대장에 장소가 없어요')}</span>
              </li>`).join('')}
            ${groups.length > 200 ? `<li class="imp__more num">그 밖에 ${n(groups.length - 200)}가지</li>` : ''}
          </ul>`;
      }

      const todoFold = view.querySelector('#todo-fold');
      todoFold.addEventListener('click', () => {
        const open = body.hidden;
        body.hidden = !open;
        todoFold.setAttribute('aria-expanded', String(open));
      });

      spotFold.addEventListener('click', () => {
        const open = spotBox.hidden;
        spotBox.hidden = !open;
        spotFold.setAttribute('aria-expanded', String(open));
        if (open) drawSpots();
      });

      view.addEventListener('change', (e) => {
        const box = e.target.closest('[data-spot]');
        if (!box) return;
        box.checked ? chosen.add(box.dataset.spot) : chosen.delete(box.dataset.spot);
        drawSpots();
      });

      /* ── 기록 지우기 ── */
      const wipeBox = view.querySelector('#wipe-box');
      let wipeKind = '';   // '' | items | loans
      let wipeStep = 1;    // 1 물어보기 · 2 코드 적기
      // 실수로 지우지 않도록 학교 코드를 그대로 적게 한다
      const wipeWord = () => (online() ? (me?.school?.join_code || '') : '삭제');

      const WIPES = {
        items: {
          title: '물품 전체 삭제',
          count: () => state.items.length,
          unit: '가지',
          desc: () => `등록된 물품 ${n(state.items.length)}가지를 모두 지워요. 대장을 새로 올릴 때 쓰세요.`,
          warn: '삭제하면 다시 복구할 수 없습니다. 복구를 하려면 엑셀로 내려받아 주세요.',
          run: () => commit({ ...state, items: [] }),
          done: (c) => `물품 ${n(c)}가지를 모두 지웠어요`,
        },
        all: {
          title: '학교 정보 삭제',
          count: () => state.items.length + (state.loans || []).length,
          unit: '건',
          desc: () => '물품, 대여 기록, 서명, 공간 설정, 담당 정보를 모두 지우고 처음 상태로 되돌려요.',
          warn: '삭제하면 다시 복구할 수 없습니다. 복구를 하려면 엑셀로 내려받아 주세요. 학교와 선생님 계정은 남아서 로그인은 그대로 됩니다.',
          run: () => commit({ ...state, items: [], loans: [], recent: [], school: { ...DEFAULT_SCHOOL, name: school().name } }),
          done: () => '학교 정보를 모두 지웠어요',
        },
        loans: {
          title: '대여 기록·서명 삭제',
          count: () => (state.loans || []).length,
          unit: '건',
          desc: () => `빌려준 기록과 받아 둔 서명 ${n((state.loans || []).length)}건을 모두 지워요. 학년이 바뀔 때 쓰세요.`,
          warn: '삭제하면 다시 복구할 수 없습니다. 서명도 함께 사라져요.',
          run: () => commit({ ...state, loans: [] }),
          done: (c) => `대여 기록 ${n(c)}건을 모두 지웠어요`,
        },
      };

      function drawWipe() {
        if (!wipeBox) return;
        const spec = WIPES[wipeKind];

        if (!wipeKind) {
          wipeBox.innerHTML = ['items', 'loans', 'all'].map((key) => [key, WIPES[key]]).map(([key, w]) => `
            <div class="wipe__row">
              <div class="wipe__what">
                <p class="wipe__name">${esc(w.title)}</p>
                <p class="wipe__count num">${key === 'all' ? '모두 처음 상태로' : (w.count() ? `${n(w.count())}${w.unit}` : '비어 있어요')}</p>
              </div>
              <button class="mini wipe__pick ${key === 'all' ? 'wipe__pick--all' : ''}" type="button" data-wipe="${key}" ${w.count() || key === 'all' ? '' : 'disabled'}>지우기</button>
            </div>`).join('');
          return;
        }

        if (wipeStep === 1) {
          wipeBox.innerHTML = `
            <div class="wipe__ask">
              <p class="wipe__head">${esc(spec.title)}</p>
              <p class="wipe__desc">${esc(spec.desc())}</p>
              <p class="wipe__warn">${icon(ICONS.bell)}<span>${esc(spec.warn)}</span></p>
              <div class="wipe__acts">
                <button class="mini mini--quiet" type="button" id="wipe-cancel">그만두기</button>
                ${(wipeKind === 'items' || wipeKind === 'all') && state.items.length ? '<button class="mini mini--quiet" type="button" id="wipe-save">엑셀로 내려받기</button>' : ''}
                <button class="mini wipe__go" type="button" id="wipe-next">계속</button>
              </div>
            </div>`;
          return;
        }

        wipeBox.innerHTML = `
          <div class="wipe__ask">
            <p class="wipe__head">${esc(spec.title)}</p>
            <label class="field__label" for="wipe-code">확인을 위해 ${online() ? '학교 코드' : '‘삭제’'}를 적어 주세요</label>
            <input class="input wipe__input" id="wipe-code" type="text" autocomplete="off" placeholder="${esc(online() ? '예: A1B2C3' : '삭제')}">
            <p class="field__error" id="wipe-err"></p>
            <div class="wipe__acts">
              <button class="mini mini--quiet" type="button" id="wipe-cancel">그만두기</button>
              <button class="mini wipe__go" type="button" id="wipe-go">${n(spec.count())}${spec.unit} 모두 지우기</button>
            </div>
          </div>`;
        view.querySelector('#wipe-code')?.focus();
      }

      view.addEventListener('click', async (e) => {
        const pick = e.target.closest('[data-wipe]');
        if (pick) { wipeKind = pick.dataset.wipe; wipeStep = 1; drawWipe(); return; }
        if (e.target.closest('#wipe-cancel')) { wipeKind = ''; wipeStep = 1; drawWipe(); return; }
        if (e.target.closest('#wipe-next')) { wipeStep = 2; drawWipe(); return; }
        if (e.target.closest('#wipe-save')) {
          try { await exportLedger(assetsOf(state.items)); }
          catch { flash('내려받지 못했어요', 'warn'); }
          return;
        }
        if (!e.target.closest('#wipe-go')) return;

        const typed = view.querySelector('#wipe-code').value.trim().toUpperCase();
        if (typed !== wipeWord().toUpperCase()) {
          view.querySelector('#wipe-err').textContent = online()
            ? '학교 코드가 달라요. 우리 학교 선생님 카드에서 확인해 주세요.'
            : '‘삭제’라고 적어 주세요.';
          return;
        }
        const spec = WIPES[wipeKind];
        const wasAll = wipeKind === 'all';
        const count = spec.count();
        spec.run();
        wipeKind = ''; wipeStep = 1; chosen.clear();
        flash(spec.done(count));
        if (wasAll) { render(); return; }
        drawWipe();
        update();
        drawSigns();
        drawSpots();
      });

      /* ── 대여 서명 ── */
      function drawSigns() {
        const list = (state.loans || []).filter((l) => l.sign).sort((a, b) => b.outAt.localeCompare(a.outAt));
        view.querySelector('#signs-meta').textContent = list.length ? `${n(list.length)}건` : '';
        view.querySelector('#signs-body').innerHTML = list.length
          ? `<ul class="signlist">${list.map((l) => `
              <li class="signrow">
                <div class="signrow__main">
                  <p class="signrow__name">${esc(l.itemName)}${l.qty > 1 ? ` ${n(l.qty)}개` : ''}</p>
                  <p class="signrow__sub">${esc(l.who)} · ${esc(dateShort(l.outAt.slice(0, 10)))} 빌림${l.returnedAt ? ` · ${esc(dateShort(l.returnedAt.slice(0, 10)))} 반납` : ''}</p>
                </div>
                <img class="signrow__img" src="${esc(l.sign)}" alt="${esc(l.who)} 서명">
              </li>`).join('')}</ul>`
          : '<p class="side-empty">물품을 빌릴 때 받은 서명이 여기에 남아요.</p>';
      }

      /* ── 우리 학교 선생님 ── */
      function drawTeam() {
        const list = view.querySelector('#team-list');
        if (!list) return;
        const pending = members.filter((m2) => m2.status === 'pending');
        const active = members.filter((m2) => m2.status === 'active');
        view.querySelector('#team-meta').textContent = pending.length ? `승인 기다림 ${pending.length}명` : `${active.length}명`;

        const row = (m2) => `
          <li class="mrow ${m2.status === 'pending' ? 'is-pending' : ''}">
            <div>
              <p class="mrow__name">${esc(m2.name || m2.email.split('@')[0])}${m2.position ? ` <span class="mrow__pos">${esc(m2.position)}</span>` : ''}${m2.role === 'admin' ? '<span class="rolechip">관리자</span>' : (m2.can_import ? '<span class="rolechip rolechip--soft">비품 담당</span>' : '')}</p>
              <p class="mrow__mail">${esc(m2.email)}</p>
            </div>
            <div class="mrow__acts">
              ${m2.status === 'pending'
                ? `<button class="mini mini--go" type="button" data-approve="${m2.id}">승인</button>
                   <button class="act act--del" type="button" data-reject="${m2.id}" aria-label="거절">${icon(ICONS.trash)}</button>`
                : m2.user_id === session?.user?.id
                  ? '<span class="mrow__tag">나</span>'
                  : `${m2.role === 'admin'
                        ? `<button class="mini mini--quiet" type="button" data-role="${m2.id}|teacher">관리자 해제</button>`
                        : `<button class="mini mini--quiet" type="button" data-imp="${m2.id}|${m2.can_import ? 'off' : 'on'}">${m2.can_import ? '비품 담당 해제' : '비품 담당'}</button>
                           <button class="mini mini--quiet" type="button" data-role="${m2.id}|admin">관리자로</button>`}
                     <button class="act act--del" type="button" data-remove="${m2.id}" aria-label="내보내기">${icon(ICONS.trash)}</button>`}
            </div>
          </li>`;

        list.innerHTML = members.length
          ? `<ul class="mlist">${[...pending, ...active].map(row).join('')}</ul>`
          : '<p class="side-empty">아직 가입한 선생님이 없어요.</p>';
      }

      view.querySelector('#who-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const next = {
          name: (fd.get('name') || '').trim() || DEFAULT_SCHOOL.name,
          address: (fd.get('address') || '').trim(),
          teacher: (fd.get('teacher') || '').trim(),
          position: fd.get('position') || DEFAULT_SCHOOL.position,
          place: (fd.get('place') || '').trim() || DEFAULT_SCHOOL.place,
          tel: (fd.get('tel') || '').trim(),
        };
        commit({ ...state, school: next });
        view.querySelector('#w-done').textContent = '저장했어요';
        flash('담당 정보를 저장했어요');
        setTimeout(() => { const el = view.querySelector('#w-done'); if (el) el.textContent = ''; }, 2200);
        renderNav('manager');
      });

      view.addEventListener('click', async (e) => {
        // 장소 한꺼번에 옮기기
        if (e.target.closest('#sp-all')) {
          const groups = spotGroups();
          if (chosen.size === groups.length) chosen.clear();
          else groups.forEach((g) => chosen.add(g.key));
          drawSpots();
          return;
        }
        if (e.target.closest('#sp-save')) {
          const b = view.querySelector('#sp-building').value.trim();
          const f = view.querySelector('#sp-floor').value.trim();
          const r = view.querySelector('#sp-room').value.trim();
          if (!b || !f || !r) { flash('건물, 층, 실을 모두 적어 주세요', 'warn'); return; }
          const storage = view.querySelector('#sp-storage').value.trim();
          const shelf = view.querySelector('#sp-shelf').value.trim();
          const ids = new Set(spotGroups().filter((g) => chosen.has(g.key)).flatMap((g) => g.ids));
          commit({
            ...state,
            items: state.items.map((it) => (ids.has(it.id)
              ? { ...it, building: b, floor: f, room: r, storage: storage || it.storage, shelf: shelf || it.shelf, updatedAt: new Date().toISOString() }
              : it)),
          });
          chosen.clear();
          flash(`${n(ids.size)}개를 ${r}(으)로 옮겼어요`);
          drawSpots();
          update();
          return;
        }

        // 구성원 관리
        const ok = e.target.closest('[data-approve]');
        const no = e.target.closest('[data-reject]') || e.target.closest('[data-remove]');
        const rl = e.target.closest('[data-role]');
        const ip = e.target.closest('[data-imp]');
        if (ok) {
          await sb.from('members').update({ status: 'active' }).eq('id', ok.dataset.approve);
        } else if (no) {
          await sb.from('members').delete().eq('id', no.dataset.reject || no.dataset.remove);
        } else if (rl) {
          const [id, role] = rl.dataset.role.split('|');
          await sb.from('members').update({ role }).eq('id', id);
        } else if (ip) {
          const [id, on] = ip.dataset.imp.split('|');
          await sb.from('members').update({ can_import: on === 'on' }).eq('id', id);
        } else if (e.target.closest('#code-copy')) {
          try { await navigator.clipboard.writeText(me.school.join_code); flash('코드를 복사했어요'); }
          catch { flash('복사하지 못했어요', 'warn'); }
          return;
        } else if (e.target.closest('#code-reset')) {
          const { data, error } = await sb.rpc('reset_join_code');
          if (!error) { me.school.join_code = data; view.querySelector('#team-code').textContent = data; flash('새 코드를 만들었어요'); }
          return;
        } else return;

        await loadMembers();
        drawTeam();
      });

      view.refresh = () => { update(); drawSigns(); drawTeam(); drawWipe(); drawSpots(); };
      update();
      drawSigns();
      drawTeam();
      drawWipe();
      drawSpots();
    }

    /* ════════ 등록 (→ src/pages/add.js) ════════ */
    let draft = null;
    const emptyDraft = (keep = {}) => ({
      name: keep.name || '', category: keep.category || '', qty: 1, loanable: keep.loanable ?? true,
      asset: keep.asset ?? false, assetInfo: emptyAsset(),
      building: keep.building || '', floor: keep.floor || '', room: keep.room || '',
      storage: keep.storage || '', shelf: keep.shelf || '', memo: '', photo: '',
    });

    const uniq = (key) => [...new Set(state.items.map((i) => i[key]).filter(Boolean))];

    // 설정한 공간이 있으면 그 층을, 없으면 기본 층을 보여 준다
    function floorChoices(d) {
      const b = spaces().buildings.find((x) => x.name === d.building);
      if (!b) return FLOORS;
      return floorsOf(b).map((v) => ({ value: v, short: v.includes('지하') ? v.replace('지하 ', 'B').replace('층', '') : v.replace('층', '') }));
    }

    function addView(params) {
      const wanted = params.get('id');
      const target = wanted ? state.items.find((i) => i.id === wanted) : null;
      editing = target ? target.id : null;
      backTo = params.get('from') ? decodeURIComponent(params.get('from')) : '#/';
      if (!draft) {
        draft = target
          ? { ...emptyDraft(), ...target, assetInfo: { ...emptyAsset(), ...(target.assetInfo || {}) }, photo: target.photo || '' }
          : emptyDraft({
              name: params.get('name') || '',
              building: params.get('building') || '', floor: params.get('floor') || '', room: params.get('room') || '',
            });
      }
      const d = draft;
      const spaceBuildings = () => [...new Set([...spaces().buildings.map((b) => b.name), ...uniq('building'), ...BUILDING_HINTS])];
      const spaceRooms = (b, f) => [...new Set([
        ...spaces().rooms.filter((r) => (!b || r.building === b) && (!f || !r.floor || r.floor === f)).map((r) => r.name),
        ...uniq('room'),
      ])];
      const opts = (list) => list.map((v) => `<option value="${esc(v)}"></option>`).join('');

      return `
        <header class="top">
          <div>
            <a class="back" href="${esc(backTo)}">${icon(ICONS.back)}${esc(backLabel(backTo))}</a>
            <h1 class="top__title" tabindex="-1">${editing ? '물품 수정' : '물품 등록'}</h1>
          </div>
          ${!editing && canImport() ? `<div class="top__actions">
            <button class="btn btn--ghost" type="button" id="bulk-open">${icon(ICONS.upload)}엑셀로 한꺼번에</button>
          </div>` : ''}
        </header>

        <form class="sheet card" id="add-form" novalidate aria-labelledby="what-title">
          <h2 class="sheet__title" id="what-title">무엇인가요</h2>
          <p class="sheet__desc">선생님들이 부르는 이름 그대로 적어 주세요. <span class="req">*</span> 표시는 꼭 적어야 해요.</p>

          <div class="field">
            <label class="field__label" for="f-name">물품 이름<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            <input class="input" id="f-name" name="name" placeholder="예: 휴대용 빔프로젝터" autocomplete="off" value="${esc(d.name)}" aria-describedby="e-name">
            <p class="field__error" id="e-name"></p>
          </div>

          <fieldset class="field">
            <legend class="field__label">분류 <small>선택</small></legend>
            <div class="choices">
              ${CATEGORIES.map((c) => `<label class="choice"><input type="radio" name="category" value="${esc(c)}" ${d.category === c ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}
            </div>
          </fieldset>

          <div class="row row--qty" style="margin-top:16px">
            <div class="field">
              <label class="field__label" for="f-qty">수량<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
              <div class="stepper">
                <button type="button" data-step="-1" aria-label="하나 빼기" ${d.qty <= 1 ? 'disabled' : ''}>${icon(ICONS.minus)}</button>
                <input id="f-qty" name="qty" type="number" inputmode="numeric" min="1" max="9999" value="${d.qty}" class="num">
                <button type="button" data-step="1" aria-label="하나 더하기">${icon(ICONS.add)}</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="switch">
              <span>대여 가능 여부</span>
              <input type="checkbox" name="loanable" ${d.loanable ? 'checked' : ''}>
              <span class="switch__track" aria-hidden="true"></span>
            </label>
          </div>

          <div class="field">
            <label class="switch">
              <span>비품 여부</span>
              <input type="checkbox" name="asset" id="f-asset" aria-controls="asset-fields" aria-expanded="${d.asset}" ${d.asset ? 'checked' : ''}>
              <span class="switch__track" aria-hidden="true"></span>
            </label>
            <div class="assetbox" id="asset-fields" ${d.asset ? '' : 'hidden'}>
              <p class="assetbox__lead">비품 대장에 적는 내용이에요. 아는 것만 적어도 돼요.</p>
              ${assetFieldsHTML(d)}
            </div>
          </div>

          <div class="field">
            <span class="field__label">사진 <small>선택</small></span>
            <label class="photo" id="photo-box">
              <input type="file" id="f-photo" accept="image/*">
              <span class="photo__icon">${d.photo ? `<img src="${esc(d.photo)}" alt="">` : icon(ICONS.camera)}</span>
              <span class="photo__text">${d.photo ? '사진을 넣었어요<small>눌러서 바꿀 수 있어요</small>' : '보관 위치 사진 추가<small>보관함이나 선반을 찍어 두면 찾기 쉬워요</small>'}</span>
              <span class="photo__busy">사진 넣는 중…</span>
              ${d.photo ? '<button class="photo__remove" type="button" id="photo-remove">빼기</button>' : ''}
            </label>
            <p class="field__error" id="e-photo"></p>
          </div>
        </form>

        <section class="sheet card" aria-labelledby="where-title">
          <h2 class="sheet__title" id="where-title">어디에 있나요</h2>
          <p class="sheet__desc">자세히 입력하면 나중에 쉽게 찾을 수 있어요. <span class="req">*</span> 표시는 꼭 적어야 해요.</p>

          <div class="field">
            <label class="field__label" for="f-building">건물<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            <input class="input" id="f-building" name="building" form="add-form" list="l-building" placeholder="예: 본관" autocomplete="off" value="${esc(d.building)}" aria-describedby="e-building">
            <datalist id="l-building">${opts(spaceBuildings())}</datalist>
            <p class="field__error" id="e-building"></p>
          </div>

          <fieldset class="field">
            <legend class="field__label">층<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></legend>
            <div class="floors" id="floors">
              ${floorChoices(d).map((f) => `<label class="choice"><input type="radio" name="floor" form="add-form" value="${esc(f.value)}" ${d.floor === f.value ? 'checked' : ''} aria-label="${esc(f.value)}"><span>${esc(f.short)}</span></label>`).join('')}
            </div>
            <p class="field__error" id="e-floor"></p>
          </fieldset>

          <div class="field">
            <label class="field__label" for="f-room">실<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            <input class="input" id="f-room" name="room" form="add-form" list="l-room" placeholder="예: 과학 준비실" autocomplete="off" value="${esc(d.room)}" aria-describedby="e-room">
            <datalist id="l-room">${opts(spaceRooms(d.building, d.floor))}</datalist>
            <p class="field__error" id="e-room"></p>
          </div>

          <div class="row" style="margin-top:16px">
            <div class="field">
              <label class="field__label" for="f-storage">보관함 <small>선택</small></label>
              <input class="input" id="f-storage" name="storage" form="add-form" list="l-storage" placeholder="예: 2번 캐비닛" autocomplete="off" value="${esc(d.storage)}">
              <datalist id="l-storage">${opts(uniq('storage'))}</datalist>
            </div>
            <div class="field">
              <label class="field__label" for="f-shelf">칸 <small>선택</small></label>
              <input class="input" id="f-shelf" name="shelf" form="add-form" placeholder="예: 위에서 2칸" autocomplete="off" value="${esc(d.shelf)}">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="f-memo">찾는 분께 한마디 <small>선택</small></label>
            <textarea class="input" id="f-memo" name="memo" form="add-form" placeholder="예: 파란 상자 안에 있어요. 열쇠는 행정실에 있어요.">${esc(d.memo)}</textarea>
          </div>
        </section>

        <aside class="preview" aria-label="안내 미리보기">
          <div id="preview"></div>
          <div class="preview__foot">
            <p class="preview__done" id="preview-done" aria-live="polite"></p>
            <button class="save" type="submit" form="add-form">${editing ? '수정 저장' : '등록하기'}</button>
            ${editing ? `<div class="preview__danger" data-danger></div>` : ''}
          </div>
        </aside>

        ${editing ? `<div class="dangerbar" data-danger></div>` : ''}

        <div class="savebar" id="savebar">
          <div class="savebar__info" aria-live="polite">
            <p class="savebar__name" id="sb-name"></p>
            <p class="savebar__path" id="sb-path"></p>
          </div>
          <button class="btn btn--solid" type="submit" form="add-form">${editing ? '수정 저장' : '등록하기'}</button>
        </div>`;
    }

    function assetFieldsHTML(d) {
      const a = d.assetInfo || emptyAsset();
      const one = (f) => {
        const id = `a-${f.key}`;
        const common = `id="${id}" name="a_${f.key}" form="add-form" value="${esc(a[f.key])}"` +
          (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '') +
          (f.inputmode ? ` inputmode="${f.inputmode}"` : '') +
          ' autocomplete="off"';
        const control = f.area
          ? `<textarea class="input" id="${id}" name="a_${f.key}" form="add-form" placeholder="${esc(f.placeholder)}">${esc(a[f.key])}</textarea>`
          : f.unit
            ? `<span class="suffix"><input class="input num" type="text" ${common}><span class="suffix__unit">${esc(f.unit)}</span></span>`
            : `<input class="input${f.type === 'date' ? '' : ''}" type="${f.type || 'text'}" ${common}>`;
        return `<div class="field"><label class="field__label" for="${id}">${esc(f.label)}</label>${control}</div>`;
      };
      // 짧은 칸 두 개씩 나란히, 긴 칸은 한 줄로
      const out = [];
      for (let i = 0; i < ASSET_FIELDS.length; i++) {
        const f = ASSET_FIELDS[i];
        if (f.wide) { out.push(one(f)); continue; }
        const next = ASSET_FIELDS[i + 1];
        if (next && !next.wide) { out.push(`<div class="row">${one(f)}${one(next)}</div>`); i++; }
        else out.push(one(f));
      }
      return out.join('');
    }

    let editing = null;   // 수정 중인 물품 id
    let backTo = '#/';    // 마치고 돌아갈 화면
    const backLabel = (href) => (
      href.startsWith('#/search') ? '찾기'
      : href.startsWith('#/places') ? '장소별 보기'
      : href.startsWith('#/ledger') ? '비품 대장'
      : '홈');

    let lastSaved = '';

    function renderPreview(view) {
      const d = draft;
      const steps = PATH_KINDS.map((k) => ({ ...k, value: d[k.key] }));
      const lastSet = Math.max(-1, ...steps.map((s, i) => (s.value ? i : -1)));
      view.querySelector('#preview').innerHTML = `
        <p class="preview__label">이렇게 안내돼요</p>
        <p class="preview__name ${d.name ? '' : 'is-empty'}">${esc(d.name || '물품 이름')}</p>
        <p class="preview__qty num">${n(d.qty || 1)}개${d.category ? ` · ${esc(d.category)}` : ''}${d.asset ? ' · 비품' : ''}${d.loanable ? '' : ' · 대여 불가'}</p>
        <ol class="path">
          ${steps.map((s, i) => `
            <li class="path__step ${s.value ? 'is-set' : ''} ${i === lastSet ? 'is-last' : ''}">
              <span class="path__dot" aria-hidden="true"></span>
              <span><span class="path__kind">${esc(s.label)}</span><br><span class="path__value">${esc(s.value || '아직 비어 있어요')}</span></span>
            </li>`).join('')}
        </ol>
        ${d.memo ? `<p class="preview__memo">${esc(d.memo)}</p>` : ''}
        ${d.photo ? `<img class="preview__photo" src="${esc(d.photo)}" alt="보관 위치 사진">` : ''}`;
      const doneBox = view.querySelector('#preview-done');
      doneBox.innerHTML = lastSaved ? `${icon(ICONS.check)}<span>${esc(lastSaved)}</span>` : '';

      const path = pathOf(d);
      view.querySelector('#sb-name').textContent = d.name || '물품 이름을 적어 주세요';
      const sbPath = view.querySelector('#sb-path');
      const done = Boolean(lastSaved && !d.name);
      sbPath.textContent = done ? lastSaved : (path.length ? path.join(' › ') : '위치를 적으면 여기에 경로가 보여요');
      sbPath.classList.toggle('is-done', done);

      const dangerHTML = pendingDelete === editing
        ? `<div class="dconfirm">
             <p class="dconfirm__q">정말 지울까요?</p>
             <div class="dconfirm__row">
               <button class="dconfirm__yes" type="button" data-del-yes="${editing}">지우기</button>
               <button class="dconfirm__no" type="button" data-del-cancel>그만두기</button>
             </div>
           </div>`
        : `<button class="danger" type="button" data-del="${editing}">${icon(ICONS.trash)}이 물품 지우기</button>`;
      for (const slot of view.querySelectorAll('[data-danger]')) slot.innerHTML = dangerHTML;
    }

    function readForm(form) {
      const fd = new FormData(form);
      return {
        ...draft,
        name: (fd.get('name') || '').trim(),
        category: fd.get('category') || '',
        qty: Math.min(9999, Math.max(1, parseInt(fd.get('qty'), 10) || 1)),
        loanable: fd.get('loanable') === 'on',
        asset: fd.get('asset') === 'on',
        assetInfo: Object.fromEntries(ASSET_FIELDS.map((f) => [f.key, (fd.get('a_' + f.key) || '').trim()])),
        building: (fd.get('building') || '').trim(),
        floor: fd.get('floor') || '',
        room: (fd.get('room') || '').trim(),
        storage: (fd.get('storage') || '').trim(),
        shelf: (fd.get('shelf') || '').trim(),
        memo: (fd.get('memo') || '').trim(),
      };
    }

    const RULES = [
      { key: 'name',     msg: '물품 이름을 적어 주세요', focus: '#f-name' },
      { key: 'building', msg: '건물을 적어 주세요',       focus: '#f-building' },
      { key: 'floor',    msg: '층을 골라 주세요',         focus: '#floors input' },
      { key: 'room',     msg: '실 이름을 적어 주세요',    focus: '#f-room' },
    ];

    function showErrors(view, errors) {
      for (const r of RULES) {
        const has = errors.includes(r.key);
        view.querySelector(`#e-${r.key}`).textContent = has ? r.msg : '';
        if (r.key === 'floor') view.querySelector('#floors').classList.toggle('is-invalid', has);
        else view.querySelector(r.focus).setAttribute('aria-invalid', has ? 'true' : 'false');
      }
    }

    // 사진은 긴 변 640px JPEG로 줄여서 저장 공간을 아낀다.
    function shrinkPhoto(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 640 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
        img.src = url;
      });
    }

    function mountAdd(view) {
      view.querySelector('#bulk-open')?.addEventListener('click', () => {
        openItemImport((count) => { draft = null; render(); flash(`${n(count)}개를 등록했어요`); });
      });

      const form = view.querySelector('#add-form');
      let tried = false;

      const assetBox = view.querySelector('#asset-fields');
      const assetSwitch = view.querySelector('#f-asset');

      let shownFloors = '';
      const sync = () => {
        draft = readForm(form);
        // 건물을 바꾸면 그 건물의 층으로 갈아 끼운다
        const list = floorChoices(draft);
        const key = list.map((f) => f.value).join('|');
        if (key !== shownFloors) {
          shownFloors = key;
          view.querySelector('#floors').innerHTML = list.map((f) => `
            <label class="choice"><input type="radio" name="floor" form="add-form" value="${esc(f.value)}" ${draft.floor === f.value ? 'checked' : ''} aria-label="${esc(f.value)}"><span>${esc(f.short)}</span></label>`).join('');
        }
        assetBox.hidden = !draft.asset;
        assetSwitch.setAttribute('aria-expanded', String(draft.asset));
        // 비품명을 비워 두면 물품 이름을 그대로 쓴다고 알려 준다
        const nm = draft.name;
      view.querySelector('#a-name').placeholder = nm
        ? `비우면 ‘${nm}’${josa(nm, '으로/로').slice(nm.length)} 적어요`
        : '대장에 적힌 이름';
        view.querySelector('[data-step="-1"]').disabled = draft.qty <= 1;
        if (tried) showErrors(view, RULES.filter((r) => !draft[r.key]).map((r) => r.key));
        if (draft.name) lastSaved = '';
        renderPreview(view);
      };

      // 단가는 치는 동안 세 자리마다 쉼표를 넣는다
      view.querySelector('#a-price').addEventListener('input', (e) => {
        const digits = e.target.value.replace(/[^\d]/g, '').slice(0, 12);
        e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      });

      view.addEventListener('input', sync);
      view.addEventListener('change', sync);

      view.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
        const input = view.querySelector('#f-qty');
        input.value = Math.min(9999, Math.max(1, (parseInt(input.value, 10) || 1) + Number(b.dataset.step)));
        sync();
      }));

      view.querySelector('#f-photo').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const box = view.querySelector('#photo-box');
        const err = view.querySelector('#e-photo');
        err.textContent = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          err.textContent = '사진 파일만 넣을 수 있어요.';
          return;
        }
        box.classList.add('is-busy');
        try {
          const photo = await shrinkPhoto(file);
          // await 뒤에는 draft가 다른 객체로 바뀌어 있을 수 있으니, 그때 다시 읽어서 넣는다
          draft = { ...draft, photo };
          render();
        } catch {
          box.classList.remove('is-busy');
          err.textContent = '이 사진은 열 수 없어요. 다른 사진을 골라 주세요.';
        }
      });
      const remove = view.querySelector('#photo-remove');
      if (remove) remove.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation(); // 라벨을 눌러 파일 창이 열리지 않게
        draft = { ...draft, photo: '' };
        render();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        tried = true;
        draft = readForm(form);
        const errors = RULES.filter((r) => !draft[r.key]).map((r) => r.key);
        showErrors(view, errors);
        if (errors.length) {
          view.querySelector(RULES.find((r) => r.key === errors[0]).focus).focus();
          return;
        }

        const old = editing ? state.items.find((i) => i.id === editing) : null;
        const item = {
          ...draft,
          id: old ? old.id : newId(),
          createdAt: old ? old.createdAt : new Date().toISOString(),
          ...(old ? { updatedAt: new Date().toISOString() } : {}),
        };
        if (!item.photo) delete item.photo;
        if (item.asset) {
          item.assetInfo = { ...item.assetInfo, name: item.assetInfo.name || item.name };
        } else {
          delete item.assetInfo;
        }

        try {
          commit({
            ...state,
            items: old ? state.items.map((i) => (i.id === old.id ? item : i)) : [...state.items, item],
          });
        } catch {
          view.querySelector('#e-photo').textContent = '저장 공간이 부족해요. 사진을 빼고 다시 저장해 주세요.';
          return;
        }

        if (old) {
          flash(`‘${item.name}’ 수정했어요`);
          draft = null; editing = null;
          location.hash = backTo;   // 왔던 화면으로 돌아간다
          return;
        }

        lastSaved = `‘${item.name}’ 등록했어요`;
        flash(`‘${item.name}’ 등록했어요`);
        draft = emptyDraft({ ...item, name: '' }); // 위치·분류·비품 여부는 남기고 나머지는 비운다
        render();
        document.getElementById('f-name').focus({ preventScroll: true });
      });

      renderPreview(view);
    }

    /* ════════ 화면 전환 ════════ */
    const ROUTES = {
      '#/':       { key: 'home', view: homeView,   mount: mountHome,   title: '학교 물품 어디 있지?' },
      '#/search': { key: 'find', view: searchView, mount: mountSearch, title: '찾기 · 학교 물품 어디 있지?' },
      '#/places': { key: 'place', view: placesView, mount: mountPlaces, title: '장소별 보기 · 학교 물품 어디 있지?' },
      '#/rent':   { key: 'rent', view: rentView,  mount: mountRent, title: '대여 · 학교 물품 어디 있지?' },
      '#/lend':   { key: 'rent', view: lendView,  mount: mountLend, title: '빌리기 · 학교 물품 어디 있지?' },
      '#/ledger': { key: 'ledger', view: ledgerView, mount: mountLedger, title: '비품 대장 · 학교 물품 어디 있지?' },
      '#/handover': { key: 'handover', view: handoverView, mount: mountHandover, title: '인수인계 · 학교 물품 어디 있지?' },
      '#/manager': { key: 'manager', view: managerView, mount: mountManager, title: '관리 담당 선생님 · 학교 물품 어디 있지?' },
      '#/add':    { key: 'add',  view: addView,    mount: mountAdd,    title: '물품 등록 · 학교 물품 어디 있지?' },
    };
    const parseHash = () => {
      const [path, qs = ''] = (location.hash || '#/').split('?');
      return { path, params: new URLSearchParams(qs) };
    };

    // 로그인·학교 상태에 따라 앱 대신 안내 화면을 보여 준다
    function gateKind() {
      if (bootError) return 'error';
      if (!online()) return null;              // 혼자 쓰기 모드
      if (!session) return 'login';
      if (!me) return gateMode === 'create' ? 'create' : 'start';
      if (me.status !== 'active') return 'pending';
      return null;
    }

    function render(focus = false) {
      const gate = gateKind();
      const app = document.getElementById('app');
      const gateRoot = document.getElementById('gate');
      app.hidden = Boolean(gate);
      gateRoot.hidden = !gate;
      if (gate) {
        gateRoot.className = 'gate';
        gateRoot.innerHTML = gateView(gate);
        mountGate(gateRoot, gate);
        document.title = '학교 물품 어디 있지?';
        return;
      }

      const { path, params } = parseHash();
      const route = ROUTES[path] || ROUTES['#/'];
      // 화면을 새 요소로 갈아 끼운다. 지난 화면에 걸어 둔 이벤트가 남지 않게.
      const old = document.getElementById('view');
      const view = old.cloneNode(false);
      old.replaceWith(view);
      if (route.key === 'manager' && !isAdmin()) { location.hash = '#/'; return; }
      if (route.key === 'handover' && !canImport()) { location.hash = '#/'; return; }
      view.className = 'main is-' + route.key + (path === '#/lend' ? ' is-add' : '');
      document.body.classList.toggle('is-add', route.key === 'add' || path === '#/lend');
      document.body.classList.toggle('is-room', route.key === 'place' && state.items.length > 0);
      view.innerHTML = route.view(params);
      route.mount(view, params);
      // 수정 중에는 왼쪽 메뉴의 '등록'을 켜 두지 않는다
      renderNav(route.key === 'add' && editing ? '' : route.key);
      document.title = route.title;
      if (focus) {
        view.scrollTop = 0; window.scrollTo(0, 0);
        const fine = matchMedia('(pointer: fine)').matches;
        let target = view.querySelector('.top__title');
        if (fine && route.key === 'add') target = view.querySelector('#f-name');
        // 검색어 없이 들어오면 바로 입력하게, 검색어를 들고 오면 결과를 먼저 보게
        if (route.key === 'find' && (fine || !params.get('q'))) target = view.querySelector('#s-q');
        target.focus({ preventScroll: true });
        if (target.id === 's-q') target.setSelectionRange(target.value.length, target.value.length);
      }
    }

    window.addEventListener('hashchange', () => {
      draft = null; lastSaved = ''; pendingDelete = null; askFix = null;
      if (!location.hash.startsWith('#/lend')) lend = null;
      render(true);
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="spaces"]')) { openSpaces(); return; }

      // 수정하기
      const edit = e.target.closest('[data-edit]');
      if (edit) {
        pendingDelete = null;
        location.hash = `#/add?id=${encodeURIComponent(edit.dataset.edit)}&from=${encodeURIComponent(location.hash || '#/')}`;
        return;
      }
      // 지우기: 한 번 더 물어본다
      const del = e.target.closest('[data-del]');
      if (del) { pendingDelete = del.dataset.del; refreshView(); return; }
      if (e.target.closest('[data-del-cancel]')) { pendingDelete = null; refreshView(); return; }
      const yes = e.target.closest('[data-del-yes]');
      if (yes) {
        const id = yes.dataset.delYes;
        const gone = state.items.find((i) => i.id === id);
        commit({ ...state, items: state.items.filter((i) => i.id !== id) });
        pendingDelete = null;
        flash(gone ? `‘${gone.name}’ 지웠어요` : '지웠어요');
        if (editing === id) { draft = null; editing = null; location.hash = backTo; }
        else refreshView();
        return;
      }

      // 반납: 먼저 수리가 필요한지 묻는다
      const ret = e.target.closest('[data-return]');
      if (ret) { askFix = ret.dataset.return; refreshView(); return; }
      if (e.target.closest('[data-fixcancel]')) { askFix = null; refreshView(); return; }

      const fix = e.target.closest('[data-fix]') || e.target.closest('[data-nofix]');
      if (fix) {
        const needFix = Boolean(fix.dataset.fix);
        const id = fix.dataset.fix || fix.dataset.nofix;
        const loan = (state.loans || []).find((l) => l.id === id);
        const next = {
          ...state,
          loans: state.loans.map((l) => (l.id === id ? { ...l, returnedAt: new Date().toISOString() } : l)),
          items: needFix && loan
            ? state.items.map((it) => (it.id === loan.itemId ? { ...it, repair: true, updatedAt: new Date().toISOString() } : it))
            : state.items,
        };
        commit(next);
        askFix = null;
        flash(needFix
          ? `${loan ? loan.itemName : '물품'} 반납했어요. 수리 필요로 표시했어요`
          : `${loan ? loan.itemName : '물품'} 반납 처리했어요`);
        refreshView();
        return;
      }

      // 찾았어요
      const found = e.target.closest('[data-found]');
      if (found) {
        const id = found.dataset.found;
        const it = state.items.find((x) => x.id === id);
        commit({ ...state, items: state.items.map((x) => (x.id === id ? { ...x, lost: false, updatedAt: new Date().toISOString() } : x)) });
        flash(`${it ? it.name : '물품'} 찾음으로 바꿨어요`);
        refreshView();
        return;
      }

      // 고쳤어요
      const fixed = e.target.closest('[data-fixed]');
      if (fixed) {
        const id = fixed.dataset.fixed;
        const it = state.items.find((x) => x.id === id);
        commit({ ...state, items: state.items.map((x) => (x.id === id ? { ...x, repair: false, updatedAt: new Date().toISOString() } : x)) });
        flash(`${it ? it.name : '물품'} 수리 표시를 풀었어요`);
        refreshView();
        return;
      }
      const ldel = e.target.closest('[data-loan-del]');
      if (ldel) { pendingDelete = ldel.dataset.loanDel; refreshView(); return; }
      const lyes = e.target.closest('[data-loan-del-yes]');
      if (lyes) {
        commit({ ...state, loans: state.loans.filter((l) => l.id !== lyes.dataset.loanDelYes) });
        pendingDelete = null;
        flash('기록을 지웠어요');
        refreshView();
        return;
      }

      if (e.target.closest('[data-soon]')) {
        const view = document.getElementById('view');
        if (view.notify) view.notify('이 기능은 다음 단계에서 연결돼요');
      }
    });

    // 어디서든 / 를 누르면 검색창으로
    document.addEventListener('keydown', (e) => {
      if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      const box = document.getElementById('s-q') || document.getElementById('q');
      if (box) box.focus(); else location.hash = '#/search';
    });

    async function boot() {
      try {
        await initSupabase();
        await loadMe();
        await loadData();
      } catch (e) {
        console.error(e);
        bootError = String(e?.message || e);
      }
      render();
    }
    boot();
  </script>
</body>
</html>
