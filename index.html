    // 같은 이름·같은 자리에 있는 물품은 한 줄로 묶는다
    let openGroups = new Set();
    function groupHits(list) {
      const groups = new Map();
      for (const r of list) {
        const it = r.item;
        const key = [it.name, it.category, it.building, it.floor, it.room, it.storage, it.shelf].join('|');
        const g = groups.get(key);
        if (g) { g.rows.push(r); g.qty += it.qty; }
        else groups.set(key, { key, head: r, rows: [r], qty: it.qty });
      }
      return [...groups.values()];
    }

    function hitHTML(r) {
      const it = r.item;
      const m = r.marks;
      const steps = PATH_KINDS.filter((k) => it[k.key]);
      const path = steps.map((k, i) => {
        const inner = highlight(it[k.key], m[k.key]);
        return i === steps.length - 1
          ? `<span class="hit__end">${icon(ICONS.place)}${inner}</span>`
          : `<span>${inner}</span>`;
      }).join('');
      const memo = it.memo && (m.memo || r.why === FIELD_WHY.memo) ? `<p class="hit__memo">${highlight(it.memo, m.memo)}</p>` : (it.memo ? `<p class="hit__memo">${esc(it.memo)}</p>` : '');
      const tags = [
        it.category ? `<span class="tag">${highlight(it.category, m.category)}</span>` : '',
        it.asset ? '<span class="tag tag--asset">비품</span>' : '',
        it.disused ? '<span class="tag tag--no">불용</span>' : '',
        it.repair ? '<span class="tag tag--fix">수리 필요</span>' : '',
        it.lost ? '<span class="tag tag--no">찾는 중</span>' : '',
        it.loanable ? '' : '<span class="tag tag--no">대여 불가</span>',
        r.why && r.why !== FIELD_WHY.memo ? `<span class="hit__why">${esc(r.why)}</span>` : '',
      ].filter(Boolean).join('');
      return `
        <li class="hit ${it.photo ? 'has-photo' : ''}">
          <div class="hit__main">
            <div class="hit__head">
              <p class="hit__name">${highlight(it.name, m.name)}</p>
              ${rowActions(it.id)}
            </div>
            <p class="hit__path" aria-label="위치: ${esc(pathOf(it).join(', ') || '미지정')}">${path || '<span class="hit__none">장소 미지정</span>'}</p>
            ${memo}
            ${tags ? `<p class="hit__meta">${tags}</p>` : ''}
          </div>
          ${it.photo ? `<img class="hit__photo" src="${esc(it.photo)}" alt="${esc(it.name)} 보관 위치 사진" loading="lazy" decoding="async">` : ''}
          <span class="hit__qty num">${n(it.qty)}개</span>
        </li>`;
    }

    function groupHTML(g) {
      if (g.rows.length === 1) return hitHTML(g.head);
      const it = g.head.item;
      const m = g.head.marks;
      const steps = PATH_KINDS.filter((k) => it[k.key]);
      const path = steps.length
        ? steps.map((k, i) => {
            const inner = highlight(it[k.key], m[k.key]);
            return i === steps.length - 1 ? `<span class="hit__end">${icon(ICONS.place)}${inner}</span>` : `<span>${inner}</span>`;
          }).join('')
        : '<span class="hit__none">장소 미지정</span>';
      const open = openGroups.has(g.key);
      return `
        <li class="hit">
          <div class="hit__main">
            <div class="hit__head">
              <p class="hit__name">${highlight(it.name, m.name)}</p>
              <span class="hit__count num">${n(g.qty)}개</span>
            </div>
            <p class="hit__path">${path}</p>
            <p class="hit__meta">
              ${it.category ? `<span class="tag">${highlight(it.category, m.category)}</span>` : ''}
              ${it.asset ? '<span class="tag tag--asset">비품</span>' : ''}
              <button class="hit__each" type="button" data-group="${esc(g.key)}">${open ? '접기' : '하나씩 보기'}</button>
            </p>
            ${open ? `<ul class="hit__kids">${g.rows.slice(0, 60).map((r2) => `
              <li class="kid">
                <span class="kid__no">${esc(r2.item.assetInfo?.no || r2.item.name)}</span>
                ${rowActions(r2.item.id)}
                <span class="kid__sub">${esc([r2.item.assetInfo?.dept, r2.item.assetInfo?.date].filter(Boolean).join(' · '))}${r2.item.disused ? ' · 불용' : ''}</span>
              </li>`).join('')}${g.rows.length > 60 ? `<li class="imp__more num">그 밖에 ${n(g.rows.length - 60)}개</li>` : ''}</ul>` : ''}
          </div>
        </li>`;
    }

    function mountSearch(view, params) {
      const input = view.querySelector('#s-q');
      const clear = view.querySelector('#s-clear');
      const body = view.querySelector('#s-results');
      const filtersEl = view.querySelector('#s-filters');
      const title = view.querySelector('#r-title');
      const meta = view.querySelector('#r-meta');
      const live = view.querySelector('#r-live');
      const filter = { category: '', loanable: false };
      let saveTimer, liveTimer;

      function renderSide() {
        const list = view.querySelector('#recent-list');
        view.querySelector('#recent-clear').innerHTML = state.recent.length ? '<button class="linkish" type="button" data-recent-clear>모두 지우기</button>' : '';
        list.innerHTML = state.recent.length
          ? `<ul class="recent">${state.recent.map((r) => `
              <li>
                <button class="recent__go" type="button" data-q="${esc(r)}">${icon(ICONS.clock)}<span>${esc(r)}</span></button>
                <button class="recent__x" type="button" data-recent-remove="${esc(r)}" aria-label="${esc(r)} 지우기">${icon(ICONS.close)}</button>
              </li>`).join('')}</ul>`
          : '<p class="side-empty">찾아본 말이 여기에 남아요.</p>';
      }

      function update() {
        const q = input.value.trim();
        clear.hidden = !input.value;
        const url = '#/search' + (q ? '?q=' + encodeURIComponent(q) : '');
        if (location.hash !== url) history.replaceState(null, '', url);

        const all = state.items;
        if (!all.length) {
          filtersEl.innerHTML = '';
          title.textContent = '찾기';
          meta.textContent = '';
          body.innerHTML = `
            <div class="nohit">
              <strong>아직 등록된 물품이 없어요</strong>
              <span>물품을 등록하면 이름, 장소, 초성으로 찾을 수 있어요.</span>
              <div class="nohit__actions">
                <a class="btn btn--solid" href="#/add">물품 등록</a>
              </div>
            </div>`;
          return;
        }

        // 검색어가 없으면 목록을 그리지 않는다. 물품이 많으면 그리는 데만 한참 걸린다.
        if (!q) {
          filtersEl.innerHTML = '';
          title.textContent = '찾기';
          meta.textContent = `${n(all.length)}가지 등록됨`;
          const recent = state.recent.slice(0, 6);
          body.innerHTML = `
            <div class="nohit">
              <strong>무엇을 찾으세요?</strong>
              <span>물품 이름이나 장소를 적어 주세요.<br>초성만 넣어도 찾아요.</span>
              ${recent.length ? `<div class="nohit__guess">
                <span class="nohit__guess-label">최근 찾은 말</span>
                ${recent.map((r) => `<button class="pchip" type="button" data-q="${esc(r)}">${esc(r)}</button>`).join('')}
              </div>` : ''}
              <div class="nohit__actions">
                <a class="btn btn--ghost" href="#/places">장소별로 보기</a>
                <a class="btn btn--ghost" href="#/ledger">비품 대장 보기</a>
              </div>
            </div>`;
          announce('');
          return;
        }

        const matched = searchItems(all, q);

        // 분류 칩은 지금 찾은 것 기준으로 센다
        const counts = new Map();
        for (const r of matched) if (r.item.category) counts.set(r.item.category, (counts.get(r.item.category) || 0) + 1);
        if (filter.category && !counts.has(filter.category)) filter.category = '';
        const cats = CATEGORIES.filter((c) => counts.has(c));
        filtersEl.innerHTML = `
          <button class="fchip" type="button" data-cat="" aria-pressed="${!filter.category}">전체 <b class="num">${matched.length}</b></button>
          ${cats.map((c) => `<button class="fchip" type="button" data-cat="${esc(c)}" aria-pressed="${filter.category === c}">${esc(c)} <b class="num">${counts.get(c)}</b></button>`).join('')}
          <button class="fchip fchip--toggle" type="button" data-loanable aria-pressed="${filter.loanable}">${filter.loanable ? icon(ICONS.check) : ''}대여 가능한 것만</button>`;

        const shown = matched.filter((r) =>
          (!filter.category || r.item.category === filter.category) &&
          (!filter.loanable || r.item.loanable));

        if (q && !matched.length) {
          title.textContent = '찾은 물품';
          meta.textContent = '0개';
          const g = guesses(all, q);
          const said = josa(q, '은/는').slice(q.length);
          body.innerHTML = `
            <div class="nohit">
              <strong>‘${esc(q)}’${esc(said)} 아직 없어요</strong>
              <span>앞 글자만 넣거나, 장소 이름으로 찾아보세요.</span>
              ${g.length ? `<div class="nohit__guess"><span class="nohit__guess-label">혹시 이걸 찾으세요?</span>${g.map((x) => `<button class="pchip" type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>` : ''}
              <div class="nohit__actions">
                <a class="btn btn--solid" href="#/add?name=${encodeURIComponent(q)}">‘${esc(q)}’${esc(josa(q, '으로/로').slice(q.length))} 등록하기</a>
              </div>
            </div>`;
          announce(`${josa(q, '은/는')} 찾지 못했어요`);
          return;
        }

        const groups = groupHits(shown);
        title.textContent = '찾은 물품';
        meta.textContent = `${n(shown.length)}개${groups.length < shown.length ? ` · ${n(groups.length)}가지` : ''}`;
        body.innerHTML = (shown.length
          ? `<ul class="hits" id="s-list">${groups.slice(0, 60).map(groupHTML).join('')}</ul>${groups.length > 60 ? `<p class="imp__more num">그 밖에 ${n(groups.length - 60)}가지 더 있어요. 검색어를 더 적어 주세요.</p>` : ''}`
          : `<div class="nohit"><strong>조건에 맞는 물품이 없어요</strong><span>위에서 고른 조건을 풀어 보세요.</span></div>`);
        announce(q ? `${shown.length}개 찾았어요` : '');

        // 잠깐 멈추면 최근 검색에 남긴다
        clearTimeout(saveTimer);
        if (q && shown.length) saveTimer = setTimeout(() => { addRecent(q); renderSide(); }, 1500);
      }

      function announce(msg) {
        clearTimeout(liveTimer);
        liveTimer = setTimeout(() => { live.textContent = msg; }, 400);
      }

      const setQuery = (q, focus = true) => {
        input.value = q;
        update();
        addRecent(q); renderSide();
        if (focus) input.focus();
        body.scrollTop = 0;
      };

      input.addEventListener('input', update);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && input.value) { e.preventDefault(); input.value = ''; update(); }
      });
      view.querySelector('#s-form').addEventListener('submit', (e) => {
        e.preventDefault();
        addRecent(input.value); renderSide();
        input.blur(); // 모바일에서 키보드를 내려 결과가 보이게
      });
      clear.addEventListener('click', () => { input.value = ''; update(); input.focus(); });

      view.addEventListener('click', (e) => {
        const qBtn = e.target.closest('[data-q]');
        if (qBtn) { setQuery(qBtn.dataset.q, matchMedia('(pointer: fine)').matches); return; }
        const grp = e.target.closest('[data-group]');
        if (grp) {
          const k = grp.dataset.group;
          openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k);
          update();
          return;
        }
        const cat = e.target.closest('[data-cat]');
        if (cat) { filter.category = cat.dataset.cat; update(); return; }
        if (e.target.closest('[data-loanable]')) { filter.loanable = !filter.loanable; update(); return; }
        const rm = e.target.closest('[data-recent-remove]');
        if (rm) { commit({ ...state, recent: state.recent.filter((r) => r !== rm.dataset.recentRemove) }); renderSide(); update(); return; }
        if (e.target.closest('[data-recent-clear]')) { commit({ ...state, recent: [] }); renderSide(); update(); }
      });

      view.refresh = () => { renderSide(); update(); };
      renderSide();
      update();
    }

    /* ════════ 장소별 보기 (→ src/pages/places.js) ════════ */
    const FLOOR_ORDER = FLOORS.map((f) => f.value);
    const floorRank = (v) => {
      const i = FLOOR_ORDER.indexOf(v);
      return i >= 0 ? i : FLOOR_ORDER.length + (v || '').length;
    };
    // 자리가 안 적힌 물품도 '장소 미지정'으로 모아 보여 준다. 안 그러면 어디에도 안 보인다.
    const UNSET_B = '장소 미지정';
    const placeOf = (i) => (i.building && i.room
      ? { building: i.building, floor: i.floor, room: i.room }
      : { building: UNSET_B, floor: '미정', room: (i.assetInfo?.place || i.room || '어디인지 몰라요') });
    const roomKey = (i) => { const p = placeOf(i); return [p.building, p.floor, p.room].join('|'); };

    // 건물 → 층 → 실 순으로 묶는다.
    function groupPlaces(items) {
      const buildings = new Map();
      for (const it of items) {
        const p = placeOf(it);
        const b = buildings.get(p.building) || { name: p.building, count: 0, rooms: 0, floors: new Map(), unset: p.building === UNSET_B };
        const f = b.floors.get(p.floor) || { name: p.floor, rooms: new Map() };
        const r = f.rooms.get(p.room) || { name: p.room, key: roomKey(it), building: p.building, floor: p.floor, count: 0, kinds: 0 };
        r.count += it.qty; r.kinds += 1;
        b.count += it.qty;
        f.rooms.set(p.room, r); b.floors.set(p.floor, f); buildings.set(p.building, b);
      }
      // 학교 공간 설정에서 정한 건물·층·실은 물품이 없어도 자리를 깔아 둔다
      const sp = spaces();
      const ensure = (bName, fName) => {
        const b = buildings.get(bName) || { name: bName, count: 0, rooms: 0, floors: new Map(), unset: false, configured: true };
        b.configured = true;
        const f = b.floors.get(fName) || { name: fName, rooms: new Map() };
        b.floors.set(fName, f); buildings.set(bName, b);
        return f;
      };
      for (const cb of sp.buildings) {
        for (const fName of floorsOf(cb)) ensure(cb.name, fName);
      }
      for (const cr of sp.rooms) {
        const fName = cr.floor || '미정';
        const f = ensure(cr.building, fName);
        if (!f.rooms.has(cr.name)) {
          f.rooms.set(cr.name, {
            name: cr.name, key: [cr.building, fName, cr.name].join('|'),
            building: cr.building, floor: fName, count: 0, kinds: 0, empty: true,
          });
        }
      }

      for (const b of buildings.values()) {
        b.rooms = [...b.floors.values()].reduce((a, f) => a + f.rooms.size, 0);
        b.floorList = [...b.floors.values()]
          .map((f) => ({ ...f, roomList: [...f.rooms.values()].sort((x, y) => y.count - x.count || x.name.localeCompare(y.name, 'ko')) }))
          .sort((x, y) => floorRank(y.name) - floorRank(x.name)); // 위층이 위로
      }
      const order = new Map(sp.buildings.map((b, i) => [b.name, i]));
      return [...buildings.values()].sort((a, b) => {
        if (a.unset !== b.unset) return a.unset ? 1 : -1;
        const ia = order.has(a.name) ? order.get(a.name) : 99;
        const ib = order.has(b.name) ? order.get(b.name) : 99;
        if (ia !== ib) return ia - ib;
        return b.count - a.count || a.name.localeCompare(b.name, 'ko');
      });
    }

    // 칸 이름을 위에서 아래로 읽히게 정렬한다. 알아볼 수 없으면 등록한 순서를 따른다.
    function shelfRank(name) {
      if (!name) return 999;
      const t = name.replace(/\s/g, '');
      if (/^맨위|^제일위|^최상/.test(t)) return 0;
      if (/^맨아래|^제일아래|^최하|^바닥/.test(t)) return 900;
      if (/가운데|중간/.test(t)) return 500;
      const num = t.match(/(\d+)/);
      if (num) return 10 + Number(num[1]);
      const words = ['첫', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉'];
      const wi = words.findIndex((w) => t.startsWith(w));
      if (wi >= 0) return 11 + wi;
      return 800;
    }

    // 한 실 안에서 보관함 → 칸 순으로 묶는다.
    function groupRoom(items) {
      const units = new Map();
      for (const it of items) {
        const uName = it.storage || '';
        const u = units.get(uName) || { name: uName, count: 0, shelves: new Map() };
        const sName = it.shelf || '';
        const s = u.shelves.get(sName) || { name: sName, list: [], seen: u.shelves.size };
        s.list.push(it); u.count += it.qty;
        u.shelves.set(sName, s); units.set(uName, u);
      }
      return [...units.values()]
        .map((u) => ({ ...u, shelfList: [...u.shelves.values()].sort((a, b) => shelfRank(a.name) - shelfRank(b.name) || a.seen - b.seen) }))
        .sort((a, b) => (a.name ? 0 : 1) - (b.name ? 0 : 1) || b.count - a.count);
    }

    function placesView(params) {
      const items = state.items;
      const buildings = groupPlaces(items);
      const placed = items.length > 0 || hasSpaces();
      const want = params.get('room');
      const current = want && items.some((i) => roomKey(i) === want) ? want
        : (buildings[0]?.floorList.flatMap((f) => f.roomList)[0]?.key || '');
      const [curB] = current ? current.split('|') : [''];
      const building = buildings.find((b) => b.name === (params.get('b') || curB)) || buildings[0];

      return `
        <header class="top">
          <div>
            <a class="back" href="#/">${icon(ICONS.back)}홈</a>
            <h1 class="top__title" tabindex="-1">장소별 보기</h1>
          </div>
          <div class="top__actions">
            <a class="btn btn--ghost" href="#/search">${icon(ICONS.find)}이름으로 찾기</a>
          </div>
        </header>

        ${placed ? `
          <section class="card bld" aria-labelledby="bld-title">
            <div class="card__head">
              <h2 class="card__title" id="bld-title">건물과 층</h2>
            </div>
            <div class="bld__tabs" role="group" aria-label="건물 고르기">
              ${buildings.map((b) => `
                <button class="bld__tab" type="button" data-bld="${esc(b.name)}" aria-pressed="${b === building}">${esc(b.name)}</button>`).join('')}
            </div>
            <div class="stack" id="stack"></div>
          </section>

          <section class="card roomview" id="roomview" aria-live="polite"></section>

          <div class="placebar" id="placebar"></div>`
        : `
          <section class="card" style="grid-column:1/-1">
            <div class="nohit">
              <strong>${items.length ? '보관 자리가 정해진 물품이 없어요' : '아직 등록된 장소가 없어요'}</strong>
              <span>${items.length
                ? '관리 담당 화면의 ‘장소 미지정 비품’에서<br>건물과 층, 실을 정하면 여기에 쌓여요.'
                : '물품을 등록하면 건물과 층, 실이 여기에 자동으로 쌓여요.'}</span>
              <div class="nohit__actions">
                ${items.length ? '<a class="btn btn--solid" href="#/manager">장소 정하러 가기</a>' : '<a class="btn btn--solid" href="#/add">물품 등록</a>'}
              </div>
            </div>
          </section>`}`;
    }

    function mountPlaces(view, params) {
      const items = state.items;
      if (!items.length && !hasSpaces()) return;

      const buildings = groupPlaces(items);
      const stack = view.querySelector('#stack');
      const roomview = view.querySelector('#roomview');
      const placebar = view.querySelector('#placebar');
      let building = buildings[0];
      let current = '';

      function renderStack() {
        // 물품이 있는 층만 그리되, 사이에 빈 층이 있으면 자리를 비워 둔다
        const have = building.floorList;
        const top = floorRank(have[0].name);
        const bottom = floorRank(have[have.length - 1].name);
        const rows = [];
        for (let r = top; r >= bottom; r--) {
          const name = FLOOR_ORDER[r];
          const found = have.find((f) => f.name === name);
          rows.push(found || { name: name || '', roomList: [], void: true });
        }
        // FLOORS 목록에 없는 층 이름(예: 옥상)은 그대로 이어 붙인다
        for (const f of have) if (!rows.includes(f)) rows.unshift(f);

        stack.innerHTML = rows.map((f) => {
          // '3층'은 그대로, '지하 1층'은 '지하'로 짧게
          const short = f.name === '미정' ? '미정' : (f.name.includes('지하') ? '지하' : (FLOORS.find((x) => x.value === f.name)?.value ?? f.name));
          return `
          <div class="floor ${f.void ? 'floor--void' : ''}">
            <div class="floor__no">${esc(short)}</div>
            <div class="floor__rooms">
              ${f.roomList.length ? f.roomList.map((r) => `
                <button class="room" type="button" data-room="${esc(r.key)}" aria-current="${r.key === current}">${esc(r.name)}</button>`).join('')
              : '<span class="floor__none">정한 실이 없어요</span>'}
            </div>
          </div>`;
        }).join('');
      }

      function renderRoom() {
        const list = items.filter((i) => roomKey(i) === current);
        const [b, f, r] = (current || '||').split('|');
        if (!list.length) {
          roomview.innerHTML = current ? `
            <div class="roomview__head">
              <div>
                <p class="roomview__crumb"><span>${esc(b)}</span><span>${esc(f)}</span></p>
                <h2 class="roomview__name">${esc(r)}</h2>
                <p class="roomview__sum">아직 등록된 물품이 없어요</p>
              </div>
            </div>
            <div class="nohit">
              <strong>${esc(r)}에 둔 물품을 등록해 보세요</strong>
              <span>건물·층·실이 미리 채워진 채로 등록 화면이 열려요.</span>
              <div class="nohit__actions">
                <a class="btn btn--solid" href="#/add?building=${encodeURIComponent(b)}&floor=${encodeURIComponent(f === '미정' ? '' : f)}&room=${encodeURIComponent(r)}">${icon(ICONS.add)}여기에 등록</a>
              </div>
            </div>` : `
            <div class="nohit">
              <strong>이 건물에는 아직 정한 실이 없어요</strong>
              <span>학교 공간 설정하기에서 층별로 실을 담으면 여기에 보여요.</span>
              <div class="nohit__actions">
                <button class="btn btn--solid" type="button" data-action="spaces">학교 공간 설정하기</button>
              </div>
            </div>`;
          return;
        }
        const count = list.reduce((a, i) => a + i.qty, 0);
        const units = groupRoom(list);

        roomview.innerHTML = `
          <div class="roomview__head">
            <div>
              <p class="roomview__crumb"><span>${esc(b)}</span><span>${esc(f)}</span></p>
              <h2 class="roomview__name">${esc(r)}</h2>
              <p class="roomview__sum num">물품 ${n(list.length)}가지 · 모두 ${n(count)}개</p>
            </div>
            ${b === UNSET_B ? `<a class="btn btn--ghost" href="#/manager">${icon(ICONS.place)}자리 정하러 가기</a>` : `<a class="btn btn--ghost" href="#/add?building=${encodeURIComponent(b)}&floor=${encodeURIComponent(f)}&room=${encodeURIComponent(r)}">${icon(ICONS.add)}여기에 등록</a>`}
          </div>
          <div class="units">
            ${units.map((u) => `
              <section>
                <h3 class="unit__name">${icon(ICONS.place)}${u.name ? esc(u.name) : '따로 보관함 없이'}<small class="num">${n(u.count)}개</small></h3>
                ${u.shelfList.map((s) => `
                  <div class="shelf">
                    ${s.name ? `<p class="shelf__label">${esc(s.name)}</p>` : ''}
                    ${s.list.map((it) => `
                      <div class="thing">
                        <p class="thing__name">${esc(it.name)}</p>
                        <span class="thing__qty num">${n(it.qty)}개</span>
                        ${it.memo ? `<p class="thing__memo">${esc(it.memo)}</p>` : ''}
                        <p class="thing__meta">
                          ${it.category ? `<span class="tag">${esc(it.category)}</span>` : ''}
                          ${it.asset ? '<span class="tag tag--asset">비품</span>' : ''}
                          ${it.repair ? '<span class="tag tag--fix">수리 필요</span>' : ''}
                          ${it.loanable ? '' : '<span class="tag tag--no">대여 불가</span>'}
                          ${rowActions(it.id)}
                        </p>
                      </div>`).join('')}
                  </div>`).join('')}
              </section>`).join('')}
          </div>`;

        placebar.innerHTML = `
          <div class="placebar__info">
            <p class="placebar__name">${esc(r)}</p>
            <p class="placebar__sum num">${esc(b)} ${esc(f)} · 모두 ${n(count)}개</p>
          </div>
          ${b === UNSET_B ? `<a class="btn btn--solid" href="#/manager">자리 정하러 가기</a>` : `<a class="btn btn--solid" href="#/add?building=${encodeURIComponent(b)}&floor=${encodeURIComponent(f)}&room=${encodeURIComponent(r)}">여기에 등록</a>`}`;
      }

      function select(key, scroll = false) {
        current = key;
        const url = '#/places?room=' + encodeURIComponent(key);
        if (location.hash !== url) history.replaceState(null, '', url);
        renderStack(); renderRoom();
        if (scroll && matchMedia('(max-width: 1180px)').matches) {
          roomview.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        }
      }

      const want = params.get('room');
      const found = want && items.some((i) => roomKey(i) === want) ? want : '';
      if (found) building = buildings.find((b) => b.name === found.split('|')[0]) || building;
      const firstKey = (b) => b.floorList.flatMap((f) => f.roomList)[0]?.key || '';
      select(found || firstKey(building));

      view.addEventListener('click', (e) => {
        const bTab = e.target.closest('[data-bld]');
        if (bTab) {
          building = buildings.find((b) => b.name === bTab.dataset.bld);
          view.querySelectorAll('[data-bld]').forEach((t) => t.setAttribute('aria-pressed', t === bTab));
          select(firstKey(building));
          return;
        }
        const room = e.target.closest('[data-room]');
        if (room) select(room.dataset.room, true);
      });

      view.refresh = () => render();
    }

    /* ════════ 대여 (→ src/pages/rent.js) ════════ */
    const DAY = 86400000;
    const ymd = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const today = () => ymd(new Date());
    const plusDays = (days) => ymd(new Date(Date.now() + days * DAY));
    const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / DAY);
    const dateShort = (v) => (v ? `${Number(v.slice(5, 7))}월 ${Number(v.slice(8, 10))}일` : '');
    // 반납한 때는 몇 시 몇 분까지 남긴다
    const clock = (iso) => {
      const d = new Date(iso);
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    };
    const whenBack = (iso) => (iso ? `${dateShort(ymd(new Date(iso)))} ${clock(iso)}` : '');

    const activeLoans = () => (state.loans || []).filter((l) => !l.returnedAt);
    const doneLoans = () => (state.loans || []).filter((l) => l.returnedAt);

    // 지금 빌릴 수 있는 개수 = 가진 개수 - 나가 있는 개수
    function leftOf(item) {
      const out = activeLoans().filter((l) => l.itemId === item.id).reduce((a, l) => a + l.qty, 0);
      return Math.max(0, item.qty - out);
    }

    // 몇 교시까지 빌리는지
    const periodText = (l) => (!l.period ? '' : (l.period === 'etc' ? (l.periodNote || '기타') : `${l.period}교시`));

    // 반납일로 상태를 정한다
    function dueState(loan) {
      if (loan.returnedAt) return { key: 'back', label: `${whenBack(loan.returnedAt)} 반납` };
      const diff = daysBetween(today(), loan.dueAt);
      const pt = periodText(loan);
      if (diff < 0) return { key: 'late', label: `${-diff}일 늦음` };
      if (diff === 0) return { key: 'today', label: pt ? `오늘 ${pt}까지` : '오늘 반납' };
      return { key: 'soon', label: pt ? `${dateShort(loan.dueAt)} ${pt}까지` : `${dateShort(loan.dueAt)}까지` };
    }
    const PILL = { late: 'pill--late', today: 'pill--today', soon: '', back: '' };
    const ORDER = { late: 0, today: 1, soon: 2, back: 3 };

    // 반납을 누르면 바로 처리하지 않고 수리가 필요한지 한 번 묻는다
    let askFix = null;   // 물어보는 중인 대여 id

    function returnControl(l, small = false) {
      const cls = small ? 'mini' : 'back-btn';
      if (askFix !== l.id) {
        return `<button class="${cls} ${small ? 'mini--back' : ''}" type="button" data-return="${l.id}">반납하기</button>`;
      }
      return `<span class="askfix">
        <span class="askfix__q">혹시 수리가 필요한가요?</span>
        <button class="mini askfix__yes" type="button" data-fix="${l.id}">예</button>
        <button class="mini mini--back" type="button" data-nofix="${l.id}">아니요</button>
        <button class="askfix__cancel" type="button" data-fixcancel>그만두기</button>
      </span>`;
    }

    const sortLoans = (list) => list.slice().sort((a, b) => {
      const x = dueState(a), y = dueState(b);
      return ORDER[x.key] - ORDER[y.key] || (a.dueAt || '').localeCompare(b.dueAt || '') || a.outAt.localeCompare(b.outAt);
    });

    // 기록을 지우는 건 적은 사람과 관리자만
    const canDropLoan = (l) => !online() || isAdmin() || (l.by && l.by === session?.user?.id);

    function loanRow(loan) {
      const st = dueState(loan);
      const gone = !state.items.some((i) => i.id === loan.itemId);
      return `
        <li class="rrow ${st.key === 'late' ? 'is-late' : ''} ${loan.returnedAt ? 'is-back' : ''}">
          <div class="rrow__head">
            <p class="rrow__name">${gone ? `<s>${esc(loan.itemName)}</s>` : esc(loan.itemName)}${loan.qty > 1 ? ` <span class="num">${n(loan.qty)}개</span>` : ''}</p>
            <span class="pill ${PILL[st.key]}">${esc(st.label)}</span>
          </div>
          <p class="rrow__who">${esc(loan.who)}</p>
          <p class="rrow__where">${esc(loan.path)}${gone ? ' · 지워진 물품' : ''}</p>
          ${loan.memo ? `<p class="rrow__memo">${esc(loan.memo)}</p>` : ''}
          <div class="rrow__acts">
            ${pendingDelete === loan.id
              ? `<span class="confirm">기록을 지울까요?
                   <button class="confirm__yes" type="button" data-loan-del-yes="${loan.id}">지우기</button>
                   <button class="confirm__no" type="button" data-del-cancel>그만두기</button>
                 </span>`
              : `${askFix === loan.id || !canDropLoan(loan) ? '' : `<button class="act act--del" type="button" data-loan-del="${loan.id}" aria-label="기록 지우기">${icon(ICONS.trash)}<span class="act__label">기록 지우기</span></button>`}
                 ${loan.returnedAt ? '' : returnControl(loan)}`}
          </div>
        </li>`;
    }

    function rentView(params) {
      const active = activeLoans();
      const late = active.filter((l) => dueState(l).key === 'late').length;
      const dueToday = active.filter((l) => dueState(l).key === 'today').length;
      const canLend = state.items.some((i) => i.loanable && leftOf(i) > 0);

      return `
        <header class="top">
          <div>
            <a class="back" href="#/">${icon(ICONS.back)}홈</a>
            <h1 class="top__title" tabindex="-1">대여</h1>
          </div>
          <div class="top__actions">
            <a class="btn btn--solid" href="#/lend">${icon(ICONS.rent)}빌리기</a>
          </div>
        </header>

        <section class="card rsum" aria-label="대여 요약">
          <div class="rsum__fig">
            <span class="rsum__label">대여 물품</span>
            <span class="rsum__value num">${n(active.length)}<small>건</small></span>
          </div>
          <div class="rsum__fig ${dueToday ? 'is-today' : ''}">
            <span class="rsum__label">오늘 반납</span>
            <span class="rsum__value num">${n(dueToday)}<small>건</small></span>
          </div>
          <div class="rsum__fig ${late ? 'is-late' : ''}">
            <span class="rsum__label">늦음</span>
            <span class="rsum__value num">${n(late)}<small>건</small></span>
          </div>
        </section>

        <section class="card rlist" aria-labelledby="r-title">
          <div class="card__head">
            <h2 class="card__title" id="r-title">대여 현황</h2>
            <span class="card__meta">${canLend ? '' : '빌릴 수 있는 물품이 없어요'}</span>
          </div>
          <div class="tabs" role="tablist" id="r-tabs"></div>
          <div id="r-body" aria-live="polite"></div>
        </section>`;
    }

    function mountRent(view, params) {
      let tab = params.get('tab') === 'done' ? 'done' : 'out';
      const tabs = view.querySelector('#r-tabs');
      const body = view.querySelector('#r-body');

      function update() {
        const out = sortLoans(activeLoans());
        const done = sortLoans(doneLoans()).reverse();
        tabs.innerHTML = `
          <button class="tab" type="button" role="tab" data-tab="out" aria-selected="${tab === 'out'}">대여 물품<b class="num">${out.length}</b></button>
          <button class="tab" type="button" role="tab" data-tab="done" aria-selected="${tab === 'done'}">반납 완료<b class="num">${done.length}</b></button>`;

        const list = tab === 'out' ? out : done;
        if (!list.length) {
          body.innerHTML = tab === 'out'
            ? `<div class="nohit">
                 <strong>대여 중인 물품이 없어요</strong>
                 <span>물품을 빌리면 반납일과 함께 여기에 쌓여요.</span>
                 <div class="nohit__actions"><a class="btn btn--solid" href="#/lend">빌리기</a></div>
               </div>`
            : `<div class="nohit"><strong>반납 기록이 아직 없어요</strong><span>반납한 물품이 여기에 남아요.</span></div>`;
          return;
        }
        body.innerHTML = `<ul class="rrows">${list.map(loanRow).join('')}</ul>`;
      }

      view.addEventListener('click', (e) => {
        const t = e.target.closest('[data-tab]');
        if (t) { tab = t.dataset.tab; pendingDelete = null; update(); }
      });

      view.refresh = update;
      update();
    }

    /* ── 빌리기 ── */
    let lend = null;
    const emptyLend = () => ({
      itemId: '', qty: 1, dueAt: plusDays(1), period: '', periodNote: '', memo: '', q: '', cat: '',
      whoType: 'staff', staffName: writerName(), grade: '', classNo: '', studentName: '',
    });

    // 빌리는 분을 한 줄로 만든다. 학생은 학년·반까지 붙여 동명이인을 가린다.
    function whoText(d) {
      if (d.whoType === 'student') {
        const bits = [d.grade && `${d.grade}학년`, d.classNo && `${d.classNo}반`, d.studentName].filter(Boolean);
        return bits.join(' ');
      }
      return d.staffName;
    }
    const PERIODS = ['1', '2', '3', '4', '5', '6', '7', '8'];
    const WHENS = [{ d: 0, label: '오늘' }, { d: 1, label: '내일' }, { d: 3, label: '3일 뒤' }, { d: 7, label: '일주일 뒤' }];

    function lendView() {
      lend = lend || emptyLend();
      const d = lend;
      const chosen = state.items.find((i) => i.id === d.itemId);
      const left = chosen ? leftOf(chosen) : 0;

      return `
        <header class="top">
          <div>
            <a class="back" href="#/rent">${icon(ICONS.back)}대여</a>
            <h1 class="top__title" tabindex="-1">빌리기</h1>
          </div>
        </header>

        <form class="sheet card" id="lend-form" novalidate aria-labelledby="lend-what">
          <h2 class="sheet__title" id="lend-what">무엇을 빌리나요</h2>
          <p class="sheet__desc">대여 가능으로 등록된 물품만 고를 수 있어요.</p>

          ${chosen ? `
            <div class="chosen">
              <p class="chosen__name">${esc(chosen.name)}</p>
              <button class="chosen__change" type="button" id="l-change">바꾸기</button>
              <p class="chosen__where">${esc(pathOf(chosen).join(' › '))}</p>
              <p class="chosen__left num">지금 빌릴 수 있는 수량 ${n(left)}개</p>
            </div>

            <div class="field" style="margin-top:16px">
              <label class="field__label" for="l-qty">빌리는 수량<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
              <div class="stepper">
                <button type="button" data-lstep="-1" aria-label="하나 빼기" ${d.qty <= 1 ? 'disabled' : ''}>${icon(ICONS.minus)}</button>
                <input id="l-qty" name="qty" type="number" inputmode="numeric" min="1" max="${left}" value="${d.qty}" class="num">
                <button type="button" data-lstep="1" aria-label="하나 더하기" ${d.qty >= left ? 'disabled' : ''}>${icon(ICONS.add)}</button>
              </div>
              <p class="field__error" id="e-qty"></p>
            </div>`
          : `
            <div class="pick">
              <div class="cats" id="l-cats" role="group" aria-label="분류로 고르기"></div>
              <div class="lfind">
                ${icon(ICONS.find)}
                <input id="l-q" type="search" value="${esc(d.q)}" placeholder="물품 이름이나 장소" autocomplete="off" aria-label="빌릴 물품 찾기">
              </div>
              <div id="l-results"></div>
            </div>
            <p class="field__error" id="e-item"></p>`}
        </form>

        <section class="sheet card" aria-labelledby="lend-who">
          <h2 class="sheet__title" id="lend-who">누가, 언제까지</h2>
          <p class="sheet__desc">반납일이 지나면 대여 현황에서 빨갛게 보여요. <span class="req">*</span> 표시는 꼭 적어야 해요.</p>

          <fieldset class="field">
            <legend class="field__label">빌리는 분<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></legend>
            <div class="whotabs" role="group" aria-label="누가 빌리나요">
              <button class="whotab" type="button" data-whotype="staff" aria-pressed="${d.whoType !== 'student'}">${icon(ICONS.manager)}교직원</button>
              <button class="whotab" type="button" data-whotype="student" aria-pressed="${d.whoType === 'student'}">${icon(ICONS.student)}학생</button>
            </div>

            <div class="whobox" ${d.whoType === 'student' ? 'hidden' : ''} id="who-staff">
              <input class="input" id="l-staff" name="staffName" form="lend-form" list="l-staff-list" placeholder="예: 김하늘" autocomplete="off" value="${esc(d.staffName)}" aria-label="교직원 이름">
              <datalist id="l-staff-list">${[...new Set((state.loans || []).filter((l) => l.whoType !== 'student').map((l) => l.who))].map((w) => `<option value="${esc(w)}"></option>`).join('')}</datalist>
            </div>

            <div class="whobox" ${d.whoType === 'student' ? '' : 'hidden'} id="who-student">
              <div class="whoclass">
                <span class="whonum">
                  <input class="input num" id="l-grade" name="grade" form="lend-form" type="number" inputmode="numeric" min="1" max="9" placeholder="0" value="${esc(d.grade)}" aria-label="학년">
                  <span class="whonum__unit">학년</span>
                </span>
                <span class="whonum">
                  <input class="input num" id="l-class" name="classNo" form="lend-form" type="number" inputmode="numeric" min="1" max="99" placeholder="0" value="${esc(d.classNo)}" aria-label="반">
                  <span class="whonum__unit">반</span>
                </span>
                <input class="input" id="l-sname" name="studentName" form="lend-form" placeholder="이름" autocomplete="off" value="${esc(d.studentName)}" aria-label="학생 이름">
              </div>
            </div>
            <p class="field__error" id="e-who"></p>
          </fieldset>

          <div class="field">
            <label class="field__label" for="l-due">반납 예정일<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            <div class="whens" id="l-whens">
              ${WHENS.map((w) => `<button class="when" type="button" data-when="${w.d}" aria-pressed="${d.dueAt === plusDays(w.d)}">${esc(w.label)}</button>`).join('')}
            </div>
            <input class="input" id="l-due" name="dueAt" type="date" form="lend-form" value="${esc(d.dueAt)}" min="${today()}" aria-describedby="e-due">
            <p class="field__error" id="e-due"></p>
          </div>

          <div class="field">
            <label class="field__label" for="l-period">반납 교시 <small>선택</small></label>
            <div class="selectbox">
              <select class="input" id="l-period" name="period" form="lend-form">
                <option value="" ${d.period ? '' : 'selected'}>정하지 않음</option>
                ${PERIODS.map((v) => `<option value="${v}" ${d.period === v ? 'selected' : ''}>${v}교시까지</option>`).join('')}
                <option value="etc" ${d.period === 'etc' ? 'selected' : ''}>기타 (직접 적기)</option>
              </select>
              ${icon(ICONS.caret, 'icon selectbox__caret')}
            </div>
            <div class="periodnote" ${d.period === 'etc' ? '' : 'hidden'} id="l-periodnote">
              <input class="input" id="l-pnote" name="periodNote" form="lend-form" placeholder="예: 점심시간, 방과 후" autocomplete="off" value="${esc(d.periodNote)}" aria-label="반납 시점 직접 적기">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="l-memo">메모 <small>선택</small></label>
            <textarea class="input" id="l-memo" name="memo" form="lend-form" placeholder="예: 체육대회 때 쓰고 바로 돌려주기로 했어요.">${esc(d.memo)}</textarea>
          </div>
        </section>

        <aside class="preview" aria-label="대여 미리보기">
          <div id="l-preview"></div>
          <div class="preview__foot">
            <button class="save" type="submit" form="lend-form">서명하고 빌리기</button>
          </div>
        </aside>

        <div class="savebar" id="savebar">
          <div class="savebar__info" aria-live="polite">
            <p class="savebar__name" id="lb-name"></p>
            <p class="savebar__path" id="lb-due"></p>
          </div>
          <button class="btn btn--solid" type="submit" form="lend-form">서명</button>
        </div>`;
    }

    function mountLend(view) {
      const form = view.querySelector('#lend-form');
      let tried = false;

      // 분류 칩: 지금 빌릴 수 있는 것이 있는 분류만 보여 준다
      function renderCats() {
        const box = view.querySelector('#l-cats');
        if (!box) return;
        const pool = state.items.filter((i) => i.loanable && leftOf(i) > 0);
        const counts = new Map();
        for (const i of pool) if (i.category) counts.set(i.category, (counts.get(i.category) || 0) + 1);
        const cats = CATEGORIES.filter((c) => counts.has(c));
        if (lend.cat && !counts.has(lend.cat)) lend.cat = '';
        box.innerHTML = cats.length < 2 ? '' : `
          <button class="cat" type="button" data-cat="" aria-pressed="${!lend.cat}">전체</button>
          ${cats.map((c) => `<button class="cat" type="button" data-cat="${esc(c)}" aria-pressed="${lend.cat === c}">${esc(c)}<b class="num">${counts.get(c)}</b></button>`).join('')}`;
      }

      function renderResults() {
        const box = view.querySelector('#l-results');
        if (!box) return;
        const pool = state.items.filter((i) => i.loanable && (!lend.cat || i.category === lend.cat));
        if (!pool.length) {
          box.innerHTML = `<p class="pick__none">대여 가능으로 등록된 물품이 없어요. 물품을 등록할 때 ‘대여 가능 여부’를 켜 주세요.</p>`;
          return;
        }
        const q = lend.q.trim();
        const found = (q ? searchItems(pool, q).map((r) => r.item) : pool.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt))).slice(0, 10);
        if (!found.length) {
          box.innerHTML = `<p class="pick__none">${q ? `‘${esc(q)}’${esc(josa(q, '은/는').slice(q.length))} 찾지 못했어요.` : `${esc(lend.cat)}에는 빌릴 수 있는 물품이 없어요.`}</p>`;
          return;
        }
        box.innerHTML = `<ul class="pick__results">${found.map((it) => {
          const left = leftOf(it);
          return `<li>
            <button class="pickrow" type="button" data-pick="${it.id}" ${left ? '' : 'disabled'}>
              <span class="pickrow__name">${esc(it.name)}</span>
              <span class="pickrow__left num ${left ? '' : 'is-none'}">${left ? `${n(left)}개 가능` : '모두 나감'}</span>
              <span class="pickrow__where">${esc(pathOf(it).join(' › '))}</span>
            </button>
          </li>`;
        }).join('')}</ul>`;
      }

      function readLend() {
        const fd = new FormData(form);
        const chosen = state.items.find((i) => i.id === lend.itemId);
        const max = chosen ? leftOf(chosen) : 1;
        return {
          ...lend,
          qty: Math.min(Math.max(1, parseInt(fd.get('qty'), 10) || 1), Math.max(1, max)),
          staffName: (fd.get('staffName') || '').trim(),
          grade: (fd.get('grade') || '').trim(),
          classNo: (fd.get('classNo') || '').trim(),
          studentName: (fd.get('studentName') || '').trim(),
          dueAt: fd.get('dueAt') || '',
          period: fd.get('period') || '',
          periodNote: (fd.get('periodNote') || '').trim(),
          memo: (fd.get('memo') || '').trim(),
        };
      }

      function renderPreview() {
        const d = lend;
        const chosen = state.items.find((i) => i.id === d.itemId);
        const line = (k, v) => `<span class="preview__k">${k}</span><span class="preview__v ${v ? '' : 'is-empty'}">${esc(v || '아직 비어 있어요')}</span>`;
        view.querySelector('#l-preview').innerHTML = `
          <p class="preview__label">이렇게 기록돼요</p>
          <p class="preview__name ${chosen ? '' : 'is-empty'}">${esc(chosen ? chosen.name : '빌릴 물품')}</p>
          <p class="preview__qty num">${n(d.qty)}개</p>
          <div class="preview__line">
            ${line('빌리는 분', whoText(d))}
            ${line('반납일', d.dueAt ? `${dateShort(d.dueAt)}${periodText(d) ? ` ${periodText(d)}` : ''} (${daysBetween(today(), d.dueAt)}일 뒤)` : '')}
            ${line('있던 곳', chosen ? pathOf(chosen).join(' › ') : '')}
          </div>
          ${d.memo ? `<p class="preview__memo">${esc(d.memo)}</p>` : ''}
          <p class="preview__sign">빌리기를 누르면 서명 화면이 열려요.</p>`;

        view.querySelector('#lb-name').textContent = chosen ? `${chosen.name} ${d.qty}개` : '빌릴 물품을 고르세요';
        view.querySelector('#lb-due').textContent = whoText(d)
          ? `${whoText(d)} · ${d.dueAt ? `${dateShort(d.dueAt)}${periodText(d) ? ` ${periodText(d)}` : ''}까지` : '반납일을 정하세요'}`
          : '빌리는 분을 적어 주세요';
      }

      const problems = () => {
        const chosen = state.items.find((i) => i.id === lend.itemId);
        const out = [];
        if (!chosen) out.push(['item', '빌릴 물품을 골라 주세요']);
        else if (lend.qty > leftOf(chosen)) out.push(['qty', `지금은 ${leftOf(chosen)}개까지 빌릴 수 있어요`]);
        if (lend.whoType === 'student') {
          if (!lend.grade || !lend.classNo || !lend.studentName) out.push(['who', '학년, 반, 이름을 모두 적어 주세요']);
        } else if (!lend.staffName) {
          out.push(['who', '빌리는 분 이름을 적어 주세요']);
        }
        if (!lend.dueAt) out.push(['due', '반납 예정일을 정해 주세요']);
        else if (daysBetween(today(), lend.dueAt) < 0) out.push(['due', '오늘보다 이전 날짜는 고를 수 없어요']);
        return out;
      };

      function showProblems(list) {
        for (const key of ['item', 'qty', 'who', 'due']) {
          const el = view.querySelector('#e-' + key);
          if (el) el.textContent = (list.find(([k]) => k === key) || [, ''])[1];
        }
      }

      const sync = () => {
        lend = readLend();
        const chosen = state.items.find((i) => i.id === lend.itemId);
        const minus = view.querySelector('[data-lstep="-1"]');
        if (minus) {
          minus.disabled = lend.qty <= 1;
          view.querySelector('[data-lstep="1"]').disabled = !chosen || lend.qty >= leftOf(chosen);
        }
        for (const w of view.querySelectorAll('[data-when]')) {
          w.setAttribute('aria-pressed', String(lend.dueAt === plusDays(Number(w.dataset.when))));
        }
        const note = view.querySelector('#l-periodnote');
        if (note) note.hidden = lend.period !== 'etc';
        if (tried) showProblems(problems());
        renderPreview();
      };

      view.addEventListener('input', sync);
      view.addEventListener('change', sync);

      view.querySelector('#l-period').addEventListener('change', (e) => {
        if (e.target.value === 'etc') view.querySelector('#l-pnote')?.focus();
      });

      const qBox = view.querySelector('#l-q');
      if (qBox) qBox.addEventListener('input', () => { lend.q = qBox.value; renderResults(); });

      view.addEventListener('click', (e) => {
        const pick = e.target.closest('[data-pick]');
        if (pick) { lend = { ...readLend(), itemId: pick.dataset.pick, qty: 1 }; render(); return; }
        if (e.target.closest('#l-change')) { lend = { ...readLend(), itemId: '', qty: 1 }; render(); return; }
        const step = e.target.closest('[data-lstep]');
        if (step) {
          const input = view.querySelector('#l-qty');
          input.value = Math.max(1, (parseInt(input.value, 10) || 1) + Number(step.dataset.lstep));
          sync();
          return;
        }
        const when = e.target.closest('[data-when]');
        if (when) { view.querySelector('#l-due').value = plusDays(Number(when.dataset.when)); sync(); return; }
        const wt = e.target.closest('[data-whotype]');
        if (wt) {
          lend = { ...readLend(), whoType: wt.dataset.whotype };
          for (const b of view.querySelectorAll('[data-whotype]')) {
            b.setAttribute('aria-pressed', String(b.dataset.whotype === lend.whoType));
          }
          view.querySelector('#who-staff').hidden = lend.whoType === 'student';
          view.querySelector('#who-student').hidden = lend.whoType !== 'student';
          view.querySelector(lend.whoType === 'student' ? '#l-grade' : '#l-staff').focus();
          sync();
          return;
        }
        const cat = e.target.closest('[data-cat]');
        if (cat) { lend = { ...readLend(), cat: cat.dataset.cat }; renderCats(); renderResults(); return; }

      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        tried = true;
        lend = readLend();
        const list = problems();
        showProblems(list);
        if (list.length) {
          const first = { item: '#l-q', qty: '#l-qty',
            who: lend.whoType === 'student' ? '#l-grade' : '#l-staff', due: '#l-due' }[list[0][0]];
          view.querySelector(first)?.focus();
          return;
        }
        // 마지막으로 빌리는 분의 서명을 받는다
        const chosenItem = state.items.find((i) => i.id === lend.itemId);
        const dueText = `${dateShort(lend.dueAt)}${periodText(lend) ? ` ${periodText(lend)}` : ''}까지`;
        askSign(
          `${whoText(lend)} 님, 여기에 서명해 주세요`,
          `${chosenItem.name} ${n(lend.qty)}개 · ${dueText} · ${pathOf(chosenItem).join(' › ')}`,
          (sign) => {
          const item = state.items.find((i) => i.id === lend.itemId);
          const loan = {
            id: 'lon_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            itemId: item.id, itemName: item.name, path: pathOf(item).join(' › '),
            qty: lend.qty, who: whoText(lend), whoType: lend.whoType, dueAt: lend.dueAt,
          by: session?.user?.id || '',
            period: lend.period, periodNote: lend.period === 'etc' ? lend.periodNote : '',
            memo: lend.memo, sign,
            outAt: new Date().toISOString(), returnedAt: null,
          };
          try {
            commit({ ...state, loans: [...(state.loans || []), loan] });
          } catch {
            return '저장 공간이 부족해요. 사진이 많은 물품을 정리해 주세요.';
          }
          flash(`${loan.itemName} ${n(loan.qty)}개 대여했어요`);
          lend = null;
          location.hash = '#/rent';
          return null;
        });
      });

      renderCats();
      renderResults();
      renderPreview();
    }

    // ── 서명 받기 (대여·인수인계에서 함께 쓴다) ──
    function askSign(title, desc, onDone) {
      const back = document.createElement('div');
      back.className = 'signback';
      back.innerHTML = `
        <div class="signbox" role="dialog" aria-modal="true" aria-labelledby="sign-title">
          <p class="signbox__title" id="sign-title">${esc(title)}</p>
          <p class="signbox__desc">${esc(desc)}</p>
          <div class="signpad" id="sign-pad">
            <canvas></canvas>
            <span class="signpad__line" aria-hidden="true"></span>
            <span class="signpad__hint">손가락이나 마우스로 이름을 써 주세요</span>
          </div>
          <p class="signbox__err" id="sign-err" aria-live="polite"></p>
          <div class="signacts">
            <button class="signacts__btn" type="button" id="sign-clear">다시 쓰기</button>
            <button class="signacts__btn" type="button" id="sign-cancel">취소</button>
            <button class="signacts__btn signacts__btn--go" type="button" id="sign-ok">서명 완료</button>
          </div>
        </div>`;
      document.body.append(back);

      const pad = back.querySelector('#sign-pad');
      const canvas = pad.querySelector('canvas');
      const err = back.querySelector('#sign-err');
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.strokeStyle = '#121831';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let drawing = false, drawn = false;
      let pts = [];
      let width = 2.4;

      const at = (e) => {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top, t: e.timeStamp || performance.now() };
      };
      const mid = (a2, b2) => ({ x: (a2.x + b2.x) / 2, y: (a2.y + b2.y) / 2 });

      // 빠르게 그으면 가늘게, 천천히 그으면 굵게. 실제 펜처럼 보이게 한다.
      function widthFor(a2, b2) {
        const dist = Math.hypot(b2.x - a2.x, b2.y - a2.y);
        const dt = Math.max(1, b2.t - a2.t);
        const target = Math.max(1.1, 3.2 - (dist / dt) * 2.4);
        width = width * 0.7 + target * 0.3;
        return width;
      }

      function drawSegment() {
        const nPts = pts.length;
        if (nPts < 3) return;
        const p0 = pts[nPts - 3], p1 = pts[nPts - 2], p2 = pts[nPts - 1];
        ctx.lineWidth = widthFor(p1, p2);
        ctx.beginPath();
        ctx.moveTo(mid(p0, p1).x, mid(p0, p1).y);
        ctx.quadraticCurveTo(p1.x, p1.y, mid(p1, p2).x, mid(p1, p2).y);
        ctx.stroke();
      }

      function addPoint(p) {
        pts.push(p);
        if (pts.length === 2) {
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        } else {
          drawSegment();
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        drawing = true;
        width = 2.4;
        const p = at(e);
        pts = [p];
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.2, 0, Math.PI * 2);
        ctx.fillStyle = '#121831';
        ctx.fill();
        canvas.setPointerCapture(e.pointerId);
        drawn = true; pad.classList.add('is-drawn'); err.textContent = '';
      });

      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return;
        e.preventDefault();
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of (events.length ? events : [e])) addPoint(at(ev));
      });

      const stop = (e) => {
        if (!drawing) return;
        drawing = false;
        if (e && canvas.hasPointerCapture?.(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
        pts = [];
      };
      canvas.addEventListener('pointerup', stop);
      canvas.addEventListener('pointercancel', stop);

      const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);

      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      back.querySelector('#sign-cancel').addEventListener('click', close);
      back.querySelector('#sign-clear').addEventListener('click', () => {
        ctx.clearRect(0, 0, w, h);
        drawn = false; drawing = false; pts = []; width = 2.4;
        pad.classList.remove('is-drawn'); err.textContent = '';
      });
      back.querySelector('#sign-ok').addEventListener('click', () => {
        if (!drawn) { err.textContent = '서명을 해 주세요.'; return; }
        const msg = onDone(shrinkSign(canvas));
        if (msg) { err.textContent = msg; return; }
        close();
      });
      back.querySelector('#sign-ok').focus();
    }

    // 빈 여백을 잘라 내고 가로 420px 안으로 줄여서 저장한다
    function shrinkSign(canvas) {
      const { width: W, height: H } = canvas;
      const px = canvas.getContext('2d').getImageData(0, 0, W, H).data;
      let x0 = W, y0 = H, x1 = 0, y1 = 0;
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (px[(y * W + x) * 4 + 3] > 8) {
            if (x < x0) x0 = x;
            if (x > x1) x1 = x;
            if (y < y0) y0 = y;
            if (y > y1) y1 = y;
          }
        }
      }
      if (x1 < x0) return canvas.toDataURL('image/png');
      const pad = 10;
      x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
      x1 = Math.min(W - 1, x1 + pad); y1 = Math.min(H - 1, y1 + pad);
      const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      const scale = Math.min(1, 420 / cw, 140 / ch);
      const out = document.createElement('canvas');
      out.width = Math.round(cw * scale);
      out.height = Math.round(ch * scale);
      out.getContext('2d').drawImage(canvas, x0, y0, cw, ch, 0, 0, out.width, out.height);
      return out.toDataURL('image/png');
    }

    /* ════════ 파일로 가져오기 (→ src/lib/ledger-file.js) ════════ */
    // 학교에서 내려받는 '물품목록정보' 엑셀을 그대로 읽는다.

    // 내보낼 때 쓰는 열 순서. 가져온 파일과 같은 모양이라 다시 올릴 수 있다.
    const LEDGER_OUT = [
      '담당자',
      'G2B목록번호', 'G2B물품분류명', 'G2B목록명', '물품고유번호', 'RFID 관리번호',
      '취득일자', '정리일자', '최초취득금액', '취득금액', '내용연수(취득)', '내용연수(변경)',
      '운용부서', '운용일자', '상태', '진행상태', '나이스등록', '기자재여부', '기안상태',
      '승인상태', '설치장소', '정보화기기구분', '비고',
      '건물', '층', '실', '보관함', '칸',   // 이 앱에서 더한 칸
    ];

    const CATEGORY_HINTS = [
      ['수업 기기', ['컴퓨터', '노트북', '모니터', 'LCD', '패널', '프로젝터', '빔', '전자칠판', '태블릿', '실물화상', '프린터', '복사', '스캐너', '충전', 'TV', '텔레비전', '서버', '공유기']],
      ['과학 실험', ['현미경', '실험', '측정', '망원경', '표본', '해부', '시약', '저울', '항온']],
      ['방송·행사', ['방송', '마이크', '앰프', '스피커', '카메라', '캠코더', '조명', '무대', '확성']],
      ['체육', ['체육', '운동', '매트', '뜀틀', '평균대', '골대', '탁구', '농구', '배구', '축구', '철봉', '헬스']],
      ['사무·행정', ['책상', '걸상', '의자', '로커', '책장', '캐비닛', '탁자', '테이블', '서랍', '금고', '파쇄', '게시', '칠판', '사물함', '스툴', '소파']],
    ];
    const guessCategory = (text) => {
      const t = String(text || '');
      for (const [cat, words] of CATEGORY_HINTS) if (words.some((w) => t.includes(w))) return cat;
      return '기타';
    };

    const cellStr = (v) => (v === null || v === undefined ? '' : String(v).trim());

    // 19980103 · 1998-01-03 · 날짜 칸 → 1998-01-03
    function toDate(v) {
      if (v instanceof Date) return ymd(v);
      const t = cellStr(v).replace(/[^\d]/g, '');
      return t.length === 8 ? `${t.slice(0, 4)}-${t.slice(4, 6)}-${t.slice(6, 8)}` : '';
    }
    const toMoney = (v) => {
      const num = Number(String(v ?? '').replace(/[^\d]/g, ''));
      return num ? num.toLocaleString('ko-KR') : '';
    };
    const fromMoney = (v) => Number(String(v ?? '').replace(/[^\d]/g, '')) || '';

    // 제목 줄이 위에 있어도 열 이름이 적힌 줄을 찾아낸다
    function findHeader(rows) {
      const wanted = [...LEDGER_IN.no, ...LEDGER_IN.kind, ...LEDGER_IN.code];
      for (let r = 0; r < Math.min(rows.length, 30); r++) {
        const cells = (rows[r] || []).map(cellStr);
        if (cells.filter((c) => wanted.includes(c)).length >= 2) return r;
      }
      return -1;
    }

    function rowsToItems(rows) {
      const hr = findHeader(rows);
      if (hr < 0) return { error: 'NO_HEADER' };

      const at = {};
      const seenCol = {};
      rows[hr].forEach((h, i) => { const k = cellStr(h); if (k && !(k in seenCol)) seenCol[k] = i; });
      for (const [key, names] of Object.entries(LEDGER_IN)) {
        at[key] = names.reduce((acc, n) => (acc >= 0 ? acc : (n in seenCol ? seenCol[n] : -1)), -1);
      }
      const extra = { building: seenCol['건물'] ?? -1, floor: seenCol['층'] ?? -1, room: seenCol['실'] ?? -1,
                      storage: seenCol['보관함'] ?? -1, shelf: seenCol['칸'] ?? -1 };
      if (at.no < 0 && at.kind < 0) return { error: 'NO_COLUMNS' };

      const get = (row, key, map = at) => (map[key] >= 0 ? cellStr(row[map[key]]) : '');
      const items = [];
      const seen = new Set();
      let blank = 0, dup = 0;

      for (let r = hr + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        if (!row.some((c) => cellStr(c) !== '')) continue;

        const kind = get(row, 'kind');
        const title = get(row, 'title');
        const no = get(row, 'no');
        const name = kind || title.split(',')[0].trim();
        if (!name) { blank++; continue; }
        if (no && seen.has(no)) { dup++; continue; }
        if (no) seen.add(no);

        let spec = title;
        if (kind && spec.startsWith(kind)) spec = spec.slice(kind.length).replace(/^\s*,\s*/, '');

        const noteBits = [get(row, 'note'), get(row, 'rfid') && `RFID ${get(row, 'rfid')}`].filter(Boolean);

        items.push({
          name,
          category: guessCategory(`${kind} ${title}`),
          qty: 1,
          loanable: true,
          building: get(row, 'building', extra), floor: get(row, 'floor', extra),
          room: get(row, 'room', extra), storage: get(row, 'storage', extra), shelf: get(row, 'shelf', extra),
          memo: '',
          asset: true,
          disused: get(row, 'state').includes('불용'),
          assetInfo: {
            name: title || name,
            code: get(row, 'code'),
            spec,
            dept: get(row, 'dept'),
            place: get(row, 'place') || get(row, 'dept'),
            date: toDate(at.date >= 0 ? row[at.date] : ''),
            no,
            price: toMoney(at.price >= 0 ? row[at.price] : ''),
            life: get(row, 'life2') || get(row, 'life1'),
            note: noteBits.join(' · '),
            manager: get(row, 'manager'),
          },
          raw: { state: get(row, 'state') },
        });
      }
      return { items, blank, dup };
    }

    // 엑셀 다루는 도구는 쓸 때만 불러온다
    let XLSXLib = null;
    async function xlsx() {
      if (!XLSXLib) XLSXLib = await import('https://esm.sh/xlsx@0.18.5');
      return XLSXLib;
    }

    async function readTable(file) {
      const buf = await file.arrayBuffer();
      if (/\.csv$/i.test(file.name)) {
        const text = new TextDecoder('utf-8').decode(buf).replace(/^\ufeff/, '');
        return text.split(/\r?\n/).map((line) => {
          const out = []; let cur = ''; let q = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (q) {
              if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
              else if (ch === '"') q = false;
              else cur += ch;
            } else if (ch === '"') q = true;
            else if (ch === ',') { out.push(cur); cur = ''; }
            else cur += ch;
          }
          out.push(cur);
          return out;
        });
      }
      const XLSX = await xlsx();
      const wb = XLSX.read(buf, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      return XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: '' });
    }

    // 지금 대장을 같은 양식의 엑셀로 내보낸다
    async function exportLedger(list) {
      const XLSX = await xlsx();
      const today = new Date();
      const stamp = ymd(today).replaceAll('-', '');
      const body = list.map((it) => {
        const a = it.assetInfo || {};
        return [
          a.manager || '',
          a.code || '', it.name || '', a.name || '', a.no || '', (a.note || '').includes('RFID') ? (a.note.match(/RFID\s*([^\s·]+)/) || [, ''])[1] : '',
          (a.date || '').replaceAll('-', ''), '', fromMoney(a.price), fromMoney(a.price),
          a.life || '', a.life || '', a.dept || '', '', it.disused ? '불용' : '', '', '', '', '', '',
          a.place || '', '', (a.note || '').replace(/(^|\s·\s)RFID\s*[^\s·]+/, '').trim(),
          it.building || '', it.floor || '', it.room || '', it.storage || '', it.shelf || '',
        ];
      });
      const aoa = [[`물품목록정보_${stamp}`], [], [], LEDGER_OUT, ...body];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = LEDGER_OUT.map((h) => ({ wch: Math.max(10, Math.min(34, h.length * 2 + 6)) }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `물품목록정보_${stamp}`);
      XLSX.writeFile(wb, `물품목록정보_${stamp}.xlsx`);
    }

    /* ════════ 물품 엑셀로 한꺼번에 등록 (→ src/lib/item-file.js) ════════ */
    const ITEM_COLS = ['물품 이름(필수)', '분류(선택)', '수량(필수)', '대여 가능(필수)', '비품 여부(선택)', '건물(필수)', '층(필수)', '실(필수)', '보관함(선택)', '칸(선택)', '메모(선택)'];
    const ITEM_IN = {
      name:     ['물품 이름', '물품이름', '이름', '품명', '물품명'],
      category: ['분류', '종류', '카테고리'],
      qty:      ['수량', '개수'],
      loanable: ['대여 가능', '대여가능', '대여', '대여 여부'],
      building: ['건물', '건물명'],
      floor:    ['층', '층수'],
      room:     ['실', '실명', '장소', '보관장소'],
      storage:  ['보관함', '수납함', '캐비닛'],
      shelf:    ['칸', '선반'],
      memo:     ['메모', '비고', '한마디'],
      asset:    ['비품 여부', '비품', '비품여부'],
    };

    const YES = ['예', 'o', 'O', 'ㅇ', 'y', 'Y', 'yes', 'TRUE', 'true', '1', '가능', '대여가능'];
    const NO = ['아니오', '아니요', 'x', 'X', 'n', 'N', 'no', 'FALSE', 'false', '0', '불가', '대여불가'];

    // 층 표기를 앱이 쓰는 모양으로 맞춘다 (3 · 3층 · B1 · 지하1층 → 3층 · 지하 1층)
    function normalFloor(v) {
      const t = cellStr(v).replace(/\s+/g, '');
      if (!t) return '';
      const down = t.match(/^(?:지하|b)(\d+)층?$/i);
      if (down) return `지하 ${down[1]}층`;
      const up = t.match(/^(\d+)층?$/);
      if (up) return `${up[1]}층`;
      return cellStr(v);
    }

    function rowsToPlainItems(rows) {
      // '물품 이름(필수)'처럼 괄호 표시가 붙어도 알아본다
      const head = (v) => cellStr(v).replace(/\s*[(（][^)）]*[)）]\s*/g, '').trim();
      let hr = -1;
      for (let r = 0; r < Math.min(rows.length, 20); r++) {
        const cells = (rows[r] || []).map(head);
        if (cells.some((c) => ITEM_IN.name.includes(c))) { hr = r; break; }
      }
      if (hr < 0) return { error: 'NO_HEADER' };

      const seenCol = {};
      rows[hr].forEach((h, i) => { const k = head(h); if (k && !(k in seenCol)) seenCol[k] = i; });
      const at = {};
      for (const [key, names] of Object.entries(ITEM_IN)) {
        at[key] = names.reduce((acc, nm) => (acc >= 0 ? acc : (nm in seenCol ? seenCol[nm] : -1)), -1);
      }

      const get = (row, key) => (at[key] >= 0 ? cellStr(row[at[key]]) : '');
      const items = [];
      let blank = 0;

      for (let r = hr + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        if (!row.some((c) => cellStr(c) !== '')) continue;
        const name = get(row, 'name');
        if (!name || name.startsWith('예)')) { blank++; continue; }

        const cat = get(row, 'category');
        const lend = get(row, 'loanable');
        items.push({
          name,
          category: CATEGORIES.includes(cat) ? cat : (cat ? '기타' : ''),
          qty: Math.max(1, parseInt(get(row, 'qty'), 10) || 1),
          loanable: NO.includes(lend) ? false : true,
          building: get(row, 'building'),
          floor: normalFloor(at.floor >= 0 ? row[at.floor] : ''),
          room: get(row, 'room'),
          storage: get(row, 'storage'),
          shelf: get(row, 'shelf'),
          memo: get(row, 'memo'),
          asset: YES.includes(get(row, 'asset')),
          ...(YES.includes(get(row, 'asset')) ? { assetInfo: { name } } : {}),
        });
      }
      return { items, blank };
    }

    const itemKey = (it) => [it.name, it.building, it.floor, it.room, it.storage, it.shelf].join('|');

    // 빈 양식 내려받기

    /* ── 물품 한꺼번에 등록 화면 ── */

    /* ════════ 비품 대장 (→ src/pages/ledger.js) ════════ */
    const toNumber = (v) => Number(String(v ?? '').replace(/[^\d]/g, '')) || 0;
    const won = (v) => toNumber(v).toLocaleString('ko-KR');
    const dateLabel = (v) => (v ? v.replaceAll('-', '. ') : '');

    // 대장에 실을 칸. csv로 내려받을 때도 이 순서를 쓴다.
    const LEDGER_COLS = [
      { key: 'no',    label: '고유번호' },
      { key: 'code',  label: '분류번호' },
      { key: 'spec',  label: '규격' },
      { key: 'dept',  label: '운용부서' },
      { key: 'place', label: '위치장소' },
      { key: 'date',  label: '취득일',   sort: 'date',  format: dateLabel },
      { key: 'qty',   label: '수량',     sort: 'qty',   num: true, of: (it) => n(it.qty) },
      { key: 'price', label: '단가',     sort: 'price', num: true, of: (it) => won(it.assetInfo.price) },
      { key: 'total', label: '금액',     sort: 'total', num: true, of: (it) => won(toNumber(it.assetInfo.price) * it.qty) },
      { key: 'life',  label: '내용연수', num: true, of: (it) => (it.assetInfo.life ? `${toNumber(it.assetInfo.life)}년` : '') },
      { key: 'note',  label: '비고',     note: true },
    ];
    const cellText = (it, col) => (col.of ? col.of(it) : (col.format ? col.format(it.assetInfo[col.key]) : it.assetInfo[col.key] || ''));

    const assetName = (it) => it.assetInfo?.name || it.name;
    const assetsOf = (items) => items.filter((i) => i.asset && i.assetInfo);

    function sortAssets(list, by, dir) {
      const val = {
        name: (it) => assetName(it),
        date: (it) => it.assetInfo.date || '',
        qty: (it) => it.qty,
        price: (it) => toNumber(it.assetInfo.price),
        total: (it) => toNumber(it.assetInfo.price) * it.qty,
      }[by];
      const sign = dir === 'asc' ? 1 : -1;
      return list.slice().sort((a, b) => {
        const x = val(a), y = val(b);
        const cmp = typeof x === 'string' ? x.localeCompare(y, 'ko') : x - y;
        return cmp * sign || assetName(a).localeCompare(assetName(b), 'ko');
      });
    }

    function mountLedger(view) {
      view.querySelector('#l-import')?.addEventListener('click', openLedgerFile);
      view.querySelector('#l-import2')?.addEventListener('click', openLedgerFile);
      function openLedgerFile() {
        openImport((count) => { render(); flash(`${n(count)}개를 가져왔어요`); });
      }

      let all = assetsOf(state.items);
      if (!all.length) return;

      const input = view.querySelector('#l-q');
      const clear = view.querySelector('#l-clear');
      const deptWrap = view.querySelector('#l-depts');
      const listEl = view.querySelector('#l-list');
      const meta = view.querySelector('#l-meta');
      let dept = '';
      let deptsOpen = false;
      let limit = 60;
      let shown = [];
      let picking = false;              // 여러 개 고르는 중인지
      const picked = new Set();         // 고른 비품

      function update(keepLimit = false) {
        if (!keepLimit) limit = 60;
        const q = input.value.trim().toLowerCase();
        clear.hidden = !input.value;

        const counts = new Map();
        for (const it of all) {
          const d = it.assetInfo.dept || '없음';
          counts.set(d, (counts.get(d) || 0) + 1);
        }
        const depts = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b, 'ko'));
        const cap = 8;
        const show = deptsOpen ? depts : depts.slice(0, cap);
        if (dept && !show.includes(dept)) show.unshift(dept);
        deptWrap.innerHTML = depts.length < 2 ? '' : `
          <button class="dept__chip" type="button" data-dept="" aria-pressed="${!dept}">전체 부서</button>
          ${show.map((d) => `<button class="dept__chip" type="button" data-dept="${esc(d)}" aria-pressed="${dept === d}">${esc(d)}<b class="num">${counts.get(d)}</b></button>`).join('')}
          ${depts.length > cap ? `<button class="dept__chip dept__more" type="button" id="dept-more">${deptsOpen ? '접기' : `부서 ${n(depts.length - cap)}개 더`}</button>` : ''}`;

        shown = all.filter((it) => {
          if (dept && (it.assetInfo.dept || '없음') !== dept) return false;
          if (!q) return true;
          const a = it.assetInfo;
          return [assetName(it), it.name, a.manager, a.no, a.code, a.dept, a.spec, a.place, pathOf(it).join(' ')]
            .filter(Boolean).some((v) => String(v).toLowerCase().includes(q));
        }).sort((a, b) => assetName(a).localeCompare(assetName(b), 'ko'));

        const page = shown.slice(0, limit);
        meta.textContent = shown.length > limit ? `${n(limit)} / ${n(shown.length)}가지` : `${n(shown.length)}가지`;

        listEl.innerHTML = page.length ? page.map((it) => {
          const mg = it.assetInfo.manager;
          const on = picked.has(it.id);
          return `
            <button class="lrow ${picking ? 'is-picking' : ''} ${on ? 'is-picked' : ''}" type="button" data-asset="${it.id}">
              ${picking ? `<span class="lrow__box ${on ? 'is-on' : ''}" aria-hidden="true">${on ? icon(ICONS.check) : ''}</span>` : ''}
              <span class="lrow__main">
                <span class="lrow__name">${esc(assetName(it))}${it.qty > 1 ? ` <span class="num">${n(it.qty)}개</span>` : ''}</span>
                <span class="lrow__sub">${esc([it.assetInfo.no, it.assetInfo.dept].filter(Boolean).join(' · ') || '고유번호 없음')}</span>
              </span>
              <span class="lrow__mgr ${mg ? '' : 'is-none'}">${mg ? esc(mg) : '담당 없음'}</span>
              ${picking ? '' : `<span class="lrow__pass" role="button" tabindex="0" data-pass="${it.id}">${icon(ICONS.handover)}인수인계</span>`}
              ${picking ? '' : icon(ICONS.next, 'icon lrow__go')}
            </button>`;
        }).join('') : `<div class="nohit"><strong>찾는 비품이 없어요</strong><span>비품명, 고유번호, 담당자로 찾아보세요.</span></div>`;

        // 고르기 막대
        const bar = view.querySelector('#l-pickbar');
        bar.hidden = !picking;
        if (picking) {
          const allOn = shown.length && shown.every((it) => picked.has(it.id));
          bar.innerHTML = `
            <button class="mini mini--quiet" type="button" id="pick-all">${allOn ? '모두 풀기' : `보이는 ${n(shown.length)}가지 모두`}</button>
            <span class="pickbar__info">${picked.size ? `${n(picked.size)}가지 고름` : '비품을 눌러 골라 주세요'}</span>
            <button class="mini mini--quiet" type="button" id="pick-name" ${picked.size ? '' : 'disabled'}>담당자 지정</button>
            <button class="mini mini--go" type="button" id="pick-pass" ${picked.size ? '' : 'disabled'}>인수인계</button>`;
        }

        const more = shown.length - page.length;
        view.querySelector('#l-more').innerHTML = more
          ? `<button class="btn btn--ghost" type="button" id="l-more-go">${n(more)}가지 더 보기</button>`
          : '';
      }

      input.addEventListener('input', () => update());
      clear.addEventListener('click', () => { input.value = ''; update(); input.focus(); });

      view.addEventListener('click', (e) => {
        const d = e.target.closest('[data-dept]');
        if (d) { dept = d.dataset.dept; update(); return; }
        if (e.target.closest('#dept-more')) { deptsOpen = !deptsOpen; update(true); return; }
        if (e.target.closest('#l-more-go')) { limit += 120; update(true); return; }
        if (e.target.closest('#l-csv')) {
          exportLedger(shown).catch(() => flash('내려받지 못했어요', 'warn'));
          return;
        }
        if (e.target.closest('#l-pickmode')) {
          picking = !picking;
          picked.clear();
          view.querySelector('#l-pickmode').textContent = picking ? '고르기 끝' : '여러 개 고르기';
          update(true);
          return;
        }
        if (e.target.closest('#pick-all')) {
          const allOn = shown.length && shown.every((it) => picked.has(it.id));
          if (allOn) picked.clear();
          else shown.forEach((it) => picked.add(it.id));
          update(true);
          return;
        }
        if (e.target.closest('#pick-pass')) {
          openPass([...picked], () => {
            all = assetsOf(state.items);
            picked.clear();
            update(true);
          });
          return;
        }
        if (e.target.closest('#pick-name')) {
          openSetManager([...picked], () => {
            all = assetsOf(state.items);
            picked.clear();
            update(true);
          });
          return;
        }

        const pass = e.target.closest('[data-pass]');
        if (pass) {
          e.stopPropagation();
          openPass(pass.dataset.pass, () => { all = assetsOf(state.items); update(true); });
          return;
        }
        const row = e.target.closest('[data-asset]');
        if (!row) return;
        if (picking) {
          const id = row.dataset.asset;
          picked.has(id) ? picked.delete(id) : picked.add(id);
          update(true);
          return;
        }
        openAsset(row.dataset.asset, () => { all = assetsOf(state.items); update(true); });
      });

      view.refresh = () => {
        all = assetsOf(state.items);
        if (!all.length) { render(); return; }
        update(true);
      };
      update();
    }

    /* ════════ 우리 학교 공간 설정하기 (→ src/pages/spaces.js) ════════ */
    const BUILDING_CHIPS = ['본관', '별관', '체육관', '급식동', '유치원', '모듈형 건물', '후관', '신관'];

    const ROOM_CHIPS = [
