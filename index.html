      }
      if (!info.open) {
        root.innerHTML = shell(`<h1 class="gate__title">마감된 링크예요</h1><p class="gate__desc"><b>${esc(info.title || '물품 모으기')}</b>는 이제 받지 않아요.<br>필요하면 보낸 분께 말씀해 주세요.</p>`);
        return;
      }

      const fixed = [info.building, info.floor, info.room].filter(Boolean).join(' › ');

      // 학교 공간 설정에 담긴 실을 목록으로 (건물 → 낮은 층부터)
      const sp = info.spaces && Array.isArray(info.spaces.buildings) ? info.spaces : { buildings: [], rooms: [] };
      const placeGroups = [];
      for (const b of sp.buildings) {
        const floors = [...floorsOf(b).slice().reverse(), ''];
        for (const f of floors) {
          const list = (sp.rooms || []).filter((r) => r.building === b.name && (r.floor || '') === f);
          if (list.length) placeGroups.push({ label: `${b.name}${f ? ` ${f}` : ''}`, rooms: list.map((r) => ({ key: [b.name, f, r.name].join('|'), name: r.name })) });
        }
      }
      const canPick = !fixed && placeGroups.length > 0;
      let place = '';        // 고른 실 (건물|층|실)
      let manual = !canPick; // 목록에 없어서 직접 적는지
      let rows = [{ name: '', qty: 1, building: '', floor: '', room: '', storage: '', memo: '' }];
      let who = '';
      let nothing = false;   // 낼 물품이 없다고 답하는 경우

      const rowHTML = (r, i) => `
        <div class="grow" data-i="${i}">
          <div class="grow__top">
            <span class="grow__no num">${i + 1}</span>
            ${rows.length > 1 ? `<button class="grow__del" type="button" data-del="${i}" aria-label="이 줄 지우기">${icon(ICONS.close)}</button>` : ''}
          </div>
          <div class="grow__main">
            <input class="input" data-k="name" placeholder="물품 이름 (예: 휴대용 빔프로젝터)" value="${esc(r.name)}" maxlength="60">
            <div class="grow__qty">
              <input class="input num" data-k="qty" type="number" inputmode="numeric" min="1" value="${esc(r.qty)}" aria-label="수량">
              <span>개</span>
            </div>
          </div>
          ${fixed || !manual ? '' : `
            <div class="grow__place">
              <input class="input" data-k="building" placeholder="건물 (예: 본관)" value="${esc(r.building)}" maxlength="40">
              <input class="input" data-k="floor" placeholder="층 (예: 3층)" value="${esc(r.floor)}" maxlength="20">
              <input class="input" data-k="room" placeholder="실 (예: 과학실)" value="${esc(r.room)}" maxlength="40">
            </div>`}
          <input class="input grow__more" data-k="storage" placeholder="보관 자리 (선택, 예: 2번 캐비닛)" value="${esc(r.storage)}" maxlength="40">
        </div>`;

      const draw = () => {
        root.innerHTML = shell(`
          <p class="give__school">${esc(info.school || '')}</p>
          <h1 class="gate__title">${esc(info.title || '물품 모으기')}</h1>
          <p class="gate__desc">공유할 물품을 작성해주세요! 여러 개 한번에 제출도 가능합니다.${info.due_date ? `<br><b>${esc(dateShort(info.due_date))}까지</b> 제출해주시면 감사하겠습니다 :)` : ''}</p>
          ${fixed ? `<p class="give__fixed">${icon(ICONS.place)}<span>모두 <b>${esc(fixed)}</b>에 있는 물품으로 받아요</span></p>` : ''}

          <div class="field" style="margin-top:18px">
            <label class="field__label" for="g-who">적는 분<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="g-who" placeholder="예: 3학년 2반 김하늘" value="${esc(who)}" maxlength="30">
          </div>

          ${canPick ? `
            <div class="field">
              <label class="field__label" for="g-place">어디에 있는 물품인가요?<span class="req" aria-hidden="true">*</span></label>
              ${manual ? `
                <p class="give__manual">목록에 없는 곳이라 아래 줄마다 건물·층·실을 적어 주세요.
                  <button type="button" id="g-back">목록에서 고르기</button></p>` : `
                <div class="selectbox">
                  <select class="input" id="g-place">
                    <option value="">실을 골라 주세요</option>
                    ${placeGroups.map((g) => `<optgroup label="${esc(g.label)}">${g.rooms.map((r) => `<option value="${esc(r.key)}" ${place === r.key ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</optgroup>`).join('')}
                  </select>
                  ${icon(ICONS.caret, 'icon selectbox__caret')}
                </div>
                <button class="give__other" type="button" id="g-other">목록에 없어요 · 직접 적기</button>`}
            </div>` : ''}

          <label class="give__none">
            <input type="checkbox" id="g-none" ${nothing ? 'checked' : ''}>
            <span><b>제출할 물품 없음</b></span>
          </label>

          ${nothing ? '' : `
            <div class="grows">${rows.map(rowHTML).join('')}</div>
            <button class="give__add" type="button" id="g-add">${icon(ICONS.add)}한 줄 더</button>`}

          <p class="gate__err" id="g-err" aria-live="polite"></p>
          <button class="bigbtn bigbtn--navy" type="button" id="g-send">${nothing ? '없음으로 내기' : `${n(rows.filter((r) => r.name.trim()).length || rows.length)}개 내기`}</button>`);
      };
      draw();

      root.addEventListener('change', (e) => {
        if (e.target.id === 'g-none') { nothing = e.target.checked; draw(); }
        if (e.target.id === 'g-place') { place = e.target.value; }
      });

      root.addEventListener('input', (e) => {
        if (e.target.id === 'g-who') { who = e.target.value; return; }
        const k = e.target.dataset.k;
        const box = e.target.closest('[data-i]');
        if (!k || !box) return;
        const i = Number(box.dataset.i);
        rows[i][k] = k === 'qty' ? Math.max(1, parseInt(e.target.value, 10) || 1) : e.target.value;
        const btn = root.querySelector('#g-send');
        if (btn) btn.textContent = `${n(rows.filter((r) => r.name.trim()).length || 1)}개 내기`;
      });

      root.addEventListener('click', async (e) => {
        if (e.target.closest('#g-add')) {
          const last = rows[rows.length - 1];
          rows.push({ name: '', qty: 1, building: last.building, floor: last.floor, room: last.room, storage: '', memo: '' });
          draw();
          root.querySelectorAll('[data-k="name"]')[rows.length - 1]?.focus();
          return;
        }
        const del = e.target.closest('[data-del]');
        if (del) { rows.splice(Number(del.dataset.del), 1); draw(); return; }
        if (e.target.closest('#g-other')) { manual = true; place = ''; draw(); return; }
        if (e.target.closest('#g-back')) { manual = false; draw(); return; }
        if (e.target.closest('#g-again')) {
          rows = [{ name: '', qty: 1, building: '', floor: '', room: '', storage: '', memo: '' }];
          nothing = false;
          draw();
          return;
        }
        if (!e.target.closest('#g-send')) return;

        const err = root.querySelector('#g-err');
        let list = nothing ? [] : rows.filter((r) => r.name.trim());
        if (!who.trim()) { err.textContent = '적는 분 이름을 적어 주세요.'; root.querySelector('#g-who').focus(); return; }
        if (canPick && !manual && !place) { err.textContent = '어디에 있는 물품인지 실을 골라 주세요.'; root.querySelector('#g-place')?.focus(); return; }
        if (!nothing && !list.length) { err.textContent = '물품 이름을 적거나 “제출할 물품 없음”을 골라 주세요.'; return; }
        if (!nothing && !fixed && manual && list.some((r) => !r.room.trim())) { err.textContent = '각 물품이 있는 실을 적어 주세요.'; return; }

        // 목록에서 고른 실을 모든 줄에 붙인다. '없음'이어도 어느 실의 응답인지 남긴다.
        if (canPick && !manual) {
          const [pb, pf, pr] = place.split('|');
          list = list.map((r) => ({ ...r, building: pb, floor: pf, room: pr }));
          if (nothing) list = [{ building: pb, floor: pf, room: pr }];
        } else if (nothing && manual && rows[0]) {
          list = [{ building: rows[0].building, floor: rows[0].floor, room: rows[0].room }];
        }

        const btn = e.target.closest('#g-send');
        btn.disabled = true; btn.textContent = '보내는 중이에요…';
        const { data, error: sendErr } = await sb.rpc('submit_items', { link_code: code, submitter: who.trim(), rows: list, nothing });
        if (sendErr) {
          btn.disabled = false; btn.textContent = `${n(list.length)}개 내기`;
          err.textContent = String(sendErr.message).includes('CLOSED') ? '마감된 링크예요.' : '보내지 못했어요. 잠시 뒤 다시 해 주세요.';
          return;
        }
        root.innerHTML = shell(`
          <span class="waitmark is-done" aria-hidden="true">${icon(ICONS.check)}</span>
          <h1 class="gate__title">${nothing ? '없음으로 냈어요' : `${n(data?.count || list.length)}개를 냈어요`}</h1>
          <p class="gate__desc">${nothing ? '담당 선생님께 응답이 전해졌어요.' : (data?.auto ? '바로 학교 물품 목록에 올라갔어요.' : '담당 선생님이 확인한 뒤 목록에 올려요.')}<br>고맙습니다.</p>
          <div class="gate__acts"><button class="bigbtn bigbtn--ghost" type="button" id="g-again">더 내기</button></div>`);
      });
    }

    let collPulledAt = '';    // 마지막으로 서버에서 받아 온 때
    let keepCollOpen = false; // 새로 고침 뒤 카드를 다시 펼친다

    // 다른 사람이 낸 물품은 서버에만 있다. 필요할 때 다시 받아 온다.
    async function pullCollects() {
      if (!sb || me?.status !== 'active') return false;
      try {
        await loadData();
        collPulledAt = new Date().toISOString();
        return true;
      } catch (e) {
        console.error(e);
        return false;
      }
    }

    // 학교 전체 링크: 공간 설정의 실마다 냈는지, 없다고 했는지, 아직인지
    function roomBoard(c) {
      const sp = spaces();
      if (placeOfCollect(c) || !sp.rooms.length) return null;
      const got = submissions().filter((x) => x.collectId === c.id && x.status !== 'rejected');
      const same = (x, r) => x.building === r.building && x.room === r.name && (!r.floor || !x.floor || x.floor === r.floor);

      const groups = [];
      for (const b of sp.buildings) {
        for (const f of [...floorsOf(b).slice().reverse(), '']) {
          const rooms = sp.rooms.filter((r) => r.building === b.name && (r.floor || '') === f);
          if (!rooms.length) continue;
          groups.push({
            label: `${b.name}${f ? ` ${f}` : ''}`,
            rooms: rooms.map((r) => {
              const mine = got.filter((x) => same(x, r));
              const things = mine.filter((x) => x.status !== 'none');
              return {
                name: r.name,
                state: things.length ? 'in' : (mine.length ? 'none' : 'wait'),
                count: things.reduce((a, x) => a + 1, 0),
              };
            }),
          });
        }
      }
      const all = groups.flatMap((g) => g.rooms);
      const waiting = all.filter((r) => r.state === 'wait').length;
      const outside = got.filter((x) => !sp.rooms.some((r) => same(x, r)));
      return { groups, waiting, total: all.length, outside };
    }

    function roomBoardHTML(c) {
      const bd = roomBoard(c);
      if (!bd) return '';
      return `
        <details class="rboard">
          <summary>실별 응답 보기 · <b class="${bd.waiting ? 'is-warn' : ''}">미제출 ${n(bd.waiting)}곳</b> / ${n(bd.total)}곳</summary>
          ${bd.groups.map((g) => `
            <div class="rboard__grp">
              <p class="rboard__label">${esc(g.label)}</p>
              <div class="rboard__rooms">
                ${g.rooms.map((r) => `<span class="rchip is-${r.state}">${esc(r.name)}<small>${r.state === 'in' ? `${n(r.count)}개` : r.state === 'none' ? '없음' : '미제출'}</small></span>`).join('')}
              </div>
            </div>`).join('')}
          ${bd.outside.length ? `<p class="rboard__out">목록에 없는 곳에서 낸 물품 ${n(bd.outside.length)}개도 있어요.</p>` : ''}
        </details>`;
    }

    /* ── 관리 담당 화면의 '물품 모으기' ── */
    const collShut = (c) => c.closed || (c.dueDate && c.dueDate < today());

    function collStat(c) {
      const got = submissions().filter((x) => x.collectId === c.id && x.status !== 'rejected');
      return {
        people: new Set(got.map((x) => x.who).filter(Boolean)).size,
        none: new Set(got.filter((x) => x.status === 'none').map((x) => x.who)).size,
        things: got.filter((x) => x.status !== 'none').length,
        wait: got.filter((x) => x.status === 'pending').length,
      };
    }

    function collRowHTML(c, archived = false) {
      const st = collStat(c);
      const shut = collShut(c);
      return `
        <li class="crow ${shut ? 'is-shut' : ''}">
          <div class="crow__main">
            <p class="crow__title">${esc(c.title)}${shut ? '<span class="crow__tag">마감</span>' : ''}</p>
            <p class="crow__sub">${c.dueDate ? `${esc(dateShort(c.dueDate))}까지 · ` : ''}${c.autoApprove ? '바로 등록' : '검토 후 등록'} · ${placeOfCollect(c) ? esc(placeOfCollect(c)) : '<b>학교 전체</b>'}</p>
            <p class="crow__sub">응답 ${n(st.people)}명${st.none ? ` (없음 ${n(st.none)})` : ''} · 물품 ${n(st.things)}개${st.wait ? ` · <b>검토 대기 ${n(st.wait)}</b>` : ''}</p>
            ${roomBoardHTML(c)}
          </div>
          <div class="crow__acts">
            ${archived
              ? `${st.wait ? `<button class="mini mini--go" type="button" data-capply="${c.id}">반영하기</button>` : ''}
                 <button class="mini mini--quiet" type="button" data-cxls="${c.id}">엑셀로 받기</button>
                 <button class="mini mini--quiet" type="button" data-cshut="${c.id}">다시 열기</button>`
              : `<button class="mini mini--go" type="button" data-ccopy="${c.id}">링크 복사</button>
                 ${c.autoApprove
                   ? `<button class="mini mini--quiet" type="button" data-cshut="${c.id}">마감</button>`
                   : `<button class="mini mini--quiet" type="button" data-cdone="${c.id}">마감하고 반영하기</button>`}`}
            <button class="act act--del" type="button" data-cdel="${c.id}" aria-label="지우기">${icon(ICONS.trash)}</button>
          </div>
        </li>`;
    }

    function collectsHTML() {
      const all = collects().slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
      const live = all.filter((c) => !collShut(c));
      const done = all.filter((c) => collShut(c));
      const pend = submissions().filter((x) => x.status === 'pending');
      const wholeDefault = hasSpaces();

      return `
        <div class="coll__bar">
          <span class="coll__stamp">${collPulledAt ? `${esc(clock(collPulledAt))}에 확인함` : '화면을 열 때 받아 왔어요'}</span>
          <div class="coll__barbtns">
            <button class="mini mini--quiet" type="button" id="c-refresh">${icon(ICONS.refresh)}새로 고침</button>
            <button class="mini mini--quiet" type="button" id="c-arch">물품 모으기 자료${done.length ? ` ${n(done.length)}` : ''}</button>
          </div>
        </div>

        <div class="coll__new">
          <p class="coll__label">새 링크 만들기</p>
          <div class="row">
            <div class="field">
              <label class="field__label" for="c-title">제목<span class="req" aria-hidden="true">*</span></label>
              <input class="input" id="c-title" placeholder="예: 3학년 교실 물품 조사" maxlength="40">
            </div>
            <div class="field">
              <label class="field__label" for="c-due">마감일</label>
              <input class="input" id="c-due" type="date" value="${plusDays(7)}">
            </div>
          </div>

          <label class="coll__whole">
            <input type="checkbox" id="c-whole" ${wholeDefault ? 'checked' : ''}>
            <span><b>학교 전체에서 받기</b><small>받는 분이 자기 실을 목록에서 골라요${wholeDefault ? '' : ' (학교 공간 설정이 필요해요)'}</small></span>
          </label>

          <div class="field" id="c-placebox" ${wholeDefault ? 'hidden' : ''}>
            <label class="field__label">장소 <small>작성 하면 받은 사람이 이름과 수량만 적어서 더 편리해요</small></label>
            <div class="coll__place">
              <input class="input" id="c-b" list="c-bl" placeholder="건물 (예: 본관)" autocomplete="off">
              <input class="input" id="c-f" placeholder="층" autocomplete="off">
              <input class="input" id="c-r" list="c-rl" placeholder="실" autocomplete="off">
              <datalist id="c-bl">${[...new Set([...spaces().buildings.map((b) => b.name), ...state.items.map((i) => i.building)])].filter(Boolean).map((v) => `<option value="${esc(v)}"></option>`).join('')}</datalist>
              <datalist id="c-rl">${[...new Set([...spaces().rooms.map((r) => r.name), ...state.items.map((i) => i.room)])].filter(Boolean).map((v) => `<option value="${esc(v)}"></option>`).join('')}</datalist>
            </div>
          </div>

          <div class="coll__mode" role="radiogroup" aria-label="받은 물품 처리">
            <label class="coll__opt"><input type="radio" name="c-mode" value="review" checked><span><b>검토 후 등록</b><small>제가 보고 올릴게요</small></span></label>
            <label class="coll__opt"><input type="radio" name="c-mode" value="auto"><span><b>바로 등록</b><small>받자마자 목록에 올라가요</small></span></label>
          </div>
          <button class="btn btn--solid" type="button" id="c-make">${icon(ICONS.add)}링크 만들기</button>
        </div>

        ${pend.length ? `
          <div class="coll__pend">
            <div class="coll__pendhead">
              <p class="coll__label">검토 기다리는 물품 ${n(pend.length)}개</p>
              <button class="mini mini--go" type="button" id="c-okall">모두 등록</button>
            </div>
            <ul class="coll__plist">
              ${pend.slice(0, 100).map((x) => `
                <li class="prow">
                  <div class="prow__main">
                    <p class="prow__name">${esc(x.name)} <span class="num">${n(x.qty)}개</span></p>
                    <p class="prow__sub">${esc([x.building, x.floor, x.room].filter(Boolean).join(' › ') || '장소 없음')}${x.storage ? ` · ${esc(x.storage)}` : ''} · ${esc(x.who)}</p>
                  </div>
                  <button class="mini mini--go" type="button" data-cok="${x.id}">등록</button>
                  <button class="mini mini--quiet" type="button" data-cno="${x.id}">빼기</button>
                </li>`).join('')}
            </ul>
          </div>` : ''}

        ${live.length ? `
          <p class="coll__label">받고 있는 링크</p>
          <ul class="coll__list">${live.map((c) => collRowHTML(c)).join('')}</ul>`
        : '<p class="side-empty">받고 있는 링크가 없어요. 위에서 하나 만들어 보세요.</p>'}`;
    }

    /* ── 마감한 링크 모아 보기 ── */
    function openArchive(onChange) {
      const back = document.createElement('div');
      back.className = 'signback';
      back.innerHTML = '<div class="signbox archbox" role="dialog" aria-modal="true" aria-labelledby="ar-title"></div>';
      document.body.append(back);
      const box = back.querySelector('.archbox');
      const close = () => { back.remove(); document.removeEventListener('keydown', onKey); onChange(); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      back.addEventListener('click', (e) => { if (e.target === back) close(); });

      const draw = () => {
        const done = collects().filter(collShut).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
        const wait = done.reduce((a, c) => a + collStat(c).wait, 0);
        box.innerHTML = `
          <p class="signbox__title" id="ar-title">물품 모으기 자료</p>
          <p class="signbox__desc">마감한 링크와 받은 내용이 여기에 모여요.${wait ? ` 아직 <b>${n(wait)}개</b>가 반영을 기다려요.` : ''}</p>
          ${done.length
            ? `<ul class="coll__list arch__list">${done.map((c) => collRowHTML(c, true)).join('')}</ul>`
            : '<p class="side-empty">마감한 링크가 아직 없어요.</p>'}
          <div class="signbox__acts">
            <span class="signbox__spacer"></span>
            <button class="mini mini--quiet" type="button" id="ar-close">닫기</button>
          </div>`;
      };
      draw();
      box.addEventListener('click', async (e) => {
        if (e.target.closest('#ar-close')) { close(); return; }
        const handled = await collectAction(e, draw);
        if (handled === 'gone') close();
      });
    }

    // 링크 줄의 단추들은 관리 화면과 자료 화면에서 똑같이 쓴다
    async function collectAction(e, redraw) {
      const cp = e.target.closest('[data-ccopy]');
      if (cp) {
        const c = collects().find((x) => x.id === cp.dataset.ccopy);
        try { await navigator.clipboard.writeText(giveLink(c)); flash('링크를 복사했어요'); }
        catch { prompt('이 주소를 복사해 주세요', giveLink(c)); }
        return true;
      }

      const sh = e.target.closest('[data-cshut]');
      if (sh) {
        commit({ ...state, collects: collects().map((x) => (x.id === sh.dataset.cshut ? { ...x, closed: !x.closed, dueDate: x.closed ? null : x.dueDate } : x)) });
        redraw();
        return true;
      }

      const dn = e.target.closest('[data-cdone]');
      const ap = e.target.closest('[data-capply]');
      if (dn || ap) {
        const btn = dn || ap;
        btn.disabled = true;
        await pullCollects();
        const cid = btn.dataset.cdone || btn.dataset.capply;
        const pend = submissions().filter((x) => x.collectId === cid && x.status === 'pending');
        const now = new Date().toISOString();
        const made = pend.map((x) => ({
          id: newId(), name: x.name, category: x.category || '기타', qty: x.qty, loanable: true,
          building: x.building, floor: x.floor, room: x.room, storage: x.storage || '', shelf: '',
          memo: x.memo || '', asset: false, createdAt: now,
        }));
        const ids = new Set(pend.map((x) => x.id));
        commit({
          ...state,
          items: [...state.items, ...made],
          submissions: submissions().map((x) => (ids.has(x.id) ? { ...x, status: 'done' } : x)),
          collects: collects().map((x) => (x.id === cid && dn ? { ...x, closed: true } : x)),
        });
        redraw();
        flash(made.length
          ? `${n(made.length)}개를 물품 목록에 반영했어요${dn ? ' · 링크를 마감했어요' : ''}`
          : (dn ? '링크를 마감했어요. 반영할 물품은 없었어요' : '새로 반영할 물품이 없어요'));
        return true;
      }

      const xl = e.target.closest('[data-cxls]');
      if (xl) {
        const c = collects().find((x) => x.id === xl.dataset.cxls);
        exportCollect(c).catch(() => flash('내려받지 못했어요', 'warn'));
        return true;
      }

      const dl = e.target.closest('[data-cdel]');
      if (dl) {
        if (!confirm('이 링크를 지울까요? 받은 기록도 함께 지워져요. 이미 등록한 물품은 남아요.')) return true;
        commit({
          ...state,
          collects: collects().filter((x) => x.id !== dl.dataset.cdel),
          submissions: submissions().filter((x) => x.collectId !== dl.dataset.cdel),
        });
        redraw();
        return collects().filter(collShut).length ? true : 'gone';
      }
      return false;
    }

    // 받은 내용을 엑셀로
    async function exportCollect(c) {
      const XLSX = await xlsx();
      const got = submissions().filter((x) => x.collectId === c.id)
        .sort((a, b) => (a.room || '').localeCompare(b.room || '', 'ko') || a.createdAt.localeCompare(b.createdAt));
      const LABEL = { pending: '검토 대기', done: '등록함', rejected: '뺌', none: '없음' };
      const head = [
        [`물품 모으기 — ${c.title}`], [],
        ['학교', school().name, '', '기간', c.dueDate ? `${c.dueDate}까지` : '기한 없음'],
        ['처리', c.autoApprove ? '바로 등록' : '검토 후 등록', '', '장소', placeOfCollect(c) || '학교 전체'],
        [],
        ['적은 분', '건물', '층', '실', '물품 이름', '수량', '보관 자리', '상태', '낸 때'],
      ];
      const body = got.map((x) => [
        x.who, x.building, x.floor, x.room, x.name, x.qty, x.storage || '',
        LABEL[x.status] || x.status, `${x.createdAt.slice(0, 10)} ${clock(x.createdAt)}`,
      ]);
      const ws = XLSX.utils.aoa_to_sheet([...head, ...body]);
      ws['!cols'] = [16, 12, 10, 16, 26, 8, 16, 10, 18].map((wch) => ({ wch }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '물품 모으기');
      XLSX.writeFile(wb, `물품 모으기_${c.title}_${ymd(new Date()).replaceAll('-', '')}.xlsx`);
    }

    function mountCollects(view, redraw) {
      const box = view.querySelector('#coll-body');
      if (!box) return;

      box.addEventListener('change', (e) => {
        if (e.target.id !== 'c-whole') return;
        const pb = box.querySelector('#c-placebox');
        pb.hidden = e.target.checked;
        if (e.target.checked) { pb.querySelector('#c-b').value = ''; pb.querySelector('#c-f').value = ''; pb.querySelector('#c-r').value = ''; }
      });

      box.addEventListener('click', async (e) => {
        if (e.target.closest('#c-refresh')) {
          const b = e.target.closest('#c-refresh');
          b.disabled = true;
          const ok = await pullCollects();
          keepCollOpen = true;
          render();
          flash(ok ? '최신 상태로 새로 고쳤어요' : '새로 고치지 못했어요', ok ? 'ok' : 'warn');
          return;
        }

        if (e.target.closest('#c-arch')) { openArchive(redraw); return; }

        if (e.target.closest('#c-make')) {
          const title = box.querySelector('#c-title').value.trim();
          if (!title) { flash('제목을 적어 주세요', 'warn'); box.querySelector('#c-title').focus(); return; }
          const whole = box.querySelector('#c-whole').checked;
          const c = {
            id: 'col_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            code: newCode(), title,
            dueDate: box.querySelector('#c-due').value || null,
            autoApprove: box.querySelector('input[name="c-mode"]:checked').value === 'auto',
            building: whole ? '' : box.querySelector('#c-b').value.trim(),
            floor: whole ? '' : normalFloor(box.querySelector('#c-f').value),
            room: whole ? '' : box.querySelector('#c-r').value.trim(),
            closed: false, createdAt: new Date().toISOString(),
          };
          commit({ ...state, collects: [...collects(), c] });
          try { await navigator.clipboard.writeText(giveLink(c)); flash('링크를 만들고 복사했어요. 메신저에 붙여 넣으세요'); }
          catch { flash('링크를 만들었어요'); }
          redraw();
          return;
        }

        const ok = e.target.closest('[data-cok]');
        const all = e.target.closest('#c-okall');
        const no = e.target.closest('[data-cno]');
        if (ok || all || no) {
          const ids = new Set(all ? submissions().filter((x) => x.status === 'pending').map((x) => x.id)
            : [(ok || no).dataset.cok || (ok || no).dataset.cno]);
          if (no) {
            commit({ ...state, submissions: submissions().map((x) => (ids.has(x.id) ? { ...x, status: 'rejected' } : x)) });
            flash('뺐어요');
            redraw();
            return;
          }
          const now = new Date().toISOString();
          const made = submissions().filter((x) => ids.has(x.id)).map((x) => ({
            id: newId(), name: x.name, category: x.category || '기타', qty: x.qty, loanable: true,
            building: x.building, floor: x.floor, room: x.room, storage: x.storage || '', shelf: '',
            memo: x.memo || '', asset: false, createdAt: now,
          }));
          commit({
            ...state,
            items: [...state.items, ...made],
            submissions: submissions().map((x) => (ids.has(x.id) ? { ...x, status: 'done' } : x)),
          });
          flash(`${n(made.length)}개를 등록했어요`);
          redraw();
          return;
        }

        await collectAction(e, redraw);
      });
    }

    /* ════════ 관리 담당 선생님 (→ src/pages/manager.js) ════════ */
    const ASSET_NEED = [
      { key: 'no', label: '고유번호' }, { key: 'code', label: '분류번호' },
      { key: 'date', label: '취득일' }, { key: 'price', label: '단가' },
    ];

    // 내용연수가 끝나는 날
    function expiryOf(it) {
      const a = it.assetInfo;
      if (!a || !a.date || !toNumber(a.life)) return null;
      const d = new Date(a.date + 'T00:00');
      d.setFullYear(d.getFullYear() + toNumber(a.life));
      return ymd(d);
    }

    const editHref = (it, from = '#/') => `#/add?id=${encodeURIComponent(it.id)}&from=${encodeURIComponent(from)}`;

    // 담당 선생님이 챙길 일을 한곳에 모은다
    function todoGroups() {
      const out = activeLoans();
      const assets = assetsOf(state.items);
      const overdue = sortLoans(out.filter((l) => dueState(l).key === 'late'));
      const dueToday = sortLoans(out.filter((l) => dueState(l).key === 'today'));
      const blanks = assets
        .map((it) => ({ it, missing: ASSET_NEED.filter((f) => !it.assetInfo[f.key]) }))
        .filter((x) => x.missing.length)
        .sort((a, b) => b.missing.length - a.missing.length)
        .slice(0, 30);
      const expired = assets
        .map((it) => ({ it, on: expiryOf(it) }))
        .filter((x) => x.on && daysBetween(today(), x.on) <= 0)
        .sort((a, b) => a.on.localeCompare(b.on))
        .slice(0, 30);

      const broken = state.items.filter((i) => i.repair).slice(0, 30);
      const missing = state.items.filter((i) => i.lost).slice(0, 30);

      return [
        {
          key: 'lost', name: '찾는 중이에요', color: 'var(--late)', rows: missing, href: (it) => editHref(it, '#/manager'),
          why: '인수인계 때 찾지 못한 비품이에요. 찾으면 표시를 풀어 주세요.',
          row: (it) => ({
            late: true,
            name: assetName(it),
            sub: `${it.assetInfo?.no || '고유번호 없음'} · ${pathOf(it).join(' › ') || '장소 미지정'}`,
            acts: `<button class="mini mini--quiet" type="button" data-found="${it.id}">찾았어요</button>`,
          }),
        },
        {
          key: 'fix', name: '수리가 필요해요', color: '#b8860b', rows: broken, href: (it) => editHref(it, '#/manager'),
          why: '반납할 때 수리가 필요하다고 표시된 물품이에요.',
          row: (it) => ({
            name: `${it.name}${it.qty > 1 ? ` ${n(it.qty)}개` : ''}`,
            sub: pathOf(it).join(' › ') || '장소 미지정',
            acts: `<button class="mini mini--quiet" type="button" data-fixed="${it.id}">고쳤어요</button>`,
          }),
        },
        {
          key: 'late', name: '반납이 늦었어요', color: 'var(--late)', rows: overdue, href: () => '#/rent',
          why: '빌려 간 분에게 한 번 알려 주세요.',
          row: (l) => ({
            late: true, name: `${l.itemName}${l.qty > 1 ? ` ${n(l.qty)}개` : ''}`,
            sub: `${l.who} · ${dueState(l).label}`,
            acts: returnControl(l, true),
          }),
        },
        {
          key: 'today', name: '오늘 반납이에요', color: 'var(--marker)', rows: dueToday, href: () => '#/rent',
          why: '돌려받으면 바로 반납 처리해 주세요.',
          row: (l) => ({
            name: `${l.itemName}${l.qty > 1 ? ` ${n(l.qty)}개` : ''}`,
            sub: `${l.who} · ${l.path}`,
            acts: returnControl(l, true),
          }),
        },
        {
          key: 'blank', name: '비품 대장에 빈 칸이 있어요', color: 'var(--navy)', rows: blanks, href: (x) => editHref(x.it),
          why: '대장을 낼 때 필요한 내용이에요.',
          row: ({ it, missing }) => ({
            name: assetName(it),
            sub: `${missing.map((f) => f.label).join(', ')}${missing.length > 1 ? '이(가)' : '이'} 비었어요`,
            acts: `<a class="mini mini--go" href="${editHref(it, '#/manager')}">채우기</a>`,
          }),
        },
        {
          key: 'old', name: '내용연수가 지났어요', color: 'var(--ink-3)', rows: expired, href: (x) => editHref(x.it),
          why: '교체나 불용 처리를 검토할 때가 됐어요.',
          row: ({ it, on }) => ({
            name: assetName(it),
            sub: `${dateShort(it.assetInfo.date)} 취득 · ${toNumber(it.assetInfo.life)}년 · ${on.slice(0, 4)}년에 만료`,
            acts: `<a class="mini mini--quiet" href="${editHref(it, '#/manager')}">보기</a>`,
          }),
        },
      ].filter((g) => g.rows.length);
    }

          </div>
          <div class="spotbar">
            <span class="spotbar__info">${picked.length ? `${n(picked.length)}가지 · ${n(pickedQty)}개 고름` : '옮길 물품을 골라 주세요'}</span>
            <button class="mini mini--quiet" type="button" id="sp-all">${picked.length === groups.length ? '모두 풀기' : '모두 고르기'}</button>
            <button class="mini mini--go" type="button" id="sp-save" ${picked.length ? '' : 'disabled'}>여기로 옮기기</button>
          </div>
          <ul class="spotlist">
            ${groups.slice(0, 200).map((g) => `
              <li class="spotrow">
                <input type="checkbox" data-spot="${esc(g.key)}" ${chosen.has(g.key) ? 'checked' : ''} aria-label="${esc(g.name)}">
                <span class="spotrow__name">${esc(g.name)}</span>
                <span class="spotrow__qty num">${n(g.qty)}개</span>
                <span class="spotrow__sub">${esc(g.place || '대장에 장소가 없어요')}</span>
              </li>`).join('')}
            ${groups.length > 200 ? `<li class="imp__more num">그 밖에 ${n(groups.length - 200)}가지</li>` : ''}
          </ul>`;
      }

      // 카드 접기·펴기 한 곳에서 처리
      view.addEventListener('click', (e) => {
        const f = e.target.closest('[data-fold]');
        if (!f) return;
        const panel = view.querySelector('#' + f.getAttribute('aria-controls'));
        const open = panel.hidden;
        panel.hidden = !open;
        f.setAttribute('aria-expanded', String(open));
        f.closest('.fold-card').classList.toggle('is-open', open);
        if (open && f.dataset.fold === 'spot') drawSpots();
        if (open && f.dataset.fold === 'coll') {
          pullCollects().then(() => {
            const b = view.querySelector('#coll-body');
            if (b) b.innerHTML = collectsHTML();
          });
        }
      });

      view.addEventListener('change', (e) => {
        const box = e.target.closest('[data-spot]');
        if (!box) return;
        box.checked ? chosen.add(box.dataset.spot) : chosen.delete(box.dataset.spot);
        drawSpots();
      });

      /* ── 기록 지우기 ── */
      const wipeBox = view.querySelector('#wipe-box');
      let wipeKind = '';   // '' | items | loans
      let wipeStep = 1;    // 1 물어보기 · 2 코드 적기
      // 실수로 지우지 않도록 학교 코드를 그대로 적게 한다
      const wipeWord = () => (online() ? (me?.school?.join_code || '') : '삭제');

      const WIPES = {
        items: {
          title: '물품 전체 삭제',
          count: () => state.items.length,
          unit: '가지',
          desc: () => `등록된 물품 ${n(state.items.length)}가지를 모두 지워요. 대장을 새로 올릴 때 쓰세요.`,
          warn: '삭제하면 다시 복구할 수 없습니다. 복구를 하려면 엑셀로 내려받아 주세요.',
          run: () => commit({ ...state, items: [] }),
          done: (c) => `물품 ${n(c)}가지를 모두 지웠어요`,
        },
        account: {
          title: online() ? (isAdmin() ? '계정 삭제 (학교 지우기)' : '학교에서 나가기') : '',
          count: () => 1,
          unit: '',
          desc: () => (isAdmin()
            ? '학교를 지우고 나갑니다. 물품, 대여 기록, 서명, 공간 설정이 모두 사라지고 함께 쓰던 선생님들도 접속할 수 없게 돼요.'
            : '이 학교에서 나갑니다. 학교 자료는 그대로 남고, 나만 볼 수 없게 돼요. 다시 들어오려면 코드로 가입 신청을 해야 해요.'),
          warn: isAdmin()
            ? '삭제하면 다시 복구할 수 없습니다. 우리 학교 선생님 모두가 쓸 수 없게 됩니다.'
            : '나가면 다시 들어올 때 관리자의 승인이 필요합니다.',
          run: null,   // 서버에서 처리한다
          done: () => (isAdmin() ? '학교를 지웠어요' : '학교에서 나왔어요'),
        },
        all: {
          title: '학교 정보 삭제',
          count: () => state.items.length + (state.loans || []).length,
          unit: '건',
          desc: () => '물품, 대여 기록, 서명, 공간 설정, 담당 정보를 모두 지우고 처음 상태로 되돌려요.',
          warn: '삭제하면 다시 복구할 수 없습니다. 복구를 하려면 엑셀로 내려받아 주세요. 학교와 선생님 계정은 남아서 로그인은 그대로 됩니다.',
          run: () => commit({ ...state, items: [], loans: [], recent: [], school: { ...DEFAULT_SCHOOL, name: school().name } }),
          done: () => '학교 정보를 모두 지웠어요',
        },
        loans: {
          title: '대여 기록·서명 삭제',
          count: () => (state.loans || []).length,
          unit: '건',
          desc: () => `빌려준 기록과 받아 둔 서명 ${n((state.loans || []).length)}건을 모두 지워요. 학년이 바뀔 때 쓰세요.`,
          warn: '삭제하면 다시 복구할 수 없습니다. 서명도 함께 사라져요.',
          run: () => commit({ ...state, loans: [] }),
          done: (c) => `대여 기록 ${n(c)}건을 모두 지웠어요`,
        },
      };

      function drawWipe() {
        if (!wipeBox) return;
        const spec = WIPES[wipeKind];

        if (!wipeKind) {
          const keys = online() ? ['items', 'loans', 'all', 'account'] : ['items', 'loans', 'all'];
          wipeBox.innerHTML = keys.map((key) => [key, WIPES[key]]).map(([key, w]) => `
            <div class="wipe__row">
              <div class="wipe__what">
                <p class="wipe__name">${esc(w.title)}</p>
                <p class="wipe__count">${key === 'all' ? '모두 처음 상태로'
                  : key === 'account' ? (isAdmin() ? '학교까지 함께 사라져요' : '나만 나가요')
                  : (w.count() ? `${n(w.count())}${w.unit}` : '비어 있어요')}</p>
              </div>
              <button class="mini wipe__pick ${key === 'all' || key === 'account' ? 'wipe__pick--all' : ''}" type="button" data-wipe="${key}" ${w.count() || key === 'all' || key === 'account' ? '' : 'disabled'}>${key === 'account' ? (isAdmin() ? '삭제' : '나가기') : '지우기'}</button>
            </div>`).join('');
          return;
        }

        if (wipeStep === 1) {
          wipeBox.innerHTML = `
            <div class="wipe__ask">
              <p class="wipe__head">${esc(spec.title)}</p>
              <p class="wipe__desc">${esc(spec.desc())}</p>
              <p class="wipe__warn">${icon(ICONS.bell)}<span>${esc(spec.warn)}</span></p>
              <div class="wipe__acts">
                <button class="mini mini--quiet" type="button" id="wipe-cancel">그만두기</button>
                ${(wipeKind === 'items' || wipeKind === 'all') && state.items.length ? '<button class="mini mini--quiet" type="button" id="wipe-save">엑셀로 내려받기</button>' : ''}
                <button class="mini wipe__go" type="button" id="wipe-next">계속</button>
              </div>
            </div>`;
          return;
        }

        wipeBox.innerHTML = `
          <div class="wipe__ask">
            <p class="wipe__head">${esc(spec.title)}</p>
            <label class="field__label" for="wipe-code">확인을 위해 ${online() ? '학교 코드' : '‘삭제’'}를 적어 주세요</label>
            <input class="input wipe__input" id="wipe-code" type="text" autocomplete="off" placeholder="${esc(online() ? '예: A1B2C3' : '삭제')}">
            <p class="field__error" id="wipe-err"></p>
            <div class="wipe__acts">
              <button class="mini mini--quiet" type="button" id="wipe-cancel">그만두기</button>
              <button class="mini wipe__go" type="button" id="wipe-go">${wipeKind === 'account' ? (isAdmin() ? '계정과 학교 삭제' : '학교에서 나가기') : `${n(spec.count())}${spec.unit} 모두 지우기`}</button>
            </div>
          </div>`;
        view.querySelector('#wipe-code')?.focus();
      }

      view.addEventListener('click', async (e) => {
        const pick = e.target.closest('[data-wipe]');
        if (pick) { wipeKind = pick.dataset.wipe; wipeStep = 1; drawWipe(); return; }
        if (e.target.closest('#wipe-cancel')) { wipeKind = ''; wipeStep = 1; drawWipe(); return; }
        if (e.target.closest('#wipe-next')) { wipeStep = 2; drawWipe(); return; }
        if (e.target.closest('#wipe-save')) {
          try { await exportLedger(assetsOf(state.items)); }
          catch { flash('내려받지 못했어요', 'warn'); }
          return;
        }
        if (!e.target.closest('#wipe-go')) return;

        const typed = view.querySelector('#wipe-code').value.trim().toUpperCase();
        if (typed !== wipeWord().toUpperCase()) {
          view.querySelector('#wipe-err').textContent = online()
            ? '학교 코드가 달라요. 우리 학교 선생님 카드에서 확인해 주세요.'
            : '‘삭제’라고 적어 주세요.';
          return;
        }
        const spec = WIPES[wipeKind];
        const wasAll = wipeKind === 'all';
        const count = spec.count();

        // 계정 삭제는 서버에 맡기고 로그아웃까지 한다
        if (wipeKind === 'account') {
          view.querySelector('#wipe-go').disabled = true;
          sb.rpc('delete_account').then(async ({ error }) => {
            if (error) {
              console.error(error);
              view.querySelector('#wipe-err').textContent = '지우지 못했어요. 잠시 뒤 다시 해 주세요.';
              view.querySelector('#wipe-go').disabled = false;
              return;
            }
            try { localStorage.removeItem(STORE_KEY); } catch {}
            await sb.auth.signOut();
            me = null; session = null; state = blank();
            render();
            flash(spec.done());
          });
          return;
        }

        spec.run();
        wipeKind = ''; wipeStep = 1; chosen.clear();
        flash(spec.done(count));
        if (wasAll) { render(); return; }
        drawWipe();
        update();
        drawSigns();
        drawSpots();
      });

      /* ── 대여 서명 ── */
      function drawSigns() {
        const list = (state.loans || []).filter((l) => l.sign).sort((a, b) => b.outAt.localeCompare(a.outAt));
        view.querySelector('#signs-meta').textContent = list.length ? `${n(list.length)}건` : '';
        view.querySelector('#signs-body').innerHTML = list.length
          ? `<ul class="signlist">${list.map((l) => `
              <li class="signrow">
                <div class="signrow__main">
                  <p class="signrow__name">${esc(l.itemName)}${l.qty > 1 ? ` ${n(l.qty)}개` : ''}</p>
                  <p class="signrow__sub">${esc(l.who)} · ${esc(dateShort(l.outAt.slice(0, 10)))} 빌림${l.returnedAt ? ` · ${esc(whenBack(l.returnedAt))} 반납` : ''}</p>
                </div>
                <img class="signrow__img" src="${esc(l.sign)}" alt="${esc(l.who)} 서명">
              </li>`).join('')}</ul>`
          : '<p class="side-empty">물품을 빌릴 때 받은 서명이 여기에 남아요.</p>';
      }

      /* ── 우리 학교 선생님 ── */
      function drawTeam() {
        const list = view.querySelector('#team-list');
        if (!list) return;
        const pending = members.filter((m2) => m2.status === 'pending');
        const active = members.filter((m2) => m2.status === 'active');
        view.querySelector('#team-meta').textContent = pending.length ? `승인 기다림 ${pending.length}명` : `${active.length}명`;

        const row = (m2) => `
          <li class="mrow ${m2.status === 'pending' ? 'is-pending' : ''}">
            <div>
              <p class="mrow__name">${esc(m2.name || m2.email.split('@')[0])}${m2.position ? ` <span class="mrow__pos">${esc(m2.position)}</span>` : ''}${m2.role === 'admin' ? '<span class="rolechip">관리자</span>' : (m2.can_import ? '<span class="rolechip rolechip--soft">비품 담당</span>' : '')}</p>
              <p class="mrow__mail">${esc(m2.email)}</p>
            </div>
            <div class="mrow__acts">
              ${m2.status === 'pending'
                ? `<button class="mini mini--go" type="button" data-approve="${m2.id}">승인</button>
                   <button class="act act--del" type="button" data-reject="${m2.id}" aria-label="거절">${icon(ICONS.trash)}</button>`
                : m2.user_id === session?.user?.id
                  ? '<span class="mrow__tag">나</span>'
                  : `${m2.role === 'admin'
                        ? `<button class="mini mini--quiet" type="button" data-role="${m2.id}|teacher">관리자 해제</button>`
                        : `<button class="mini mini--quiet" type="button" data-imp="${m2.id}|${m2.can_import ? 'off' : 'on'}">${m2.can_import ? '비품 담당 해제' : '비품 담당'}</button>
                           <button class="mini mini--quiet" type="button" data-role="${m2.id}|admin">관리자로</button>`}
                     <button class="act act--del" type="button" data-remove="${m2.id}" aria-label="내보내기">${icon(ICONS.trash)}</button>`}
            </div>
          </li>`;

        list.innerHTML = members.length
          ? `<ul class="mlist">${[...pending, ...active].map(row).join('')}</ul>`
          : '<p class="side-empty">아직 가입한 선생님이 없어요.</p>';
      }

      view.querySelector('#who-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const next = {
          name: (fd.get('name') || '').trim() || DEFAULT_SCHOOL.name,
          address: (fd.get('address') || '').trim(),
          teacher: (fd.get('teacher') || '').trim(),
          position: fd.get('position') || DEFAULT_SCHOOL.position,
          place: (fd.get('place') || '').trim() || DEFAULT_SCHOOL.place,
          tel: (fd.get('tel') || '').trim(),
        };
        commit({ ...state, school: next });
        view.querySelector('#w-done').textContent = '저장했어요';
        flash('담당 정보를 저장했어요');
        setTimeout(() => { const el = view.querySelector('#w-done'); if (el) el.textContent = ''; }, 2200);
        renderNav('manager');
      });

      view.addEventListener('click', async (e) => {
        // 장소 한꺼번에 옮기기
        if (e.target.closest('#sp-all')) {
          const groups = spotGroups();
          if (chosen.size === groups.length) chosen.clear();
          else groups.forEach((g) => chosen.add(g.key));
          drawSpots();
          return;
        }
        if (e.target.closest('#sp-save')) {
          const b = view.querySelector('#sp-building').value.trim();
          const f = view.querySelector('#sp-floor').value.trim();
          const r = view.querySelector('#sp-room').value.trim();
          if (!b || !f || !r) { flash('건물, 층, 실을 모두 적어 주세요', 'warn'); return; }
          const storage = view.querySelector('#sp-storage').value.trim();
          const shelf = view.querySelector('#sp-shelf').value.trim();
          const ids = new Set(spotGroups().filter((g) => chosen.has(g.key)).flatMap((g) => g.ids));
          commit({
            ...state,
            items: state.items.map((it) => (ids.has(it.id)
              ? { ...it, building: b, floor: f, room: r, storage: storage || it.storage, shelf: shelf || it.shelf, updatedAt: new Date().toISOString() }
              : it)),
          });
          chosen.clear();
          flash(`${n(ids.size)}개를 ${r}(으)로 옮겼어요`);
          drawSpots();
          update();
          return;
        }

        // 구성원 관리
        const ok = e.target.closest('[data-approve]');
        const no = e.target.closest('[data-reject]') || e.target.closest('[data-remove]');
        const rl = e.target.closest('[data-role]');
        const ip = e.target.closest('[data-imp]');
        if (ok) {
          await sb.from('members').update({ status: 'active' }).eq('id', ok.dataset.approve);
        } else if (no) {
          await sb.from('members').delete().eq('id', no.dataset.reject || no.dataset.remove);
        } else if (rl) {
          const [id, role] = rl.dataset.role.split('|');
          await sb.from('members').update({ role }).eq('id', id);
        } else if (ip) {
          const [id, on] = ip.dataset.imp.split('|');
          await sb.from('members').update({ can_import: on === 'on' }).eq('id', id);
        } else if (e.target.closest('#code-copy')) {
          try { await navigator.clipboard.writeText(me.school.join_code); flash('코드를 복사했어요'); }
          catch { flash('복사하지 못했어요', 'warn'); }
          return;
        } else if (e.target.closest('#code-reset')) {
          const { data, error } = await sb.rpc('reset_join_code');
          if (!error) { me.school.join_code = data; view.querySelector('#team-code').textContent = data; flash('새 코드를 만들었어요'); }
          return;
        } else return;

        await loadMembers();
        drawTeam();
      });

      const redrawColl = () => {
        const b = view.querySelector('#coll-body');
        if (b) b.innerHTML = collectsHTML();
      };
      mountCollects(view, redrawColl);

      // 새로 고침으로 다시 그렸으면 카드를 열어 둔다
      if (keepCollOpen) {
        keepCollOpen = false;
        const f = view.querySelector('[data-fold="coll"]');
        if (f) { f.setAttribute('aria-expanded', 'true'); view.querySelector('#coll-body').hidden = false; f.closest('.fold-card').classList.add('is-open'); }
      }

      view.refresh = () => { update(); drawSigns(); drawTeam(); drawWipe(); drawSpots(); redrawColl(); };
      update();
      drawSigns();
      drawTeam();
      drawWipe();
      drawSpots();
    }

    /* ════════ 등록 (→ src/pages/add.js) ════════ */
    let draft = null;
    const emptyDraft = (keep = {}) => ({
      name: keep.name || '', category: keep.category || '', qty: 1, loanable: keep.loanable ?? true,
      asset: keep.asset ?? false, assetInfo: emptyAsset(),
      building: keep.building || '', floor: keep.floor || '', room: keep.room || '',
      storage: keep.storage || '', shelf: keep.shelf || '', memo: '', photo: '',
    });

    const uniq = (key) => [...new Set(state.items.map((i) => i[key]).filter(Boolean))];

    // 설정한 공간이 있으면 그 층을, 없으면 기본 층을 보여 준다
    function floorChoices(d) {
      const b = spaces().buildings.find((x) => x.name === d.building);
      if (!b) return FLOORS;
      // 낮은 층부터: 지하 → 1층 → 2층 …
      return floorsOf(b).slice().reverse().map((v) => ({ value: v, short: v.includes('지하') ? v.replace('지하 ', 'B').replace('층', '') : v.replace('층', '') }));
    }

    function addView(params) {
      const wanted = params.get('id');
      const target = wanted ? state.items.find((i) => i.id === wanted) : null;
      editing = target ? target.id : null;
      backTo = params.get('from') ? decodeURIComponent(params.get('from')) : '#/';
      if (!draft) {
        draft = target
          ? { ...emptyDraft(), ...target, assetInfo: { ...emptyAsset(), ...(target.assetInfo || {}) }, photo: target.photo || '' }
          : emptyDraft({
              name: params.get('name') || '',
              building: params.get('building') || '', floor: params.get('floor') || '', room: params.get('room') || '',
            });
      }
      const d = draft;
      // 학교 공간을 설정했으면 그 건물만, 아니면 쓰던 이름과 기본 예시를
      const spaceBuildings = () => (hasSpaces()
        ? [...new Set([...spaces().buildings.map((b) => b.name), ...uniq('building')])]
        : [...new Set([...uniq('building'), ...BUILDING_HINTS])]);
      const spaceRooms = (b, f) => [...new Set([
        ...spaces().rooms.filter((r) => (!b || r.building === b) && (!f || !r.floor || r.floor === f)).map((r) => r.name),
        ...uniq('room'),
      ])];
      const opts = (list) => list.map((v) => `<option value="${esc(v)}"></option>`).join('');

      return `
        <header class="top">
          <div>
            <a class="back" href="${esc(backTo)}">${icon(ICONS.back)}${esc(backLabel(backTo))}</a>
            <h1 class="top__title" tabindex="-1">${editing ? '물품 수정' : '물품 등록'}</h1>
          </div>
          ${!editing && canImport() ? `<div class="top__actions">
            <button class="btn btn--ghost" type="button" id="bulk-open">${icon(ICONS.upload)}엑셀로 한꺼번에</button>
          </div>` : ''}
        </header>

        <form class="sheet card" id="add-form" novalidate aria-labelledby="what-title">
          <h2 class="sheet__title" id="what-title">무엇인가요</h2>
          <p class="sheet__desc">선생님들이 부르는 이름 그대로 적어 주세요. <span class="req">*</span> 표시는 꼭 적어야 해요.</p>

          <div class="field">
            <label class="field__label" for="f-name">물품 이름<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            <input class="input" id="f-name" name="name" placeholder="예: 휴대용 빔프로젝터" autocomplete="off" value="${esc(d.name)}" aria-describedby="e-name">
            <p class="field__error" id="e-name"></p>
          </div>

          <fieldset class="field">
            <legend class="field__label">분류 <small>선택</small></legend>
            <div class="choices">
              ${CATEGORIES.map((c) => `<label class="choice"><input type="radio" name="category" value="${esc(c)}" ${d.category === c ? 'checked' : ''}><span>${esc(c)}</span></label>`).join('')}
            </div>
          </fieldset>

          <div class="row row--qty" style="margin-top:16px">
            <div class="field">
              <label class="field__label" for="f-qty">수량<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
              <div class="stepper">
                <button type="button" data-step="-1" aria-label="하나 빼기" ${d.qty <= 1 ? 'disabled' : ''}>${icon(ICONS.minus)}</button>
                <input id="f-qty" name="qty" type="number" inputmode="numeric" min="1" max="9999" value="${d.qty}" class="num">
                <button type="button" data-step="1" aria-label="하나 더하기">${icon(ICONS.add)}</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="switch">
              <span>대여 가능 여부</span>
              <input type="checkbox" name="loanable" ${d.loanable ? 'checked' : ''}>
              <span class="switch__track" aria-hidden="true"></span>
            </label>
          </div>

          <div class="field">
            <label class="switch">
              <span>비품 여부</span>
              <input type="checkbox" name="asset" id="f-asset" aria-controls="asset-fields" aria-expanded="${d.asset}" ${d.asset ? 'checked' : ''}>
              <span class="switch__track" aria-hidden="true"></span>
            </label>
            <div class="assetbox" id="asset-fields" ${d.asset ? '' : 'hidden'}>
              <p class="assetbox__lead">비품 대장에 적는 내용이에요. 아는 것만 적어도 돼요.</p>
              ${assetFieldsHTML(d)}
            </div>
          </div>

          <div class="field">
            <span class="field__label">사진 <small>선택</small></span>
            <label class="photo" id="photo-box">
              <input type="file" id="f-photo" accept="image/*">
              <span class="photo__icon">${d.photo ? `<img src="${esc(d.photo)}" alt="">` : icon(ICONS.camera)}</span>
              <span class="photo__text">${d.photo ? '사진을 넣었어요<small>눌러서 바꿀 수 있어요</small>' : '보관 위치 사진 추가<small>보관함이나 선반을 찍어 두면 찾기 쉬워요</small>'}</span>
              <span class="photo__busy">사진 넣는 중…</span>
              ${d.photo ? '<button class="photo__remove" type="button" id="photo-remove">빼기</button>' : ''}
            </label>
            <p class="field__error" id="e-photo"></p>
          </div>
        </form>

        <section class="sheet card" aria-labelledby="where-title">
          <h2 class="sheet__title" id="where-title">어디에 있나요</h2>
          <p class="sheet__desc">자세히 입력하면 나중에 쉽게 찾을 수 있어요. <span class="req">*</span> 표시는 꼭 적어야 해요.</p>

          <div class="field">
            <label class="field__label" for="f-building">건물<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            ${hasSpaces() ? `<div class="pickchips" id="b-chips">
              ${spaces().buildings.map((b) => `<button class="pickchip ${d.building === b.name ? 'is-on' : ''}" type="button" data-pickb="${esc(b.name)}">${esc(b.name)}</button>`).join('')}
            </div>` : ''}
            <input class="input" id="f-building" name="building" form="add-form" list="l-building" placeholder="${hasSpaces() ? '위에서 고르거나 직접 적기' : '예: 본관'}" autocomplete="off" value="${esc(d.building)}" aria-describedby="e-building">
            <datalist id="l-building">${opts(spaceBuildings())}</datalist>
            <p class="field__error" id="e-building"></p>
          </div>

          <fieldset class="field">
            <legend class="field__label">층<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></legend>
            <div class="floors" id="floors">
              ${floorChoices(d).map((f) => `<label class="choice"><input type="radio" name="floor" form="add-form" value="${esc(f.value)}" ${d.floor === f.value ? 'checked' : ''} aria-label="${esc(f.value)}"><span>${esc(f.short)}</span></label>`).join('')}
            </div>
            <p class="field__error" id="e-floor"></p>
          </fieldset>

          <div class="field">
            <label class="field__label" for="f-room">실<span class="req" aria-hidden="true">*</span><span class="sr-only">필수</span></label>
            <div class="pickchips" id="r-chips"></div>
            <input class="input" id="f-room" name="room" form="add-form" list="l-room" placeholder="${hasSpaces() ? '위에서 고르거나 직접 적기' : '예: 과학 준비실'}" autocomplete="off" value="${esc(d.room)}" aria-describedby="e-room">
            <datalist id="l-room">${opts(spaceRooms(d.building, d.floor))}</datalist>
            <p class="field__error" id="e-room"></p>
          </div>

          <div class="row" style="margin-top:16px">
            <div class="field">
              <label class="field__label" for="f-storage">보관함 <small>선택</small></label>
              <input class="input" id="f-storage" name="storage" form="add-form" list="l-storage" placeholder="예: 2번 캐비닛" autocomplete="off" value="${esc(d.storage)}">
              <datalist id="l-storage">${opts(uniq('storage'))}</datalist>
            </div>
            <div class="field">
              <label class="field__label" for="f-shelf">칸 <small>선택</small></label>
              <input class="input" id="f-shelf" name="shelf" form="add-form" placeholder="예: 위에서 2칸" autocomplete="off" value="${esc(d.shelf)}">
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="f-memo">찾는 분께 한마디 <small>선택</small></label>
            <textarea class="input" id="f-memo" name="memo" form="add-form" placeholder="예: 파란 상자 안에 있어요. 열쇠는 행정실에 있어요.">${esc(d.memo)}</textarea>
          </div>
        </section>

        <aside class="preview" aria-label="안내 미리보기">
          <div id="preview"></div>
          <div class="preview__foot">
            <p class="preview__done" id="preview-done" aria-live="polite"></p>
            <button class="save" type="submit" form="add-form">${editing ? '수정 저장' : '등록하기'}</button>
            ${editing ? `<div class="preview__danger" data-danger></div>` : ''}
          </div>
        </aside>

        ${editing ? `<div class="dangerbar" data-danger></div>` : ''}

        <div class="savebar" id="savebar">
          <div class="savebar__info" aria-live="polite">
            <p class="savebar__name" id="sb-name"></p>
            <p class="savebar__path" id="sb-path"></p>
          </div>
          <button class="btn btn--solid" type="submit" form="add-form">${editing ? '수정 저장' : '등록하기'}</button>
        </div>`;
    }

    function assetFieldsHTML(d) {
      const a = d.assetInfo || emptyAsset();
      const one = (f) => {
        const id = `a-${f.key}`;
        const common = `id="${id}" name="a_${f.key}" form="add-form" value="${esc(a[f.key])}"` +
          (f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : '') +
          (f.inputmode ? ` inputmode="${f.inputmode}"` : '') +
          ' autocomplete="off"';
        const control = f.area
          ? `<textarea class="input" id="${id}" name="a_${f.key}" form="add-form" placeholder="${esc(f.placeholder)}">${esc(a[f.key])}</textarea>`
          : f.unit
            ? `<span class="suffix"><input class="input num" type="text" ${common}><span class="suffix__unit">${esc(f.unit)}</span></span>`
            : `<input class="input${f.type === 'date' ? '' : ''}" type="${f.type || 'text'}" ${common}>`;
        return `<div class="field"><label class="field__label" for="${id}">${esc(f.label)}</label>${control}</div>`;
      };
      // 짧은 칸 두 개씩 나란히, 긴 칸은 한 줄로
      const out = [];
      for (let i = 0; i < ASSET_FIELDS.length; i++) {
        const f = ASSET_FIELDS[i];
        if (f.wide) { out.push(one(f)); continue; }
        const next = ASSET_FIELDS[i + 1];
        if (next && !next.wide) { out.push(`<div class="row">${one(f)}${one(next)}</div>`); i++; }
        else out.push(one(f));
      }
      return out.join('');
    }

    let editing = null;   // 수정 중인 물품 id
    let backTo = '#/';    // 마치고 돌아갈 화면
    const backLabel = (href) => (
      href.startsWith('#/search') ? '찾기'
      : href.startsWith('#/places') ? '장소별 보기'
      : href.startsWith('#/ledger') ? '비품 대장'
      : '홈');

    let lastSaved = '';

    function renderPreview(view) {
      const d = draft;
      const steps = PATH_KINDS.map((k) => ({ ...k, value: d[k.key] }));
      const lastSet = Math.max(-1, ...steps.map((s, i) => (s.value ? i : -1)));
      view.querySelector('#preview').innerHTML = `
        <p class="preview__label">이렇게 안내돼요</p>
        <p class="preview__name ${d.name ? '' : 'is-empty'}">${esc(d.name || '물품 이름')}</p>
        <p class="preview__qty num">${n(d.qty || 1)}개${d.category ? ` · ${esc(d.category)}` : ''}${d.asset ? ' · 비품' : ''}${d.loanable ? '' : ' · 대여 불가'}</p>
        <ol class="path">
          ${steps.map((s, i) => `
            <li class="path__step ${s.value ? 'is-set' : ''} ${i === lastSet ? 'is-last' : ''}">
              <span class="path__dot" aria-hidden="true"></span>
              <span><span class="path__kind">${esc(s.label)}</span><br><span class="path__value">${esc(s.value || '아직 비어 있어요')}</span></span>
            </li>`).join('')}
        </ol>
        ${d.memo ? `<p class="preview__memo">${esc(d.memo)}</p>` : ''}
        ${d.photo ? `<img class="preview__photo" src="${esc(d.photo)}" alt="보관 위치 사진">` : ''}`;
      const doneBox = view.querySelector('#preview-done');
      doneBox.innerHTML = lastSaved ? `${icon(ICONS.check)}<span>${esc(lastSaved)}</span>` : '';

      const path = pathOf(d);
      view.querySelector('#sb-name').textContent = d.name || '물품 이름을 적어 주세요';
      const sbPath = view.querySelector('#sb-path');
      const done = Boolean(lastSaved && !d.name);
      sbPath.textContent = done ? lastSaved : (path.length ? path.join(' › ') : '위치를 적으면 여기에 경로가 보여요');
      sbPath.classList.toggle('is-done', done);

      const dangerHTML = pendingDelete === editing
        ? `<div class="dconfirm">
             <p class="dconfirm__q">정말 지울까요?</p>
             <div class="dconfirm__row">
               <button class="dconfirm__yes" type="button" data-del-yes="${editing}">지우기</button>
               <button class="dconfirm__no" type="button" data-del-cancel>그만두기</button>
             </div>
           </div>`
        : `<button class="danger" type="button" data-del="${editing}">${icon(ICONS.trash)}이 물품 지우기</button>`;
      for (const slot of view.querySelectorAll('[data-danger]')) slot.innerHTML = dangerHTML;
    }

    function readForm(form) {
      const fd = new FormData(form);
      return {
        ...draft,
        name: (fd.get('name') || '').trim(),
        category: fd.get('category') || '',
        qty: Math.min(9999, Math.max(1, parseInt(fd.get('qty'), 10) || 1)),
        loanable: fd.get('loanable') === 'on',
        asset: fd.get('asset') === 'on',
        assetInfo: Object.fromEntries(ASSET_FIELDS.map((f) => [f.key, (fd.get('a_' + f.key) || '').trim()])),
        building: (fd.get('building') || '').trim(),
        floor: fd.get('floor') || '',
        room: (fd.get('room') || '').trim(),
        storage: (fd.get('storage') || '').trim(),
        shelf: (fd.get('shelf') || '').trim(),
        memo: (fd.get('memo') || '').trim(),
      };
    }

    const RULES = [
      { key: 'name',     msg: '물품 이름을 적어 주세요', focus: '#f-name' },
      { key: 'building', msg: '건물을 적어 주세요',       focus: '#f-building' },
      { key: 'floor',    msg: '층을 골라 주세요',         focus: '#floors input' },
      { key: 'room',     msg: '실 이름을 적어 주세요',    focus: '#f-room' },
    ];

    function showErrors(view, errors) {
      for (const r of RULES) {
        const has = errors.includes(r.key);
        view.querySelector(`#e-${r.key}`).textContent = has ? r.msg : '';
        if (r.key === 'floor') view.querySelector('#floors').classList.toggle('is-invalid', has);
        else view.querySelector(r.focus).setAttribute('aria-invalid', has ? 'true' : 'false');
      }
    }

    // 사진은 긴 변 640px JPEG로 줄여서 저장 공간을 아낀다.
    function shrinkPhoto(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 640 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
        img.src = url;
      });
    }

    function mountAdd(view) {
      view.querySelector('#bulk-open')?.addEventListener('click', () => {
        openItemImport((count) => { draft = null; render(); flash(`${n(count)}개를 등록했어요`); });
      });

      const form = view.querySelector('#add-form');
      let tried = false;

      const assetBox = view.querySelector('#asset-fields');
      const assetSwitch = view.querySelector('#f-asset');

      let shownFloors = '';
      let shownRooms = '';
      view.addEventListener('click', (e) => {
        const bc = e.target.closest('[data-pickb]');
        if (bc) {
          const box = view.querySelector('#f-building');
          box.value = bc.dataset.pickb;
          box.dispatchEvent(new Event('input', { bubbles: true }));
          return;
        }
        const rc = e.target.closest('[data-pickr]');
        if (rc) {
          const box = view.querySelector('#f-room');
          box.value = rc.dataset.pickr;
          box.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });

      const sync = () => {
        draft = readForm(form);
        // 건물 칩 표시
        for (const b of view.querySelectorAll('[data-pickb]')) b.classList.toggle('is-on', b.dataset.pickb === draft.building);
        // 그 건물·층에 설정한 실을 칩으로
        const roomNames = hasSpaces()
          ? spaces().rooms.filter((r) => r.building === draft.building && (!draft.floor || !r.floor || r.floor === draft.floor)).map((r) => r.name)
          : [];
        const rKey = roomNames.join('|') + '#' + draft.room;
        if (rKey !== shownRooms) {
          shownRooms = rKey;
          const rc = view.querySelector('#r-chips');
          if (rc) {
            rc.innerHTML = roomNames.slice(0, 30).map((nm) => `<button class="pickchip ${draft.room === nm ? 'is-on' : ''}" type="button" data-pickr="${esc(nm)}">${esc(nm)}</button>`).join('');
            rc.hidden = !roomNames.length;
          }
          const dl = view.querySelector('#l-room');
          if (dl) dl.innerHTML = [...new Set([...roomNames, ...uniq('room')])].map((v) => `<option value="${esc(v)}"></option>`).join('');
        }
        // 건물을 바꾸면 그 건물의 층으로 갈아 끼운다
        const list = floorChoices(draft);
        const key = list.map((f) => f.value).join('|');
        if (key !== shownFloors) {
          shownFloors = key;
          view.querySelector('#floors').innerHTML = list.map((f) => `
            <label class="choice"><input type="radio" name="floor" form="add-form" value="${esc(f.value)}" ${draft.floor === f.value ? 'checked' : ''} aria-label="${esc(f.value)}"><span>${esc(f.short)}</span></label>`).join('');
        }
        assetBox.hidden = !draft.asset;
        assetSwitch.setAttribute('aria-expanded', String(draft.asset));
        // 비품명을 비워 두면 물품 이름을 그대로 쓴다고 알려 준다
        const nm = draft.name;
      view.querySelector('#a-name').placeholder = nm
        ? `비우면 ‘${nm}’${josa(nm, '으로/로').slice(nm.length)} 적어요`
        : '대장에 적힌 이름';
        view.querySelector('[data-step="-1"]').disabled = draft.qty <= 1;
        if (tried) showErrors(view, RULES.filter((r) => !draft[r.key]).map((r) => r.key));
        if (draft.name) lastSaved = '';
        renderPreview(view);
      };

      // 단가는 치는 동안 세 자리마다 쉼표를 넣는다
      view.querySelector('#a-price').addEventListener('input', (e) => {
        const digits = e.target.value.replace(/[^\d]/g, '').slice(0, 12);
        e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      });

      view.addEventListener('input', sync);
      view.addEventListener('change', sync);

      view.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
        const input = view.querySelector('#f-qty');
        input.value = Math.min(9999, Math.max(1, (parseInt(input.value, 10) || 1) + Number(b.dataset.step)));
        sync();
      }));

      view.querySelector('#f-photo').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const box = view.querySelector('#photo-box');
        const err = view.querySelector('#e-photo');
        err.textContent = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          err.textContent = '사진 파일만 넣을 수 있어요.';
          return;
        }
        box.classList.add('is-busy');
        try {
          const photo = await shrinkPhoto(file);
          // await 뒤에는 draft가 다른 객체로 바뀌어 있을 수 있으니, 그때 다시 읽어서 넣는다
          draft = { ...draft, photo };
          render();
        } catch {
          box.classList.remove('is-busy');
          err.textContent = '이 사진은 열 수 없어요. 다른 사진을 골라 주세요.';
        }
      });
      const remove = view.querySelector('#photo-remove');
      if (remove) remove.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation(); // 라벨을 눌러 파일 창이 열리지 않게
        draft = { ...draft, photo: '' };
        render();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        tried = true;
        draft = readForm(form);
        const errors = RULES.filter((r) => !draft[r.key]).map((r) => r.key);
        showErrors(view, errors);
        if (errors.length) {
          view.querySelector(RULES.find((r) => r.key === errors[0]).focus).focus();
          return;
        }

        const old = editing ? state.items.find((i) => i.id === editing) : null;
        const item = {
          ...draft,
          id: old ? old.id : newId(),
          createdAt: old ? old.createdAt : new Date().toISOString(),
          ...(old ? { updatedAt: new Date().toISOString() } : {}),
        };
        if (!item.photo) delete item.photo;
        if (item.asset) {
          item.assetInfo = { ...item.assetInfo, name: item.assetInfo.name || item.name };
        } else {
          delete item.assetInfo;
        }

        try {
          commit({
            ...state,
            items: old ? state.items.map((i) => (i.id === old.id ? item : i)) : [...state.items, item],
          });
        } catch {
          view.querySelector('#e-photo').textContent = '저장 공간이 부족해요. 사진을 빼고 다시 저장해 주세요.';
          return;
        }

        if (old) {
          flash(`‘${item.name}’ 수정했어요`);
          draft = null; editing = null;
          location.hash = backTo;   // 왔던 화면으로 돌아간다
          return;
        }

        lastSaved = `‘${item.name}’ 등록했어요`;
        flash(`‘${item.name}’ 등록했어요`);
        draft = emptyDraft({ ...item, name: '' }); // 위치·분류·비품 여부는 남기고 나머지는 비운다
        render();
        document.getElementById('f-name').focus({ preventScroll: true });
      });

      renderPreview(view);
    }

    /* ════════ 화면 전환 ════════ */
    const ROUTES = {
      '#/':       { key: 'home', view: homeView,   mount: mountHome,   title: '학교 물품 어디 있지?' },
      '#/search': { key: 'find', view: searchView, mount: mountSearch, title: '찾기 · 학교 물품 어디 있지?' },
      '#/places': { key: 'place', view: placesView, mount: mountPlaces, title: '장소별 보기 · 학교 물품 어디 있지?' },
      '#/rent':   { key: 'rent', view: rentView,  mount: mountRent, title: '대여 · 학교 물품 어디 있지?' },
      '#/lend':   { key: 'rent', view: lendView,  mount: mountLend, title: '빌리기 · 학교 물품 어디 있지?' },
      '#/ledger': { key: 'ledger', view: ledgerView, mount: mountLedger, title: '비품 대장 · 학교 물품 어디 있지?' },
      '#/handover': { key: 'handover', view: handoverView, mount: mountHandover, title: '인수인계 · 학교 물품 어디 있지?' },
      '#/manager': { key: 'manager', view: managerView, mount: mountManager, title: '관리 담당 선생님 · 학교 물품 어디 있지?' },
      '#/add':    { key: 'add',  view: addView,    mount: mountAdd,    title: '물품 등록 · 학교 물품 어디 있지?' },
    };
    const parseHash = () => {
      const [path, qs = ''] = (location.hash || '#/').split('?');
      return { path, params: new URLSearchParams(qs) };
    };

    // 로그인·학교 상태에 따라 앱 대신 안내 화면을 보여 준다
    function gateKind() {
      if (bootError) return 'error';
      if (!online()) return null;              // 혼자 쓰기 모드
      if (!session) return 'login';
      if (!me) return gateMode === 'create' ? 'create' : 'start';
      if (me.status !== 'active') return 'pending';
      return null;
    }

    function render(focus = false) {
      const app = document.getElementById('app');
      const gateRoot = document.getElementById('gate');

      // 물품 모으기 링크는 로그인 없이 연다
      if (location.hash.startsWith('#/give')) {
        app.hidden = true;
        gateRoot.hidden = false;
        gateRoot.className = 'gate';
        const code = new URLSearchParams(location.hash.split('?')[1] || '').get('c');
        document.title = '물품 내기 · 학교 물품 어디 있지?';
        if (gateRoot.dataset.give !== code) {
          gateRoot.dataset.give = code || '';
          const fresh = gateRoot.cloneNode(false);
          gateRoot.replaceWith(fresh);
          mountGive(fresh, code);
        }
        return;
      }

      const gate = gateKind();
      app.hidden = Boolean(gate);
      gateRoot.hidden = !gate;
      if (gate) {
        gateRoot.className = 'gate';
        gateRoot.innerHTML = gateView(gate);
        mountGate(gateRoot, gate);
        document.title = '학교 물품 어디 있지?';
        return;
      }

      const { path, params } = parseHash();
      const route = ROUTES[path] || ROUTES['#/'];
      // 화면을 새 요소로 갈아 끼운다. 지난 화면에 걸어 둔 이벤트가 남지 않게.
      const old = document.getElementById('view');
      const view = old.cloneNode(false);
      old.replaceWith(view);
      if (route.key === 'manager' && !isAdmin()) { location.hash = '#/'; return; }
      if (route.key === 'handover' && (!canImport() || missingTables.has('handovers'))) { location.hash = '#/'; return; }
      view.className = 'main is-' + route.key + (path === '#/lend' ? ' is-add' : '');
      document.body.classList.toggle('is-add', route.key === 'add' || path === '#/lend');
      document.body.classList.toggle('is-room', route.key === 'place' && state.items.length > 0);
      view.innerHTML = route.view(params);
      route.mount(view, params);
      // 수정 중에는 왼쪽 메뉴의 '등록'을 켜 두지 않는다
      renderNav(route.key === 'add' && editing ? '' : route.key);
      document.title = route.title;
      if (focus) {
        view.scrollTop = 0; window.scrollTo(0, 0);
        const fine = matchMedia('(pointer: fine)').matches;
        let target = view.querySelector('.top__title');
        if (fine && route.key === 'add') target = view.querySelector('#f-name');
        // 검색어 없이 들어오면 바로 입력하게, 검색어를 들고 오면 결과를 먼저 보게
        if (route.key === 'find' && (fine || !params.get('q'))) target = view.querySelector('#s-q');
        target.focus({ preventScroll: true });
        if (target.id === 's-q') target.setSelectionRange(target.value.length, target.value.length);
      }
    }

    window.addEventListener('hashchange', () => {
      draft = null; lastSaved = ''; pendingDelete = null; askFix = null;
      if (!location.hash.startsWith('#/lend')) lend = null;
      render(true);
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="spaces"]')) { openSpaces(); return; }

      // 수정하기
      const edit = e.target.closest('[data-edit]');
      if (edit) {
        pendingDelete = null;
        location.hash = `#/add?id=${encodeURIComponent(edit.dataset.edit)}&from=${encodeURIComponent(location.hash || '#/')}`;
        return;
      }
      // 지우기: 한 번 더 물어본다
      const del = e.target.closest('[data-del]');
      if (del) { pendingDelete = del.dataset.del; refreshView(); return; }
      if (e.target.closest('[data-del-cancel]')) { pendingDelete = null; refreshView(); return; }
      const yes = e.target.closest('[data-del-yes]');
      if (yes) {
        const id = yes.dataset.delYes;
        const gone = state.items.find((i) => i.id === id);
        commit({ ...state, items: state.items.filter((i) => i.id !== id) });
        pendingDelete = null;
        flash(gone ? `‘${gone.name}’ 지웠어요` : '지웠어요');
        if (editing === id) { draft = null; editing = null; location.hash = backTo; }
        else refreshView();
        return;
      }

      // 반납: 먼저 수리가 필요한지 묻는다
      const ret = e.target.closest('[data-return]');
      if (ret) { askFix = ret.dataset.return; refreshView(); return; }
      if (e.target.closest('[data-fixcancel]')) { askFix = null; refreshView(); return; }

      const fix = e.target.closest('[data-fix]') || e.target.closest('[data-nofix]');
      if (fix) {
        const needFix = Boolean(fix.dataset.fix);
        const id = fix.dataset.fix || fix.dataset.nofix;
        const loan = (state.loans || []).find((l) => l.id === id);
        const next = {
          ...state,
          loans: state.loans.map((l) => (l.id === id ? { ...l, returnedAt: new Date().toISOString() } : l)),
          items: needFix && loan
            ? state.items.map((it) => (it.id === loan.itemId ? { ...it, repair: true, updatedAt: new Date().toISOString() } : it))
            : state.items,
        };
        commit(next);
        askFix = null;
        flash(needFix
          ? `${loan ? loan.itemName : '물품'} 반납했어요. 수리 필요로 표시했어요`
          : `${loan ? loan.itemName : '물품'} 반납 처리했어요`);
        refreshView();
        return;
      }

      // 찾았어요
      const found = e.target.closest('[data-found]');
      if (found) {
        const id = found.dataset.found;
        const it = state.items.find((x) => x.id === id);
        commit({ ...state, items: state.items.map((x) => (x.id === id ? { ...x, lost: false, updatedAt: new Date().toISOString() } : x)) });
        flash(`${it ? it.name : '물품'} 찾음으로 바꿨어요`);
        refreshView();
        return;
      }

      // 고쳤어요
      const fixed = e.target.closest('[data-fixed]');
      if (fixed) {
        const id = fixed.dataset.fixed;
        const it = state.items.find((x) => x.id === id);
        commit({ ...state, items: state.items.map((x) => (x.id === id ? { ...x, repair: false, updatedAt: new Date().toISOString() } : x)) });
        flash(`${it ? it.name : '물품'} 수리 표시를 풀었어요`);
        refreshView();
        return;
      }
      const ldel = e.target.closest('[data-loan-del]');
      if (ldel) {
        const target = (state.loans || []).find((l) => l.id === ldel.dataset.loanDel);
        if (target && !canDropLoan(target)) { flash('빌린 본인이나 관리자만 지울 수 있어요', 'warn'); return; }
        pendingDelete = ldel.dataset.loanDel;
        refreshView();
        return;
      }
      const lyes = e.target.closest('[data-loan-del-yes]');
      if (lyes) {
        const target = (state.loans || []).find((l) => l.id === lyes.dataset.loanDelYes);
        if (target && !canDropLoan(target)) { flash('빌린 본인이나 관리자만 지울 수 있어요', 'warn'); return; }
        commit({ ...state, loans: state.loans.filter((l) => l.id !== lyes.dataset.loanDelYes) });
        pendingDelete = null;
        flash('기록을 지웠어요');
        refreshView();
        return;
      }

      if (e.target.closest('[data-soon]')) {
        const view = document.getElementById('view');
        if (view.notify) view.notify('이 기능은 다음 단계에서 연결돼요');
      }
    });

    // 어디서든 / 를 누르면 검색창으로
    document.addEventListener('keydown', (e) => {
      if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      e.preventDefault();
      const box = document.getElementById('s-q') || document.getElementById('q');
      if (box) box.focus(); else location.hash = '#/search';
    });

    async function boot() {
      try {
        await initSupabase();
        await loadMe();
        await loadData();
      } catch (e) {
        console.error(e);
        bootError = String(e?.message || e);
      }
      render();
    }
    // 손가락으로 눌러도 아이콘이 한 번 움직이도록
    document.addEventListener('pointerdown', (e) => {
      const it = e.target.closest?.('.rail__item[data-key], .tabbar__item');
      if (!it) return;
      it.classList.remove('is-wiggle');
      void it.offsetWidth;          // 다시 재생시키기
      it.classList.add('is-wiggle');
      setTimeout(() => it.classList.remove('is-wiggle'), 600);
    }, { passive: true });

    // 화면 아래 학교 이름 옆에 판 번호를 적어 둔다 (새 파일이 올라갔는지 확인용)
    console.log('학교 물품 어디 있지? · 2026-09-23 판');

    boot();
  </script>
</body>
</html>
