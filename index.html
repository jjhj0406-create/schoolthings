    const emptySpaces = () => ({ buildings: [], rooms: [] });
    const spaces = () => {
      const sp = school().spaces;
      return sp && Array.isArray(sp.buildings) ? sp : emptySpaces();
    };
    const hasSpaces = () => spaces().buildings.length > 0;

    // 지하 n층 ~ 지상 n층을 위에서 아래 순서로 만든다
    function floorsOf(b) {
      const out = [];
      for (let i = Number(b.up) || 1; i >= 1; i--) out.push(`${i}층`);
      for (let i = 1; i <= (Number(b.down) || 0); i++) out.push(`지하 ${i}층`);
      return out;
    }
    const roomsOf = (building, floor) => spaces().rooms
      .filter((r) => r.building === building && (!floor || !r.floor || r.floor === floor));

    // 다르게 부르는 이름으로도 찾을 수 있게
    function roomAliasMap() {
      const map = new Map();
      for (const r of spaces().rooms) {
        for (const a of r.aliases || []) map.set(a, r.name);
      }
      return map;
    }

    /* ── 글에서 실 이름 뽑아내기 ── */
    // "3층 - 과학실, 음악실" 같은 흔한 모양을 규칙으로 읽는다
    function parseRooms(text) {
      const found = [];
      const seen = new Set();
      const push = (name, floor) => {
        const n2 = name.trim().replace(/^[-–·•*\d.)\s]+/, '').replace(/[,.·]+$/, '').trim();
        if (n2.length < 2 || n2.length > 20 || seen.has(n2)) return;
        if (/^(층|실|호|건물|구분|번호|비고|합계|계)$/.test(n2)) return;
        seen.add(n2);
        found.push({ name: n2, floor: floor || '' });
      };
      for (const rawLine of String(text).split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line) continue;
        const m = line.match(/(지하\s*\d+\s*층|B\d|\d+\s*층)\s*[:\-–|\t]?\s*(.*)$/i);
        if (m && m[2]) {
          const floor = m[1].replace(/\s+/g, '').replace(/^B(\d)$/i, '지하 $1층').replace(/^(\d+)층$/, '$1층');
          m[2].split(/[,،/|\t]+/).forEach((part) => push(part, floor));
        } else {
          line.split(/[,،/|\t]{1,}/).forEach((part) => {
            if (/(실|관|창고|교실|센터|반)$/.test(part.trim())) push(part, '');
          });
        }
      }
      return found;
    }

    // 비품 대장에 적힌 장소를 후보로 모은다
    function roomsFromLedger() {
      const count = new Map();
      for (const it of state.items) {
        const raw = it.assetInfo?.place || it.assetInfo?.dept || '';
        for (const part of raw.split(/[,、/]+/)) {
          const name = part.trim();
          if (name.length < 2 || name.length > 20) continue;
          if (/^\d/.test(name)) continue;          // 4-1,4-2 같은 반 표기는 뺀다
          count.set(name, (count.get(name) || 0) + it.qty);
        }
      }
      return [...count.entries()]
        .sort((a, b) => b[1] - a[1])
        .map(([name, qty]) => ({ name, qty }));
    }

    /* ── 배치도에서 실 이름 뽑기 ── */
    const PLAN_SKIP = new Set(['계단', '화장실', '엘리베이터', '복도', '창고', '정문', '중정', '주차장',
      '주출입구', '부출입구', '중앙현관', '학급배치도', '교실배치도', '학년도', '학기교실']);

    function parsePlanText(text) {
      const found = [];
      const seen = new Set();
      const push = (name, floor = '') => {
        const n2 = name.trim();
        if (n2.length < 2 || n2.length > 14 || seen.has(n2) || PLAN_SKIP.has(n2)) return;
        if (/학기|배치도/.test(n2)) return;
        seen.add(n2);
        found.push({ name: n2, floor });
      };

      for (const rawLine of String(text).split(/\r?\n/)) {
        const line = rawLine
          .replace(/\([^)]*\)/g, ' ')                       // 괄호 설명은 버린다
          .replace(/([가-힣])\s+(?=[가-힣])/g, '$1')          // 낱자 사이 공백을 붙인다
          .trim();
        if (!line) continue;

        const fm = line.match(/(지하\s*\d+|B\d|\d+)\s*(F|층)/i);
        const floor = fm ? (/지하|B/i.test(fm[1]) ? `지하 ${fm[1].replace(/\D/g, '')}층` : `${fm[1]}층`) : '';

        // 붙어 있는 학급 표기를 하나씩 끊는다: 5-25-35-4 → 5-2 · 5-3 · 5-4
        for (const m of line.matchAll(/(\d{1,2})-(\d{1,2})(?=(?:\d{1,2}-|[^\d-]|$))/g)) {
          push(`${m[1]}-${m[2]}`, floor);
        }
        // 붙어 있는 실 이름을 끊는다: 실과실준비실컴퓨터실 → 실과실 · 준비실 · 컴퓨터실
        for (const m of line.matchAll(/([가-힣]{1,7}?)(교실|각실|실|관|당)/g)) {
          push((m[1] + m[2]).replace(/^\d+-\d+/, ''), floor);
        }
      }
      return found;
    }

    // PDF 안에 글자가 있으면 서버 없이 그 자리에서 읽는다
    async function readPdfText(file) {
      const base = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/';
      const pdfjs = await import(base + 'pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
      const doc = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
      let out = '';
      for (let i = 1; i <= Math.min(doc.numPages, 5); i++) {
        const page = await doc.getPage(i);
        const content = await page.getTextContent();
        let last = null;
        for (const item of content.items) {
          const y = Math.round(item.transform[5]);
          if (last !== null && Math.abs(y - last) > 3) out += '\n';
          out += item.str;
          last = y;
        }
        out += '\n';
      }
      return out;
    }

    /* ── 설정 화면 ── */
    let wizOpen = false;
    let wizAt = 0;           // 지금 몇 번째 화면인지
    let wiz = null;          // { buildings:[{name,down,up}], rooms:[{building,floor,name,aliases}] }
    let wizPick = null;      // 이름을 고르는 중인 칩
    let wizMsg = '';         // 배치도 읽기 알림
    let wizReading = false;
    let probeMsg = '';   // AI 연결 확인 결과

    // 건물과 층이 정해지면 화면 목록이 만들어진다
    function wizPages() {
      const pages = [{ kind: 'buildings' }, { kind: 'floors' }, { kind: 'upload' }];
      for (const b of wiz.buildings) {
        // 낮은 층부터 올라간다 (지하 → 1층 → 2층 …)
        for (const f of floorsOf(b).slice().reverse()) pages.push({ kind: 'floor', building: b.name, floor: f });
      }
      pages.push({ kind: 'done' });
      return pages;
    }

    // AI가 적어 준 건물 이름을 설정한 건물과 맞춘다. 없으면 새로 만든다.
    function matchBuilding(name) {
      const nm = String(name || '').trim();
      if (!nm) {
        if (!wiz.buildings.length) wiz.buildings.push({ name: '본관', down: 0, up: 1 });
        return wiz.buildings[0];
      }
      const near = wiz.buildings.find((b) => b.name === nm)
        || wiz.buildings.find((b) => b.name.includes(nm) || nm.includes(b.name))
        || wiz.buildings.find((b) => b.name.slice(0, 2) === nm.slice(0, 2));
      if (near) return near;
      const made = { name: nm, down: 0, up: 1 };
      wiz.buildings.push(made);
      return made;
    }

    // 층 표기를 맞추고, 건물 층수보다 높으면 층수를 늘린다
    function placeFloor(b, raw) {
      const t = String(raw || '').replace(/\s+/g, '');
      const down = t.match(/^(?:지하|B)(\d+)/i);
      if (down) { b.down = Math.max(b.down || 0, Number(down[1])); return `지하 ${down[1]}층`; }
      const up = t.match(/^(\d+)(?:층|F)?$/i);
      if (up) { b.up = Math.max(b.up || 1, Number(up[1])); return `${up[1]}층`; }
      return '';
    }

    function openSpaces() {
      const sp = spaces();
      const used = [...new Set(state.items.map((i) => i.building).filter(Boolean))];
      wiz = {
        buildings: sp.buildings.length
          ? sp.buildings.map((b) => ({ ...b }))
          : used.map((name) => ({ name, down: 0, up: 4 })),
        rooms: sp.rooms.map((r) => ({ ...r })),
      };
      wizAt = 0; wizPick = null; wizMsg = ''; wizOpen = true;
      drawWiz();
    }

    function closeSpaces(force = false) {
      if (!force && wizAt > 0 && wiz?.buildings.length) {
        if (!confirm('설정을 그만둘까요? 지금까지 저장한 내용은 남아 있어요.')) return;
      }
      wizOpen = false; wiz = null;
      document.getElementById('wizroot').innerHTML = '';
      document.body.classList.remove('is-wiz');
    }

    function saveSpaces() {
      commit({ ...state, school: { ...school(), spaces: { buildings: wiz.buildings, rooms: wiz.rooms } } });
    }

    function drawWiz() {
      const root = document.getElementById('wizroot');
      if (!wizOpen) { root.innerHTML = ''; return; }
      document.body.classList.add('is-wiz');

      const pages = wizPages();
      wizAt = Math.max(0, Math.min(wizAt, pages.length - 1));
      const page = pages[wizAt];
      const pct = Math.round(((wizAt + 1) / pages.length) * 100);

      root.innerHTML = `
        <div class="wizback">
          <div class="wizbox" role="dialog" aria-modal="true" aria-labelledby="wiz-title">
            <div class="wizbar">
              <span class="wizbar__step num">${wizAt + 1} / ${pages.length}</span>
              <div class="wizbar__track"><span class="wizbar__fill" style="width:${pct}%"></span></div>
              <button class="wizbar__x" type="button" id="wiz-close" aria-label="닫기">${icon(ICONS.close)}</button>
            </div>
            <div class="wizbody" id="wiz-body">${wizPageHTML(page)}</div>
          </div>
        </div>`;
      mountWiz(page, pages);
    }

    const wizActs = (opts = {}) => `
      <div class="wiz__acts">
        ${wizAt > 0 ? '<button class="bigbtn bigbtn--ghost" type="button" id="wiz-prev">이전</button>' : ''}
        <button class="bigbtn bigbtn--navy" type="button" id="wiz-next" ${opts.off ? 'disabled' : ''}>${esc(opts.next || '다음')}</button>
      </div>
      ${opts.skip ? `<button class="wiz__skip" type="button" id="wiz-skip">${esc(opts.skip)}</button>` : ''}`;

    function wizPageHTML(page) {
      /* ── 건물 ── */
      if (page.kind === 'buildings') {
        const picked = wiz.buildings.map((b) => b.name);
        const rest = BUILDING_CHIPS.filter((c) => !picked.includes(c));
        return `
          <div class="wizstep">
            <p class="wiz__eyebrow">1. 건물</p>
            <h2 class="wiz__title" id="wiz-title">${esc(school().name)}에<br>어떤 건물이 있나요?</h2>
            <p class="wiz__desc">탭해서 고르고, 없으면 직접 적어 주세요.</p>

            <div class="wizchips">
              ${picked.map((nm) => `<button class="wizchip is-on" type="button" data-bld="${esc(nm)}">${esc(nm)}${icon(ICONS.close, 'icon wizchip__x')}</button>`).join('')}
              ${rest.map((nm) => `<button class="wizchip" type="button" data-bld="${esc(nm)}">${esc(nm)}<span class="wizchip__plus">+</span></button>`).join('')}
            </div>

            <div class="wizadd">
              <input class="input" id="wiz-newb" placeholder="직접 적기 (예: 모듈형 건물)" autocomplete="off">
              <button class="btn btn--ghost" type="button" id="wiz-addb">더하기</button>
            </div>
            <p class="wiz__hint">별관이 여러 개면 후관·신관처럼 <b>부르는 이름 그대로</b> 각각 적어 주세요.</p>
            ${wizActs({ off: !picked.length })}
            ${(wiz.buildings.length || wiz.rooms.length) ? '<button class="wiz__reset" type="button" id="wiz-reset">모두 지우고 처음부터</button>' : ''}
          </div>`;
      }

      /* ── 층 ── */
      if (page.kind === 'floors') {
        return `
          <div class="wizstep">
            <p class="wiz__eyebrow">2. 층</p>
            <h2 class="wiz__title" id="wiz-title">건물별로 몇 층까지 있나요?</h2>
            <p class="wiz__desc">지하가 없으면 0으로 두세요. 여기서 정한 층이 등록 화면에도 그대로 나와요.</p>
            <ul class="wizfloors">
              ${wiz.buildings.map((b, i) => `
                <li class="wizfloor">
                  <p class="wizfloor__name">${esc(b.name)}</p>
                  <div class="wizfloor__rows">
                    <div class="wizfloor__row">
                      <span class="wizfloor__k">지하</span>
                      <div class="stepper stepper--sm">
                        <button type="button" data-fl="${i}|down|-1" aria-label="지하 층 줄이기" ${b.down <= 0 ? 'disabled' : ''}>${icon(ICONS.minus)}</button>
                        <span class="stepper__val num">${b.down}</span>
                        <button type="button" data-fl="${i}|down|1" aria-label="지하 층 늘리기" ${b.down >= 5 ? 'disabled' : ''}>${icon(ICONS.add)}</button>
                      </div>
                    </div>
                    <div class="wizfloor__row">
                      <span class="wizfloor__k">지상</span>
                      <div class="stepper stepper--sm">
                        <button type="button" data-fl="${i}|up|-1" aria-label="지상 층 줄이기" ${b.up <= 1 ? 'disabled' : ''}>${icon(ICONS.minus)}</button>
                        <span class="stepper__val num">${b.up}</span>
                        <button type="button" data-fl="${i}|up|1" aria-label="지상 층 늘리기" ${b.up >= 20 ? 'disabled' : ''}>${icon(ICONS.add)}</button>
                      </div>
                    </div>
                  </div>
                  <p class="wizfloor__sum">${esc(floorsOf(b).join(' · '))}</p>
                </li>`).join('')}
            </ul>
            ${wizActs()}
          </div>`;
      }

      /* ── 배치도 올리기 ── */
      if (page.kind === 'upload') {
        const ledger = roomsFromLedger().filter((x) => !wiz.rooms.some((r) => r.name === x.name)).slice(0, 24);
        const total = wiz.rooms.length;
        return `
          <div class="wizstep">
            <p class="wiz__eyebrow">3. 실 이름</p>
            <h2 class="wiz__title" id="wiz-title">배치도가 있으면<br>먼저 올려 주세요</h2>
            <p class="wiz__desc">학교 배치도 PDF나 사진을 올리면 층별 실 이름을 미리 채워 둘게요. 없으면 그냥 넘어가도 돼요.</p>

            <label class="wizdrop ${wizReading ? 'is-busy' : ''}" id="wiz-drop">
              <input type="file" id="wiz-file" accept="image/*,.pdf,application/pdf" ${wizReading ? 'disabled' : ''}>
              ${icon(ICONS.upload, 'icon wizdrop__icon')}
              <span class="wizdrop__text">${wizReading ? 'AI가 배치도를 읽는 중이에요…' : '배치도 올리기'}<small>${wizReading ? '보통 10~30초 걸려요. 붐비면 조금 더 걸려요.' : 'PDF · 사진'}</small></span>
            </label>
            ${wizMsg ? `<p class="wizdrop__msg ${wizMsg.includes('실패') ? 'is-bad' : ''}">${esc(wizMsg)}</p>` : ''}
            ${aiWhy ? `<p class="wizdrop__why">${esc(aiWhy)}</p>` : ''}

            ${ledger.length ? `
              <div class="wizledger">
                <div class="wizledger__head">
                  <p class="wiz__label">비품 대장에서 찾은 장소</p>
                  <button class="mini mini--quiet" type="button" id="wiz-allled">${n(ledger.length)}곳 담기</button>
                </div>
                <p class="wiz__hint">올려 두신 대장에 적힌 장소예요. 담아 두면 다음 화면에서 층만 정하면 돼요.</p>
                <div class="wizchips">
                  ${ledger.slice(0, 12).map((x) => `<button class="wizchip" type="button" data-rmled="${esc(x.name)}">${esc(x.name)}<b class="num">${n(x.qty)}</b></button>`).join('')}
                </div>
              </div>` : ''}

            ${total ? `<p class="wizcount">${icon(ICONS.check)}<span>지금까지 실 <b class="num">${n(total)}곳</b>을 담았어요</span></p>` : ''}
            ${wizActs({ next: '층별로 정하기' })}
          </div>`;
      }

      /* ── 층별 ── */
      if (page.kind === 'floor') {
        const here = wiz.rooms.filter((r) => r.building === page.building && r.floor === page.floor);
        const waiting = wiz.rooms.filter((r) => r.building === page.building && !r.floor);
        const chips = ROOM_CHIPS.filter((c) => !wiz.rooms.some((r) => r.name === c.name || (r.aliases || []).includes(c.name)));
        return `
          <div class="wizstep">
            <p class="wiz__eyebrow">${esc(page.building)}</p>
            <h2 class="wiz__title" id="wiz-title">${esc(page.floor)}에<br>어떤 실이 있나요?</h2>
            <p class="wiz__desc">없으면 비워 두고 넘어가도 돼요.</p>

            ${here.length ? `
              <p class="wiz__label">이 층에 담은 실 ${n(here.length)}곳</p>
              <div class="wizchips wizchips--on">
                ${here.map((r) => `<button class="wizchip is-on" type="button" data-rmdel="${esc(r.name)}">${esc(r.name)}${icon(ICONS.close, 'icon wizchip__x')}</button>`).join('')}
              </div>` : ''}

            <div class="wizadd">
              <input class="input" id="wiz-newr" placeholder="직접 적기 (예: 과학 준비실)" autocomplete="off">
              <button class="btn btn--ghost" type="button" id="wiz-addr">더하기</button>
            </div>

            ${waiting.length ? `
              <p class="wiz__label">층이 정해지지 않은 실</p>
              <p class="wiz__hint">이 층에 있는 것을 탭하면 옮겨져요.</p>
              <div class="wizchips">
                ${waiting.map((r) => `<button class="wizchip wizchip--wait" type="button" data-rmmove="${esc(r.name)}">${esc(r.name)}<span class="wizchip__plus">+</span></button>`).join('')}
              </div>` : ''}

            ${wizPick ? `
              <div class="wizask">
                <p class="wizask__q">이 학교에서는 뭐라고 부르세요?</p>
                <div class="wizchips">
                  ${[wizPick.name, ...wizPick.alt].map((nm) => `<button class="wizchip" type="button" data-rmname="${esc(nm)}">${esc(nm)}</button>`).join('')}
                </div>
              </div>` : `
              <p class="wiz__label">자주 쓰는 실</p>
              <div class="wizchips">
                ${chips.slice(0, 10).map((c) => `<button class="wizchip" type="button" data-rmchip="${esc(c.name)}">${esc(c.name)}<span class="wizchip__plus">+</span></button>`).join('')}
              </div>`}

            ${wizActs({ skip: '남은 층은 건너뛰고 마치기' })}
          </div>`;
      }

      /* ── 완료 ── */
      return `
        <div class="wizstep">
          <span class="wizdone" aria-hidden="true">${icon(ICONS.check)}</span>
          <h2 class="wiz__title" id="wiz-title">설정을 마쳤어요</h2>
          <p class="wiz__desc">이제 물품을 등록할 때 여기서 고르면 돼요. 없는 곳은 그때 직접 적어도 됩니다.</p>
          <ul class="wizsum">
            ${wiz.buildings.map((b) => {
              const rs = wiz.rooms.filter((r) => r.building === b.name);
              return `<li class="wizsum__row">
                <p class="wizsum__name">${esc(b.name)}</p>
                <p class="wizsum__sub">${esc(floorsOf(b).join(' · '))}</p>
                <p class="wizsum__sub">${rs.length ? `실 ${n(rs.length)}곳 · ${esc(rs.slice(0, 8).map((r) => r.name).join(', '))}${rs.length > 8 ? ' …' : ''}` : '실은 나중에 채워도 돼요'}</p>
              </li>`;
            }).join('')}
          </ul>
          <div class="wiz__acts">
            <button class="bigbtn bigbtn--ghost" type="button" id="wiz-prev">이전</button>
            <button class="bigbtn bigbtn--navy" type="button" id="wiz-save">설정 완료</button>
          </div>
          <button class="wiz__reset" type="button" id="wiz-reset">모두 지우고 처음부터</button>
        </div>`;
    }

    function mountWiz(page, pages) {
      const root = document.getElementById('wizroot');
      const back = root.querySelector('.wizback');

      const go = (n2) => {
        saveSpaces();                 // 넘어갈 때마다 저장해 둔다
        wizAt = n2; wizPick = null; wizMsg = ''; probeMsg = ''; aiWhy = '';
        drawWiz();
      };

      root.querySelector('#wiz-close').addEventListener('click', () => closeSpaces());
      back.addEventListener('click', (e) => { if (e.target === back) closeSpaces(); });
      root.querySelector('#wiz-prev')?.addEventListener('click', () => go(wizAt - 1));
      root.querySelector('#wiz-next')?.addEventListener('click', () => go(wizAt + 1));
      root.querySelector('#wiz-skip')?.addEventListener('click', () => go(pages.length - 1));
      root.querySelector('#wiz-reset')?.addEventListener('click', () => {
        if (!confirm('설정한 건물과 층, 실을 모두 지우고 처음부터 할까요?\n등록한 물품은 그대로 남아요.')) return;
        wiz = { buildings: [], rooms: [] };
        wizAt = 0; wizPick = null; wizMsg = ''; probeMsg = ''; aiWhy = '';
        saveSpaces();
        drawWiz();
        flash('학교 공간 설정을 지웠어요');
      });

      root.querySelector('#wiz-save')?.addEventListener('click', () => {
        saveSpaces();
        closeSpaces(true);
        flash('학교 공간을 저장했어요');
        render();
      });

      /* 건물 더하기 */
      const addB = (name) => {
        const nm = name.trim();
        if (!nm || wiz.buildings.some((b) => b.name === nm)) return;
        wiz.buildings.push({ name: nm, down: 0, up: 4 });
        drawWiz();
      };
      root.querySelector('#wiz-addb')?.addEventListener('click', () => addB(root.querySelector('#wiz-newb').value));
      root.querySelector('#wiz-newb')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addB(e.target.value); }
      });

      /* 실 더하기 */
      const addR = (name, alt = [], floor) => {
        const nm = name.trim();
        if (!nm) return;
        const b = page.building || wiz.buildings[0]?.name || '';
        const f = floor === undefined ? (page.floor || '') : floor;
        if (wiz.rooms.some((r) => r.building === b && r.name === nm && r.floor === f)) return;
        wiz.rooms = wiz.rooms.filter((r) => !(r.building === b && r.name === nm));
        wiz.rooms.push({ building: b, floor: f, name: nm, aliases: alt });
        wizPick = null;
        drawWiz();
      };
      root.querySelector('#wiz-addr')?.addEventListener('click', () => addR(root.querySelector('#wiz-newr').value));
      root.querySelector('#wiz-newr')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addR(e.target.value); }
      });

      /* 대장에서 담기 */
      root.querySelector('#wiz-allled')?.addEventListener('click', () => {
        const b = wiz.buildings[0]?.name || '';
        for (const x of roomsFromLedger().slice(0, 24)) {
          if (!wiz.rooms.some((r) => r.name === x.name)) {
            wiz.rooms.push({ building: b, floor: '', name: x.name, aliases: [] });
          }
        }
        drawWiz();
      });

      /* AI가 붙어 있는지 확인 */
      root.querySelector('#wiz-probe')?.addEventListener('click', async () => {
        probeMsg = '확인하는 중이에요…';
        drawWiz();
        probeMsg = await probeAI();
        drawWiz();
      });

      /* 배치도 읽기 */
      const file = root.querySelector('#wiz-file');
      if (file) {
        file.addEventListener('change', async (e) => {
          const f = e.target.files[0];
          if (!f) return;
          if (f.size > 8 * 1024 * 1024) { wizMsg = '학교 배치도 업로드에 실패하였습니다. 파일이 8MB를 넘어요.'; drawWiz(); return; }
          wizReading = true; wizMsg = ''; drawWiz();
          try {
            let list = null;
            const isPdf = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name);

            // 1) AI에게 먼저 맡긴다. 층과 건물까지 읽어 낸다.
            const base64 = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(String(r.result).split(',')[1]);
              r.onerror = rej;
              r.readAsDataURL(f);
            });
            list = await askAI({ image: base64, mime: isPdf ? 'application/pdf' : (f.type || 'image/png') });

            // 2) AI가 안 되면 PDF 안의 글자라도 읽는다 (층은 비어 있을 수 있다)
            if (!list && isPdf) {
              try {
                const got = parsePlanText(await readPdfText(f));
                if (got.length >= 3) list = got;
              } catch (e) {
                console.warn('PDF 글자 읽기 실패', e);
              }
            }
            wizReading = false;
            if (!list) {
              wizMsg = '학교 배치도 업로드에 실패하였습니다. 수동으로 설정해주세요.';
              if (aiWhy) console.warn('배치도 읽기 실패:', aiWhy);
              drawWiz();
              return;
            }

            let added = 0;
            for (const r of list) {
              const bld = matchBuilding(r.building);
              const floor = placeFloor(bld, r.floor);
              if (wiz.rooms.some((x) => x.building === bld.name && x.name === r.name)) continue;
              wiz.rooms.push({ building: bld.name, floor, name: r.name, aliases: [] });
              added++;
            }
            wizMsg = added ? `${added}곳을 찾아 담았어요. 다음 화면에서 층을 확인해 주세요.` : '새로 담을 실 이름을 찾지 못했어요.';
            saveSpaces();
            drawWiz();
          } catch {
            wizReading = false;
            wizMsg = '학교 배치도 업로드에 실패하였습니다. 수동으로 설정해주세요.';
            drawWiz();
          }
        });
      }

      /* 칩 누르기 */
      back.addEventListener('click', (e) => {
        const b = e.target.closest('[data-bld]');
        if (b) {
          const nm = b.dataset.bld;
          const at = wiz.buildings.findIndex((x) => x.name === nm);
          if (at >= 0) {
            wiz.buildings.splice(at, 1);
            wiz.rooms = wiz.rooms.filter((r) => r.building !== nm);
            drawWiz();
          } else addB(nm);
          return;
        }
        const fl = e.target.closest('[data-fl]');
        if (fl) {
          const [i, key, step] = fl.dataset.fl.split('|');
          const bb = wiz.buildings[Number(i)];
          bb[key] = Math.max(key === 'up' ? 1 : 0, Number(bb[key]) + Number(step));
          drawWiz();
          return;
        }
        const chip = e.target.closest('[data-rmchip]');
        if (chip) {
          const spec = ROOM_CHIPS.find((c) => c.name === chip.dataset.rmchip);
          if (spec && spec.alt.length) { wizPick = spec; drawWiz(); }
          else addR(chip.dataset.rmchip);
          return;
        }
        const pick = e.target.closest('[data-rmname]');
        if (pick) {
          const nm = pick.dataset.rmname;
          const all = [wizPick.name, ...wizPick.alt];
          addR(nm, all.filter((x) => x !== nm));
          return;
        }
        const led = e.target.closest('[data-rmled]');
        if (led) {
          const bb = wiz.buildings[0]?.name || '';
          if (!wiz.rooms.some((r) => r.name === led.dataset.rmled)) {
            wiz.rooms.push({ building: bb, floor: '', name: led.dataset.rmled, aliases: [] });
          }
          drawWiz();
          return;
        }
        const mv = e.target.closest('[data-rmmove]');
        if (mv) { addR(mv.dataset.rmmove); return; }
        const del = e.target.closest('[data-rmdel]');
        if (del) {
          wiz.rooms = wiz.rooms.filter((r) => !(r.building === page.building && r.floor === page.floor && r.name === del.dataset.rmdel));
          drawWiz();
        }
      });
    }

    let aiWhy = '';   // 서버가 알려 준 실패 이유

    // 구글이 보낸 오류에서 사람이 읽을 부분만 꺼낸다
    function pickReason(raw) {
      try {
        const j = JSON.parse(raw);
        const e = j.error || {};
        const why = (e.details || []).map((d) => d.reason).filter(Boolean).join(', ');
        return `${e.status || ''} ${e.message || ''}${why ? ` [${why}]` : ''}`.trim().slice(0, 240);
      } catch {
        return String(raw || '').slice(0, 240);
      }
    }

    // 어디까지 되고 어디서 막혔는지 한 번에 알려 준다
    async function probeAI() {
      if (!online()) return '로그인 방식이 아니라 AI를 쓸 수 없어요. Supabase 설정을 먼저 해 주세요.';
      if (!session) return '로그인이 필요해요.';
      const url = `${SUPABASE.url}/functions/v1/${AI_FUNCTION}`;
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${session.access_token}`,
            apikey: SUPABASE.anonKey,
          },
          body: JSON.stringify({ probe: true }),
        });
        const raw = await res.text();
        let data = {};
        try { data = JSON.parse(raw); } catch { /* 형식이 아닐 수도 있다 */ }

        if (res.status === 404) return `① 함수 없음\n${url} 주소에 함수가 없어요.\n대시보드의 함수 주소 끝부분과 AI_FUNCTION 값이 같은지 확인해 주세요.`;
        if (res.status === 401) return '② 로그인 문제\n함수가 요청을 거절했어요. 다시 로그인해 보세요.';
        if (data.error === 'NO_KEY') return '③ 키 없음\n함수는 있는데 GEMINI_API_KEY가 없어요.\nEdge Functions → Secrets에 넣어 주세요.';
        if (data.ok === false && data.step === 'key') return `④ 키 거절\n구글이 키를 받지 않았어요 (${data.status}).\n${pickReason(data.detail)}`;
        if (data.ok === false && data.step === 'generate') {
          const lines = (data.tries || []).map((t) => `· ${t.model} → ${t.status}\n  ${pickReason(t.detail)}`).join('\n');
          return `⑥ 목록은 보이는데 생성이 막혀요\n${lines}`;
        }
        if (data.ok === true && data.step === 'generate') {
          return `모두 정상이에요.\n실제로 답을 받은 모델: ${data.model}`;
        }
        if (data.ok === true) {
          return data.models?.length
            ? `키는 통해요.\n쓸 수 있는 모델: ${data.models.slice(0, 6).join(', ')}\n(함수 코드를 최신으로 바꾸면 생성까지 시험해요)`
            : '키는 통했는데 쓸 수 있는 모델이 안 보여요.\nGoogle Cloud에서 Generative Language API를 켜 주세요.';
        }
        return `알 수 없는 답이에요 (${res.status})\n${raw.slice(0, 220)}`;
      } catch (e) {
        return `⑤ 서버에 닿지 못함\n${String(e?.message || e)}\n\n가장 흔한 원인: 함수의 JWT 확인이 켜져 있어요.\nSupabase → Edge Functions → parse-spaces → 설정에서\n'Enforce JWT Verification'을 꺼 주세요.\n\n그래도 같으면 함수 주소가 맞는지 확인해 주세요.\n지금 부르는 주소: ${url}`;
      }
    }

    // 서버(Edge Function)에 제미나이로 읽어 달라고 부탁한다. 준비가 안 됐으면 조용히 물러난다.
    async function askAI(payload) {
      aiWhy = '';
      if (!sb || !session) { aiWhy = '로그인한 뒤에 쓸 수 있어요.'; return null; }
      try {
        const res = await fetch(`${SUPABASE.url}/functions/v1/${AI_FUNCTION}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${session.access_token}`,
            apikey: SUPABASE.anonKey,
          },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (res.status === 404) aiWhy = `${AI_FUNCTION} 함수를 찾지 못했어요.`;
          else if (data.error === 'NO_KEY') aiWhy = 'Supabase Secrets에 GEMINI_API_KEY가 없어요.';
          else if (data.error === 'NOT_SIGNED_IN') aiWhy = '로그인이 풀렸어요. 다시 로그인해 주세요.';
          else if (data.status === 503 || data.status === 429 || /UNAVAILABLE|high demand|RESOURCE_EXHAUSTED/.test(String(data.detail))) {
            aiWhy = '지금 AI 사용자가 많아 잠시 붐벼요. 몇 번 다시 시도했지만 자리가 나지 않았어요. 1~2분 뒤에 다시 올려 주세요.';
          }
          else if (data.detail) aiWhy = `구글이 거절했어요 (${data.status || res.status}) ${pickReason(data.detail)}`;
          else aiWhy = `서버가 ${res.status} 오류를 냈어요.`;
          return null;
        }
        return Array.isArray(data.rooms) ? data.rooms.filter((r) => r && r.name) : null;
      } catch {
        aiWhy = '서버에 닿지 못했어요. 인터넷을 확인해 주세요.';
        return null;
      }
    }

    /* ════════ 물품 문의 글 (→ src/pages/board.js) ════════ */
    const posts = () => state.posts || [];
    const comments = () => state.comments || [];
    const commentsOf = (id) => comments().filter((c) => c.postId === id)
      .sort((a, b) => a.createdAt.localeCompare(b.createdAt));

    // 글쓴이 이름: 로그인한 이름 → 담당 선생님 이름 순으로 채운다
    function writerName() {
      const meta = session?.user?.user_metadata?.full_name;
      if (meta) return meta;
      const mail = session?.user?.email;
      if (mail) return mail.split('@')[0];
      return school().teacher || '';
    }

    const timeAgo = (iso) => {
      const min = Math.round((Date.now() - new Date(iso)) / 60000);
      if (min < 1) return '방금';
      if (min < 60) return `${min}분 전`;
      const hr = Math.round(min / 60);
      if (hr < 24) return `${hr}시간 전`;
      const day = Math.round(hr / 24);
      if (day < 7) return `${day}일 전`;
      return dateShort(iso.slice(0, 10));
    };

    /* ── 자주 대여하는 물품 ── */
    function rentRank() {
      const map = new Map();
      for (const l of state.loans || []) {
        const g = map.get(l.itemName) || { name: l.itemName, times: 0, qty: 0, itemId: l.itemId };
        g.times += 1; g.qty += l.qty;
        map.set(l.itemName, g);
      }
      return [...map.values()].sort((a, b) => b.times - a.times || b.qty - a.qty).slice(0, 5);
    }

    /* ── 그 물품의 대여 현황 팝업 ── */
    function openRankDetail(name) {
      const all = (state.loans || []).filter((l) => l.itemName === name);
      const out = sortLoans(all.filter((l) => !l.returnedAt));
      const back = document.createElement('div');
      back.className = 'signback';
      back.innerHTML = `
        <div class="signbox rankbox" role="dialog" aria-modal="true" aria-labelledby="rank-title">
          <p class="signbox__title" id="rank-title">${esc(name)}</p>
          <p class="signbox__desc">모두 ${n(all.length)}번 빌려 갔어요${out.length ? ` · 지금 ${n(out.length)}건 나가 있어요` : ' · 지금은 모두 들어와 있어요'}</p>

          ${out.length ? `
            <p class="rankbox__label">지금 빌려 간 사람</p>
            <ul class="rankbox__list">
              ${out.map((l) => {
                const st = dueState(l);
                return `<li class="rankrow ${st.key === 'late' ? 'is-late' : ''}">
                  <div class="rankrow__main">
                    <p class="rankrow__who">${esc(l.who)}${l.qty > 1 ? ` <span class="num">${n(l.qty)}개</span>` : ''}</p>
                    <p class="rankrow__sub">${esc(l.path || '')}</p>
                  </div>
                  <span class="pill ${PILL[st.key]}">${esc(st.label)}</span>
                </li>`;
              }).join('')}
            </ul>` : ''}

          ${all.filter((l) => l.returnedAt).length ? `
            <p class="rankbox__label">지난 기록</p>
            <ul class="rankbox__list">
              ${all.filter((l) => l.returnedAt).sort((a, b) => b.returnedAt.localeCompare(a.returnedAt)).slice(0, 5).map((l) => `
                <li class="rankrow is-done">
                  <div class="rankrow__main">
                    <p class="rankrow__who">${esc(l.who)}</p>
                    <p class="rankrow__sub">${esc(dateShort(l.outAt.slice(0, 10)))} 빌림 · ${esc(dateShort(l.returnedAt.slice(0, 10)))} 반납</p>
                  </div>
                </li>`).join('')}
            </ul>` : ''}

          <div class="signbox__acts">
            <span class="signbox__spacer"></span>
            <button class="mini mini--quiet" type="button" id="rank-close">닫기</button>
            <a class="signbox__go" href="#/rent">대여 화면으로</a>
          </div>
        </div>`;
      document.body.append(back);
      const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      back.querySelector('#rank-close').addEventListener('click', close);
      back.querySelector('.signbox__go').addEventListener('click', close);
    }

    /* ── 문의 글쓰기 ── */
    function openWrite(onDone) {
      const back = document.createElement('div');
      back.className = 'signback';
      back.innerHTML = `
        <div class="signbox" role="dialog" aria-modal="true" aria-labelledby="w-title">
          <p class="signbox__title" id="w-title">물품 문의 글쓰기</p>
          <p class="signbox__desc">찾는 물품이 어디 있는지 물어보세요. 아는 선생님이 댓글로 알려 줄 거예요.</p>
          <div class="field" style="margin-top:16px">
            <label class="field__label" for="w-q">무엇이 궁금하세요?<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="w-q" placeholder="예: 이동식 마이크는 어디 있을까요?" autocomplete="off" maxlength="60">
          </div>
          <div class="field">
            <label class="field__label" for="w-body">더 적을 말 <small>선택</small></label>
            <textarea class="input" id="w-body" placeholder="예: 내일 학년 행사에 써야 해요." maxlength="300"></textarea>
          </div>
          <div class="field">
            <label class="field__label" for="w-who">이름<span class="req" aria-hidden="true">*</span></label>
            <input class="input" id="w-who" placeholder="예: 김하늘" autocomplete="off" value="${esc(writerName())}" maxlength="20">
          </div>
          <p class="signbox__err" id="w-err" aria-live="polite"></p>
          <div class="signbox__acts">
            <span class="signbox__spacer"></span>
            <button class="mini mini--quiet" type="button" id="w-cancel">취소</button>
            <button class="signbox__go" type="button" id="w-go">올리기</button>
          </div>
        </div>`;
      document.body.append(back);
      const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      back.querySelector('#w-cancel').addEventListener('click', close);
      back.querySelector('#w-q').focus();

      back.querySelector('#w-go').addEventListener('click', () => {
        const title = back.querySelector('#w-q').value.trim();
        const who = back.querySelector('#w-who').value.trim();
        const err = back.querySelector('#w-err');
        if (!title) { err.textContent = '무엇이 궁금한지 적어 주세요.'; return; }
        if (!who) { err.textContent = '이름을 적어 주세요.'; return; }
        commit({
          ...state,
          posts: [...posts(), {
            id: 'pst_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            title, body: back.querySelector('#w-body').value.trim(),
            who, solved: false, createdAt: new Date().toISOString(),
          }],
        });
        close();
        onDone();
      });
    }

    /* ── 문의 글 보기 ── */
    function openPost(id, onChange) {
      const draw = () => {
        const post = posts().find((p) => p.id === id);
        if (!post) { close(); return; }
        const list = commentsOf(id);
        box.innerHTML = `
          <p class="signbox__title" id="p-title">${esc(post.title)}${post.solved ? '<span class="solved">해결됨</span>' : ''}</p>
          <p class="signbox__desc">${esc(post.who)} · ${esc(timeAgo(post.createdAt))}</p>
          ${post.body ? `<p class="postbody">${esc(post.body)}</p>` : ''}

          <p class="rankbox__label">답변 ${n(list.length)}</p>
          ${list.length ? `<ul class="cmts">${list.map((c) => `
            <li class="cmt">
              <div class="cmt__main">
                <p class="cmt__who">${esc(c.who)} <span class="cmt__when">${esc(timeAgo(c.createdAt))}</span></p>
                <p class="cmt__body">${esc(c.body)}</p>
              </div>
              ${canImport() ? `<button class="act act--del" type="button" data-cdel="${c.id}" aria-label="댓글 지우기">${icon(ICONS.trash)}</button>` : ''}
            </li>`).join('')}</ul>`
            : '<p class="side-empty">아직 답변이 없어요. 아는 곳이면 알려 주세요.</p>'}

          <div class="cmtwrite">
            <input class="input" id="c-who" placeholder="이름" autocomplete="off" value="${esc(writerName())}" maxlength="20">
            <input class="input" id="c-body" placeholder="예: 방송실에 있습니다." autocomplete="off" maxlength="200">
            <button class="btn btn--solid" type="button" id="c-go">답변</button>
          </div>
          <p class="signbox__err" id="c-err" aria-live="polite"></p>

          <div class="signbox__acts">
            ${canImport() ? `<button class="act act--del" type="button" id="p-del">${icon(ICONS.trash)}<span class="act__label">글 지우기</span></button>` : ''}
            <span class="signbox__spacer"></span>
            <button class="mini mini--quiet" type="button" id="p-solve">${post.solved ? '해결 표시 풀기' : '해결됐어요'}</button>
            <button class="mini mini--quiet" type="button" id="p-close">닫기</button>
          </div>`;
      };

      const back = document.createElement('div');
      back.className = 'signback';
      back.innerHTML = '<div class="signbox postbox" role="dialog" aria-modal="true" aria-labelledby="p-title"></div>';
      document.body.append(back);
      const box = back.querySelector('.postbox');
      const close = () => { back.remove(); document.removeEventListener('keydown', onKey); onChange(); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      document.addEventListener('keydown', onKey);
      back.addEventListener('click', (e) => { if (e.target === back) close(); });
      draw();

      box.addEventListener('click', (e) => {
        if (e.target.closest('#p-close')) { close(); return; }
        if (e.target.closest('#c-go')) {
          const who = box.querySelector('#c-who').value.trim();
          const body = box.querySelector('#c-body').value.trim();
          const err = box.querySelector('#c-err');
          if (!who || !body) { err.textContent = '이름과 답변을 적어 주세요.'; return; }
          commit({
            ...state,
            comments: [...comments(), {
              id: 'cmt_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              postId: id, who, body, createdAt: new Date().toISOString(),
            }],
          });
          draw();
          return;
        }
        if (e.target.closest('#p-solve')) {
          const post = posts().find((p) => p.id === id);
          commit({ ...state, posts: posts().map((p) => (p.id === id ? { ...p, solved: !post.solved } : p)) });
          draw();
          return;
        }
        const cd = e.target.closest('[data-cdel]');
        if (cd) {
          commit({ ...state, comments: comments().filter((c) => c.id !== cd.dataset.cdel) });
          draw();
          return;
        }
        if (e.target.closest('#p-del')) {
          if (!confirm('이 글과 답변을 모두 지울까요?')) return;
          commit({
            ...state,
            posts: posts().filter((p) => p.id !== id),
            comments: comments().filter((c) => c.postId !== id),
          });
          close();
        }
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.id === 'c-body') box.querySelector('#c-go').click();
      });
    }

    /* ════════ 인수인계 (→ src/pages/handover.js) ════════ */
    const handovers = () => state.handovers || [];
    const openHandover = () => handovers().find((h) => !h.doneAt) || null;

    // 인수인계는 비품만 다룬다. 없어지면 안 되는 물건이라서.
    const handoverItems = () => assetsOf(state.items);

    // 실별로 묶는다. 하루에 다 못 하니 나눠서 하도록.
    function handoverRooms(h) {
      const map = new Map();
      for (const it of handoverItems()) {
        const key = [it.building, it.floor, it.room].filter(Boolean).join(' › ') || '장소 미지정';
        const g = map.get(key) || { key, items: [], ok: 0, lost: 0, fix: 0 };
        g.items.push(it);
        const mark = h.checks[it.id];
        if (mark === 'ok') g.ok++;
        else if (mark === 'lost') g.lost++;
        else if (mark === 'fix') g.fix++;
        map.set(key, g);
      }
      return [...map.values()].sort((a, b) => (a.key === '장소 미지정' ? 1 : b.key === '장소 미지정' ? -1 : a.key.localeCompare(b.key, 'ko')));
    }

    function handoverCount(h) {
      const all = handoverItems();
      let ok = 0, lost = 0, fix = 0;
      for (const it of all) {
        const mark = h.checks[it.id];
        if (mark === 'ok') ok++;
        else if (mark === 'lost') lost++;
        else if (mark === 'fix') fix++;
      }
      return { total: all.length, ok, lost, fix, left: all.length - ok - lost - fix };
    }

    // 마칠 때 그 순간의 상태를 따로 복사해 둔다. 나중에 바뀌어도 이 기록은 안 바뀐다.
    function freezeSnapshot(h) {
      return handoverItems().map((it) => ({
        name: assetName(it),
        no: it.assetInfo?.no || '',
        dept: it.assetInfo?.dept || '',
        path: pathOf(it).join(' › ') || '장소 미지정',
        qty: it.qty,
        price: it.assetInfo?.price || '',
        mark: h.checks[it.id] || 'skip',
      }));
    }

    const MARK_LABEL = { ok: '있음', lost: '못 찾음', fix: '수리 필요', skip: '확인 안 함' };

    async function exportHandover(h) {
      const XLSX = await xlsx();
      const c = h.snapshot.reduce((a, r) => { a[r.mark] = (a[r.mark] || 0) + 1; return a; }, {});
      const head = [
        ['비품 인수인계 확인서'],
        [],
        ['학교', school().name, '', '인계자', `${h.fromName} ${h.fromPosition}`],
        ['날짜', dateShort(h.doneAt.slice(0, 10)), '', '인수자', `${h.toName} ${h.toPosition}`],
        ['확인함', c.ok || 0, '못 찾음', c.lost || 0, '수리 필요', c.fix || 0, '확인 안 함', c.skip || 0],
        [],
        ['비품명', '고유번호', '운용부서', '보관 위치', '수량', '단가', '확인 결과'],
      ];
      const body = h.snapshot.map((r) => [r.name, r.no, r.dept, r.path, r.qty, r.price, MARK_LABEL[r.mark]]);
      const ws = XLSX.utils.aoa_to_sheet([...head, ...body]);
      ws['!cols'] = [30, 16, 14, 30, 8, 12, 12].map((wch) => ({ wch }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, '인수인계 확인서');
      XLSX.writeFile(wb, `비품 인수인계 확인서_${h.doneAt.slice(0, 10).replaceAll('-', '')}.xlsx`);
    }

    let hoOpenRoom = '';   // 지금 펼친 실

    function handoverView() {
      const h = openHandover();
      const done = handovers().filter((x) => x.doneAt).sort((a, b) => b.doneAt.localeCompare(a.doneAt));

      const header = `
        <header class="top">
          <div>
            <a class="back" href="#/">${icon(ICONS.back)}홈</a>
            <h1 class="top__title" tabindex="-1">인수인계</h1>

      if (!h) {
        return `

          <section class="card hostart" aria-labelledby="ho-title">
            <div class="card__head"><h2 class="card__title" id="ho-title">비품 인수인계 시작</h2></div>
            <p class="sheet__desc">비품 <b class="num">${n(handoverItems().length)}가지</b>를 하나씩 확인하면서 넘겨요. 확인한 것과 확인하지 않은 것이 그대로 기록에 남아요.</p>

                <div class="selectbox">
                  <select class="input" id="ho-frompos">
                    ${POSITIONS.map((v) => `<option value="${esc(v)}" ${v === (school().position || '교사') ? 'selected' : ''}>${esc(v)}</option>`).join('')}
                  </select>
                  ${icon(ICONS.caret, 'icon selectbox__caret')}
                </div>
              </div>
            </div>
            <div class="horow">
              <div class="field">
                <label class="field__label" for="ho-to">인수자<span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="ho-to" placeholder="예: 박서연" autocomplete="off">
              </div>
              <div class="field">
                <label class="field__label" for="ho-topos">직위</label>
                <div class="selectbox">
                  <select class="input" id="ho-topos">
                    ${POSITIONS.map((v) => `<option value="${esc(v)}">${esc(v)}</option>`).join('')}
                  </select>

              </div>

            <p class="field__error" id="ho-err"></p>

          </section>

          <section class="card holist" aria-labelledby="hopast-title">
            <div class="card__head">
              <h2 class="card__title" id="hopast-title">지난 인수인계</h2>
              <span class="card__meta">${done.length ? `${n(done.length)}건` : ''}</span>
            </div>
            ${done.length ? `<ul class="hopast">${done.map((x) => {
              const c = x.snapshot.reduce((a, r) => { a[r.mark] = (a[r.mark] || 0) + 1; return a; }, {});
              return `<li class="hopast__row">
                <div class="hopast__main">
                  <p class="hopast__when">${esc(dateShort(x.doneAt.slice(0, 10)))}</p>
                  <p class="hopast__who">${esc(x.fromName)} ${esc(x.fromPosition)} → ${esc(x.toName)} ${esc(x.toPosition)}</p>
                  <p class="hopast__sum">확인함 ${n(c.ok || 0)} · 못 찾음 ${n(c.lost || 0)} · 수리 ${n(c.fix || 0)} · 확인 안 함 ${n(c.skip || 0)}</p>
                  <div class="hopast__signs">
                    <img src="${esc(x.signFrom)}" alt="인계자 서명"><img src="${esc(x.signTo)}" alt="인수자 서명">
                  </div>
                </div>
                <button class="mini mini--go" type="button" data-hoout="${esc(x.id)}">확인서</button>

            }).join('')}</ul>` : '<p class="side-empty">아직 인수인계 기록이 없어요.</p>'}
          </section>`;
      }

      const c = handoverCount(h);
      const pct = c.total ? Math.round(((c.ok + c.lost + c.fix) / c.total) * 100) : 0;
      const rooms = handoverRooms(h);

      return `
        ${header}
        <section class="card hobar" aria-label="진행 상황">
          <div class="hobar__who">
            <p class="hobar__names">${esc(h.fromName)} ${esc(h.fromPosition)} → ${esc(h.toName)} ${esc(h.toPosition)}</p>
            <p class="hobar__sub">${esc(dateShort(h.startedAt.slice(0, 10)))}에 시작했어요</p>
          </div>
          <div class="hobar__figs">
            <span class="hobar__fig"><b class="num">${n(c.ok)}</b>있음</span>
            <span class="hobar__fig is-lost"><b class="num">${n(c.lost)}</b>못 찾음</span>
            <span class="hobar__fig is-fix"><b class="num">${n(c.fix)}</b>수리</span>
            <span class="hobar__fig is-left"><b class="num">${n(c.left)}</b>남음</span>
          </div>
          <div class="hobar__acts">
            <button class="mini mini--quiet" type="button" id="ho-cancel">그만두기</button>
            <button class="btn btn--solid" type="button" id="ho-finish">인계 마치기</button>
          </div>
          <div class="hobar__track"><span class="hobar__fill" style="width:${pct}%"></span></div>
        </section>

        <section class="card horooms" aria-label="실별 확인">
          ${rooms.map((g) => {
            const left = g.items.length - g.ok - g.lost - g.fix;
            const open = hoOpenRoom === g.key;
            return `
              <div class="horoom ${left ? '' : 'is-done'}">
                <button class="horoom__head" type="button" data-horoom="${esc(g.key)}" aria-expanded="${open}">
                  ${icon(ICONS.caret, 'icon fold__caret')}
                  <span class="horoom__name">${esc(g.key)}</span>
                  <span class="horoom__count num">${left ? `${n(g.items.length - left)} / ${n(g.items.length)}` : `${n(g.items.length)}가지 확인 끝`}</span>
                </button>
                ${open ? `<ul class="hoitems">
                  ${g.items.slice(0, 200).map((it) => {
                    const mark = h.checks[it.id] || '';
                    return `<li class="hoitem ${mark ? 'is-' + mark : ''}">
                      <div class="hoitem__main">
                        <p class="hoitem__name">${esc(assetName(it))}${it.qty > 1 ? ` <span class="num">${n(it.qty)}개</span>` : ''}</p>
                        <p class="hoitem__sub">${esc([it.assetInfo?.no, it.assetInfo?.dept].filter(Boolean).join(' · ') || '고유번호 없음')}</p>
                      </div>
                      <div class="hoitem__marks">
                        <button class="homark ${mark === 'ok' ? 'is-on' : ''}" type="button" data-homark="${it.id}|ok">있음</button>
                        <button class="homark homark--fix ${mark === 'fix' ? 'is-on' : ''}" type="button" data-homark="${it.id}|fix">수리</button>
                        <button class="homark homark--lost ${mark === 'lost' ? 'is-on' : ''}" type="button" data-homark="${it.id}|lost">못 찾음</button>
                      </div>
                    </li>`;
                  }).join('')}
                  ${g.items.length > 200 ? `<li class="imp__more num">그 밖에 ${n(g.items.length - 200)}가지</li>` : ''}
                </ul>
                <div class="horoom__all">
                  <button class="mini mini--quiet" type="button" data-hoall="${esc(g.key)}">이 실 전부 있음으로</button>
                </div>` : ''}
              </div>`;
          }).join('')}
        </section>`;
    }

    function mountHandover(view) {
      const h = openHandover();

      if (!h) {
        view.querySelector('#ho-go')?.addEventListener('click', () => {
          const from = view.querySelector('#ho-from').value.trim();
          const to = view.querySelector('#ho-to').value.trim();
          const err = view.querySelector('#ho-err');
          if (!from || !to) { err.textContent = '인계자와 인수자 이름을 모두 적어 주세요.'; return; }
          commit({
            ...state,
            handovers: [...handovers(), {
              id: 'ho_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              startedAt: new Date().toISOString(), doneAt: null,
              fromName: from, fromPosition: view.querySelector('#ho-frompos').value,
              toName: to, toPosition: view.querySelector('#ho-topos').value,
              checks: {}, snapshot: [], signFrom: '', signTo: '',
            }],
          });
          hoOpenRoom = '';
          render();
          flash('인수인계를 시작했어요');
        });

        view.addEventListener('click', (e) => {
          const out = e.target.closest('[data-hoout]');
          if (!out) return;
          const rec = handovers().find((x) => x.id === out.dataset.hoout);
          if (rec) exportHandover(rec).catch(() => flash('내려받지 못했어요', 'warn'));
        });
        return;
      }

      const save = (next) => {
        commit({ ...state, handovers: handovers().map((x) => (x.id === h.id ? next : x)) });
      };

      view.addEventListener('click', (e) => {
        const room = e.target.closest('[data-horoom]');
        if (room) {
          hoOpenRoom = hoOpenRoom === room.dataset.horoom ? '' : room.dataset.horoom;
          render();
          return;
        }

        const mark = e.target.closest('[data-homark]');
        if (mark) {
          const [id, kind] = mark.dataset.homark.split('|');
          const checks = { ...h.checks };
          if (checks[id] === kind) delete checks[id]; else checks[id] = kind;
          save({ ...h, checks });
          render();
          return;
        }

        const all = e.target.closest('[data-hoall]');
        if (all) {
          const g = handoverRooms(h).find((x) => x.key === all.dataset.hoall);
          if (!g) return;
          const checks = { ...h.checks };
          for (const it of g.items) if (!checks[it.id]) checks[it.id] = 'ok';
          save({ ...h, checks });
          render();
          flash(`${g.key} 전부 있음으로 표시했어요`);
          return;
        }

        if (e.target.closest('#ho-cancel')) {
          if (!confirm('인수인계를 그만둘까요? 지금까지 확인한 내용이 사라져요.')) return;
          commit({ ...state, handovers: handovers().filter((x) => x.id !== h.id) });
          render();
          return;
        }

        if (!e.target.closest('#ho-finish')) return;

        // 인계자 → 인수자 순서로 서명을 받는다
        const c = handoverCount(h);
        const sum = `확인함 ${n(c.ok)} · 못 찾음 ${n(c.lost)} · 수리 ${n(c.fix)} · 확인 안 함 ${n(c.left)}`;
        askSign(`${h.fromName} ${h.fromPosition} 님, 인계 서명해 주세요`, sum, (signFrom) => {
          setTimeout(() => {
            askSign(`${h.toName} ${h.toPosition} 님, 이 상태 그대로 인수합니다`, sum, (signTo) => {
              const snapshot = freezeSnapshot(h);
              const lostIds = Object.entries(h.checks).filter(([, v]) => v === 'lost').map(([k]) => k);
              const fixIds = Object.entries(h.checks).filter(([, v]) => v === 'fix').map(([k]) => k);
              commit({
                ...state,
                items: state.items.map((it) => (
                  lostIds.includes(it.id) ? { ...it, lost: true }
                  : fixIds.includes(it.id) ? { ...it, repair: true }
                  : it)),
                handovers: handovers().map((x) => (x.id === h.id
                  ? { ...x, doneAt: new Date().toISOString(), checks: h.checks, snapshot, signFrom, signTo }
                  : x)),
                school: { ...school(), teacher: h.toName, position: h.toPosition },
              });
              render();
              flash('인수인계를 마쳤어요');
              return null;
            });
          }, 250);
          return null;
        });
      });
    }

    /* ════════ 물품 모으기 — 링크로 받기 (→ src/pages/give.js) ════════ */
    const collects = () => state.collects || [];
    const submissions = () => state.submissions || [];
    const newCode = () => Array.from(crypto.getRandomValues(new Uint8Array(8)))
      .map((b) => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
    const giveLink = (c) => `${location.origin}${location.pathname}#/give?c=${c.code}`;
    const placeOfCollect = (c) => [c.building, c.floor, c.room].filter(Boolean).join(' › ');

    /* ── 받는 사람이 여는 화면 (로그인 없이) ── */
    async function mountGive(root, code) {
      const shell = (inner) => `
        <div class="give">

        root.innerHTML = shell('<h1 class="gate__title">열 수 없는 링크예요</h1><p class="gate__desc">받은 주소를 다시 확인해 주세요.</p>');
        return;
      }
      root.innerHTML = shell('<p class="gate__desc">불러오는 중이에요…</p>');

      const { data: info, error } = await sb.rpc('collect_info', { link_code: code });
      if (error || !info) {
        root.innerHTML = shell('<h1 class="gate__title">찾을 수 없는 링크예요</h1><p class="gate__desc">지워졌거나 주소가 잘못됐어요. 보낸 분께 다시 받아 주세요.</p>');
